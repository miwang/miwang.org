<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>懒人代码生成器</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; background: #f0f4f8; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        textarea { width: 100%; height: 300px; margin-top: 20px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        input { display: none; }
        .upload-btn { 
            background: #2196F3; color: white; padding: 15px 30px; 
            border-radius: 8px; cursor: pointer; font-size: 1.2rem; display: inline-block;
        }
        .upload-btn:hover { background: #1976D2; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🛠️ 懒人代码生成器</h2>
        <p>请点击下面的按钮，<b>一次性选中</b>你所有的学生照片（PNG文件）。<br>我会利用文件名自动生成代码。</p>
        
        <label class="upload-btn">
            📂 选择所有照片
            <input type="file" id="fileInput" multiple accept=".png, .jpg, .jpeg" onchange="generateCode()">
        </label>

        <h3>👇 你的代码生成在这里：</h3>
        <textarea id="outputArea" placeholder="代码会出现在这里..."></textarea>
        <p style="color: #666; font-size: 0.9rem;">复制上面的代码，覆盖掉 grouping.html 里的 const allStudents = [...] 那一段。</p>
    </div>

    <script>
        function generateCode() {
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) return;

            // 按文件名排序，保证顺序不乱
            const fileArray = Array.from(files).sort((a, b) => a.name.localeCompare(b.name));

            let code = "const allStudents = [\n";

            fileArray.forEach((file, index) => {
                // 去掉后缀名作为名字 (比如 Alex.png -> Alex)
                let name = file.name.replace(/\.[^/.]+$/, ""); 
                // 首字母大写（以防万一）
                name = name.charAt(0).toUpperCase() + name.slice(1);

                // 生成一行代码
                code += `    { id: ${index + 1}, name: "${name}", img: "${file.name}" },\n`;
            });

            // 去掉最后一个逗号，闭合数组
            code += "];";

            document.getElementById('outputArea').value = code;
        }
    </script>
</body>
</html>
