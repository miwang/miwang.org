<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我爱迷宫 - 智能加法挑战</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #FF9800;
            --bg: #FFF3E0;
            --cell-bg: #ffffff;
            --selected: #FFE082;
            --correct: #81C784;
            --incorrect: #E57373;
            --text: #333;
        }
        * { box-sizing: border-box; }
        
        body {
            background-color: #ECEFF1;
            color: var(--text);
            margin: 0;
            padding: 0;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        /* ── 悬浮玻璃返回按钮 ── */
        .glass-btn {
            position: fixed; top: 16px; left: 20px;
            color: #444; text-decoration: none;
            font-size: 1rem; font-weight: 600; z-index: 9999;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 8px 22px; border-radius: 40px;
            border: 1.5px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
            display: inline-flex; align-items: center;
            transition: background 0.2s, transform 0.2s;
            font-family: inherit;
        }
        .glass-btn:hover { background: rgba(255,255,255,0.75); transform: scale(1.04); }
        @media (max-width: 768px) {
            .glass-btn { top: 12px; left: 12px; font-size: 0.85rem; padding: 6px 14px; }
        }

        .page { display: none; width: 100%; height: 100%; }
        .page.active { display: flex; justify-content: center; align-items: center; }

        /* ================= 开始页面 ================= */
        #start-page-content {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 1000px;
            margin-top: 40px; 
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 { color: var(--primary); text-shadow: 1px 1px 3px rgba(0,0,0,0.1); margin-top: 0; }
        .number-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .number-grid { grid-template-columns: repeat(4, 1fr); }
            h1 { font-size: 1.6em; }
        }
        .num-btn {
            background-color: white;
            border: 3px solid var(--primary);
            border-radius: 12px;
            font-size: 1.8em;
            padding: 15px 0;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, background 0.2s;
            font-family: inherit;
        }
        .num-btn:hover { transform: scale(1.05); background-color: var(--selected); }
        .num-btn.completed { background-color: var(--correct); border-color: #388E3C; color: white; }
        .completed-badge {
            position: absolute;
            top: -8px; right: -8px;
            background: #FFEB3B;
            border-radius: 50%;
            width: 25px; height: 25px;
            font-size: 0.6em; line-height: 25px;
            border: 2px solid #333;
            display: none;
            color: #333;
        }
        .num-btn.completed .completed-badge { display: block; }

        .btn-reset {
            margin-top: 25px;
            background: transparent;
            border: 1px dashed #B0BEC5;
            color: #78909C;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-block;
        }
        .btn-reset:hover { background: #FFEBEE; color: #E53935; border-color: #E53935; }

        /* ================= 游戏页面 ================= */
        .app-container {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            height: 100%;
        }

        .target-box { text-align: center; }
        .target-label { font-size: 1.8em; font-weight: bold; display: block; color: var(--text); }
        #current-target { font-size: 3.5em; color: #E65100; text-shadow: 2px 2px 0px white; display: block; margin-top: 5px; font-weight: bold; }

        @media (min-width: 900px) {
            .page.active.app-container {
                display: flex; flex-direction: row; width: 100vw; height: 100vh;
                max-width: 100%; border-radius: 0; overflow: hidden;
            }
            .sidebar {
                width: 250px; background: var(--bg); padding: 70px 20px 30px; 
                display: flex; flex-direction: column; align-items: center;
                border-right: 4px solid var(--primary); flex-shrink: 0;
            }
            .target-box { margin-bottom: 30px; }
            .controls { display: flex; flex-direction: column; gap: 20px; width: 100%; margin-top: auto; }
            .game-area { flex: 1; padding: 20px; background: #E3F2FD; display: flex; height: 100vh; overflow: hidden; }
        }

        /* 修复后的手机端自适应布局 */
        @media (max-width: 899px) {
            .page.active.app-container { 
                display: flex; 
                flex-direction: column; 
                height: 100vh; 
                width: 100vw; 
                align-items: stretch; /* 强制填满屏幕宽度，解除紧凑状态 */
                justify-content: flex-start;
            }
            .sidebar {
                background: var(--bg);
                /* 增加顶部 Padding 到 70px，彻底避开返回按钮 */
                padding: 70px 15px 15px; 
                border-bottom: 4px solid var(--primary);
                display: flex; flex-direction: column; gap: 12px;
                flex-shrink: 0; align-items: center; width: 100%;
            }
            .target-box { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 0; }
            .target-label { font-size: 1.3em; display: inline; }
            #current-target { font-size: 2em; display: inline; margin-top: 0; text-shadow: 1px 1px 0px white; }
            .controls { display: flex; flex-direction: row; gap: 10px; width: 100%; justify-content: center; }
            .btn { flex: 1; padding: 12px 5px; font-size: 1rem; max-width: 160px; }
            .game-area { 
                flex: 1; 
                padding: 10px; 
                background: #E3F2FD; 
                display: flex; 
                min-height: 0; 
                width: 100%; 
            }
        }

        .btn {
            padding: 15px; font-size: 1.3em; border-radius: 12px; border: none;
            cursor: pointer; font-weight: bold; text-align: center; font-family: inherit;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .back-btn { background-color: #9E9E9E; color: white; }
        .check-btn { background-color: #4CAF50; color: white; box-shadow: 0 4px 0 #388E3C; }

        /* 迷宫网格 */
        #maze-container {
            display: grid; gap: 5px; background: #FFB74D; padding: 8px;
            border-radius: 12px; width: 100%; height: 100%; 
        }
        .cell {
            background-color: var(--cell-bg); border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(1rem, 4vw, 2rem); font-weight: bold; /* 字体随手机宽度自动放大 */
            cursor: pointer; position: relative;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.1); width: 100%; height: 100%;
            overflow: visible; transition: transform 0.1s, background-color 0.3s;
        }
        .cell:active { box-shadow: none; transform: translateY(2px) scale(0.95); }
        .cell.selected { background-color: var(--selected); border: 2px solid #FBC02D; z-index: 5; }
        .cell.correct { background-color: var(--correct); color: white; box-shadow: none; border: none; }
        .cell.incorrect { background-color: var(--incorrect); color: white; box-shadow: none; border: none; }
        
        /* 智能提示箭头 */
        .hint-arrow { position: absolute; font-size: 1.5rem; color: #1976D2; pointer-events: none; z-index: 10; }
        .hint-top { left: calc(50% - 12px); animation: pointUp 0.6s infinite alternate; }
        .hint-bottom { left: calc(50% - 12px); transform: rotate(180deg); animation: pointDown 0.6s infinite alternate; }
        .hint-left { top: calc(50% - 12px); transform: rotate(-90deg); animation: pointLeft 0.6s infinite alternate; }
        .hint-right { top: calc(50% - 12px); transform: rotate(90deg); animation: pointRight 0.6s infinite alternate; }

        @keyframes pointUp { from { top: -15px; } to { top: -25px; } }
        @keyframes pointDown { from { bottom: -15px; } to { bottom: -25px; } }
        @keyframes pointLeft { from { left: -15px; } to { left: -25px; } }
        @keyframes pointRight { from { right: -15px; } to { right: -25px; } }

        /* ====== 互动动画 ====== */
        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* 自定义通关弹窗 */
        #celebration-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6); z-index: 10000; 
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; padding: 40px 60px; border-radius: 30px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 8px solid var(--correct);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-content h1 { font-size: 3.5rem; margin: 0 0 10px 0; color: var(--primary); }
        .modal-content p { font-size: 1.8rem; margin-bottom: 30px; }
        .modal-btn {
            background: var(--primary); color: white; font-size: 1.5rem; padding: 15px 40px;
            border-radius: 50px; border: none; cursor: pointer; box-shadow: 0 6px 0 #E65100;
            font-weight: bold; font-family: inherit;
        }
        .modal-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #E65100; }
        @media (max-width: 600px) {
            .modal-content { padding: 30px 20px; width: 90%; }
            .modal-content h1 { font-size: 2.5rem; }
            .modal-content p { font-size: 1.3rem; }
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <a href="../teachers.html" class="glass-btn">⬅️ 返回工具台</a>

    <div id="start-page" class="page active">
        <div id="start-page-content">
            <h1>🔢 找一找，画一画颜色！</h1>
            <p>选择一个数字，系统将为你自动生成全新的专属迷宫</p>
            <div class="number-grid" id="number-grid"></div>
            <button class="btn-reset" onclick="clearProgress()">🗑️ 清除所有进度</button>
        </div>
    </div>

    <div id="game-page" class="page app-container">
        <div class="sidebar">
            <div class="target-box">
                <span class="target-label">目标数字</span>
                <span id="current-target">5</span>
            </div>
            <div class="controls">
                <button class="btn check-btn" onclick="checkAnswers()">检查答案 ✔️</button>
                <button class="btn back-btn" onclick="showStartPage()">重新选</button>
            </div>
        </div>
        <div class="game-area">
            <div id="maze-container"></div>
        </div>
    </div>

    <div id="celebration-modal">
        <div class="modal-content">
            <h1>🌟 太棒啦！ 🌟</h1>
            <p>你成功走出了数字 <span id="win-number" style="color:#E65100; font-size: 2.5rem; font-weight:bold;"></span> 的迷宫！</p>
            <button class="modal-btn" onclick="closeCelebration()">继续挑战</button>
        </div>
    </div>

    <script>
        let currentTarget = 0;
        let rows = 8;
        let cols = 11; 
        let endCellPos = {r: rows-1, c: cols-1};

        function init() {
            const grid = document.getElementById('number-grid');
            grid.innerHTML = '';
            const completedStr = localStorage.getItem('mazeProgress');
            const completedArr = completedStr ? JSON.parse(completedStr) : [];

            for (let i = 5; i <= 20; i++) {
                const btn = document.createElement('button');
                btn.className = 'num-btn';
                if (completedArr.includes(i)) btn.classList.add('completed');
                btn.innerHTML = `${i} <div class="completed-badge">⭐</div>`;
                btn.onclick = () => startGame(i);
                grid.appendChild(btn);
            }
        }

        function showStartPage() {
            document.getElementById('start-page').classList.add('active');
            document.getElementById('game-page').classList.remove('active');
            init(); 
        }

        function clearProgress() {
            if(confirm("确定要清除所有的通关小星星吗？")) {
                localStorage.removeItem('mazeProgress');
                init();
            }
        }

        function startGame(num) {
            currentTarget = num;
            document.getElementById('current-target').innerText = num;
            document.getElementById('start-page').classList.remove('active');
            document.getElementById('game-page').classList.add('active');
            
            if (window.innerWidth < 900) {
                rows = 8;
                cols = 5; 
            } else {
                rows = 8;
                cols = 11; 
            }
            endCellPos = {r: rows-1, c: cols-1};

            const generatedData = generateMazeData(num, rows, cols);
            renderMaze(generatedData);
        }

        function generateMazeData(target, rCount, cCount) {
            let data = Array(rCount).fill(0).map(() => Array(cCount).fill(null));
            let path = [];
            
            let r = 0, c = 0;
            path.push(`${r},${c}`);
            while(r < rCount - 1 || c < cCount - 1) {
                let moves = [];
                if(r < rCount - 1) moves.push({dr: 1, dc: 0}); 
                if(c < cCount - 1) moves.push({dr: 0, dc: 1}); 
                let move = moves[Math.floor(Math.random() * moves.length)];
                r += move.dr;
                c += move.dc;
                path.push(`${r},${c}`);
            }

            for(let i=0; i<rCount; i++) {
                for(let j=0; j<cCount; j++) {
                    const isCorrectNode = path.includes(`${i},${j}`);
                    let sum = isCorrectNode ? target : generateWrongSum(target);
                    let num1 = Math.floor(Math.random() * (sum + 1));
                    let num2 = sum - num1;
                    data[i][j] = { text: `${num1}+${num2}`, sum: sum };
                }
            }
            return data;
        }

        function generateWrongSum(target) {
            let wrongSum = target;
            while(wrongSum === target) {
                let offset = Math.floor(Math.random() * 7) - 3;
                wrongSum = target + offset;
                if(wrongSum < 0) wrongSum = target + 1;
            }
            return wrongSum;
        }

        function renderMaze(data) {
            const container = document.getElementById('maze-container');
            container.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
            container.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
            container.innerHTML = '';

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = data[r][c].text;
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.dataset.sum = data[r][c].sum;

                    cell.onclick = () => handleCellClick(cell, r, c);
                    container.appendChild(cell);
                }
            }
        }

        function handleCellClick(cell, r, c) {
            if (cell.classList.contains('correct')) {
                updateHints(r, c, cell);
                return; 
            }

            if (cell.classList.contains('selected') || cell.classList.contains('incorrect')) {
                cell.classList.remove('selected', 'incorrect', 'shake'); 
                clearHints();
            } else {
                cell.classList.add('selected');
                updateHints(r, c, cell);
            }
        }

        function updateHints(r, c, currentCell) {
            clearHints();
            const directions = [
                { dr: -1, dc: 0, class: 'hint-top', icon: '▲' },
                { dr: 1, dc: 0, class: 'hint-bottom', icon: '▲' },
                { dr: 0, dc: -1, class: 'hint-left', icon: '▲' },
                { dr: 0, dc: 1, class: 'hint-right', icon: '▲' }
            ];

            directions.forEach(dir => {
                const nr = r + dir.dr;
                const nc = c + dir.dc;
                
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                    const neighbor = document.querySelector(`.cell[data-row="${nr}"][data-col="${nc}"]`);
                    if (neighbor && !neighbor.classList.contains('correct') && !neighbor.classList.contains('selected')) {
                        const arrow = document.createElement('div');
                        arrow.className = `hint-arrow ${dir.class}`;
                        arrow.innerText = dir.icon;
                        currentCell.appendChild(arrow);
                    }
                }
            });
        }

        function clearHints() {
            document.querySelectorAll('.hint-arrow').forEach(el => el.remove());
        }

        function checkAnswers() {
            clearHints();
            let hasWrong = false;
            let hasSelected = false;

            const cells = document.querySelectorAll('.cell.selected, .cell.incorrect');
            
            cells.forEach(cell => {
                hasSelected = true;
                const sum = parseInt(cell.dataset.sum);
                
                cell.classList.remove('shake');
                
                if (sum === currentTarget) {
                    cell.classList.remove('selected', 'incorrect');
                    cell.classList.add('correct');
                } else {
                    cell.classList.remove('selected');
                    cell.classList.add('incorrect');
                    void cell.offsetWidth;
                    cell.classList.add('shake');
                    hasWrong = true;
                }
            });

            if (!hasSelected && !document.querySelector('.cell.correct')) {
                const checkBtn = document.querySelector('.check-btn');
                checkBtn.classList.remove('shake');
                void checkBtn.offsetWidth;
                checkBtn.classList.add('shake');
                return;
            }

            const endCell = document.querySelector(`.cell[data-row="${endCellPos.r}"][data-col="${endCellPos.c}"]`);
            if (!hasWrong && endCell && endCell.classList.contains('correct')) {
                let completedArr = JSON.parse(localStorage.getItem('mazeProgress') || '[]');
                if (!completedArr.includes(currentTarget)) {
                    completedArr.push(currentTarget);
                    localStorage.setItem('mazeProgress', JSON.stringify(completedArr));
                }
                triggerCelebration();
            }
        }

        function triggerCelebration() {
            document.getElementById('win-number').innerText = currentTarget;
            document.getElementById('celebration-modal').style.display = 'flex';
            
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5, angle: 60, spread: 55, origin: { x: 0 },
                    colors: ['#FF9800', '#81C784', '#2196F3', '#FFEB3B', '#E57373']
                });
                confetti({
                    particleCount: 5, angle: 120, spread: 55, origin: { x: 1 },
                    colors: ['#FF9800', '#81C784', '#2196F3', '#FFEB3B', '#E57373']
                });

                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function closeCelebration() {
            document.getElementById('celebration-modal').style.display = 'none';
            showStartPage();
        }

        window.onload = init;
    </script>
</body>
</html>
