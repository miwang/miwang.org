<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十个裙子 / Ten Dresses</title>
    <script src="../js/config.js"></script>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/common_nav.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f8fb;
            color: #1a2740;
            font-family: "LXGW WenKai Lite", sans-serif;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 90px 20px 30px;
        }

        .title {
            text-align: center;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            margin: 0 0 24px;
            color: #4d617f;
            font-size: clamp(1rem, 2.1vw, 1.2rem);
        }

        .palette {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .color-btn {
            border: 3px solid transparent;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a2740;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            font-family: "KaiTi-CJK", "LXGW WenKai Lite", serif;
        }

        .color-btn.active {
            transform: scale(1.12);
        }

        .color-btn[data-color="pink"] { background: #ffd9e8; }
        .color-btn[data-color="blue"] { background: #d7e8ff; }

        .color-btn[data-color="pink"].active {
            background: #ffb3d5;
            border-color: #d0367c;
            box-shadow: 0 4px 16px rgba(208, 54, 124, 0.45);
        }

        .color-btn[data-color="blue"].active {
            background: #9fc5ff;
            border-color: #1f5fbf;
            box-shadow: 0 4px 16px rgba(31, 95, 191, 0.45);
        }

        .clear-btn {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: #598586;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            font-family: "KaiTi-CJK", "LXGW WenKai Lite", serif;
        }

        .ten-frame {
            display: grid;
            grid-template-columns: repeat(10, minmax(45px, 1fr));
            gap: 0;
            width: min(100%, 900px);
            margin: 0 auto;
            border: 4px solid #1a2740;
            background: #fff;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border-right: 2px solid #1a2740;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-top: none;
            border-bottom: none;
            border-left: none;
        }

        .cell:last-child {
            border-right: none;
        }

        .dress-icon {
            width: 82%;
            height: 82%;
            pointer-events: none;
        }

        .dress-shape {
            fill: transparent;
            stroke: #1a2740;
            stroke-width: 5;
            stroke-linejoin: round;
            transition: fill 0.15s ease;
        }

        .cell.pink .dress-shape { fill: #ff7fb2; }
        .cell.blue .dress-shape { fill: #79adff; }

        .result {
            margin-top: 24px;
            text-align: center;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 1.5;
        }

        .tip {
            margin-top: 8px;
            color: #4d617f;
            font-size: 1rem;
        }

        /* ── Equation phase ── */
        .equation-area { margin-top: 16px; text-align: center; }

        .eq-display {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(2rem, 4.5vw, 3rem);
            font-weight: 700;
            font-family: "LXGW WenKai Lite", sans-serif;
            color: #1a2740;
        }

        .eq-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.4em;
            height: 1.1em;
            border: 3px solid #1a2740;
            border-radius: 8px;
            font-size: inherit;
            font-weight: 700;
            color: #1a2740;
            background: #fff;
            transition: all 0.2s ease;
        }

        .eq-box.active {
            border-color: #f4789d;
            background: #fff0f6;
            box-shadow: 0 0 0 4px rgba(244,120,157,0.25);
            animation: pulse-box 0.9s infinite alternate;
        }

        @keyframes pulse-box {
            from { box-shadow: 0 0 0 2px rgba(244,120,157,0.3); }
            to   { box-shadow: 0 0 0 7px rgba(244,120,157,0.08); }
        }

        .eq-box.filled-pink { background: #ffd9e8; border-color: #d0367c; color: #d0367c; }
        .eq-box.filled-blue { background: #d7e8ff; border-color: #1f5fbf; color: #1f5fbf; }

        .num-picker {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .num-chip {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2.5px solid #9dbfe8;
            background: #f0f7ff;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            font-family: "LXGW WenKai Lite", sans-serif;
            color: #1a2740;
        }

        .num-chip:hover { background: #deeeff; transform: scale(1.12); border-color: #1f5fbf; }

        /* Cell highlight rings */
        .cell.ring-pink {
            box-shadow: inset 0 0 0 3px #d0367c, 0 0 10px 3px rgba(244,120,157,0.6);
            position: relative;
            z-index: 1;
        }

        .cell.ring-blue {
            box-shadow: inset 0 0 0 3px #1f5fbf, 0 0 10px 3px rgba(61,127,224,0.6);
            position: relative;
            z-index: 1;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60% { transform: translateX(-8px); }
            40%,80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.45s ease; }

        .found-section {
            margin-top: 28px;
            text-align: center;
        }

        .found-label {
            font-size: 1rem;
            color: #4d617f;
            margin-bottom: 12px;
        }

        .found-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .found-chip {
            background: #e8f0ff;
            border: 2px solid #79adff;
            border-radius: 999px;
            padding: 6px 18px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a2740;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 36px 32px;
            text-align: center;
            max-width: 340px;
            width: calc(100% - 40px);
            box-shadow: 0 8px 32px rgba(26, 39, 64, 0.18);
        }

        .modal-msg {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            color: #1a2740;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .modal-continue-btn {
            border: none;
            border-radius: 999px;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            background: #f4789d;
            cursor: pointer;
            font-family: "KaiTi-CJK", "LXGW WenKai Lite", serif;
            transition: transform 0.15s ease;
        }

        .modal-continue-btn:hover { transform: translateY(-2px); }

        @media (max-width: 760px) {
            .page { padding: 78px 12px 20px; }
            .ten-frame {
                grid-template-columns: repeat(10, minmax(28px, 1fr));
                border-width: 3px;
            }
            .cell { border-right-width: 1.5px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="title" id="page-title"></h1>
        <p class="subtitle" id="question-text"></p>

        <div class="palette">
            <button class="color-btn active" data-color="pink" type="button" id="pink-btn">粉色</button>
            <button class="color-btn" data-color="blue" type="button" id="blue-btn">蓝色</button>
            <button class="clear-btn" id="clear-all" type="button">清空重来</button>
        </div>

        <div class="ten-frame" id="ten-frame" aria-label="一行十条裙子"></div>

        <div class="result">
            <div class="tip" id="tip-text"></div>
            <div class="equation-area" id="equation-area" style="display:none">
                <div class="eq-display" id="eq-display">
                    <span class="eq-box" id="eq-box-pink"></span>
                    <span>+</span>
                    <span class="eq-box" id="eq-box-blue"></span>
                    <span>= 10</span>
                </div>
                <div class="num-picker" id="num-picker"></div>
            </div>
        </div>

        <div class="found-section" id="found-section" style="display:none">
            <div class="found-label" id="found-label"></div>
            <div class="found-list" id="found-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="congrats-modal" style="display:none">
        <div class="modal-box">
            <div class="modal-msg" id="modal-msg"></div>
            <button class="modal-continue-btn" id="modal-continue-btn" type="button"></button>
        </div>
    </div>

    <script>
        const frame = document.getElementById('ten-frame');
        const titleEl = document.getElementById('page-title');
        const questionText = document.getElementById('question-text');
        const tipText = document.getElementById('tip-text');
        const clearBtn = document.getElementById('clear-all');
        const pinkBtn = document.getElementById('pink-btn');
        const blueBtn = document.getElementById('blue-btn');
        const colorButtons = document.querySelectorAll('.color-btn');
        const congratsModal = document.getElementById('congrats-modal');
        const modalMsg = document.getElementById('modal-msg');
        const modalContinueBtn = document.getElementById('modal-continue-btn');
        const foundSection = document.getElementById('found-section');
        const foundLabel = document.getElementById('found-label');
        const foundList = document.getElementById('found-list');
        const equationArea = document.getElementById('equation-area');
        const eqDisplay = document.getElementById('eq-display');
        const eqBoxPink = document.getElementById('eq-box-pink');
        const eqBoxBlue = document.getElementById('eq-box-blue');
        const numPicker = document.getElementById('num-picker');

        const state = Array(10).fill(null);
        const cellElements = [];
        let activeColor = 'pink';
        let t;
        let foundEquations = [];
        let currentEquation = '';
        // phase: 'coloring' | 'pick-pink' | 'pick-blue' | 'done'
        let phase = 'coloring';
        let pickedPink = null;
        let pickedBlue = null;

        const i18n = {
            zh: {
                htmlLang: 'zh-CN',
                pageTitle: '十个裙子',
                navTitle: '十个裙子',
                question: '一个公主有十个裙子。有的裙子是粉色的，有的裙子是蓝色的。公主有几个粉色的裙子，有几个蓝色的裙子？',
                pink: '粉色',
                blue: '蓝色',
                blank: '空白',
                frameLabel: '一行十条裙子',
                clear: '清空重来',
                congratsMsg: '你真棒！再看看还有没有别的组合方法？',
                continueBtn: '继续',
                foundLabel: '已找到的组合：',
                tipTodo: (blankCount) => `再涂 ${blankCount} 条裙子就到 10。`,
                tipPickPink: '数一数粉色的裙子有几条？',
                tipPickBlue: '数一数蓝色的裙子有几条？',
                tipWrong: '不对哦，再数一数！',
                dressAria: (index, colorName) => `第${index + 1}条裙子，${colorName}`
            },
            en: {
                htmlLang: 'en',
                pageTitle: 'Ten Dresses',
                navTitle: 'Ten Dresses',
                question: 'A princess has 10 dresses. Some are pink and the rest are blue. How many pink dresses and how many blue dresses does the princess have?',
                pink: 'Pink',
                blue: 'Blue',
                blank: 'Blank',
                frameLabel: 'A row of ten dresses',
                clear: 'Clear all',
                congratsMsg: 'Great job! Can you find another way to make 10?',
                continueBtn: 'Continue',
                foundLabel: 'Combinations found:',
                tipTodo: (blankCount) => `Color ${blankCount} more dresses to make 10.`,
                tipPickPink: 'Count the pink dresses!',
                tipPickBlue: 'Count the blue dresses!',
                tipWrong: 'Not quite! Try again.',
                dressAria: (index, colorName) => `Dress ${index + 1}, ${colorName}`
            }
        };

        function getTextByColor(color) {
            if (color === 'pink') return t.pink;
            if (color === 'blue') return t.blue;
            return t.blank;
        }

        function applyLanguage() {
            const detectedLang = window.MECC_CONFIG?.getLang?.();
            const lang = detectedLang === 'en' || detectedLang === 'zh' ? detectedLang : 'zh';
            t = i18n[lang];

            document.documentElement.lang = t.htmlLang;
            document.title = t.pageTitle;
            titleEl.textContent = t.pageTitle;
            questionText.textContent = t.question;
            pinkBtn.textContent = t.pink;
            blueBtn.textContent = t.blue;
            clearBtn.textContent = t.clear;
            frame.setAttribute('aria-label', t.frameLabel);

            const isEn = lang === 'en';
            titleEl.className = `title ${isEn ? 'font-en' : 'font-zh'}`;
            questionText.className = `subtitle ${isEn ? 'font-en' : 'font-zh'}`;
            tipText.className = `tip ${isEn ? 'font-en' : 'font-zh'}`;
            foundLabel.className = `found-label ${isEn ? 'font-en' : 'font-zh'}`;
        }

        function showCongrats() {
            modalMsg.textContent = t.congratsMsg;
            modalContinueBtn.textContent = t.continueBtn;
            congratsModal.style.display = 'flex';
        }

        function renderFoundEquations() {
            if (foundEquations.length === 0) {
                foundSection.style.display = 'none';
                return;
            }
            foundSection.style.display = '';
            foundLabel.textContent = t.foundLabel;
            foundList.innerHTML = '';
            foundEquations.forEach((eq) => {
                const chip = document.createElement('span');
                chip.className = 'found-chip font-en';
                chip.textContent = eq;
                foundList.appendChild(chip);
            });
        }

        function applyHighlights(h) {
            cellElements.forEach((cell, i) => {
                cell.classList.remove('ring-pink', 'ring-blue');
                if (h === 'pick-pink' && state[i] === 'pink') {
                    cell.classList.add('ring-pink');
                } else if (h === 'pick-blue' && state[i] === 'blue') {
                    cell.classList.add('ring-blue');
                }
            });
        }

        function updateEquationUI() {
            if (phase === 'pick-pink') {
                eqBoxPink.classList.add('active');
                eqBoxBlue.classList.remove('active');
                applyHighlights('pick-pink');
                tipText.textContent = t.tipPickPink;
                tipText.style.display = '';
            } else if (phase === 'pick-blue') {
                eqBoxPink.classList.remove('active');
                eqBoxBlue.classList.add('active');
                applyHighlights('pick-blue');
                tipText.textContent = t.tipPickBlue;
                tipText.style.display = '';
            }
        }

        function checkAnswer() {
            const pinkCount = state.filter((v) => v === 'pink').length;
            const blueCount = state.filter((v) => v === 'blue').length;
            if (pickedPink === pinkCount && pickedBlue === blueCount) {
                currentEquation = `${pinkCount} + ${blueCount} = 10`;
                numPicker.style.display = 'none';
                setTimeout(() => showCongrats(), 400);
            } else {
                eqDisplay.classList.add('shake');
                tipText.textContent = t.tipWrong;
                tipText.style.display = '';
                setTimeout(() => {
                    eqDisplay.classList.remove('shake');
                    pickedPink = null;
                    pickedBlue = null;
                    eqBoxPink.textContent = '';
                    eqBoxBlue.textContent = '';
                    eqBoxPink.className = 'eq-box';
                    eqBoxBlue.className = 'eq-box';
                    phase = 'pick-pink';
                    numPicker.style.display = '';
                    updateEquationUI();
                }, 600);
            }
        }

        function onNumPick(n) {
            if (phase === 'pick-pink') {
                pickedPink = n;
                eqBoxPink.textContent = n;
                eqBoxPink.classList.remove('active');
                eqBoxPink.classList.add('filled-pink');
                phase = 'pick-blue';
                updateEquationUI();
            } else if (phase === 'pick-blue') {
                pickedBlue = n;
                eqBoxBlue.textContent = n;
                eqBoxBlue.classList.remove('active');
                eqBoxBlue.classList.add('filled-blue');
                phase = 'done';
                applyHighlights(null);
                tipText.style.display = 'none';
                checkAnswer();
            }
        }

        function buildNumPicker() {
            numPicker.innerHTML = '';
            for (let i = 0; i <= 10; i++) {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'num-chip';
                chip.textContent = String(i);
                chip.addEventListener('click', () => onNumPick(i));
                numPicker.appendChild(chip);
            }
        }

        function updateText() {
            const pinkCount = state.filter((v) => v === 'pink').length;
            const blueCount = state.filter((v) => v === 'blue').length;
            const blankCount = 10 - pinkCount - blueCount;

            if (blankCount > 0) {
                if (phase !== 'coloring') {
                    phase = 'coloring';
                    pickedPink = null;
                    pickedBlue = null;
                }
                equationArea.style.display = 'none';
                tipText.textContent = t.tipTodo(blankCount);
                tipText.style.display = '';
                applyHighlights(null);
                return;
            }

            // All 10 dresses colored — enter equation phase
            if (phase === 'coloring') {
                phase = 'pick-pink';
                pickedPink = null;
                pickedBlue = null;
                eqBoxPink.textContent = '';
                eqBoxBlue.textContent = '';
                eqBoxPink.className = 'eq-box';
                eqBoxBlue.className = 'eq-box';
                numPicker.style.display = '';
            }
            equationArea.style.display = '';
            if (phase === 'pick-pink' || phase === 'pick-blue') {
                updateEquationUI();
            }
        }

        function setActiveColor(color) {
            activeColor = color;
            colorButtons.forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.color === color);
            });
        }

        function updateFrameUI() {
            state.forEach((color, index) => {
                const cell = cellElements[index];
                const colorName = getTextByColor(color);
                const hasRingPink = cell.classList.contains('ring-pink');
                const hasRingBlue = cell.classList.contains('ring-blue');
                cell.className = `cell${color ? ` ${color}` : ''}${hasRingPink ? ' ring-pink' : ''}${hasRingBlue ? ' ring-blue' : ''}`;
                cell.setAttribute('aria-label', t.dressAria(index, colorName));
                cell.setAttribute('aria-pressed', color ? 'true' : 'false');
            });
        }

        function initFrame() {
            state.forEach((_, index) => {
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'cell';
                cell.innerHTML = `
                    <svg class="dress-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                        <!-- Dress body: neckline, shoulders, fitted bodice, A-line skirt, straight hem -->
                        <path class="dress-shape" d="M 37 12 Q 50 17 63 12 L 70 20 L 66 44 L 84 88 L 16 88 L 34 44 L 30 20 Z"/>
                        <!-- Waist bow -->
                        <path class="dress-shape" d="M 50 44 Q 39 40 43 35 Q 48 42 50 44 Q 52 42 57 35 Q 61 40 50 44 Z"/>
                    </svg>
                `;
                cell.addEventListener('click', () => {
                    state[index] = state[index] === activeColor ? null : activeColor;
                    updateFrameUI();
                    updateText();
                });
                cellElements.push(cell);
                frame.appendChild(cell);
            });
            updateFrameUI();
        }

        colorButtons.forEach((btn) => {
            btn.addEventListener('click', () => setActiveColor(btn.dataset.color));
        });

        function resetState() {
            state.fill(null);
            phase = 'coloring';
            pickedPink = null;
            pickedBlue = null;
            currentEquation = '';
            equationArea.style.display = 'none';
            eqBoxPink.textContent = '';
            eqBoxBlue.textContent = '';
            eqBoxPink.className = 'eq-box';
            eqBoxBlue.className = 'eq-box';
            applyHighlights(null);
        }

        clearBtn.addEventListener('click', () => {
            resetState();
            updateFrameUI();
            updateText();
        });

        modalContinueBtn.addEventListener('click', () => {
            congratsModal.style.display = 'none';
            if (currentEquation && !foundEquations.includes(currentEquation)) {
                foundEquations.push(currentEquation);
            }
            renderFoundEquations();
            resetState();
            setActiveColor('pink');
            updateFrameUI();
            updateText();
        });

        window.addEventListener('load', () => {
            applyLanguage();
            if (window.MECC_CONFIG?.renderGlobalNav) {
                window.MECC_CONFIG.renderGlobalNav(t.navTitle);
            }
            buildNumPicker();
            initFrame();
            updateText();
        });
    </script>
</body>
</html>
