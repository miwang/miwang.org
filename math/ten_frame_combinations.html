<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10的分解练习</title>
    <script src="../js/config.js"></script>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/common_nav.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f8fb;
            color: #1a2740;
            font-family: "LXGW WenKai Lite", sans-serif;
        }

        .page {
            max-width: 980px;
            margin: 0 auto;
            padding: 90px 20px 30px;
        }

        .title {
            text-align: center;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            margin: 0 0 24px;
            color: #4d617f;
            font-size: clamp(1rem, 2.1vw, 1.2rem);
        }

        .palette {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .color-btn {
            border: 3px solid transparent;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #1a2740;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            font-family: "KaiTi-CJK", "LXGW WenKai Lite", serif;
        }

        .color-btn.active {
            border-color: #1a2740;
            transform: translateY(-1px);
        }

        .color-btn[data-color="pink"] { background: #ffd9e8; }
        .color-btn[data-color="blue"] { background: #d7e8ff; }

        .clear-btn {
            border: none;
            border-radius: 999px;
            padding: 10px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: #598586;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
            font-family: "KaiTi-CJK", "LXGW WenKai Lite", serif;
        }

        .ten-frame {
            display: grid;
            grid-template-columns: repeat(10, minmax(45px, 1fr));
            gap: 0;
            width: min(100%, 900px);
            margin: 0 auto;
            border: 4px solid #1a2740;
            background: #fff;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border-right: 2px solid #1a2740;
            cursor: pointer;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-top: none;
            border-bottom: none;
            border-left: none;
        }

        .cell:last-child {
            border-right: none;
        }

        .dress-icon {
            width: 82%;
            height: 82%;
            pointer-events: none;
        }

        .dress-shape {
            fill: transparent;
            stroke: #1a2740;
            stroke-width: 5;
            stroke-linejoin: round;
            transition: fill 0.15s ease;
        }

        .cell.pink .dress-shape { fill: #ff7fb2; }
        .cell.blue .dress-shape { fill: #79adff; }

        .result {
            margin-top: 24px;
            text-align: center;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 1.5;
        }

        .equation {
            font-size: clamp(1.4rem, 3vw, 2.1rem);
            font-weight: 700;
            color: #1a2740;
            margin-top: 8px;
        }

        .tip {
            margin-top: 8px;
            color: #4d617f;
            font-size: 1rem;
        }

        @media (max-width: 760px) {
            .page { padding: 78px 12px 20px; }
            .ten-frame {
                grid-template-columns: repeat(10, minmax(28px, 1fr));
                border-width: 3px;
            }
            .cell { border-right-width: 1.5px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="title" id="page-title"></h1>
        <p class="subtitle" id="question-text"></p>

        <div class="palette">
            <button class="color-btn active" data-color="pink" type="button" id="pink-btn">粉色</button>
            <button class="color-btn" data-color="blue" type="button" id="blue-btn">蓝色</button>
            <button class="clear-btn" id="clear-all" type="button">清空重来</button>
        </div>

        <div class="ten-frame" id="ten-frame" aria-label="一行十条裙子"></div>

        <div class="result">
            <div id="breakdown-text">粉色 0 + 蓝色 0 + 空白 10 = 10</div>
            <div class="equation font-en" id="equation-text">0 + 0 = 0</div>
            <div class="tip" id="tip-text">再涂 10 个格子就到 10。</div>
        </div>
    </div>

    <script>
        const frame = document.getElementById('ten-frame');
        const titleEl = document.getElementById('page-title');
        const questionText = document.getElementById('question-text');
        const breakdownText = document.getElementById('breakdown-text');
        const equationText = document.getElementById('equation-text');
        const tipText = document.getElementById('tip-text');
        const clearBtn = document.getElementById('clear-all');
        const pinkBtn = document.getElementById('pink-btn');
        const blueBtn = document.getElementById('blue-btn');
        const colorButtons = document.querySelectorAll('.color-btn');

        const state = Array(10).fill(null);
        const cellElements = [];
        let activeColor = 'pink';
        let t;

        const i18n = {
            zh: {
                htmlLang: 'zh-CN',
                pageTitle: '10的分解（裙子）',
                navTitle: '10的分解练习',
                question: '一个公主有十个裙子。有的裙子是粉色的，有的裙子是蓝色的。公主有几个粉色的裙子，有几个蓝色的裙子？',
                pink: '粉色',
                blue: '蓝色',
                blank: '空白',
                frameLabel: '一行十条裙子',
                clear: '清空重来',
                breakdown: (pinkCount, blueCount, blankCount) => `粉色 ${pinkCount} + 蓝色 ${blueCount} + 空白 ${blankCount} = 10`,
                tipDone: (pinkCount, blueCount) => `太棒了！你找到了粉色 ${pinkCount} 和蓝色 ${blueCount} 的组合。`,
                tipTodo: (blankCount) => `再涂 ${blankCount} 条裙子就到 10。`,
                dressAria: (index, colorName) => `第${index + 1}条裙子，${colorName}`
            },
            en: {
                htmlLang: 'en',
                pageTitle: 'Ten Dress Combinations',
                navTitle: 'Ten Frame Dresses',
                question: 'A princess has 10 dresses. Some are pink and the rest are blue. How many pink dresses and how many blue dresses does the princess have?',
                pink: 'Pink',
                blue: 'Blue',
                blank: 'Blank',
                frameLabel: 'A row of ten dresses',
                clear: 'Clear all',
                breakdown: (pinkCount, blueCount, blankCount) => `Pink ${pinkCount} + Blue ${blueCount} + Blank ${blankCount} = 10`,
                tipDone: (pinkCount, blueCount) => `Great! Pink ${pinkCount} and Blue ${blueCount} make 10.`,
                tipTodo: (blankCount) => `Color ${blankCount} more dresses to make 10.`,
                dressAria: (index, colorName) => `Dress ${index + 1}, ${colorName}`
            }
        };
        function getTextByColor(color) {
            if (color === 'pink') return t.pink;
            if (color === 'blue') return t.blue;
            return t.blank;
        }

        function applyLanguage() {
            const detectedLang = window.MECC_CONFIG?.getLang?.();
            const lang = detectedLang === 'en' || detectedLang === 'zh' ? detectedLang : 'zh';
            t = i18n[lang];

            document.documentElement.lang = t.htmlLang;
            document.title = t.pageTitle;
            titleEl.textContent = t.pageTitle;
            questionText.textContent = t.question;
            pinkBtn.textContent = t.pink;
            blueBtn.textContent = t.blue;
            clearBtn.textContent = t.clear;
            frame.setAttribute('aria-label', t.frameLabel);

            const isEn = lang === 'en';
            titleEl.className = `title ${isEn ? 'font-en' : 'font-zh'}`;
            questionText.className = `subtitle ${isEn ? 'font-en' : 'font-zh'}`;
            breakdownText.className = isEn ? 'font-en' : 'font-zh';
            tipText.className = `tip ${isEn ? 'font-en' : 'font-zh'}`;
        }

        function setActiveColor(color) {
            activeColor = color;
            colorButtons.forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.color === color);
            });
        }

        function updateText() {
            const pinkCount = state.filter((v) => v === 'pink').length;
            const blueCount = state.filter((v) => v === 'blue').length;
            const blankCount = 10 - pinkCount - blueCount;
            const filledCount = pinkCount + blueCount;

            breakdownText.textContent = t.breakdown(pinkCount, blueCount, blankCount);
            equationText.textContent = `${pinkCount} + ${blueCount} = ${filledCount}`;

            if (blankCount === 0) {
                tipText.textContent = t.tipDone(pinkCount, blueCount);
            } else {
                tipText.textContent = t.tipTodo(blankCount);
            }
        }

        function updateFrameUI() {
            state.forEach((color, index) => {
                const cell = cellElements[index];
                const colorName = getTextByColor(color);
                cell.className = `cell${color ? ` ${color}` : ''}`;
                cell.setAttribute('aria-label', t.dressAria(index, colorName));
                cell.setAttribute('aria-pressed', color ? 'true' : 'false');
            });
        }

        function initFrame() {
            state.forEach((_, index) => {
                const cell = document.createElement('button');
                cell.type = 'button';
                cell.className = 'cell';
                cell.innerHTML = `
                    <svg class="dress-icon" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
                        <path class="dress-shape" d="M33 10 H67 L72 32 L63 38 L74 88 H26 L37 38 L28 32 Z" />
                    </svg>
                `;
                cell.addEventListener('click', () => {
                    state[index] = state[index] === activeColor ? null : activeColor;
                    updateFrameUI();
                    updateText();
                });
                cellElements.push(cell);
                frame.appendChild(cell);
            });
            updateFrameUI();
        }

        colorButtons.forEach((btn) => {
            btn.addEventListener('click', () => setActiveColor(btn.dataset.color));
        });

        clearBtn.addEventListener('click', () => {
            state.fill(null);
            updateFrameUI();
            updateText();
        });

        window.addEventListener('load', () => {
            applyLanguage();
            if (window.MECC_CONFIG?.renderGlobalNav) {
                window.MECC_CONFIG.renderGlobalNav(t.navTitle);
            }
            initFrame();
            updateText();
        });
    </script>
</body>
</html>
