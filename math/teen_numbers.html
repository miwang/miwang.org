<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Teen Number! 🎆</title>
    
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />
    
    <style>
        /* 🌟 强制全局使用 LXGW 字体 */
        * { 
            box-sizing: border-box; 
            font-family: "LXGW WenKai Lite", sans-serif !important; 
        }

        body { 
            background-color: #f8fafc; margin: 0; 
            display: flex; flex-direction: column; 
            height: 100vh; width: 100vw; overflow: hidden; /* 强制锁定一屏 */
        }
        body.night-mode { background-color: #000000 !important; }

        /* 🌟 极简标题栏 */
        .header { 
            height: 50px; border-bottom: 4px solid #f3b236; background: #598586; 
            display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0;
        }
        .header h1 { font-size: 1.5rem; color: white; margin: 0; }
        .back-link { position: absolute; left: 20px; color: #f3b236; text-decoration: none; font-weight: bold; }

        /* 游戏主体区 */
        .game-area { 
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; padding: 12px 16px 8px; gap: 8px;
            overflow: hidden;
        }

        /* 🌟 紧凑的目标数字显示区 */
        .target-box {
            display: flex; align-items: center; gap: clamp(10px, 1.5vw, 20px); margin-top: clamp(2px, 0.5vh, 8px);
        }
        .target-label { font-size: clamp(1.2rem, 2.2vw, 2rem); color: #1e2e46; font-weight: bold; }
        .target-number { 
            font-size: clamp(2.5rem, 5vw, 5rem); font-weight: bold; color: #f3b236; background: white; 
            border: 3px solid #598586; border-radius: 12px; padding: 0 2.5vw; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #message { height: clamp(24px, 3.5vw, 44px); font-size: clamp(1.1rem, 2vw, 1.8rem); font-weight: bold; color: #598586; margin: 4px 0; }

        .options-container { 
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 12px; width: 100%; max-width: 1100px;
            align-content: center; flex: 1;
        }

        .option-card { 
            background: white; border: 3px solid transparent; border-radius: 15px; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.06); transition: 0.2s;
            height: clamp(130px, 18vh, 220px); flex: 1 1 clamp(220px, 25vw, 380px); max-width: 420px;
        }
        .option-card.selected { border-color: #f3b236; background-color: #fffdf5; transform: scale(1.03); }

        /* 十格阵内饰微调 */
        .dot-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .ten-frame { border: 2.5px solid #333; padding: 4px; background-color: white; border-radius: 4px; }
        .frame-cell, .loose-cell { width: clamp(28px, 3.2vw, 48px); height: clamp(28px, 3.2vw, 48px); display: flex; justify-content: center; align-items: center; }
        .frame-cell { border: 1.5px solid #555; }
        .dot { width: clamp(20px, 2.4vw, 36px); height: clamp(20px, 2.4vw, 36px); background-color: #dc3545; border-radius: 50%; border: 1px solid #a71d2a; }

        /* 🌟 底部记分牌：放在底边减少占用 */
        #star-container { 
            margin-top: 6px; font-size: clamp(1rem, 1.8vw, 1.8rem); color: #f3b236; font-weight: bold;
            background: #1e2e46; padding: 4px 20px; border-radius: 30px;
            border: 2px solid #f3b236; flex-shrink: 0;
        }

        #fireworksCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <a href="../parents.html" class="back-link">⬅️ Back to Parents Hub</a>
        <h1>Teen Numbers 🎆</h1>
    </div>

    <div class="game-area">
        <div class="target-box">
            <span class="target-label">Make the number:</span>
            <div class="target-number" id="target-display">--</div>
        </div>

        <div id="message">Choose two groups!</div>
        
        <div class="options-container" id="options-container"></div>
        
        <div id="star-container">⭐ <span id="star-count">0</span> / 5</div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        let currentTarget = 0; let options = []; let selectedIndices = []; let consecutiveCorrect = 0;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        
        function playClickSound() { initAudio(); const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination); osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
        function playWinSound() { initAudio(); const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination); osc.type = 'triangle'; [523, 659, 1046].forEach((f, i) => osc.frequency.setValueAtTime(f, audioCtx.currentTime + i*0.1)); g.gain.setValueAtTime(0.3, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
        function playErrorSound() { initAudio(); const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
        function playFireworksSound() { initAudio(); const osc = audioCtx.createOscillator(); const g = audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(60, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4); g.gain.setValueAtTime(0.4, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }

        function generateDotsHTML(count) {
            let html = '';
            if (count === 10) {
                html += '<div class="dot-group ten-frame">';
                for(let i=0; i<10; i++) { html += `<div class="frame-cell"><div class="dot"></div></div>`; }
                html += '</div>';
            } else {
                html += '<div class="dot-group">';
                const totalCells = count > 5 ? 10 : 5;
                for(let i=0; i < totalCells; i++) {
                    if (i < count) { html += `<div class="loose-cell"><div class="dot"></div></div>`; }
                    else { html += `<div class="loose-cell"></div>`; }
                }
                html += '</div>';
            }
            return html;
        }

        function generateRound() {
            selectedIndices = [];
            document.body.classList.remove('night-mode');
            document.getElementById('message').innerText = "Choose two groups!";
            document.getElementById('message').style.color = "#598586";
            document.getElementById('star-count').innerText = consecutiveCorrect;
            currentTarget = Math.floor(Math.random() * 9) + 11;
            document.getElementById('target-display').innerText = currentTarget;
            let correctOnes = currentTarget - 10;
            
            options = [10, correctOnes];
            while (options.length < 5) { // 强制生成5个卡片
                let rnd = Math.floor(Math.random() * 9) + 1;
                if (rnd !== correctOnes && !options.includes(rnd)) { options.push(rnd); }
            }
            options.sort(() => Math.random() - 0.5);
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach((val, index) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = generateDotsHTML(val);
                card.onclick = () => handleCardClick(index, card);
                container.appendChild(card);
            });
        }

        function handleCardClick(index, card) {
            playClickSound();
            if (selectedIndices.includes(index)) { selectedIndices = selectedIndices.filter(i => i !== index); card.classList.remove('selected'); }
            else { if (selectedIndices.length < 2) { selectedIndices.push(index); card.classList.add('selected'); } }
            if (selectedIndices.length === 2) { verifySelection(); }
        }

        function verifySelection() {
            const sum = options[selectedIndices[0]] + options[selectedIndices[1]];
            const cards = document.querySelectorAll('.option-card');
            const c1 = cards[selectedIndices[0]]; const c2 = cards[selectedIndices[1]];
            const hasTen = options[selectedIndices[0]] === 10 || options[selectedIndices[1]] === 10;

            if (sum === currentTarget && hasTen) {
                playWinSound();
                c1.style.borderColor = "#4CAF50"; c2.style.borderColor = "#4CAF50";
                document.getElementById('message').innerText = `Bingo! 10 + ${currentTarget-10} = ${currentTarget}!`;
                document.getElementById('message').style.color = "#4CAF50";
                consecutiveCorrect++; 
                if (consecutiveCorrect >= 5) {
                    document.getElementById('star-count').innerText = consecutiveCorrect;
                    document.body.classList.add('night-mode'); 
                    setTimeout(startFireworksCelebration, 500);
                } else {
                    document.getElementById('star-count').innerText = consecutiveCorrect;
                    setTimeout(generateRound, 1500);
                }
            } else {
                playErrorSound();
                c1.style.borderColor = "#dc3545"; c2.style.borderColor = "#dc3545";
                document.getElementById('message').innerText = "Oops! Not quite.";
                document.getElementById('message').style.color = "#dc3545";
                consecutiveCorrect = 0; 
                document.getElementById('star-count').innerText = consecutiveCorrect;
                setTimeout(() => { c1.classList.remove('selected'); c2.classList.remove('selected'); c1.style.borderColor = "transparent"; c2.style.borderColor = "transparent"; selectedIndices = []; document.getElementById('message').innerText = "Try again!"; }, 800);
            }
        }

        const canvas = document.getElementById('fireworksCanvas'); const ctx = canvas.getContext('2d');
        let particles = []; let animationId; let isFireworksPlaying = false;
        class Particle { constructor(x, y, color) { this.x = x; this.y = y; this.color = color; const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 8 + 4; this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed; this.alpha = 1; this.friction = 0.98; this.gravity = 0.2; this.life = Math.random() * 50 + 50; } update() { this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity; this.x += this.vx; this.y += this.vy; this.life--; this.alpha = this.life / 100; } draw() { ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); } }
        function createFirework(x, y) { const colors = ['#FF5733', '#FFC300', '#DAF7A6', '#C70039', '#33FFBD']; const color = colors[Math.floor(Math.random() * colors.length)]; for (let i = 0; i < 60; i++) { particles.push(new Particle(x, y, color)); } playFireworksSound(); }
        function animateFireworks() { ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height); particles.forEach((p, i) => { if (p.life > 0) { p.update(); p.draw(); } else { particles.splice(i, 1); } }); animationId = requestAnimationFrame(animateFireworks); }
        function startFireworksCelebration() { if (isFireworksPlaying) return; isFireworksPlaying = true; canvas.style.display = 'block'; canvas.width = window.innerWidth; canvas.height = window.innerHeight; animateFireworks(); createFirework(canvas.width * 0.5, canvas.height * 0.3); setTimeout(() => createFirework(canvas.width * 0.3, canvas.height * 0.4), 800); setTimeout(() => createFirework(canvas.width * 0.7, canvas.height * 0.4), 1600); setTimeout(stopFireworksCelebration, 4000); }
        function stopFireworksCelebration() { isFireworksPlaying = false; cancelAnimationFrame(animationId); canvas.style.display = 'none'; consecutiveCorrect = 0; generateRound(); }
        generateRound();
    </script>
</body>
</html>
