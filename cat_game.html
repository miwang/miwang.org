<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猫在哪里？</title>
    <style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />
body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* 把绝对高度改成最小高度，允许内容撑开屏幕 */
            min-height: 100vh; 
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f9f9;
            color: #333;
            /* 允许上下滑动，但禁止左右乱晃 */
            overflow-x: hidden; 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }
        /* --- 星星计分板 --- */
        #star-container {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: #f3b236;
            display: none; /* 开始界面隐藏 */
            align-items: center;
            gap: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .star-icon {
            font-size: 2.5rem;
        }

        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); color: #fff; }
            100% { transform: scale(1); }
        }

        .pop-anim {
            animation: starPop 0.4s ease-in-out;
        }

        /* --- 开始界面（字卡墙）样式 --- */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 90%;
            height: 100%;
            padding-top: 30px;
            z-index: 10;
        }

        #start-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #f3b236;
        }

        .controls {
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 25px;
            font-size: 1.2rem;
            background-color: #598586;
            color: #f3b236;
            border: 2px solid #f3b236;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            margin: 0 10px;
 font-family: "LXGW WenKai Lite", system-ui, -apple-system, sans-serif;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #4a6f70;
        }

        #char-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            overflow-y: auto;
            max-height: 60vh;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }

        .char-card {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
        }

        .char-card.selected {
            background-color: #598586;
            color: #f3b236;
            border: 3px solid #f3b236;
            transform: scale(1.1);
        }

        /* --- 游戏界面样式 --- */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 50px;
            font-size: 3.5rem;
            letter-spacing: 5px;
        }

        .game-board {
            display: flex;
            gap: 40px;
            margin-top: 100px;
            z-index: 2;
        }

        .card-container {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .hidden-cat {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes bounceCat {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -80%); }
        }

        .cat-found-anim {
            animation: bounceCat 0.5s ease-in-out infinite;
            opacity: 1 !important;
        }

        .char-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #598586;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 6rem;
            color: #f3b236;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.2);
            transition: transform 0.1s;
        }

        .char-circle:active {
            transform: scale(0.95);
        }

        @keyframes tornadoFly {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-150px) scale(1.5) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(-400px) scale(0) rotate(720deg); opacity: 0; }
        }

        .fly-away {
            animation: tornadoFly 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            pointer-events: none;
        }

        .footer {
            margin-top: auto;
            margin-bottom: 60px;
            font-size: 2.5rem;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: #598586;
        }

        .bottom-wave {
            position: absolute;
            bottom: -50%;
            width: 150%;
            height: 80%;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 1;
        }

        #next-btn {
            display: none;
        }
    </style>
</head>
<body>

    <div id="star-container">
        <span class="star-icon" id="star-icon">⭐</span> x <span id="star-count">0</span>
    </div>

    <div id="start-screen">
        <h1>选择本节课的四会字</h1>
        <div class="controls">
            <button class="btn" onclick="selectAll()">全选</button>
            <button class="btn" onclick="clearAll()">清空</button>
            <button class="btn" onclick="startGame()" style="background-color: #f3b236; color: #1f2e46; border-color: #1f2e46;">开始游戏</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-screen">
        <div class="header">
            小猫在哪里？
        </div>
        
        <div class="game-board" id="board"></div>

        <div class="footer">
            <div id="result-text">小猫在 ______ 的后面。</div>
            <button class="btn" id="next-btn" onclick="nextRound()">下一组 ➔</button>
        </div>

        <div class="bottom-wave"></div>
    </div>

    <script>
        const allChars = [
            '四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太',
            '六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也',
            '八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有',
            '要','是','了'
        ];

        let selectedChars = [];
        let currentTargetIndex = -1;
        let currentChars = [];
        let totalStars = 0; // 记录星星总数

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSwooshSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTadaSound() {
            initAudio();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.type = 'triangle';
            osc2.type = 'sine';
            
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            
            osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime); 
            osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            
            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.6);
            osc2.stop(audioCtx.currentTime + 0.6);
        }
        
        // 获得星星时的清脆音效
        function playStarSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); // C#6
            osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.2); // E6
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        window.onload = () => {
            const grid = document.getElementById('char-grid');
            allChars.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerText = char;
                card.onclick = () => {
                    card.classList.toggle('selected');
                };
                grid.appendChild(card);
            });
        };

        function selectAll() {
            document.querySelectorAll('.char-card').forEach(card => card.classList.add('selected'));
        }

        function clearAll() {
            document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
        }

        function startGame() {
            initAudio(); 
            
            const selectedElements = document.querySelectorAll('.char-card.selected');
            selectedChars = Array.from(selectedElements).map(el => el.innerText);
            
            if (selectedChars.length < 4) {
                alert("因为每轮需要展示4个不重复的字，请至少选择4个字来开始游戏哦！");
                return;
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('star-container').style.display = 'flex'; // 显示计分板
            nextRound();
        }

        function nextRound() {
            const board = document.getElementById('board');
            const resultText = document.getElementById('result-text');
            const nextBtn = document.getElementById('next-btn');
            
            board.innerHTML = '';
            resultText.innerText = '小猫在 ______ 的后面。';
            nextBtn.style.display = 'none';
            currentChars = [];

            let tempChars = [...selectedChars];
            for (let i = tempChars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempChars[i], tempChars[j]] = [tempChars[j], tempChars[i]];
            }
            currentChars = tempChars.slice(0, 4);

            currentTargetIndex = Math.floor(Math.random() * 4);

            for (let i = 0; i < 4; i++) {
                const container = document.createElement('div');
                container.className = 'card-container';

                const cat = document.createElement('div');
                cat.className = 'hidden-cat';
                cat.innerText = '😸';
                cat.id = 'cat-' + i;
                
                if (i === currentTargetIndex) {
                    cat.style.opacity = '1';
                }

                const circle = document.createElement('div');
                circle.className = 'char-circle';
                circle.innerText = currentChars[i];
                circle.onclick = function() { reveal(i, this, cat); };

                container.appendChild(cat);
                container.appendChild(circle);
                board.appendChild(container);
            }
        }

        function reveal(index, circleElement, catElement) {
            circleElement.classList.add('fly-away');

            if (index === currentTargetIndex) {
                playTadaSound();
                setTimeout(addStar, 400); // 稍微延迟一下加星星，效果更好
                
                catElement.classList.add('cat-found-anim');
                const charFound = currentChars[index];
                document.getElementById('result-text').innerText = `小猫在“${charFound}”的后面！`;
                document.getElementById('next-btn').style.display = 'block';
                
                const allCircles = document.querySelectorAll('.char-circle');
                allCircles.forEach(c => c.style.pointerEvents = 'none');
            } else {
                playSwooshSound();
            }
        }
        
        function addStar() {
            totalStars++;
            document.getElementById('star-count').innerText = totalStars;
            playStarSound();
            
            // 触发星星放大特效
            const starIcon = document.getElementById('star-icon');
            starIcon.classList.remove('pop-anim');
            void starIcon.offsetWidth; // 触发重绘，重新播放动画
            starIcon.classList.add('pop-anim');
        }
    </script>
</body>
</html>
