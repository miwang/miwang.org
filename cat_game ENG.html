<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where is the Cat?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'KaiTi', 'STKaiti', serif;
            background-color: #1f2e46;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #star-container {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.8rem;
            color: #f3b236;
            display: none; 
            align-items: center;
            gap: 10px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .star-icon {
            font-size: 2rem;
        }

        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.6); color: #fff; }
            100% { transform: scale(1); }
        }

        .pop-anim {
            animation: starPop 0.4s ease-in-out;
        }

        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 95%;
            height: 100%;
            padding-top: 20px;
            z-index: 10;
        }

        #start-screen h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #f3b236;
            text-align: center;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 1.1rem;
            background-color: #598586;
            color: #f3b236;
            border: 2px solid #f3b236;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #4a6f70;
        }

        #char-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            width: 100%;
            max-width: 800px;
        }

        .char-card {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            background-color: #e0e0e0;
            color: #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 3px solid transparent;
            font-family: 'KaiTi', 'STKaiti', serif;
        }

        .char-card.selected {
            background-color: #598586;
            color: #f3b236;
            border: 3px solid #f3b236;
            transform: scale(1.1);
        }

        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-weight: bold;
            z-index: 10;
        }

        .game-board {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-top: 60px;
            z-index: 10;
        }

        .card-container {
            position: relative;
            width: 140px;
            height: 140px;
        }

        .hidden-cat {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        @keyframes bounceCat {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -80%); }
        }

        .cat-found-anim {
            animation: bounceCat 0.5s ease-in-out infinite;
            opacity: 1 !important;
        }

        .char-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #598586;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5rem;
            color: #f3b236;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.2);
            transition: transform 0.1s;
            font-family: 'KaiTi', 'STKaiti', serif;
        }

        .char-circle:active {
            transform: scale(0.95);
        }

        @keyframes tornadoFly {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-150px) scale(1.5) rotate(180deg); opacity: 0.8; }
            100% { transform: translateY(-400px) scale(0) rotate(720deg); opacity: 0; }
        }

        .fly-away {
            animation: tornadoFly 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
            pointer-events: none;
        }

        .footer {
            margin-top: auto;
            margin-bottom: 50px;
            font-size: 1.8rem;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            color: #1f2e46; /* 将文字颜色改深，在白底上更清晰 */
            font-weight: bold;
            text-align: center;
            padding: 0 15px;
        }

        .bottom-wave {
            position: absolute;
            bottom: -50%;
            width: 150%;
            height: 80%;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none; 
        }

        /* 改用 visibility 控制显示隐藏，防止页面跳动 */
        #next-btn {
            visibility: hidden; 
        }

        /* 手机端自适应排版 */
        @media (max-width: 600px) {
            .header { font-size: 2rem; margin-top: 30px; }
            .game-board { gap: 15px; margin-top: 40px; }
            .card-container { width: 100px; height: 100px; }
            .char-circle { font-size: 3.5rem; }
            .hidden-cat { font-size: 4.5rem; }
            .footer { font-size: 1.5rem; margin-bottom: 40px; }
            .char-card { width: 40px; height: 40px; font-size: 1.4rem; }
            #star-container { top: 10px; right: 10px; font-size: 1.2rem; padding: 5px 10px; }
            .star-icon { font-size: 1.5rem; }
            #start-screen h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="star-container">
        <span class="star-icon" id="star-icon">⭐</span> x <span id="star-count">0</span>
    </div>

    <div id="start-screen">
        <h1>Select Characters to Practice</h1>
        <div class="controls">
            <button class="btn" onclick="selectAll()">Select All</button>
            <button class="btn" onclick="clearAll()">Clear All</button>
            <button class="btn" onclick="startGame()" style="background-color: #f3b236; color: #1f2e46; border-color: #1f2e46;">Start Game</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-screen">
        <div class="header">
            Where is the cat?
        </div>
        
        <div class="game-board" id="board"></div>

        <div class="footer">
            <button class="btn" id="next-btn" onclick="nextRound()">Next Round ➔</button>
            <div id="result-text">The cat is behind ______.</div>
        </div>

        <div class="bottom-wave"></div>
    </div>

    <script>
        const allChars = [
            '四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太',
            '六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也',
            '八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有',
            '要','是','了'
        ];

        let selectedChars = [];
        let currentTargetIndex = -1;
        let currentChars = [];
        let totalStars = 0;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSwooshSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTadaSound() {
            initAudio();
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.type = 'triangle';
            osc2.type = 'sine';
            
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            
            osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime); 
            osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            
            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.6);
            osc2.stop(audioCtx.currentTime + 0.6);
        }
        
        function playStarSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); 
            osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.2); 
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        window.onload = () => {
            const grid = document.getElementById('char-grid');
            allChars.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerText = char;
                card.onclick = () => {
                    card.classList.toggle('selected');
                };
                grid.appendChild(card);
            });
        };

        function selectAll() {
            document.querySelectorAll('.char-card').forEach(card => card.classList.add('selected'));
        }

        function clearAll() {
            document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected'));
        }

        function startGame() {
            initAudio(); 
            
            const selectedElements = document.querySelectorAll('.char-card.selected');
            selectedChars = Array.from(selectedElements).map(el => el.innerText);
            
            if (selectedChars.length < 4) {
                alert("Please select at least 4 characters to start the game!");
                return;
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('star-container').style.display = 'flex'; 
            nextRound();
        }

        function nextRound() {
            const board = document.getElementById('board');
            const resultText = document.getElementById('result-text');
            const nextBtn = document.getElementById('next-btn');
            
            board.innerHTML = '';
            resultText.innerText = 'The cat is behind ______.';
            nextBtn.style.visibility = 'hidden'; // 改用 visibility
            currentChars = [];

            let tempChars = [...selectedChars];
            for (let i = tempChars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempChars[i], tempChars[j]] = [tempChars[j], tempChars[i]];
            }
            currentChars = tempChars.slice(0, 4);

            currentTargetIndex = Math.floor(Math.random() * 4);

            for (let i = 0; i < 4; i++) {
                const container = document.createElement('div');
                container.className = 'card-container';

                const cat = document.createElement('div');
                cat.className = 'hidden-cat';
                cat.innerText = '😸';
                cat.id = 'cat-' + i;
                
                if (i === currentTargetIndex) {
                    cat.style.opacity = '1';
                }

                const circle = document.createElement('div');
                circle.className = 'char-circle';
                circle.innerText = currentChars[i];
                circle.onclick = function() { reveal(i, this, cat); };

                container.appendChild(cat);
                container.appendChild(circle);
                board.appendChild(container);
            }
        }

        function reveal(index, circleElement, catElement) {
            circleElement.classList.add('fly-away');

            if (index === currentTargetIndex) {
                playTadaSound();
                setTimeout(addStar, 400); 
                
                catElement.classList.add('cat-found-anim');
                const charFound = currentChars[index];
                document.getElementById('result-text').innerText = `The cat is behind "${charFound}"!`;
                document.getElementById('next-btn').style.visibility = 'visible'; // 改用 visibility
                
                const allCircles = document.querySelectorAll('.char-circle');
                allCircles.forEach(c => c.style.pointerEvents = 'none');
            } else {
                playSwooshSound();
            }
        }
        
        function addStar() {
            totalStars++;
            document.getElementById('star-count').innerText = totalStars;
            playStarSound();
            
            const starIcon = document.getElementById('star-icon');
            starIcon.classList.remove('pop-anim');
            void starIcon.offsetWidth; 
            starIcon.classList.add('pop-anim');
        }
    </script>
</body>
</html>
