<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Teen Number! 🎆</title>
    <style>
body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            /* 把绝对高度改成最小高度，允许内容撑开屏幕 */
            min-height: 100vh; 
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f9f9;
            color: #333;
            /* 允许上下滑动，但禁止左右乱晃 */
            overflow-x: hidden; 
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            transition: background-color 0.5s; /* 用于放烟花时变黑背景 */
        }

        /* 放烟花时的夜空背景 */
        body.night-mode {
            background-color: #000000 !important;
        }

        .header {
            width: 100%;
            background-color: #598586;
            color: white;
            padding: 15px 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            box-sizing: border-box;
            z-index: 10;
        }

        .header h1 { margin: 0; font-size: 2rem; color: #f3b236; }
        
        .back-btn {
            position: absolute;
            left: 15px;
            top: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .fullscreen-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .fullscreen-btn:hover { background: rgba(255,255,255,0.4); }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            z-index: 5;
            position: relative;
        }

        .target-container { text-align: center; margin-bottom: 10px; }
        .target-text { font-size: 1.5rem; color: #1f2e46; font-weight: bold; margin-bottom: 5px; }
        .target-number { font-size: 4rem; font-weight: bold; color: #f3b236; background: white; border: 4px solid #598586; border-radius: 20px; padding: 5px 30px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); display: inline-block; }

        #message { height: 35px; font-size: 1.6rem; font-weight: bold; margin: 10px 0; color: #598586; text-align: center;}

        .options-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 900px; width: 100%; }
        .option-card { background: white; border: 4px solid transparent; border-radius: 20px; padding: 15px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 6px 12px rgba(0,0,0,0.08); transition: all 0.2s; }
        .option-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .option-card.selected { border-color: #f3b236; background-color: #fffdf5; transform: scale(1.05); }

        .dot-group { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .ten-frame { border: 2px solid black; padding: 2px; background-color: white; gap: 0; }
        .frame-cell { width: 32px; height: 32px; border: 1px solid black; display: flex; justify-content: center; align-items: center; box-sizing: border-box; }
        .loose-cell { width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; }
        .dot { width: 24px; height: 24px; background-color: #dc3545; border-radius: 50%; border: 1px solid #a71d2a; box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2); }

        /* 计分板，隐藏以便连续答对计数器使用 */
        #star-container { position: absolute; bottom: 15px; right: 20px; font-size: 1.5rem; color: #ffcc00; font-weight: bold;}

        /* --- 烟花 Canvas --- */
        #fireworksCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 让点击穿透过去 */
            z-index: 1000; /* 最上层 */
            display: none; /* 默认隐藏 */
        }

        @media (max-width: 600px) {
            .frame-cell, .loose-cell { width: 40px; height: 40px; }
            .dot { width: 30px; height: 30px; }
            .target-number { font-size: 3.5rem; }
            .options-container { gap: 10px; }
        }

        @keyframes tada { 0% { transform: scale(1); } 10%, 20% { transform: scale(0.9) rotate(-3deg); } 30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); } 40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); } 100% { transform: scale(1); } }
        .success-anim { animation: tada 0.8s; border-color: #4CAF50 !important; }
        .error-anim { animation: shake 0.4s; border-color: #dc3545 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">⬅️ Back</a>
        <h1>Teen Numbers</h1>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
    </div>

    <div class="game-area" id="game-area">
        <div class="target-container">
            <div class="target-text">Make the number!</div>
            <div class="target-number" id="target-display">14</div>
        </div>

        <div id="message">Choose two groups!</div>
        <div class="options-container" id="options-container"></div>
        <div id="star-container">⭐ <span id="star-count">0</span> / 5</div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        let currentTarget = 0;
        let options = [];
        let selectedIndices = [];
        
        // 连续答对计数器 (核心！)
        let consecutiveCorrect = 0;
        const targetForFireworks = 5; // 连对5次触发

        // --- 全屏控制逻辑 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) { docElm.requestFullscreen(); }
                else if (docElm.webkitRequestFullscreen) { docElm.webkitRequestFullscreen(); } // Safari
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }

        // --- 音效配置 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        
        function playClickSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function playWinSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.2); 
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function playErrorSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        // 烟花爆炸声
        function playFireworksSound() {
            initAudio();
            // 同时播放高低两个音符模拟爆炸和嘶嘶声
            const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
            osc1.connect(gain1); gain1.connect(audioCtx.destination);
            osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(60, audioCtx.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);
            gain1.gain.setValueAtTime(0.4, audioCtx.currentTime); gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            
            const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
            osc2.connect(gain2); gain2.connect(audioCtx.destination);
            osc2.type = 'white-noise' || 'sawtooth'; // 模拟嘶嘶声，Sawtooth也凑合
            osc2.frequency.setValueAtTime(1000, audioCtx.currentTime);
            osc2.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gain2.gain.setValueAtTime(0.1, audioCtx.currentTime); gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc1.start(); osc1.stop(audioCtx.currentTime + 0.4);
            osc2.start(); osc2.stop(audioCtx.currentTime + 0.5);
        }

        // --- 绘图逻辑 ---
        function generateDotsHTML(count) {
            let html = '';
            if (count === 10) {
                html += '<div class="dot-group ten-frame">';
                for(let i=0; i<10; i++) { html += `<div class="frame-cell"><div class="dot"></div></div>`; }
                html += '</div>';
            } else {
                html += '<div class="dot-group">';
                for(let i=0; i<10; i++) {
                    if (i < count) { html += `<div class="loose-cell"><div class="dot"></div></div>`; }
                    else if (i < 5 || (count > 5 && i < 10)) { html += `<div class="loose-cell"></div>`; }
                }
                html += '</div>';
            }
            return html;
        }

        // --- 游戏核心逻辑 ---
        function generateRound() {
            selectedIndices = [];
            // 如果刚放完烟花，恢复背景和提示
            document.body.classList.remove('night-mode');
            document.getElementById('message').innerText = "Choose two groups!";
            document.getElementById('message').style.color = "#598586";
            
            // 更新连续答对的星星显示
            document.getElementById('star-count').innerText = consecutiveCorrect;

            currentTarget = Math.floor(Math.random() * 9) + 11;
            document.getElementById('target-display').innerText = currentTarget;

            let correctOnes = currentTarget - 10;
            
            options = [10, correctOnes];
            while (options.length < 5) {
                let randomDistractor = Math.floor(Math.random() * 9) + 1;
                if (randomDistractor !== correctOnes && !options.includes(randomDistractor)) { options.push(randomDistractor); }
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach((val, index) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.innerHTML = generateDotsHTML(val);
                card.onclick = () => handleCardClick(index, card);
                container.appendChild(card);
            });
        }

        function handleCardClick(index, cardElement) {
            playClickSound();
            if (selectedIndices.includes(index)) { selectedIndices = selectedIndices.filter(i => i !== index); cardElement.classList.remove('selected'); }
            else { if (selectedIndices.length < 2) { selectedIndices.push(index); cardElement.classList.add('selected'); } }
            if (selectedIndices.length === 2) { verifySelection(); }
        }

        function verifySelection() {
            const sum = options[selectedIndices[0]] + options[selectedIndices[1]];
            const cards = document.querySelectorAll('.option-card');
            const card1 = cards[selectedIndices[0]];
            const card2 = cards[selectedIndices[1]];
            const hasTen = options[selectedIndices[0]] === 10 || options[selectedIndices[1]] === 10;

            if (sum === currentTarget && hasTen) {
                // --- 答对了 ---
                playWinSound();
                card1.classList.add('success-anim'); card2.classList.add('success-anim');
                document.getElementById('message').innerText = `Great! 10 and ${currentTarget-10} make ${currentTarget}!`;
                document.getElementById('message').style.color = "#4CAF50";
                
                consecutiveCorrect++; // 连对计数加1

                if (consecutiveCorrect >= targetForFireworks) {
                    // --- 触发烟花庆典！ ---
                    document.getElementById('star-count').innerText = consecutiveCorrect;
                    document.getElementById('message').innerText = "🎆 BOOM! 5 Stars! Fireworks! 🎆";
                    document.body.classList.add('night-mode'); // 切换夜空模式
                    
                    // 延迟一点点触发，配合文字和背景切换
                    setTimeout(() => {
                        startFireworksCelebration();
                    }, 500);
                } else {
                    // 普通连对，普通下一关
                    document.getElementById('star-count').innerText = consecutiveCorrect;
                    setTimeout(generateRound, 2000);
                }
            } else {
                // --- 答错了 ---
                playErrorSound();
                card1.classList.add('error-anim'); card2.classList.add('error-anim');
                document.getElementById('message').innerText = "Oops! Try again.";
                document.getElementById('message').style.color = "#dc3545";
                
                consecutiveCorrect = 0; // 连对计数归零 (残忍但有趣！)
                document.getElementById('star-count').innerText = consecutiveCorrect;

                setTimeout(() => { card1.classList.remove('selected', 'error-anim'); card2.classList.remove('selected', 'error-anim'); selectedIndices = []; document.getElementById('message').innerText = "Choose two groups!"; document.getElementById('message').style.color = "#598586"; }, 600);
            }
        }

        // ==========================================
        // --- 绚丽的 Canvas 烟花效果实现 (核心！) ---
        // ==========================================
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;
        let isFireworksPlaying = false;

        // 烟花粒子类
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                // 爆炸力度（初速度）
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 4; // 速度范围
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1; // 初始透明度
                this.friction = 0.98; // 空气阻力
                this.gravity = 0.2; // 重力
                this.life = Math.random() * 50 + 50; // 生命值
            }
            update() {
                this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy;
                this.life--; this.alpha = this.life / 100; // 随生命衰减
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
            }
        }

        // 创建一次爆炸
        function createFirework(x, y) {
            const colors = ['#FF5733', '#FFC300', '#DAF7A6', '#C70039', '#900C3F', '#33FFBD', '#FF33FB'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 80; i++) { particles.push(new Particle(x, y, color)); }
            playFireworksSound(); // 伴随爆炸声
        }

        // 烟花动画循环
        function animateFireworks() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // 绘制半透明黑色蒙版模拟烟花拖尾
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => { if (p.life > 0) { p.update(); p.draw(); } else { particles.splice(i, 1); } });
            animationId = requestAnimationFrame(animateFireworks);
        }

        // 启动烟花庆典
        function startFireworksCelebration() {
            if (isFireworksPlaying) return;
            isFireworksPlaying = true;
            canvas.style.display = 'block';
            particles = [];
            // 设置Canvas全屏尺寸
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            
            animateFireworks(); // 启动循环

            // 像放烟花晚会一样，在不同时间和地点炸开几次
            createFirework(canvas.width * 0.5, canvas.height * 0.3); // 第一次：中间偏上

            setTimeout(() => createFirework(canvas.width * 0.25, canvas.height * 0.4), 800);  // 左下一点
            setTimeout(() => createFirework(canvas.width * 0.75, canvas.height * 0.25), 1500); // 右上一点
            setTimeout(() => createFirework(canvas.width * 0.5, canvas.height * 0.4), 2200);   // 最后：中间核心

            // 4.5秒后自动停止
            setTimeout(stopFireworksCelebration, 4500);
        }

        // 停止烟花庆典
        function stopFireworksCelebration() {
            if (!isFireworksPlaying) return;
            isFireworksPlaying = false;
            cancelAnimationFrame(animationId); // 停止循环
            canvas.style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 清空画布
            consecutiveCorrect = 0; // 清零计数器
            generateRound(); // 恢复普通下一关
        }

        // 窗口大小调整时调整Canvas尺寸
        window.addEventListener('resize', () => { if (isFireworksPlaying) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } });

        generateRound();
    </script>
</body>
</html>
