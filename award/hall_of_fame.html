<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>荣誉殿堂 - Hall of Fame</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <script src="../js/config.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/common_nav.css" />
  <style>
    :root{
      --hof-green:#1B4332;
      --hof-bg:#F7F3EC;
      --hof-gold:#C9A227;
      --mecc-color:#174A49;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--hof-bg); min-height:100vh; color:#1a2740; padding-top:60px; }

    /* ── 强制导航标题内 span 字体不被 common_nav.css 覆盖 ── */
    .mecc-nav-title .font-en{
      font-family:"LXGW WenKai Lite",system-ui,sans-serif !important;
    }
    .mecc-nav-title .font-zh{
      font-family:"STKaiti","Kaiti SC","KaiTi","楷体","LXGW WenKai Lite",serif !important;
    }

    /* ── 月份导航 ── */
    .month-nav{
      display:flex; align-items:center; justify-content:center;
      gap:16px; padding:14px 20px; background:#fff;
      border-bottom:1px solid #E8E0D0; box-shadow:0 2px 6px rgba(0,0,0,.05);
      position:sticky; top:60px; z-index:20;
    }
    .nav-btn{
      background:var(--hof-green); color:#fff; border:none; width:36px; height:36px; border-radius:50%;
      cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s;
    }
    .nav-btn:hover:not(:disabled){ transform:scale(1.1); background:var(--hof-gold); color:#153026; }
    .nav-btn:disabled{ background:#ccc; cursor:default; }
    .month-label{
      min-width:170px; text-align:center; font-size:1.2rem; font-weight:700; color:var(--hof-green);
      /* 不加 font-zh，让内部 span 各自控制字体 */
    }

    /* ── 图例条 ── */
    .legend-bar{
      display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
      padding:10px 20px; background:#fff; border-bottom:1px solid #E8E0D0;
    }
    .legend-pill{ padding:4px 12px; border-radius:20px; color:#fff; font-size:.74rem; font-weight:600; line-height:1; }

    /* ── 主体 ── */
    .hof-main{ max-width:1480px; margin:0 auto; padding:26px 20px 60px; }

    /* ── 徽章网格 ── */
    .badge-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
      gap:30px 22px; justify-items:center; align-items:start;
    }
    .badge-item{
      width:100%; max-width:320px; display:flex; flex-direction:column; align-items:center;
      animation:fadeUp .35s ease both;
    }
    @keyframes fadeUp{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

    /* ── 勋章卡片 ── */
    .medal-card{
      position:relative; width:300px; aspect-ratio:1/1;
      line-height:0; overflow:visible; isolation:isolate;
      filter:drop-shadow(0 8px 10px rgba(0,0,0,.12)); transition:transform .25s ease;
    }
    .medal-card:hover{ transform:translateY(-4px) scale(1.02); }

    .medal-base{
      position:absolute; inset:0; width:100%; height:100%;
      display:block; object-fit:contain; user-select:none; pointer-events:none; z-index:1;
    }

    .ov-photo,.ov-name,.ov-award,.ov-en,.ov-year{
      position:absolute; z-index:4; pointer-events:none;
    }

    .ov-photo{
      left:50%; top:42.5%;
      width:78px; height:78px;
      transform:translate(-50%,-50%);
      border-radius:50%; object-fit:cover;
    }

    .ov-name{
      left:50%; top:60.5%; transform:translateX(-50%);
      font-size:17px; font-weight:700; letter-spacing:1px; color:#A8761F; white-space:nowrap;
      text-shadow:0 1px 0 rgba(255,255,255,0.35);
      font-family:"STKaiti","Kaiti SC","KaiTi","楷体","LXGW WenKai Lite",serif; line-height:1;
    }

    .ov-award{
      left:50%; top:72.5%; transform:translateX(-50%);
      font-size:12px; font-weight:800; color:#fff; white-space:nowrap;
      text-shadow:0 1px 1px rgba(0,0,0,.35);
      font-family:"STKaiti","Kaiti SC","KaiTi","楷体","LXGW WenKai Lite",serif; line-height:1;
      text-align:center;
    }

    .ov-en{
      left:50%; top:77.5%; transform:translateX(-50%);
      font-size:8.4px; font-weight:800; color:#FFE8AA;
      font-family:"LXGW WenKai Lite",system-ui,sans-serif;
      text-transform:uppercase; line-height:1.1; letter-spacing:.1px;
      text-align:center; width:60%; white-space:normal;
    }

    .ov-year{
      left: 59%;
      top:17.0%;
      font-size:18px;
      font-weight:900;
      line-height:1.05;
      color:var(--mecc-color);
      text-align:left;
      font-family:"LXGW WenKai Lite","Arial Black","Arial Bold",Arial,sans-serif;
      letter-spacing:0;
      white-space:normal;
    }
    .ov-year .y-top,
    .ov-year .y-bottom{ display:block; }

    .state-box{ grid-column:1/-1; text-align:center; padding:60px 20px; color:#888; }
    .state-icon{ font-size:3rem; margin-bottom:8px; }
    .spinner{
      width:44px; height:44px; border:4px solid #E8E0D0; border-top-color:var(--hof-green);
      border-radius:50%; animation:spin .75s linear infinite; margin:0 auto 16px;
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    @media (max-width:768px){
      body{ padding-top:54px; }
      .month-nav{ top:54px; }
      .badge-grid{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:20px 10px; }
      .medal-card{ width:210px; }

      .ov-photo{ width:54px; height:54px; top:42.5%; }
      .ov-name{ font-size:13px; top:60.5%; }
      .ov-award{ font-size:10px; top:72.5%; }
      .ov-en{ font-size:7px; top:77.4%; width:64%; }
      .ov-year{ font-size:15px; top:17.0%; left:59%; }
    }
  </style>
</head>
<body>
  <nav class="mecc-global-nav">
    <a href="../index.html" class="mecc-nav-back en" aria-label="Back Home">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>Home</span>
    </a>
    <h1 class="mecc-nav-title">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none"
           stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           style="vertical-align:middle;margin-right:6px;flex-shrink:0;display:inline-block">
        <polyline points="2,10 14,3 26,10"/>
        <line x1="2"  y1="10" x2="26" y2="10"/>
        <line x1="5"  y1="11" x2="5"  y2="23"/>
        <line x1="11" y1="11" x2="11" y2="23"/>
        <line x1="17" y1="11" x2="17" y2="23"/>
        <line x1="23" y1="11" x2="23" y2="23"/>
        <line x1="2"  y1="23" x2="26" y2="23"/>
        <line x1="1"  y1="26" x2="27" y2="26"/>
      </svg><span class="font-zh">荣誉殿堂</span>&nbsp;<span class="font-en">Hall of Fame</span>
    </h1>
  </nav>

  <nav class="month-nav">
    <button class="nav-btn" id="prevBtn" aria-label="上一月" onclick="changeMonth(-1)">◀</button>
    <div class="month-label" id="monthLabel"><span class="font-zh">加载中…</span></div>
    <button class="nav-btn" id="nextBtn" aria-label="下一月" onclick="changeMonth(1)">▶</button>
  </nav>

  <div class="legend-bar">
    <span class="legend-pill font-zh" style="background:#1B4332">🏆 四会字大师奖</span>
    <span class="legend-pill font-zh" style="background:#1E3A8A">📐 数学大师奖</span>
    <span class="legend-pill font-zh" style="background:#5B21B6">🌟 最佳进步奖</span>
  </div>

  <main class="hof-main">
    <div class="badge-grid" id="badgeGrid">
      <div class="state-box">
        <div class="spinner"></div>
        <p><span class="font-zh">正在加载本月荣誉榜…</span></p>
      </div>
    </div>
  </main>

  <script>
    var DEFAULT_BADGE_BASE = './assets/medal_base.svg';

    var awardTextMap = {
      chinese_words: { zh: '四会字大师奖', enTop: 'BEST AWARD OF', enBottom: 'CHINESE SIGHT WORDS' },
      mathematics:   { zh: '数学大师奖',   enTop: 'BEST AWARD OF', enBottom: 'MATHEMATICS' },
      progression:   { zh: '最佳进步奖',   enTop: 'BEST AWARD OF', enBottom: 'PROGRESSION' }
    };

    var _init = new Date();
    var viewYear = _init.getFullYear();
    var viewMonth = _init.getMonth() + 1;

    function escapeHtml(str){
      if(str == null) return '';
      return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function updateNavBtn(){
      var today = new Date();
      var nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled =
        viewYear > today.getFullYear() ||
        (viewYear === today.getFullYear() && viewMonth >= today.getMonth() + 1);
    }

    function changeMonth(delta){
      viewMonth += delta;
      if(viewMonth < 1){ viewMonth = 12; viewYear--; }
      if(viewMonth > 12){ viewMonth = 1; viewYear++; }
      updateNavBtn();
      loadData();
    }

    function yearTwoLinesHtml(yearNum){
      var y = String(yearNum);
      if(y.length < 4) return '<span class="y-top">' + escapeHtml(y) + '</span>';
      return '<span class="y-top">' + escapeHtml(y.slice(0,2)) + '</span>'
           + '<span class="y-bottom">' + escapeHtml(y.slice(2)) + '</span>';
    }

    function renderBadge(s, yr){
      var name     = escapeHtml(s.studentName || '—');
      var awardCfg = awardTextMap[s.awardType] || awardTextMap.chinese_words;
      var awardZh  = escapeHtml(awardCfg.zh);
      var awardEnHtml = escapeHtml(awardCfg.enTop) + '<br>' + escapeHtml(awardCfg.enBottom);
      var photoUrl = escapeHtml(s.photoUrl || '');
      var baseUrl  = escapeHtml(s.badgeBaseUrl || DEFAULT_BADGE_BASE);
      var showYear = s.showYear !== false;
      var yearHtml = yearTwoLinesHtml(yr);

      var html = '';
      html += '<div class="badge-item"><div class="medal-card">';
      html += '<img class="medal-base" src="' + baseUrl + '" alt="medal base" loading="lazy" />';
      if(photoUrl){
        html += '<img class="ov-photo" src="' + photoUrl + '" alt="' + name + '" loading="lazy" />';
      }
      html += '<div class="ov-name">'          + name        + '</div>';
      html += '<div class="ov-award font-zh">' + awardZh     + '</div>';
      html += '<div class="ov-en">'            + awardEnHtml + '</div>';
      if(showYear){
        html += '<div class="ov-year">' + yearHtml + '</div>';
      }
      html += '</div></div>';
      return html;
    }

    function setMonthLabel(yr, mm){
      var mmStr = String(mm).padStart(2, '0');
      // 数字年份用 font-en（LXGW），中文字符用 font-zh（楷体）
      document.getElementById('monthLabel').innerHTML =
        '<span class="font-en">' + yr + '</span>'
        + '<span class="font-zh">年&nbsp;</span>'
        + '<span class="font-en">' + mmStr + '</span>'
        + '<span class="font-zh">月</span>';
    }

    function loadData(){
      var grid = document.getElementById('badgeGrid');
      var mm = String(viewMonth).padStart(2, '0');
      setMonthLabel(viewYear, viewMonth);
      grid.innerHTML = '<div class="state-box"><div class="spinner"></div><p><span class="font-zh">正在加载…</span></p></div>';

      var ym    = viewYear + '-' + mm;
      var query = '*[_type == "hallOfFame" && string::startsWith(awardMonth, "' + ym + '")] | order(_createdAt desc){ "studentName": studentRef->name, awardType, badgeBaseUrl, showYear, "photoUrl": studentRef->avatar.asset->url }';
      var url   = 'https://sow12t1i.api.sanity.io/v2023-05-03/data/query/production?query=' + encodeURIComponent(query);

      fetch(url)
        .then(function(r){
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function(data){
          var list = Array.isArray(data.result) ? data.result : [];
          if(!list.length){
            grid.innerHTML =
              '<div class="state-box"><div class="state-icon">📅</div>' +
              '<h3 class="font-zh">' + escapeHtml(String(viewYear)) + '年' + mm + '月暂无上榜学生</h3>' +
              '<p class="font-zh">去 Sanity 后台添加本月荣誉记录吧！</p></div>';
            return;
          }
          grid.innerHTML = list.map(function(item){ return renderBadge(item, viewYear); }).join('');
        })
        .catch(function(e){
          console.error(e);
          grid.innerHTML =
            '<div class="state-box"><div class="state-icon">❌</div>' +
            '<h3 class="font-zh">数据加载失败</h3>' +
            '<p>' + escapeHtml(e && e.message ? e.message : '未知错误') + '</p></div>';
        });
    }

    updateNavBtn();
    loadData();
  </script>
</body>
</html>
