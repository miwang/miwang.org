<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>荣誉殿堂 - Hall of Fame</title>
  <link rel="icon" type="image/png" href="../favicon.png" />
  <script src="../js/config.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/common_nav.css" />
  <style>
    :root{
      --hof-green:#1B4332;
      --hof-bg:#F7F3EC;
      --hof-gold:#C9A227;
      --mecc-color:#174A49;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--hof-bg); min-height:100vh; color:#1a2740; padding-top:60px; }

    /* 强制导航标题内 span 字体 */
    .mecc-nav-title .font-en{ font-family:"LXGW WenKai Lite",system-ui,sans-serif !important; }
    .mecc-nav-title .font-zh{ font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif !important; }

    /* ── 月份导航 ── */
    .month-nav{
      display:flex; align-items:center; justify-content:center;
      gap:16px; padding:14px 20px; background:#fff;
      border-bottom:1px solid #E8E0D0; box-shadow:0 2px 6px rgba(0,0,0,.05);
      position:sticky; top:60px; z-index:20;
    }
    .nav-btn{
      background:var(--hof-green); color:#fff; border:none; width:36px; height:36px; border-radius:50%;
      cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s;
    }
    .nav-btn:hover:not(:disabled){ transform:scale(1.1); background:var(--hof-gold); color:#153026; }
    .nav-btn:disabled{ background:#ccc; cursor:default; }
    .month-label{ min-width:170px; text-align:center; font-size:1.2rem; font-weight:700; color:var(--hof-green); }

    /* ── 图例条 ── */
    .legend-bar{
      display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
      padding:10px 20px; background:#fff; border-bottom:1px solid #E8E0D0;
    }
    .legend-pill{ padding:4px 12px; border-radius:20px; color:#fff; font-size:.74rem; font-weight:600; line-height:1; }

    /* ── 主体 ── */
    .hof-main{ max-width:1480px; margin:0 auto; padding:26px 20px 60px; }

    /* ── 徽章网格 ── */
    .badge-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
      gap:48px 22px; justify-items:center; align-items:start;
    }

    /* ── 单个徽章容器 ── */
    .badge-item{
      position:relative;
      width:100%; max-width:320px;
      display:flex; flex-direction:column; align-items:center;
      animation: dropIn .55s cubic-bezier(.34,1.56,.64,1) both;
    }
    .badge-item:nth-child(1){ animation-delay:.05s; }
    .badge-item:nth-child(2){ animation-delay:.12s; }
    .badge-item:nth-child(3){ animation-delay:.19s; }
    .badge-item:nth-child(4){ animation-delay:.26s; }
    .badge-item:nth-child(5){ animation-delay:.33s; }
    .badge-item:nth-child(6){ animation-delay:.40s; }
    .badge-item:nth-child(n+7){ animation-delay:.47s; }
    @keyframes dropIn{
      from{ opacity:0; transform:translateY(-40px) scale(.8); }
      to{   opacity:1; transform:translateY(0)     scale(1);  }
    }

    /* ── 闪光星星 ── */
    .sparkle{
      position:absolute; pointer-events:none; z-index:10;
      opacity:0; animation: sparkleAnim 2.4s ease-in-out infinite;
    }
    .sparkle-1{ top:2%;    left:4%;   animation-delay:0s;   }
    .sparkle-2{ top:2%;    right:4%;  animation-delay:.6s;  }
    .sparkle-3{ bottom:18%; left:2%;  animation-delay:1.2s; }
    .sparkle-4{ bottom:18%; right:2%; animation-delay:1.8s; }
    @keyframes sparkleAnim{
      0%,100%{ opacity:0;  transform:scale(.4) rotate(0deg);   }
      40%    { opacity:1;  transform:scale(1)  rotate(20deg);  }
      60%    { opacity:.8; transform:scale(.8) rotate(-10deg); }
    }

    /* ── 勋章卡片 ── */
    .medal-card{
      position:relative; width:300px; aspect-ratio:1/1;
      line-height:0; overflow:visible;
      filter:drop-shadow(0 6px 14px rgba(0,0,0,.14));
      animation: float 3.6s ease-in-out infinite;
      transition: filter .28s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
      cursor:pointer;
      transform-origin:center bottom;
    }
    .badge-item:nth-child(odd) .medal-card{ animation-duration:3.2s; }
    .badge-item:nth-child(3n)  .medal-card{ animation-duration:4.1s; }
    @keyframes float{
      0%,100%{ transform:translateY(0)    rotate(0deg);   }
      30%    { transform:translateY(-7px) rotate(.6deg);  }
      70%    { transform:translateY(-5px) rotate(-.5deg); }
    }
    .medal-card:hover{
      animation-play-state:paused;
      transform:scale(1.08) translateY(-6px) rotate(-1deg);
      filter:
        drop-shadow(0 0  10px rgba(255,215,0,.85))
        drop-shadow(0 0  26px rgba(255,165,0,.60))
        drop-shadow(0 18px 28px rgba(201,162,39,.45));
    }

    .medal-base{
      position:absolute; inset:0; width:100%; height:100%;
      display:block; object-fit:contain; user-select:none; pointer-events:none; z-index:1;
    }

    /* ── 叠层文字（公共） ── */
    .ov-photo,.ov-name,.ov-award,.ov-en,.ov-year,.ov-mecc{
      position:absolute; z-index:4; pointer-events:none;
    }

    .ov-photo{
      left:50%; top:42.5%; width:78px; height:78px;
      transform:translate(-50%,-50%);
      border-radius:50%; object-fit:cover;
    }

    /* 学生姓名：楷体 */
    .ov-name{
      left:50%; top:60.5%; transform:translateX(-50%);
      font-size:17px; font-weight:700; letter-spacing:1px;
      color:#A8761F; white-space:nowrap;
      text-shadow:0 1px 0 rgba(255,255,255,.35); line-height:1;
      font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;
    }

    /* 中文奖项：楷体 */
    .ov-award{
      left:50%; top:72.5%; transform:translateX(-50%);
      font-size:12px; font-weight:800; color:#fff; white-space:nowrap;
      text-shadow:0 1px 1px rgba(0,0,0,.35); line-height:1; text-align:center;
      font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;
    }

    /* 英文奖项：LXGW */
    .ov-en{
      left:50%; top:77.5%; transform:translateX(-50%);
      font-size:8.4px; font-weight:800; color:#FFE8AA;
      font-family:"LXGW WenKai Lite",system-ui,sans-serif;
      text-transform:uppercase; line-height:1.1; letter-spacing:.1px;
      text-align:center; width:60%; white-space:normal;
    }

    /*
     * 年份 & MECC：两者字体、字重、颜色完全一致，左右镜像。
     * SVG 通过 <img> 加载时浏览器沙箱阻止外部字体，
     * 所以 MECC 必须用 HTML overlay 渲染，不能依赖 SVG 内部 <text>。
     */
    .ov-year,
    .ov-mecc{
      font-size:17px; font-weight:900; line-height:1.05;
      color:var(--mecc-color);
      /* inline style 优先级最高，这里仍保留作为默认 */
      font-family:"LXGW WenKai Lite", sans-serif !important;
      letter-spacing:0; white-space:normal;
    }
    .ov-year .y-top, .ov-year .y-bottom,
    .ov-mecc .m-top, .ov-mecc .m-bottom{
      display:block;
      font-family:"LXGW WenKai Lite", sans-serif !important;
    }

    /* 年份：托杯右侧 */
    .ov-year{
      left:59%; top:16.5%; text-align:left;
    }
    /* MECC：托杯左侧，与年份对称 */
    .ov-mecc{
      right:60%; top:16.5%; text-align:right;
    }

    /* ── 状态框 ── */
    .state-box{ grid-column:1/-1; text-align:center; padding:60px 20px; color:#888; }
    .state-icon{ font-size:3rem; margin-bottom:8px; }
    .spinner{
      width:44px; height:44px; border:4px solid #E8E0D0; border-top-color:var(--hof-green);
      border-radius:50%; animation:spin .75s linear infinite; margin:0 auto 16px;
    }
    @keyframes spin{ to{ transform:rotate(360deg);} }

    /* ── 响应式 ── */
    @media (max-width:768px){
      body{ padding-top:54px; }
      .month-nav{ top:54px; }
      .badge-grid{ grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:32px 10px; }
      .medal-card{ width:210px; }
      .ov-photo{ width:54px; height:54px; top:42.5%; }
      .ov-name{ font-size:13px; top:60.5%; }
      .ov-award{ font-size:10px; top:72.5%; }
      .ov-en{ font-size:7px; top:77.4%; width:64%; }
      .ov-year{ font-size:14px; top:16.5%; left:59%; }
      .ov-mecc{ font-size:14px; top:16.5%; right:60%; }
      .sparkle svg{ width:14px; height:14px; }
    }

    /* ── 管理入口按钮（仅教师可见） ── */
    .admin-entry-btn{
      position:fixed; bottom:24px; right:24px; z-index:100;
      background:var(--hof-green); color:#fff; border:none; border-radius:50%;
      width:52px; height:52px; font-size:1.4rem; cursor:pointer;
      box-shadow:0 4px 16px rgba(0,0,0,.2); transition:transform .2s, background .2s;
      display:flex; align-items:center; justify-content:center;
    }
    .admin-entry-btn:hover{ transform:scale(1.1); background:var(--hof-gold); color:#153026; }

    /* ── 管理面板 Login overlay ── */
    #adminLoginOverlay{
      position:fixed; inset:0; z-index:9999;
      background:linear-gradient(135deg, var(--hof-green), #0f2718);
      display:none; align-items:center; justify-content:center; padding:20px;
    }
    .admin-login-box{
      background:#fff; border-radius:20px; padding:40px 36px;
      width:100%; max-width:360px; text-align:center;
      box-shadow:0 24px 60px rgba(0,0,0,.3);
    }
    .admin-login-icon{ font-size:3rem; margin-bottom:12px; }
    .admin-login-title{ font-size:1.4rem; font-weight:bold; color:var(--hof-green); margin-bottom:4px; font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif; }
    .admin-login-sub{ font-size:.85rem; color:#687386; margin-bottom:24px; font-family:"LXGW WenKai Lite",system-ui,sans-serif; }
    .admin-login-input{
      width:100%; padding:13px 16px; font-size:1.3rem; text-align:center;
      letter-spacing:6px; border:2px solid #d9dee8; border-radius:10px;
      outline:none; margin-bottom:14px; font-family:"LXGW WenKai Lite",system-ui,sans-serif; color:#172033;
      transition:border-color .2s;
    }
    .admin-login-input:focus{ border-color:var(--hof-green); }
    .admin-login-btn{
      width:100%; padding:13px; font-size:1rem; font-weight:bold;
      background:var(--hof-green); color:#fff; border:none; border-radius:10px;
      cursor:pointer; transition:background .2s; font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;
    }
    .admin-login-btn:hover{ background:#145028; }
    .admin-login-err{ color:#dc2626; font-size:.85rem; margin-top:10px; min-height:20px; }
    .admin-login-cancel{
      margin-top:12px; background:none; border:none; color:#687386; font-size:.85rem;
      cursor:pointer; text-decoration:underline; font-family:"LXGW WenKai Lite",system-ui,sans-serif;
    }

    /* ── 管理面板主体 ── */
    #adminPanel{ display:none; }
    .admin-panel-wrap{
      max-width:1100px; margin:0 auto; padding:26px 20px 60px;
    }
    .admin-panel-header{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:18px; flex-wrap:wrap; gap:10px;
    }
    .admin-panel-title{
      font-size:1.3rem; font-weight:bold; color:var(--hof-green);
      font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;
    }
    .admin-logout-btn{
      background:transparent; border:1px solid #d9dee8; color:#687386;
      padding:6px 14px; border-radius:8px; cursor:pointer; font-size:.82rem;
      font-family:"LXGW WenKai Lite",system-ui,sans-serif; transition:all .2s;
    }
    .admin-logout-btn:hover{ background:#f1f5f9; color:#172033; }
    .admin-panel{
      background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(15,23,42,.10);
      padding:22px; margin-bottom:18px;
    }
    .admin-panel .panel-title{
      font-size:1.1rem; font-weight:bold; color:var(--hof-green);
      margin-bottom:16px; display:flex; align-items:center; gap:8px;
      font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;
    }
    .admin-month-nav{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .admin-month-label{ font-size:1.1rem; font-weight:bold; color:var(--hof-green); min-width:140px; font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif; }
    .admin-refresh-btn{
      margin-left:auto; background:#f1f5f9; border:1px solid #d9dee8;
      border-radius:8px; padding:7px 14px; cursor:pointer; font-size:.85rem;
      color:#687386; transition:background .2s;
    }
    .admin-refresh-btn:hover{ background:#e2e8f0; color:#172033; }
    .admin-award-table{ width:100%; border-collapse:collapse; font-size:.9rem; }
    .admin-award-table th{ background:#f8fafc; padding:9px 10px; text-align:left; border-bottom:2px solid #d9dee8; font-weight:700; }
    .admin-award-table td{ padding:9px 10px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
    .admin-award-table tr:hover td{ background:#fafbfc; }
    .admin-badge-type{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:.78rem; font-weight:bold; color:#fff; }
    .admin-badge-cw{ background:var(--hof-green); }
    .admin-badge-ma{ background:#1E3A8A; }
    .admin-badge-pr{ background:#5B21B6; }
    .admin-del-btn{
      background:#fee2e2; color:#dc2626; border:none; border-radius:6px;
      padding:5px 10px; cursor:pointer; font-size:.8rem; transition:background .2s;
    }
    .admin-del-btn:hover{ background:#fca5a5; }
    .admin-state-box{ text-align:center; padding:32px 20px; color:#687386; font-size:.95rem; }
    .admin-spinner{
      width:38px; height:38px; border:3px solid #E8E0D0;
      border-top-color:var(--hof-green); border-radius:50%;
      animation:spin .7s linear infinite; margin:0 auto 12px;
    }
    .admin-upload-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
    @media (max-width:640px){ .admin-upload-grid{ grid-template-columns:1fr; } }
    .admin-field-label{ display:block; font-size:.82rem; font-weight:800; color:#334155; margin-bottom:5px; font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif; }
    .admin-field-select, .admin-field-input{
      width:100%; padding:10px 12px; border:1.5px solid #d9dee8;
      border-radius:10px; font-family:"LXGW WenKai Lite",system-ui,sans-serif; font-size:.95rem; background:#fff; outline:none;
      transition:border-color .2s;
    }
    .admin-field-select:focus, .admin-field-input:focus{ border-color:var(--hof-green); }
    .admin-drop-zone{
      border:2px dashed #a7c4b5; background:#f0faf5; border-radius:14px;
      padding:28px 20px; text-align:center; cursor:pointer; transition:background .2s;
    }
    .admin-drop-zone:hover, .admin-drop-zone.drag-over{ background:#dcfce7; border-color:var(--hof-green); }
    .admin-drop-icon{ font-size:2rem; margin-bottom:8px; }
    .admin-drop-hint{ font-size:.85rem; color:#687386; margin-top:4px; font-family:"LXGW WenKai Lite",system-ui,sans-serif; }
    #adminPdfInput{ display:none; }
    .admin-parse-status{ font-size:.85rem; color:#687386; margin-top:10px; min-height:20px; font-family:"LXGW WenKai Lite",system-ui,sans-serif; }
    .admin-parse-status.ok{ color:#16a34a; }
    .admin-parse-status.err{ color:#dc2626; }
    .admin-sel-table{ width:100%; border-collapse:collapse; font-size:.88rem; }
    .admin-sel-table th{ background:#f8fafc; padding:9px 10px; text-align:left; border-bottom:2px solid #d9dee8; }
    .admin-sel-table td{ padding:8px 10px; border-bottom:1px solid #f1f5f9; }
    .admin-sel-table tr.selected td{ background:#f0fdf4; }
    .admin-sel-table input[type="checkbox"]{ width:17px; height:17px; cursor:pointer; accent-color:var(--hof-green); }
    .admin-score-pill{ display:inline-block; min-width:34px; padding:2px 8px; border-radius:12px; font-weight:bold; text-align:center; font-size:.85rem; }
    .admin-score-high{ background:#dcfce7; color:#15803d; }
    .admin-score-mid{ background:#fef9c3; color:#854d0e; }
    .admin-score-low{ background:#fee2e2; color:#dc2626; }
    .admin-select-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:.88rem; }
    .admin-select-row button{
      padding:5px 12px; border:1px solid #d9dee8; border-radius:7px;
      background:#f8fafc; cursor:pointer; font-size:.82rem; transition:background .2s;
    }
    .admin-select-row button:hover{ background:#e2e8f0; }
    .admin-save-bar{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap;
      padding-top:14px; border-top:1px solid #d9dee8; margin-top:14px;
    }
    .admin-save-btn{
      background:var(--hof-green); color:#fff; border:none; border-radius:10px;
      padding:11px 26px; font-size:1rem; font-weight:bold; cursor:pointer;
      transition:background .2s; font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;
    }
    .admin-save-btn:hover:not(:disabled){ background:#145028; }
    .admin-save-btn:disabled{ opacity:.5; cursor:not-allowed; }
    .admin-save-status{ font-size:.88rem; font-family:"LXGW WenKai Lite",system-ui,sans-serif; }
    .admin-save-status.ok{ color:#16a34a; }
    .admin-save-status.err{ color:#dc2626; }
    .admin-unmatched-box{
      background:#fff7ed; border:1px solid #fed7aa; border-radius:10px;
      padding:12px 16px; margin-top:10px; font-size:.85rem;
    }
    .admin-unmatched-box strong{ color:#c2410c; }
  </style>
</head>
<body>

  <!-- 导航栏：语言自动判断 -->
  <script>
    (function(){
      var lang     = (typeof MECC_CONFIG !== 'undefined') ? MECC_CONFIG.getLang() : 'zh';
      /* zh → 教师工具台；en → 家长页 */
      var backHref = lang === 'en' ? '../parents.html'  : '../teachers.html';
      var backText = lang === 'en' ? 'Back to Parents Portal' : '返回工具台';

      var titleInner = lang === 'en'
        ? '<span class="font-en">Hall of Fame</span>'
        : '<span class="font-zh">荣誉殿堂</span>&nbsp;<span class="font-en">Hall of Fame</span>';

      document.write(
        '<nav class="mecc-global-nav">' +
          '<a href="' + backHref + '" class="mecc-nav-back' + (lang==='en' ? ' en' : '') + '" aria-label="' + backText + '">' +
            '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" style="width:24px;height:24px;flex-shrink:0;">' +
              '<path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
            '<span>' + backText + '</span>' +
          '</a>' +
          '<h1 class="mecc-nav-title" style="display:flex;align-items:center;gap:4px;">🏛️ ' + titleInner + '</h1>' +
        '</nav>'
      );
    })();
  </script>

  <nav class="month-nav">
    <button class="nav-btn" id="prevBtn" aria-label="上一月" onclick="changeMonth(-1)">◀</button>
    <div class="month-label" id="monthLabel">…</div>
    <button class="nav-btn" id="nextBtn" aria-label="下一月" onclick="changeMonth(1)">▶</button>
  </nav>

  <div class="legend-bar">
    <span class="legend-pill font-zh" style="background:#1B4332">🏆 四会字大师奖</span>
    <span class="legend-pill font-zh" style="background:#1E3A8A">📐 数学大师奖</span>
    <span class="legend-pill font-zh" style="background:#5B21B6">🌟 最佳进步奖</span>
  </div>

  <main class="hof-main">
    <div class="badge-grid" id="badgeGrid">
      <div class="state-box">
        <div class="spinner"></div>
        <p class="font-zh">正在加载荣誉榜…</p>
      </div>
    </div>
  </main>

  <script>
    var DEFAULT_BADGE_BASE = './assets/medal_base.svg';

    var awardTextMap = {
      chinese_words: { zh:'四会字大师奖', enTop:'BEST AWARD OF', enBottom:'CHINESE SIGHT WORDS' },
      mathematics:   { zh:'数学大师奖',   enTop:'BEST AWARD OF', enBottom:'MATHEMATICS' },
      progression:   { zh:'最佳进步奖',   enTop:'BEST AWARD OF', enBottom:'PROGRESSION' }
    };

    var LANG = (typeof MECC_CONFIG !== 'undefined') ? MECC_CONFIG.getLang() : 'zh';

    /* 默认显示上个月 */
    var _now = new Date();
    var viewYear  = _now.getFullYear();
    var viewMonth = _now.getMonth();   /* getMonth() 返回 0-11，刚好等于上月的 1-12 */
    if(viewMonth < 1){ viewMonth = 12; viewYear--; }

    var MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    /* 月份标签：数字用 inline LXGW，汉字用 inline STKaiti，绕过所有 CSS 级联 */
    var NUM_S   = 'font-family:"LXGW WenKai Lite",sans-serif;font-weight:700;';
    var KAITI_S = 'font-family:"KaiTi-CJK","LXGW WenKai Lite",sans-serif;font-weight:700;';

    function monthLabelHtml(yr, mm){
      var mmInt = parseInt(mm, 10);
      if(LANG === 'en'){
        return '<span style="' + NUM_S + '">' + MONTHS_EN[mmInt-1] + '\u00a0' + yr + '</span>';
      }
      return '<span style="' + NUM_S   + '">' + yr + '</span>' +
             '<span style="' + KAITI_S + '">年\u2002</span>' +
             '<span style="' + NUM_S   + '">' + mm + '</span>' +
             '<span style="' + KAITI_S + '">月</span>';
    }

    var UI = {
      loading  : LANG==='en' ? 'Loading…'               : '正在加载荣誉榜…',
      empty    : LANG==='en' ? 'Coming Soon 🌟'         : '敬请期待 🌟',
      emptySub : LANG==='en' ? 'Check back next month!' : '本月榜单即将揭晓，敬请期待！',
      fail     : LANG==='en' ? 'Failed to load.'        : '数据加载失败'
    };

    /* 不能超过上个月 */
    function updateNavBtn(){
      var today = new Date();
      var cy = today.getFullYear(), cm = today.getMonth()+1;
      var py = cm===1 ? cy-1 : cy, pm = cm===1 ? 12 : cm-1;
      document.getElementById('nextBtn').disabled =
        viewYear > py || (viewYear===py && viewMonth>=pm);
    }

    function changeMonth(delta){
      viewMonth += delta;
      if(viewMonth < 1){ viewMonth=12; viewYear--; }
      if(viewMonth > 12){ viewMonth=1; viewYear++; }
      updateNavBtn();
      loadData();
    }

    function escapeHtml(str){
      if(str==null) return '';
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    /* 年份：两行 span，字体靠 CSS .ov-year !important 保证 */
    function yearTwoLinesHtml(yearNum){
      var y = String(yearNum);
      if(y.length < 4) return '<span class="y-top">' + escapeHtml(y) + '</span>';
      return '<span class="y-top">'    + escapeHtml(y.slice(0,2)) + '</span>' +
             '<span class="y-bottom">' + escapeHtml(y.slice(2))   + '</span>';
    }

    /* 闪光星星 */
    function sparkleSvg(size){
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" ' +
             'fill="#FFD700" stroke="#FFA500" stroke-width="1" stroke-linecap="round">' +
             '<path d="M12 2 L13.5 9 L20 8 L15 13 L17 20 L12 16 L7 20 L9 13 L4 8 L10.5 9 Z"/>' +
             '</svg>';
    }
    function sparkleHtml(){
      return '<span class="sparkle sparkle-1">' + sparkleSvg(16) + '</span>' +
             '<span class="sparkle sparkle-2">' + sparkleSvg(12) + '</span>' +
             '<span class="sparkle sparkle-3">' + sparkleSvg(14) + '</span>' +
             '<span class="sparkle sparkle-4">' + sparkleSvg(10) + '</span>';
    }

    function renderBadge(s, yr){
      var name        = escapeHtml(s.studentName || '—');
      var awardCfg    = awardTextMap[s.awardType] || awardTextMap.chinese_words;
      var awardZh     = escapeHtml(awardCfg.zh);
      var awardEnHtml = escapeHtml(awardCfg.enTop) + '<br>' + escapeHtml(awardCfg.enBottom);
      var photoUrl    = escapeHtml(s.photoUrl || '');
      var baseUrl     = escapeHtml(s.badgeBaseUrl || DEFAULT_BADGE_BASE);
      var showYear    = s.showYear !== false;
      var yearHtml    = yearTwoLinesHtml(yr);

      var h = '';
      h += '<div class="badge-item">';
      h += sparkleHtml();
      h += '<div class="medal-card">';
      h += '<img class="medal-base" src="' + baseUrl + '" alt="medal" loading="lazy" />';

      /* ── MECC 叠层：HTML overlay 替代 SVG 内部字体（<img> 沙箱不加载外部字体） ── */
      h += '<div class="ov-mecc">' +
             '<span class="m-top">ME</span>' +
             '<span class="m-bottom">CC</span>' +
           '</div>';

      if(photoUrl){
        h += '<img class="ov-photo" src="' + photoUrl + '" alt="' + name + '" loading="lazy" />';
      }
      h += '<div class="ov-name">'  + name        + '</div>';
      h += '<div class="ov-award">' + awardZh     + '</div>';
      h += '<div class="ov-en">'    + awardEnHtml + '</div>';
      if(showYear){
        h += '<div class="ov-year">' + yearHtml + '</div>';
      }
      h += '</div>';  /* medal-card */
      h += '</div>';  /* badge-item */
      return h;
    }

    function loadData(){
      var grid = document.getElementById('badgeGrid');
      var mm   = String(viewMonth).padStart(2,'0');
      document.getElementById('monthLabel').innerHTML = monthLabelHtml(viewYear, mm);
      grid.innerHTML =
        '<div class="state-box"><div class="spinner"></div>' +
        '<p class="font-zh">' + UI.loading + '</p></div>';

      var ym    = viewYear + '-' + mm;
      var query = '*[_type=="hallOfFame" && string::startsWith(awardMonth,"' + ym + '")] | order(_createdAt desc){ "studentName":studentRef->name, awardType, badgeBaseUrl, showYear, "photoUrl":studentRef->avatar.asset->url }';
      var url   = 'https://sow12t1i.api.sanity.io/v2023-05-03/data/query/production?query=' + encodeURIComponent(query);

      fetch(url)
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(data){
          var list = Array.isArray(data.result) ? data.result : [];
          if(!list.length){
            grid.innerHTML =
              '<div class="state-box">' +
                '<div class="state-icon">🌟</div>' +
                '<h3 class="font-zh">' + UI.empty    + '</h3>' +
                '<p  class="font-zh">' + UI.emptySub + '</p>'  +
              '</div>';
            return;
          }
          grid.innerHTML = list.map(function(item){ return renderBadge(item, viewYear); }).join('');
        })
        .catch(function(e){
          console.error(e);
          grid.innerHTML =
            '<div class="state-box">' +
              '<div class="state-icon">❌</div>' +
              '<h3 class="font-zh">' + UI.fail + '</h3>' +
              '<p>' + escapeHtml(e && e.message ? e.message : '未知错误') + '</p>' +
            '</div>';
        });
    }

    updateNavBtn();
    loadData();
  </script>

    // ── PDF parsing ──
    var SIGHT_WORDS_TEST = 'Chinese Sight Words';
    var SIGHT_WORDS_TOTAL = 50;

    function normalizeNameKey(s){ return String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim(); }
    function isHeaderLine(s){
      var n = normalizeNameKey(s);
      return !n || /^\d{1,2}\s+\d{1,2}\s+\d{4}$/.test(n) || /^\d+$/.test(n) ||
        n.includes('student detail report') || n.includes('subject') ||
        n.includes('teacher') || n.includes('class') || n.includes('student') ||
        n.includes('wang class') || n.includes('mr wang') || n.includes('homeroom') ||
        n === 'k chinese' || n === 'chinese sight words' ||
        n === 'b' ||
        ['score','scores','test session date','correct','incorrect','notes','summary'].some(function(x){ return n.startsWith(x); });
    }
    function looksLikeName(s){
      return !isHeaderLine(s) &&
        /^[\p{Lu}][\p{L}''\-]+(?:\s+[\p{Lu}][\p{L}''\-]+)+$/u.test(s) && s.length < 80;
    }
    function findNameInText(text){
      var m = String(text||'').match(/Student:\s*([^\n]+)/);
      if(!m) return '';
      var name = m[1].trim();
      return looksLikeName(name) ? name : '';
    }
    function findStudentName(page1, page2){
      var n1=findNameInText(page1); if(n1) return n1;
      var n2=findNameInText(page2); if(n2) return n2;
      var lines=page1.split(/\n+/).map(function(l){return l.trim();}).filter(Boolean);
      var idx=lines.findIndex(function(l){return l===SIGHT_WORDS_TEST;});
      var search=idx>0?lines.slice(0,idx):lines.slice(0,14);
      for(var i=search.length-1;i>=0;i--){ if(looksLikeName(search[i])) return search[i]; }
      return '';
    }
    function extractSightWords(text){
      var idx=text.indexOf(SIGHT_WORDS_TEST); if(idx<0) return null;
      var rest=text.slice(idx,idx+500);
      var m=rest.match(/Score:\s*([0-9NT\s\/]+)/i); if(!m) return null;
      var nums=(m[1].match(/\d+/g)||[]).map(Number); if(nums.length<2) return null;
      var b=nums[0],q1=nums[1],q2=nums[2],q3=nums[3],q4=nums[4];
      var latest=(q4!=null&&isFinite(q4))?q4:nums[nums.length-1];
      return {baseline:b,q1:q1!=null?q1:null,q2:q2!=null?q2:null,q3:q3!=null?q3:null,q4:q4!=null?q4:null,latest:latest};
    }
    function hasValidSightWords(sw){ return !!(sw&&isFinite(sw.latest)); }
    function parsePages(pages){
      var byName=new Map();
      for(var i=0;i<pages.length;i++){
        var p1=pages[i]||'',p2=pages[i+1]||'';
        var name=findStudentName(p1,p2);
        if(!name||isHeaderLine(name)) continue;
        var sw=extractSightWords(p1); var usedNextPage=false;
        if(!hasValidSightWords(sw)&&p2&&!findNameInText(p2)){
          var chunk=p1+'\n'+p2; var pairSw=extractSightWords(chunk);
          if(hasValidSightWords(pairSw)){sw=pairSw;usedNextPage=true;}
        }
        var key=normalizeNameKey(name);
        var prev=byName.get(key);
        var prevScore=prev&&prev.sw&&isFinite(prev.sw.latest)?prev.sw.latest:-1;
        var currScore=sw&&isFinite(sw.latest)?sw.latest:-1;
        if(!prev||currScore>prevScore) byName.set(key,{name:name,sw:sw});
        if(usedNextPage) i++;
      }
      return Array.from(byName.values());
    }

    // ── Drop zone ──
    var adminDZ = document.getElementById('adminDropZone');

    adminDZ.addEventListener('drop',function(e){

    });

    function setAdminParseStatus(msg,cls){
      var el=document.getElementById('adminParseStatus');
      el.textContent=msg; el.className='admin-parse-status'+(cls?' '+cls:'');
    }

    function adminHandleFile(file){
      // Load pdf.js if not already
      if(typeof pdfjsLib==='undefined'){
        var s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload=function(){
          pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          doAdminParse(file);
        };
        document.head.appendChild(s);
      } else { doAdminParse(file); }
    }

    async function doAdminParse(file){
      setAdminParseStatus('正在解析 PDF…','');
      adminParsed=[];
      document.getElementById('adminSelArea').style.display='none';
      try{
        if(typeof pdfjsLib!=='undefined' && !pdfjsLib.GlobalWorkerOptions.workerSrc){
          pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        var buf=await file.arrayBuffer();
        var pdf=await pdfjsLib.getDocument({data:buf}).promise;
        var pages=[];
        for(var i=1;i<=pdf.numPages;i++){
          var page=await pdf.getPage(i);
          var content=await page.getTextContent();
          pages.push(content.items.map(function(it){return it.str;}).join('\n'));
        }
        adminParsed=parsePages(pages).filter(function(s){return !isHeaderLine(s.name);});
        if(!adminParsed.length){ setAdminParseStatus('未能解析到学生数据，请确认 PDF 格式是否正确。','err'); return; }
        adminParsed.sort(function(a,b){
          var sa=a.sw?a.sw.latest:-1, sb=b.sw?b.sw.latest:-1; return sb-sa;
        });
        setAdminParseStatus('解析完成，共找到 '+adminParsed.length+' 名学生。请选择获奖名单后保存。','ok');
        adminRenderSelTable();
        document.getElementById('adminSelArea').style.display='block';
      }catch(e){ setAdminParseStatus('PDF 解析失败：'+e.message,'err'); }
    }

    function adminScoreClass(score){
      if(score==null) return '';
      if(score>=40) return 'admin-score-high';
      if(score>=20) return 'admin-score-mid';
      return 'admin-score-low';
    }

    function adminRenderSelTable(){
      var tbody=document.getElementById('adminSelTbody');
      tbody.innerHTML=adminParsed.map(function(s,idx){
        var sw=s.sw; var latest=sw?sw.latest:null;
        var latestHtml=(latest!=null)?'<span class="admin-score-pill '+adminScoreClass(latest)+'">'+latest+'</span>':'<span style="color:#687386">—</span>';
        return '<tr id="admin-srow-'+idx+'">'+
          '<td><input type="checkbox" id="admin-chk-'+idx+'" onchange="adminOnCheck()" /></td>'+
          '<td><b>'+escapeHtml(s.name)+'</b></td>'+
          '<td>'+latestHtml+' <span style="color:#687386;font-size:.78rem">/ '+SIGHT_WORDS_TOTAL+'</span></td>'+
          '<td>'+escapeHtml(sw?sw.baseline:'—')+'</td>'+
          '<td>'+escapeHtml(sw&&sw.q1!=null?sw.q1:'—')+'</td>'+
          '<td>'+escapeHtml(sw&&sw.q2!=null?sw.q2:'—')+'</td>'+
          '<td>'+escapeHtml(sw&&sw.q3!=null?sw.q3:'—')+'</td>'+
          '<td>'+escapeHtml(sw&&sw.q4!=null?sw.q4:'—')+'</td></tr>';
      }).join('');
      adminOnCheck();
    }

    window.adminOnCheck = function(){
      var count=0;
      adminParsed.forEach(function(_,i){
        var chk=document.getElementById('admin-chk-'+i);
        var row=document.getElementById('admin-srow-'+i);
        if(chk&&chk.checked){count++;if(row)row.classList.add('selected');}
        else{if(row)row.classList.remove('selected');}
      });
      document.getElementById('adminSelCount').textContent='已选 '+count+' 人';
      document.getElementById('adminSaveBtn').disabled=(count===0);
    };

    window.adminSelectAll = function(checked){
      adminParsed.forEach(function(_,i){ var chk=document.getElementById('admin-chk-'+i); if(chk)chk.checked=checked; });
      adminOnCheck();
    };

    window.adminSelectTopN = function(n){
      var selected=0;
      adminParsed.forEach(function(s,i){
        var chk=document.getElementById('admin-chk-'+i); if(!chk) return;
        var score=s.sw?s.sw.latest:null;
        if(score!=null&&selected<n){chk.checked=true;selected++;}else{chk.checked=false;}
      });
      adminOnCheck();
    };

    // ── Save awards ──
    function setAdminSaveStatus(msg,cls){
      var el=document.getElementById('adminSaveStatus');
      el.textContent=msg; el.className='admin-save-status'+(cls?' '+cls:'');
    }

    window.adminSaveAwards = function(){
      var monthVal=document.getElementById('adminMonthPicker').value;
      if(!monthVal){setAdminSaveStatus('请先选择获奖月份！','err');return;}
      var awardType=document.getElementById('adminAwardType').value;
      var awards=[];
      adminParsed.forEach(function(s,i){
        var chk=document.getElementById('admin-chk-'+i);
        if(chk&&chk.checked) awards.push({studentName:s.name, awardType:awardType, sightWordScore:s.sw?s.sw.latest:null});
      });
      if(!awards.length){setAdminSaveStatus('请至少选择一名学生！','err');return;}
      var btn=document.getElementById('adminSaveBtn');
      btn.disabled=true; setAdminSaveStatus('正在保存…','');
      document.getElementById('adminUnmatchedBox').style.display='none';
      fetch('/api/hall-of-fame-import',{
        method:'POST', headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'create',month:monthVal,awards:awards}), credentials:'same-origin'
      })
      .then(function(r){return r.json();})
      .then(function(data){
        btn.disabled=false;
        if(!data.ok){setAdminSaveStatus('保存失败：'+(data.error||'未知错误'),'err');return;}
        var s=data.summary;
        setAdminSaveStatus('✅ 已保存 '+s.created+' 条记录！','ok');
        if(s.unmatchedNames&&s.unmatchedNames.length){
          var box=document.getElementById('adminUnmatchedBox');
          box.style.display='';
          box.innerHTML='<strong>⚠️ 以下学生姓名未在 Sanity 中找到匹配，请手动添加：</strong><br>'+
            s.unmatchedNames.map(function(n){return escapeHtml(n);}).join('、');
        }
        var browserYM=adminViewYear+'-'+pad2(adminViewMonth);
        if(monthVal===browserYM) adminLoadAwards();
        // Also refresh the display grid
        loadData();
      })
      .catch(function(e){btn.disabled=false;setAdminSaveStatus('网络错误：'+e.message,'err');});
    };
  })();
  </script>
</body>
</html>
