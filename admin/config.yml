backend:
  name: github
  repo: miwang/miwang.org
  branch: main
  base_url: https://miwang.org
  auth_endpoint: api/auth

# 🌟 全局媒体配置：移除各个栏目的独立限制，统一使用 images 根目录
# 这样在任何地方上传图片，都能看到 images 下的所有子文件夹，方便跨目录选择
media_folder: "images" 
public_folder: "/images"

collections:
  # ======== 1. 绘本馆配置 ========
  - name: "library"
    label: "📚 分级绘本馆"
    files:
      - label: "全部绘本数据"
        name: "books"
        file: "data/books.json"
        editor:
          preview: false
        fields:
          - label: "绘本书单"
            name: "book_list"
            widget: "list"
            collapsed: true 
            summary: "{{fields.title}} - {{fields.level}}" 
            fields:
              - { label: "绘本名称", name: "title", widget: "string" }
              - { label: "阅读级别", name: "level", widget: "select", options: ["Novice Low (L1)", "Novice Mid (L2)", "Novice High (L3)"] }
              - { label: "话题分类", name: "topic", widget: "select", options: ["动物与自然", "家庭与朋友", "节日与文化", "学校生活", "食物与购物"] }
              - { label: "核心词汇", name: "vocab_tags", widget: "string", hint: "请用逗号隔开，例如: 苹果, 喜欢, 学校" }
              - { label: "封面图片", name: "coverImage", widget: "image", required: false }
              - label: "绘本页面内容"
                name: "pages"
                widget: "list"
                collapsed: true
                summary: "句子: {{fields.text}}" 
                fields:
                  - { label: "本页插图", name: "image", widget: "image", required: false, hint: "建议直接在 images 子文件夹中选择已有图片" }
                  - { label: "中文句子", name: "text", widget: "string" }

  # ======== 2. 句子排排队配置 ========
  - name: "sentences"
    label: "🧩 句子排排队"
    files:
      - label: "全部句子库"
        name: "sentences_data"
        file: "data/sentences.json"
        editor:
          preview: false
        fields:
          - label: "句子列表"
            name: "sentence_list"
            widget: "list"
            collapsed: true
            summary: "{{fields.words}}"
            fields:
              - { label: "词语切分", name: "words", widget: "string", hint: "按词语切分，用逗号隔开。例如：我,喜欢,吃,苹果" }
              - { label: "标点符号", name: "punctuation", widget: "string", hint: "例如：。 或者是 ？（没有可不填）", required: false }
              - { label: "配图", name: "image", widget: "image", required: false }
              - { label: "主题标签", name: "tags", widget: "string", hint: "用逗号隔开。例如：动物与自然, 食物与购物", required: false }

  # ======== 3. 儿歌点唱机配置 ========
  - name: "songs"
    label: "🎵 儿歌点唱机"
    files:
      - label: "全部儿歌库"
        name: "songs_data"
        file: "data/songs.json"
        editor:
          preview: false
        fields:
          - label: "儿歌列表"
            name: "song_list"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "歌曲唯一ID", name: "id", widget: "string", hint: "必须是纯英文无空格，例如：guyongzhe" }
              - { label: "歌曲名称", name: "title", widget: "string", hint: "例如：孤勇者 (Lonely Warrior)" }
              - { label: "封面图片", name: "cover", widget: "image", required: false }
              - { label: "YouTube ID", name: "youtubeId", widget: "string", hint: "视频链接 v= 后面的字母，例如：Je6r_DqkPqU" }
              - { label: "开始时间(秒)", name: "startTime", widget: "number", value_type: "int", default: 0 }
              - label: "完整歌词"
                name: "lyrics"
                widget: "text"
                hint: "直接粘贴整首歌词！换行就按回车。如果需要分段落，请在空白行输入 ---"

  # ======== 4. 高频四会字配置 ========
  - name: "sight_words"
    label: "🔤 高频四会字"
    files:
      - label: "四会字库"
        name: "sight_words_data"
        file: "data/sight_words.json"
        editor:
          preview: false
        fields:
          - label: "四会字列表"
            name: "sight_words_list"
            widget: "list"
            collapsed: true
            summary: "{{fields.char}} - {{fields.week}}"
            fields:
              - { label: "汉字", name: "char", widget: "string" }
              - { label: "教学月份", name: "week", widget: "select", options: ["September", "October", "November", "December", "January", "February", "March", "April", "May", "June"] }
              - { label: "扩展词组/句子", name: "phrases", widget: "string", hint: "请用逗号隔开，例如：四月, 四岁, 四只小猫" }

  # ======== 5. 古诗与顺口溜配置 ========
  - name: "poems"
    label: "📜 古诗与顺口溜"
    files:
      - label: "古诗顺口溜库"
        name: "poems_data"
        file: "data/poems.json"
        editor:
          preview: false
        fields:
          - label: "诗词列表"
            name: "poem_list"
            widget: "list"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "唯一ID", name: "id", widget: "string", hint: "必须是纯英文无空格，例如：jingyesi" }
              - { label: "标题", name: "title", widget: "string", hint: "例如：静夜思 (李白)" }
              - { label: "封面图片", name: "cover", widget: "image", required: false }
              - { label: "YouTube ID", name: "youtubeId", widget: "string", hint: "视频链接 v= 后面的字母，没有可不填", required: false }
              - { label: "开始时间(秒)", name: "startTime", widget: "number", value_type: "int", default: 0, required: false }
              - label: "诗词内容"
                name: "lyrics"
                widget: "text"
                hint: "直接粘贴整首古诗或顺口溜！换行就按回车。"