backend:
  name: git-gateway
  branch: main

media_folder: "images/books"
public_folder: "/images/books"

collections:
  - name: "library"
    label: "绘本库管理"
    files:
      - label: "全部绘本数据"
        name: "books"
        file: "data/books.json" # 所有书都会保存在这一个文件里
        fields:
          - label: "绘本书单"
            name: "book_list"
            widget: "list"
            fields:
              - { label: "绘本名称", name: "title", widget: "string" }
              - { label: "阅读级别", name: "level", widget: "select", options: ["Novice Low (L1)", "Novice Mid (L2)", "Novice High (L3)"] }
              - { label: "话题分类", name: "topic", widget: "select", options: ["动物与自然", "家庭与朋友", "节日与文化", "学校生活", "食物与购物"] }
              - { label: "核心词汇 (请用逗号隔开，例如: 喜欢, 学校)", name: "vocab_tags", widget: "string" }
              - { label: "封面图片", name: "coverImage", widget: "image" }
              - label: "绘本页面内容"
                name: "pages"
                widget: "list"
                fields:
                  - { label: "本页插图", name: "image", widget: "image" }
                  - { label: "中文句子", name: "text", widget: "string" }