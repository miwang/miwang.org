<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早作业</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css');
:root {
  --teal:#598586;--gold:#f3b236;--dark:#1a2740;--bg:#f0f3f7;
  --red:#e8613a;--blue:#2b96d4;--green:#4aaa6a;--purple:#9b6bbf;
  --orange:#f07030;--pink:#d46090;--teal2:#30a8aa;--khaki:#c49010;
  --fzh:"STKaiti","Kaiti SC","KaiTi","楷体","LXGW WenKai Lite",serif;
  --fen:"LXGW WenKai Lite",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--fen);color:var(--dark);background:var(--bg);}
#setupView{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* 顶部导航布局调整 */
.s-nav{background:var(--teal);border-bottom:4px solid var(--gold);height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;padding:0 16px;}
.s-nav-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:15px;color:white;white-space:nowrap;}
.s-nav-title{font-size:1.1rem;font-family:var(--fzh);font-weight:bold;letter-spacing:2px;}
.s-nav-date{font-size:1.1rem;font-family:var(--fzh);letter-spacing:1px;opacity:0.9;}
.s-nav-back{display:flex;align-items:center;gap:6px;color:white;text-decoration:none;font-size:.95rem;font-weight:bold;font-family:var(--fzh);opacity:.9;transition:opacity .2s;}
.s-nav-back:hover{opacity:.65;}
.s-nav-back svg{width:22px;height:22px;flex-shrink:0;}
.nav-launch-btn{background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:6px 14px;font-size:0.9rem;font-family:var(--fzh);font-weight:bold;cursor:pointer;transition:0.2s;box-shadow:0 2px 6px rgba(0,0,0,0.1);display:flex;align-items:center;gap:4px;}
.nav-launch-btn:hover{background:#ffc45d;transform:translateY(-1px);}
.nav-launch-btn:active{transform:scale(0.95);}

/* 网格布局 */
.s-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:15px;min-height:0;}
.card{background:white;border-radius:14px;padding:clamp(7px,1.4vh,12px) 14px;border:2px solid #e0e8ee;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;}
.card-hdr{display:flex;align-items:center;gap:7px;padding-bottom:8px;border-bottom:2px solid #f0f3f7;flex-shrink:0;}
.c-icon{font-size:1.1rem;}
.c-title{flex:1;font-size:clamp(1.3rem,3.2vh,1.95rem);font-weight:bold;font-family:var(--fzh);}
.card.words .c-title{color:var(--red);}
.card.numbers .c-title{color:var(--purple);}
.card.math .c-title{color:var(--blue);}
.card.sentence .c-title{color:var(--green);}
.tog-wrap{display:flex;align-items:center;gap:5px;}
.tog-lbl{font-size:.72rem;color:#bbb;min-width:26px;text-align:right;}
.tog{position:relative;width:38px;height:21px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;}
.tog-sl{position:absolute;inset:0;background:#ddd;border-radius:21px;cursor:pointer;transition:.2s;}
.tog-sl::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;}
.tog input:checked ~ .tog-sl{background:var(--teal);}
.tog input:checked ~ .tog-sl::before{transform:translateX(17px);}

/* 数学题卡片头部特有样式 */
.math-hdr-ctrl{display:flex;align-items:center;gap:10px;}
.math-tip{font-size:0.7rem;color:#aaa;font-family:var(--fzh);white-space:nowrap;}

.card-body{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow:hidden;transition:opacity .2s;}
.card.off .card-body{opacity:.3;pointer-events:none;}
.month-tabs{display:flex;gap:5px;flex-shrink:0;}
.m-tab{padding:4px 12px;border-radius:16px;border:2px solid var(--red);background:white;color:var(--red);cursor:pointer;font-family:var(--fzh);font-size:.8rem;transition:.15s;}
.m-tab.active{background:var(--red);color:white;}
.words-scroll{display:flex;flex-wrap:wrap;gap:8px;overflow-y:auto;flex:1;padding:4px;}
.wchip{width:clamp(48px,7.5vh,64px);height:clamp(48px,7.5vh,64px);border-radius:50%;border:2px solid #fde0d8;background:#fff5f2;cursor:pointer;font-size:clamp(1.8rem,4.5vh,2.5rem);font-family:var(--fzh);transition:.15s;user-select:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.wchip:hover{background:#fdd0c0;border-color:var(--red);}
.wchip.sel{background:var(--red);color:white;border-color:var(--red);transform:scale(1.07);box-shadow:0 3px 8px rgba(232,97,58,.3);}
.word-prev{font-size:.8rem;color:#bbb;font-family:var(--fzh);flex-shrink:0;min-height:20px;}
.word-prev .pc{color:var(--red);font-size:1.2rem;margin-right:3px;}
.range-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex-shrink:0;}
.r-btn{padding:7px 3px;border-radius:9px;border:2px solid #f0e8ff;background:#f8f2ff;cursor:pointer;font-family:var(--fen);font-size:clamp(1.1rem,2.5vh,1.75rem);font-weight:bold;color:var(--purple);text-align:center;transition:.15s;}
.r-btn:hover{background:#e8d8ff;}
.r-btn.active{background:var(--purple);color:white;border-color:var(--purple);}
.dir-row{display:flex;gap:6px;flex-shrink:0;}
.dir-btn{flex:1;padding:6px;border-radius:8px;border:2px solid #ddd;background:transparent;cursor:pointer;font-family:var(--fzh);font-size:clamp(1.1rem,2.5vh,1.78rem);color:#999;text-align:center;transition:.15s;}
.dir-btn:hover{border-color:var(--purple);color:var(--purple);}
.dir-btn.active{background:var(--purple);color:white;border-color:var(--purple);}
.range-prev{background:#f8f2ff;border-radius:8px;padding:7px 8px;text-align:center;font-size:clamp(1.2rem,2.8vh,1.85rem);font-weight:bold;color:var(--purple);letter-spacing:3px;word-break:break-all;line-height:1.6;flex:1;overflow-y:auto;}
.math-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0;}
.math-btn{padding:8px 6px;border-radius:8px;border:2px solid #e0f0fb;background:#eef8ff;cursor:pointer;font-family:var(--fzh);font-size:clamp(1rem,2.3vh,1.5rem);color:var(--blue);text-align:center;line-height:1.3;transition:.15s;}
.math-btn:hover{background:#d0eeff;}
.math-btn.active{background:var(--blue);color:white;border-color:var(--blue);font-weight:bold;}

.math-prev{background:#eef8ff;border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;flex:1;min-height: 40px;}
.math-eq-pre{font-size:1.1rem;font-weight:bold;color:var(--blue);font-family:var(--fen);letter-spacing:1px;}

/* 顶部刷新按钮样式优化 */
.refresh-btn{background:none;border:1.5px solid var(--blue);color:var(--blue);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:.75rem;font-family:var(--fen);transition:.15s;font-weight:bold;display:flex;align-items:center;gap:3px;}
.refresh-btn:hover{background:var(--blue);color:white;}

.sent-ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex-shrink:0;}
select{border:2px solid #e0f2e8;border-radius:7px;padding:4px 7px;font-family:var(--fzh);font-size:.82rem;background:white;color:var(--dark);outline:none;cursor:pointer;}
.rand-btn{padding:4px 11px;background:var(--green);color:white;border:none;border-radius:7px;cursor:pointer;font-family:var(--fzh);font-size:.8rem;transition:.15s;}
.rand-btn:hover{background:#3a8a5a;}
.sent-disp{background:#edfff5;border-radius:9px;padding:10px;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--fzh);font-size:clamp(2.2rem,5.2vh,4.2rem);color:var(--dark);text-align:center;flex-direction:column;gap:4px;overflow:hidden;}
.s-tag{font-size:.65rem;color:var(--green);font-family:var(--fen);}

/* DISPLAY VIEW */
#displayView{display:none;position:fixed;inset:0;background:rgba(10, 20, 40, 1);align-items:center;justify-content:center;z-index:200;}
#displayView.show{display:flex;}
.d-frame{width:1280px;height:720px;background:var(--bg);display:flex;flex-direction:column;transform-origin:center center;flex-shrink:0;overflow:hidden;}
.d-hdr{background:var(--teal);border-bottom:5px solid var(--gold);height:160px;display:flex;align-items:center;justify-content:center;padding:0 22px;flex-shrink:0;position:relative;cursor:pointer;}
.d-hdr::after{content:'点击顶部退出';position:absolute;bottom:5px;font-size:0.7rem;color:rgba(255,255,255,0.3);letter-spacing:1px;}
.d-date{font-size:3.5rem;font-family:var(--fzh);color:white;letter-spacing:8px;font-weight:bold;text-align:center;}
.d-btn-back{position:absolute;left:22px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);color:white;border-radius:7px;padding:5px 13px;font-family:var(--fzh);font-size:.8rem;cursor:pointer;transition:background .15s,opacity .3s;white-space:nowrap;}
.d-btn-back:hover{background:rgba(255,255,255,.32);}
.d-btn-back.fs-hide{opacity:0;pointer-events:none;}
.d-btn-fs{position:absolute;right:22px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4);color:white;border-radius:7px;padding:5px 13px;font-family:var(--fzh);font-size:.8rem;cursor:pointer;transition:background .15s,opacity .3s;white-space:nowrap;}
.d-btn-fs:hover{background:rgba(255,255,255,.32);}
.d-btn-fs.fs-hide{opacity:0;pointer-events:none;}
.d-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px;padding:7px 10px 9px;min-height:0;overflow:hidden;}
.panel{background:white;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 12px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;position:relative;min-height:0;}
.p-lbl{position:absolute;top:7px;left:12px;font-size:clamp(.55rem,.8vw,.75rem);color:#ccc;font-family:var(--fzh);}
.p-words{border-top:5px solid var(--red);}
.p-numbers{border-top:5px solid var(--purple);}
.p-math{border-top:5px solid var(--blue);}
.p-sentence{border-top:5px solid var(--green);}
.p-empty{color:#ddd;font-size:clamp(.85rem,1.5vw,1.1rem);text-align:center;}
.pw-wrap{display:flex;flex-wrap:wrap;gap:clamp(6px,1.2vw,14px);justify-content:center;align-items:center;width:100%;padding:4px;}
.w-big{font-family:var(--fzh);font-weight:bold;color:white;border-radius:13px;cursor:pointer;user-select:none;transition:transform .12s;text-align:center;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 6px rgba(0,0,0,.2);}
.w-big:active{transform:scale(1.18);}
.wc0{background:var(--red)}.wc1{background:var(--blue)}.wc2{background:var(--green)}
.wc3{background:var(--khaki)}.wc4{background:var(--purple)}.wc5{background:var(--orange)}
.wc6{background:var(--teal2)}.wc7{background:var(--pink)}
.pn-wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:clamp(4px,.8vw,10px);width:100%;padding:4px;}
.n-chip{font-family:var(--fen);font-weight:bold;color:var(--purple);background:#f8f2ff;border-radius:9px;border:2px solid #e8d8ff;cursor:pointer;transition:all .12s;user-select:none;display:flex;align-items:center;justify-content:center;}
.n-chip:active{background:var(--purple);color:white;transform:scale(1.12);}
.pm-wrap{display:flex;flex-direction:column;gap:clamp(5px,1vh,12px);align-items:center;width:100%;}
.m-eq{font-family:var(--fen);font-weight:bold;color:var(--blue);background:#eef8ff;border-radius:12px;text-align:center;letter-spacing:2px;width:100%;display:flex;align-items:center;justify-content:center;}
.m-blank{display:inline-block;min-width:.9em;border-bottom:3px solid var(--blue);margin:0 3px;vertical-align:middle;}
.ps-wrap{font-family:var(--fzh);text-align:center;line-height:1.5;letter-spacing:5px;color:var(--dark);width:100%;}
.s-wd{display:inline-block;cursor:pointer;border-radius:7px;padding:2px 3px;transition:all .12s;}
.s-wd:active{background:#e0ffe8;color:var(--green);transform:scale(1.1);}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,20,40,.9);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:14px;cursor:pointer;}
.overlay.show{display:flex;}
.ov-char{font-family:var(--fzh);color:white;font-size:clamp(6rem,22vw,18rem);line-height:1;text-shadow:0 8px 40px rgba(255,255,255,.12);}
.ov-hint{color:rgba(255,255,255,.3);font-size:clamp(.8rem,1.4vw,1.1rem);}
</style>
</head>
<body>
<div id="setupView">
  <nav class="s-nav">
    <a class="s-nav-back" href="../teachers.html">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="5"/>
        <path d="M65 50 H35 M45 35 L35 50 L45 65" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>返回工具台</span>
    </a>
    
    <div class="s-nav-center">
      <span class="s-nav-title">🌟 早作业设置 </span>
      <span class="s-nav-date" id="sDate">加载中...</span>
    </div>

    <button class="nav-launch-btn" onclick="showDisplay()">🚀 全屏展示</button>
  </nav>

  <div class="s-grid">
    <div class="card words" id="card-words">
      <div class="card-hdr">
        <span class="c-icon">✍️</span><span class="c-title">四会字</span>
        <div class="tog-wrap"><span class="tog-lbl" id="lbl-words">开启</span><label class="tog"><input type="checkbox" id="tog-words" checked onchange="togCard('words',this.checked)"><span class="tog-sl"></span></label></div>
      </div>
      <div class="card-body" id="body-words">
        <div class="month-tabs" id="monthTabs"></div>
        <div class="words-scroll" id="wordsGrid"></div>
        <div class="word-prev" id="wordPrev">点击上方字选择（可多选）</div>
      </div>
    </div>
    <div class="card numbers" id="card-numbers">
      <div class="card-hdr">
        <span class="c-icon">🔢</span><span class="c-title">数字练习</span>
        <div class="tog-wrap"><span class="tog-lbl" id="lbl-numbers">开启</span><label class="tog"><input type="checkbox" id="tog-numbers" checked onchange="togCard('numbers',this.checked)"><span class="tog-sl"></span></label></div>
      </div>
      <div class="card-body" id="body-numbers">
        <div class="range-grid" id="rangeGrid"></div>
        <div class="dir-row">
          <button class="dir-btn active" id="dir-down" onclick="setDir('down')">从大到小 ↓</button>
          <button class="dir-btn" id="dir-up" onclick="setDir('up')">从小到大 ↑</button>
        </div>
        <div class="range-prev" id="rangePrev">请选择数字范围</div>
      </div>
    </div>
    
    <div class="card math" id="card-math">
      <div class="card-hdr">
        <span class="c-icon">➕</span>
        <span class="c-title">数学题</span>
        <div class="math-hdr-ctrl">
            <span class="math-tip">（最多选4种）</span>
            <button class="refresh-btn" onclick="generateMath()">🔄 换一组</button>
        </div>
        <div class="tog-wrap"><span class="tog-lbl" id="lbl-math">开启</span><label class="tog"><input type="checkbox" id="tog-math" checked onchange="togCard('math',this.checked)"><span class="tog-sl"></span></label></div>
      </div>
      <div class="card-body" id="body-math">
        <div class="math-type-grid" id="mathTypeGrid"></div>
        <div class="math-prev" id="mathPrev"><span style="color:#ccc;font-size:.82rem">选择题型后预览</span></div>
      </div>
    </div>

    <div class="card sentence" id="card-sentence">
      <div class="card-hdr">
        <span class="c-icon">📖</span><span class="c-title">今日句子</span>
        <div class="tog-wrap"><span class="tog-lbl" id="lbl-sentence">开启</span><label class="tog"><input type="checkbox" id="tog-sentence" checked onchange="togCard('sentence',this.checked)"><span class="tog-sl"></span></label></div>
      </div>
      <div class="card-body" id="body-sentence">
        <div class="sent-ctrl">
          <select id="tagFilter" onchange="filterSents()"></select>
          <button class="rand-btn" onclick="pickSent()">🎲 随机换一句</button>
        </div>
        <div class="sent-disp" id="sentDisp"><span style="color:#ccc">加载中...</span></div>
      </div>
    </div>
  </div>
</div>

<div id="displayView">
  <div class="d-frame" id="dFrame">
    <div class="d-hdr" id="dHdr" onclick="hideDisplay()">
      <button class="d-btn-back" id="dBtnBack">← 返回设置</button>
      <div class="d-date" id="dDate"></div>
      <button class="d-btn-fs" id="dBtnFs" onclick="event.stopPropagation(); goFS();">⛶ 全屏</button>
    </div>
    <div class="d-grid" id="dGrid"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeOv()">
  <div class="ov-char" id="ovChar"></div>
  <div class="ov-hint">点击任意处关闭</div>
</div>

<script>
const SW=[{c:"四",w:"September"},{c:"五",w:"September"},{c:"六",w:"September"},{c:"七",w:"September"},{c:"八",w:"September"},{c:"九",w:"September"},{c:"十",w:"September"},{c:"大",w:"October"},{c:"小",w:"October"},{c:"日",w:"October"},{c:"月",w:"October"},{c:"几",w:"October"},{c:"多",w:"October"},{c:"少",w:"October"},{c:"我",w:"November"},{c:"会",w:"November"},{c:"不",w:"November"},{c:"飞",w:"November"},{c:"个",w:"November"},{c:"你",w:"November"},{c:"有",w:"November"},{c:"手",w:"December"},{c:"口",w:"December"},{c:"头",w:"December"},{c:"目",w:"December"},{c:"耳",w:"December"},{c:"人",w:"December"},{c:"要",w:"December"},{c:"上",w:"January"},{c:"下",w:"January"},{c:"左",w:"January"},{c:"右",w:"January"},{c:"中",w:"January"},{c:"看",w:"January"},{c:"是",w:"January"},{c:"爱",w:"February"},{c:"天",w:"February"},{c:"白",w:"February"},{c:"的",w:"February"},{c:"山",w:"February"},{c:"水",w:"February"},{c:"和",w:"March"},{c:"土",w:"March"},{c:"木",w:"March"},{c:"叶",w:"March"},{c:"花",w:"March"},{c:"长",w:"April"},{c:"太",w:"April"},{c:"门",w:"April"},{c:"也",w:"April"},{c:"了",w:"May"},{c:"火",w:"May"}];
const SENTS=[{words:"我,和,爸爸,一起,去,月球",p:"。",tags:"家人,出去玩"},{words:"我,和,妈妈,一起,去,水上乐园",p:"。",tags:"家人,出去玩"},{words:"我,和,姐姐,一起,去,迪士尼",p:"。",tags:"家人,出去玩"},{words:"我,和,哥哥,一起,去,公园",p:"。",tags:"家人,出去玩"},{words:"我,家,有,五,个,人",p:"。",tags:"家人,自我介绍"},{words:"我,爱,我的,家人",p:"。",tags:"家人"},{words:"我,有,一个,姐姐",p:"。",tags:"家人,自我介绍"},{words:"我,有,一个,弟弟",p:"。",tags:"家人,自我介绍"},{words:"我,有,一个,妹妹",p:"。",tags:"家人,自我介绍"},{words:"我,有,一个,哥哥",p:"。",tags:"家人,自我介绍"},{words:"我,爱,我的,爸爸",p:"。",tags:"家人"},{words:"我,爱,我的,妈妈",p:"。",tags:"家人"},{words:"这是,我的,爸爸",p:"。",tags:"家人"},{words:"这是,我的,妈妈",p:"。",tags:"家人"},{words:"这是,我的,弟弟",p:"。",tags:"家人"},{words:"这是,我的,老师",p:"。",tags:"学校"},{words:"你,叫,什么,名字",p:"？",tags:"自我介绍,问答"},{words:"你,几岁",p:"？",tags:"自我介绍,问答"},{words:"我,六岁",p:"。",tags:"自我介绍"},{words:"我,要,喝,水",p:"。",tags:"食物"},{words:"我,要,吃,饭",p:"。",tags:"食物"},{words:"我,要,上厕所",p:"。",tags:"学校"},{words:"我,要,洗手",p:"。",tags:"学校"},{words:"我,会,说,中文",p:"。",tags:"自我介绍,能力"},{words:"我,会,数,到,一百",p:"。",tags:"自我介绍,能力"},{words:"我,会,游泳",p:"。",tags:"能力"},{words:"我,相信,我,会,飞",p:"。",tags:"能力"},{words:"我,有,一个,大头",p:"。",tags:"身体"},{words:"我,有,两个,大眼睛",p:"。",tags:"身体"},{words:"我,有,两个,大耳朵",p:"。",tags:"身体"},{words:"我,喜欢,晴天",p:"。",tags:"天气"},{words:"我,喜欢,下雪",p:"。",tags:"天气"},{words:"我,不喜欢,下雨",p:"。",tags:"天气"},{words:"我,喜欢,学校",p:"。",tags:"学校"},{words:"老师,在,哪里",p:"？",tags:"方位,问答,学校"},{words:"小猫,在,上面",p:"。",tags:"方位,动物"},{words:"小猫,在,下面",p:"。",tags:"方位,动物"},{words:"小猫,在,左边",p:"。",tags:"方位,动物"},{words:"小猫,在,右边",p:"。",tags:"方位,动物"},{words:"小猫,在,中间",p:"。",tags:"方位,动物"},{words:"学校,有,老师",p:"。",tags:"学校"},{words:"学校,有,小朋友",p:"。",tags:"学校"},{words:"我,有,一个,红色的,水杯",p:"。",tags:"颜色"},{words:"我,看见,一只,红色的,鸟",p:"。",tags:"颜色,动物"}];
const MONTHS=["September","October","November","December","January","February","March","April","May"];
const MCN={"September":"九月","October":"十月","November":"十一月","December":"十二月","January":"一月","February":"二月","March":"三月","April":"四月","May":"五月"};
const WDAYS=['星期天','星期一','星期二','星期三','星期四','星期五','星期六'];
const MNAMES=['一','二','三','四','五','六','七','八','九','十','十一','十二'];
const MTYPES=[{id:'add10',lbl:'十以内加法'},{id:'sub10',lbl:'十以内减法'},{id:'add20',lbl:'二十以内加法'},{id:'sub20',lbl:'二十以内减法'},{id:'missing',lbl:'未知加数 □+?=10'},{id:'compose',lbl:'十几的组成'}];
const NRANGES=[{lbl:'1–10',min:1,max:10},{lbl:'11–20',min:11,max:20},{lbl:'21–30',min:21,max:30},{lbl:'31–40',min:31,max:40},{lbl:'41–50',min:41,max:50},{lbl:'51–60',min:51,max:60},{lbl:'61–70',min:61,max:70},{lbl:'71–80',min:71,max:80},{lbl:'81–90',min:81,max:90},{lbl:'91–100',min:91,max:100}];
const WCS=['wc0','wc1','wc2','wc3','wc4','wc5','wc6','wc7'];
let selWords=[],selMath=[],curEqs=[],curSent=null,filtSents=[...SENTS],selRange=null,numDir='down';
let mods={words:true,numbers:true,math:true,sentence:true},isFull=false;
const CN_DIGITS=['零','一','二','三','四','五','六','七','八','九','十'];
function dayToCN(n){if(n<=10)return CN_DIGITS[n];if(n<20)return'十'+CN_DIGITS[n-10];if(n===20)return'二十';if(n<30)return'二十'+CN_DIGITS[n-20];if(n===30)return'三十';return'三十'+CN_DIGITS[n-30];}

function init(){
  const now=new Date();
  const ds=`${MNAMES[now.getMonth()]}月${dayToCN(now.getDate())}日　${WDAYS[now.getDay()]}`;
  document.getElementById('sDate').textContent=ds;
  document.getElementById('dDate').textContent=ds;
  const cur=getCurMonth(now),prev=prevM(cur);
  const te=document.getElementById('monthTabs');
  [prev,cur].forEach((m,i)=>{const b=document.createElement('button');b.className='m-tab'+(i===1?' active':'');b.textContent=MCN[m];b.onclick=()=>{te.querySelectorAll('.m-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderWords(m);};te.appendChild(b);});
  renderWords(cur);
  const rg=document.getElementById('rangeGrid');
  NRANGES.forEach(r=>{const b=document.createElement('button');b.className='r-btn';b.textContent=r.lbl;b.onclick=()=>selectRange(r,b);rg.appendChild(b);});
  const mg=document.getElementById('mathTypeGrid');
  MTYPES.forEach(mt=>{const b=document.createElement('button');b.className='math-btn';b.textContent=mt.lbl;b.dataset.id=mt.id;b.onclick=()=>togMath(mt.id,b);mg.appendChild(b);});
  const tags=new Set();SENTS.forEach(s=>s.tags.split(',').forEach(t=>tags.add(t.trim())));
  const sel=document.getElementById('tagFilter');addOpt(sel,'','全部句子');[...tags].sort().forEach(t=>addOpt(sel,t,t));
  pickSent();
}

function addOpt(sel,v,txt){const o=document.createElement('option');o.value=v;o.textContent=txt;sel.appendChild(o);}
function getCurMonth(now){const n=['January','February','March','April','May','June','July','August','September','October','November','December'][now.getMonth()];return MONTHS.includes(n)?n:MONTHS[MONTHS.length-1];}
function prevM(m){const i=MONTHS.indexOf(m);return i>0?MONTHS[i-1]:MONTHS[0];}
function togCard(name,checked){mods[name]=checked;document.getElementById('card-'+name).classList.toggle('off',!checked);document.getElementById('lbl-'+name).textContent=checked?'开启':'关闭';}
function renderWords(month){const g=document.getElementById('wordsGrid');g.innerHTML='';SW.filter(x=>x.w===month).forEach(x=>{const c=document.createElement('div');c.className='wchip'+(selWords.includes(x.c)?' sel':'');c.textContent=x.c;c.onclick=()=>togWord(x.c,c);g.appendChild(c);});}
function togWord(ch,chip){if(selWords.includes(ch)){selWords=selWords.filter(c=>c!==ch);chip.classList.remove('sel');}else{selWords.push(ch);chip.classList.add('sel');}const p=document.getElementById('wordPrev');p.innerHTML=selWords.length?'已选：'+selWords.map(c=>`<span class="pc">${c}</span>`).join(''):'点击上方字选择（可多选）';}
function selectRange(r,btn){selRange=r;document.querySelectorAll('.r-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');updateRangePrev();}
function setDir(d){numDir=d;['dir-down','dir-up'].forEach(id=>{const el=document.getElementById(id);el.className=el.id==='dir-'+d?'dir-btn active':'dir-btn';});updateRangePrev();}
function updateRangePrev(){const el=document.getElementById('rangePrev');if(!selRange){el.textContent='请选择数字范围';return;}const ns=[];for(let i=selRange.max;i>=selRange.min;i--)ns.push(i);el.textContent=(numDir==='down'?ns:[...ns].reverse()).join('　');}

function togMath(id,btn){
    if(selMath.includes(id)){
        selMath=selMath.filter(x=>x!==id);
        btn.classList.remove('active');
    }else{
        // 强制限制选择4种
        if(selMath.length >= 4) return;
        selMath.push(id);
        btn.classList.add('active');
    }
    generateMath();
}

function generateMath(){const p=document.getElementById('mathPrev');if(!selMath.length){p.innerHTML='<span style="color:#ccc;font-size:.82rem">选择题型后预览</span>';curEqs=[];return;}curEqs=selMath.slice(0,4).map(genEq);p.innerHTML=curEqs.map(e=>`<span class="math-eq-pre">${fmtPreview(e)}</span>`).join('');}
function genEq(t){const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let eq={type:t};switch(t){case 'add10':{const a=r(1,9),b=r(1,9-a);eq={...eq,op:'+',a,b,sum:a+b};break;}case 'sub10':{const a=r(2,10),b=r(1,a-1);eq={...eq,op:'-',a,b,sum:a-b};break;}case 'add20':{const a=r(5,19),b=r(1,20-a);eq={...eq,op:'+',a,b,sum:a+b};break;}case 'sub20':{const a=r(5,20),b=r(1,a-1);eq={...eq,op:'-',a,b,sum:a-b};break;}case 'missing':{const sum=r(6,10),a=r(1,sum-1),b=sum-a;eq={...eq,op:'+',a,b,sum,forceMissing:true};break;}case 'compose':{const n=r(11,19);eq={...eq,op:'+',a:10,b:n-10,sum:n};break;}}if(eq.forceMissing){eq.hide='b';}else{const opts=['answer','a','b'];eq.hide=opts[r(0,opts.length-1)];}return eq;}
function fmtEqStr(eq){const op=eq.op==='+'?'＋':'－';return`${eq.a}${op}${eq.b}＝${eq.sum}`;}
function fmtPreview(eq){return fmtEqStr(eq);}
function renderEqHTML(eq){const op=eq.op==='+'?'＋':'－';const blank=`<span class="m-blank">&nbsp;&nbsp;&nbsp;</span>`;const a=eq.hide==='a'?blank:eq.a,b=eq.hide==='b'?blank:eq.b,s=eq.hide==='answer'?blank:eq.sum;return`${a}${op}${b}＝${s}`;}
function filterSents(){const tag=document.getElementById('tagFilter').value;filtSents=tag?SENTS.filter(s=>s.tags.includes(tag)):[...SENTS];pickSent();}
function pickSent(){if(!filtSents.length)return;curSent=filtSents[Math.floor(Math.random()*filtSents.length)];const text=curSent.words.split(',').join('　')+curSent.p;const tags=curSent.tags.split(',').map(t=>`#${t.trim()}`).join(' ');document.getElementById('sentDisp').innerHTML=`<div>${text}</div><div class="s-tag">${tags}</div>`;}

function scaleFrame(){const f=document.getElementById('dFrame');const displayView=document.getElementById('displayView');if(!f)return;if(!displayView.classList.contains('show')){f.style.transform='none';return;}const scale=Math.min(window.innerWidth/1280,window.innerHeight/720);f.style.transform=`scale(${scale})`;}
function showDisplay(){buildGrid();document.getElementById('displayView').classList.add('show');if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>scaleFrame());}else{scaleFrame();}}
function hideDisplay(){if(document.fullscreenElement){document.exitFullscreen();}const displayView=document.getElementById('displayView');const dFrame=document.getElementById('dFrame');displayView.classList.remove('show');dFrame.style.transform='none';setTimeout(()=>{dFrame.style.transform='none';window.dispatchEvent(new Event('resize'));},150);}
function buildGrid(){const g=document.getElementById('dGrid');g.innerHTML='';[{key:'words',cls:'p-words',lbl:'四会字',fn:buildWords},{key:'numbers',cls:'p-numbers',lbl:'数字练习',fn:buildNums},{key:'math',cls:'p-math',lbl:'数学题',fn:buildMath},{key:'sentence',cls:'p-sentence',lbl:'今日句子',fn:buildSent}].forEach(def=>{const panel=document.createElement('div');panel.className=`panel ${def.cls}`;const lbl=document.createElement('div');lbl.className='p-lbl';lbl.textContent=def.lbl;panel.appendChild(lbl);if(mods[def.key])def.fn(panel);else{const e=document.createElement('div');e.className='p-empty';e.textContent='已关闭';panel.appendChild(e);}g.appendChild(panel);});}
function buildWords(panel){if(!selWords.length){addEmpty(panel,'未选择四会字');return;}const wrap=document.createElement('div');wrap.className='pw-wrap';const n=selWords.length;const fs=n<=3?'clamp(3rem,7vw,7rem)':n<=6?'clamp(2rem,5vw,5.5rem)':'clamp(1.5rem,3.5vw,4.2rem)';const pad=n<=3?'14px 20px':n<=6?'10px 16px':'8px 12px';selWords.forEach((w,i)=>{const d=document.createElement('div');d.className='w-big '+WCS[i%WCS.length];d.textContent=w;d.style.cssText=`font-size:${fs};padding:${pad};`;d.onclick=()=>showOv(w);wrap.appendChild(d);});panel.appendChild(wrap);}
function buildNums(panel){if(!selRange){addEmpty(panel,'未选择数字范围');return;}const ns=[];for(let i=selRange.max;i>=selRange.min;i--)ns.push(i);const disp=numDir==='down'?ns:[...ns].reverse();const wrap=document.createElement('div');wrap.className='pn-wrap';const n=disp.length;const fs=n<=11?'clamp(1.6rem,3.5vw,4rem)':'clamp(1.1rem,2.5vw,3rem)';const pad=n<=11?'10px 14px':'7px 10px';disp.forEach(num=>{const d=document.createElement('div');d.className='n-chip';d.textContent=num;d.style.cssText=`font-size:${fs};padding:${pad};`;d.onclick=()=>showOv(String(num));wrap.appendChild(d);});panel.appendChild(wrap);}
function buildMath(panel){if(!curEqs.length){addEmpty(panel,'未选择数学题型');return;}const wrap=document.createElement('div');wrap.className='pm-wrap';const n=curEqs.length;const fs=n<=2?'clamp(1.5rem,3.2vw,4rem)':n===3?'clamp(1.2rem,2.6vw,3.2rem)':'clamp(1rem,2.2vw,2.8rem)';const pad=n<=2?'10px 16px':n===3?'8px 12px':'6px 10px';curEqs.forEach(eq=>{const d=document.createElement('div');d.className='m-eq';d.innerHTML=renderEqHTML(eq);d.style.cssText=`font-size:${fs};padding:${pad};`;wrap.appendChild(d);});panel.appendChild(wrap);}
function buildSent(panel){if(!curSent){addEmpty(panel,'未选择句子');return;}const words=curSent.words.split(',');const total=words.join('').length+1;const fs=total<=7?'clamp(2.2rem,5vw,6rem)':total<=11?'clamp(1.8rem,4vw,5rem)':'clamp(1.4rem,3vw,4rem)';const wrap=document.createElement('div');wrap.className='ps-wrap';wrap.style.fontSize=fs;words.forEach(w=>{const sp=document.createElement('span');sp.className='s-wd';sp.textContent=w;sp.onclick=()=>showOv(w);wrap.appendChild(sp);});const punc=document.createElement('span');punc.textContent=curSent.p;punc.style.color='#aaa';wrap.appendChild(punc);panel.appendChild(wrap);}
function addEmpty(panel,msg){const e=document.createElement('div');e.className='p-empty';e.textContent=msg;panel.appendChild(e);}
function showOv(ch){document.getElementById('ovChar').textContent=ch;document.getElementById('overlay').classList.add('show');}
function closeOv(){document.getElementById('overlay').classList.remove('show');}
function goFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

document.addEventListener('fullscreenchange',()=>{isFull=!!document.fullscreenElement;document.getElementById('dBtnFs').classList.toggle('fs-hide',isFull);document.getElementById('dBtnBack').classList.toggle('fs-hide',isFull);if(isFull){scaleFrame();}else{hideDisplay();}setTimeout(scaleFrame,100);});
window.addEventListener('resize',scaleFrame);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('overlay').classList.contains('show')){closeOv();}else{hideDisplay();}}if((e.key==='f'||e.key==='F')&&!document.getElementById('overlay').classList.contains('show'))goFS();});

init();
</script>
</body>
</html>
