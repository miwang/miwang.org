<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颜色日练习纸 · Color Days</title>
<style>
  /* 楷体：优先用站上已有的霞鹜文楷，取不到就退回系统楷体 */
  @font-face {
    font-family: 'LXGWWenKai';
    src: url('/fonts/LXGWWenKaiLite-Regular.woff2') format('woff2'),
         url('/css/fonts/LXGWWenKaiLite-Regular.woff2') format('woff2');
    font-display: swap;
  }
  :root { --kai: 'LXGWWenKai','KaiTi','Kaiti SC','STKaiti','楷体',serif; }

  * { box-sizing: border-box; }
  body { margin: 0; background: #eceae5; font-family: var(--kai); color: #1a1a1a; }

  /* ---------- 控制面板（只在屏幕上显示） ---------- */
  .panel {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid #d5d1c8;
    padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end;
  }
  .panel h1 { font-size: 19px; margin: 0 12px 0 0; font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; color: #6b6459; }
  select, button, input[type=text] {
    font-family: inherit; font-size: 14px; padding: 6px 10px;
    border: 1px solid #c8c3b8; border-radius: 6px; background: #fff;
  }
  button { cursor: pointer; }
  button.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; padding: 7px 18px; }
  .colors { display: flex; flex-wrap: wrap; gap: 4px 10px; max-width: 560px; }
  .colors label { font-size: 14px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .status { font-size: 13px; color: #6b6459; margin-left: auto; text-align: right; line-height: 1.5; }
  .err { color: #a1301f; }
  .paste { display: none; padding: 14px 20px; background: #fffaf2; border-bottom: 1px solid #e5d9c4; }
  .paste.show { display: block; }
  .paste textarea { width: 100%; height: 90px; font-family: var(--kai); font-size: 14px;
                    padding: 8px; border: 1px solid #c8c3b8; border-radius: 6px; }
  .paste p { margin: 0 0 8px; font-size: 13px; color: #6b6459; }

  /* ---------- 练习纸 ---------- */
  #out { padding: 24px 0 60px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .sheet {
    width: 8.5in; height: 11in; padding: 0.5in 0.5in 0.55in; background: #fff;
    display: flex; flex-direction: column;
    box-shadow: 0 2px 10px rgba(0,0,0,.14);
  }
  .meta { font-size: 15pt; letter-spacing: .01em; }
  .meta u { text-decoration: none; border-bottom: 1.2pt solid #000;
            display: inline-block; width: 1.5in; }
  .cue { font-size: 14pt; margin-top: 6pt; }
  .cue::before { content: "✎ "; }

  .name {
    flex: 0 0 auto; text-align: center; line-height: 1;
    margin: 2pt 0 6pt; font-weight: 700;
    color: transparent;
    -webkit-text-stroke: 2.2px #000;
    text-stroke: 2.2px #000;
    white-space: nowrap;
  }
  .name.n3 { font-size: 1.85in; letter-spacing: .06in; text-indent: .06in; }
  .name.n2 { font-size: 1.95in; letter-spacing: .55in; text-indent: .55in; }
  .name.n4 { font-size: 1.42in; letter-spacing: .05in; text-indent: .05in; }

  .art { display: flex; justify-content: space-around; align-items: center;
         gap: .2in; margin: 4pt 0; }
  .art svg { width: 2.1in; height: 2.1in; }
  .think { font-size: 14pt; text-align: center; margin-top: 4pt; }
  .box { flex: 1 1 auto; min-height: 1.6in; border: 1.6pt solid #000; border-radius: 3pt; margin-top: 6pt; }

  @page { size: letter portrait; margin: 0; }
  @media print {
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .panel, .paste, .noprint { display: none !important; }
    #out { padding: 0; gap: 0; }
    .sheet { box-shadow: none; break-after: page; page-break-after: always; }
    .sheet:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="panel noprint">
  <h1>颜色日练习纸</h1>

  <label class="field"><span>学年</span>
    <input type="text" id="year" value="26-27" size="6">
  </label>

  <label class="field"><span>班级</span>
    <select id="cls">
      <option value="all">全部（两个班）</option>
    </select>
  </label>

  <div class="field"><span>颜色</span>
    <div class="colors" id="colorList"></div>
  </div>

  <label class="field"><span>&nbsp;</span>
    <label style="font-size:14px"><input type="checkbox" id="sample" checked> 每种颜色带一页「王老师」范例</label>
  </label>

  <div class="field"><span>&nbsp;</span>
    <div style="display:flex;gap:8px">
      <button id="reload">重新读名单</button>
      <button class="primary" id="print">打印 / 存 PDF</button>
    </div>
  </div>

  <div class="status" id="status">正在读名单…</div>
</div>

<div class="paste" id="pasteBox">
  <p>读不到名单时，可以在这里手动粘贴：一行一个学生，格式 <code>班级,中文名</code>（例如 <code>elephant,安以萱</code>），或者只写中文名。</p>
  <textarea id="pasteText" placeholder="elephant,安以萱&#10;elephant,白梦云&#10;tiger,安心桠"></textarea>
  <div style="margin-top:8px"><button id="usePaste">使用这份名单</button></div>
</div>

<div id="out"></div>

6 60C70 70 70 80 67 86\"/>"}, "mouse": {"label": "小老鼠", "svg": "<ellipse cx=\"46\" cy=\"58\" rx=\"30\" ry=\"24\"/><circle cx=\"30\" cy=\"32\" r=\"13\"/><circle cx=\"62\" cy=\"32\" r=\"13\"/><circle cx=\"38\" cy=\"50\" r=\"3\" fill=\"#000\" stroke=\"none\"/><circle cx=\"56\" cy=\"50\" r=\"3\" fill=\"#000\" stroke=\"none\"/><circle cx=\"47\" cy=\"62\" r=\"3.4\" fill=\"#000\" stroke=\"none\"/><path d=\"M44 63 24 58\"/><path d=\"M44 66 24 70\"/><path d=\"M50 63 70 58\"/><path d=\"M50 66 70 70\"/><path d=\"M76 64C90 64 92 80 82 90\"/>"}, "rock": {"label": "石头", "svg": "<path d=\"M14 76 26 40 52 28 78 40 88 70 74 84H26Z\"/><path d=\"M26 40 46 52 52 28\"/><path d=\"M46 52 78 40\"/><path d=\"M46 52 40 84\"/>"}, "rainbow": {"label": "彩虹", "svg": "<path d=\"M32 78A18 18 0 0 1 68 78\"/><path d=\"M24 78A26 26 0 0 1 76 78\"/><path d=\"M16 78A34 34 0 0 1 84 78\"/><path d=\"M8 78A42 42 0 0 1 92 78\"/><path d=\"M8 78H30\"/><path d=\"M70 78H92\"/><path d=\"M22 88A11 8 0 0 1 44 88Z\"/><path d=\"M56 88A11 8 0 0 1 78 88Z\"/>"}, "balloon": {"label": "气球", "svg": "<ellipse cx=\"30\" cy=\"34\" rx=\"18\" ry=\"22\"/><path d=\"M30 56 26 62h8Z\"/><path d=\"M30 62C30 76 40 82 46 94\"/><ellipse cx=\"70\" cy=\"44\" rx=\"16\" ry=\"20\"/><path d=\"M70 64 66 70h8Z\"/><path d=\"M70 70C70 82 58 86 50 94\"/>"}, "butterfly": {"label": "蝴蝶", "svg": "<ellipse cx=\"50\" cy=\"54\" rx=\"5\" ry=\"24\"/><path d=\"M45 40C34 20 14 16 8 26 2 36 16 46 45 50Z\"/><path d=\"M55 40C66 20 86 16 92 26 98 36 84 46 55 50Z\"/><path d=\"M45 58C36 70 20 78 14 72 8 66 22 56 45 54Z\"/><path d=\"M55 58C64 70 80 78 86 72 92 66 78 56 55 54Z\"/><path d=\"M47 32C44 22 38 14 32 10\"/><path d=\"M53 32C56 22 62 14 68 10\"/><circle cx=\"32\" cy=\"9\" r=\"2.6\" fill=\"#000\" stroke=\"none\"/><circle cx=\"68\" cy=\"9\" r=\"2.6\" fill=\"#000\" stroke=\"none\"/>"}};
var COLORS = [{"key": "red", "label": "红色", "items": ["apple", "ladybug", "watermelon"]}, {"key": "patriot", "label": "爱国色", "items": ["flag", "star", "firework"]}, {"key": "orange", "label": "橙色", "items": ["orange", "carrot", "pumpkin"]}, {"key": "yellow", "label": "黄色", "items": ["sun", "banana", "duck"]}, {"key": "green", "label": "绿色", "items": ["frog", "leaf", "broccoli"]}, {"key": "blue", "label": "蓝色", "items": ["whale", "umbrella", "blueberry"]}, {"key": "purple", "label": "紫色", "items": ["grapes", "eggplant", "violet"]}, {"key": "brown", "label": "棕色", "items": ["bear", "chocolate", "cookie"]}, {"key": "black", "label": "黑色", "items": ["bat", "penguin", "cat"]}, {"key": "white", "label": "白色", "items": ["cloud", "snowman", "snowflake"]}, {"key": "pink", "label": "粉色", "items": ["pig", "flamingo", "icecream"]}, {"key": "gray", "label": "灰色", "items": ["elephant", "mouse", "rock"]}, {"key": "rainbow", "label": "彩虹色", "items": ["rainbow", "balloon", "butterfly"]}];

/* ================= 名单 ================= */
var roster = [];   // [{cls, name}]

function groqUrl(year) {
  var q = '*[_type=="student" && academicYear==$y && status=="active"]' +
          '|order(className asc, studentNumber asc)' +
          '{"cls":className,"name":coalesce(nameZh,name),"no":studentNumber}';
  return 'https://' + SANITY_PROJECT + '.apicdn.sanity.io/v2023-05-03/data/query/' +
         SANITY_DATASET + '?query=' + encodeURIComponent(q) +
         '&$y=' + encodeURIComponent(JSON.stringify(year));
}

function setStatus(msg, bad) {
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (bad ? ' err' : '');
}

function loadRoster() {
  var year = document.getElementById('year').value.trim();
  setStatus('正在读 ' + year + ' 名单…');
  fetch(groqUrl(year))
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      var rows = (d.result || []).filter(function (s) { return s.name; });
      if (!rows.length) throw new Error('这个学年没有查到学生');
      roster = rows.map(function (s) { return { cls: s.cls || 'other', name: s.name }; });
      document.getElementById('pasteBox').classList.remove('show');
      afterRoster();
    })
    .catch(function (e) {
      setStatus('读名单失败（' + e.message + '）。可以在下面手动粘贴。', true);
      document.getElementById('pasteBox').classList.add('show');
    });
}

function usePasted() {
  var lines = document.getElementById('pasteText').value.split('\n');
  roster = [];
  lines.forEach(function (ln) {
    ln = ln.trim(); if (!ln) return;
    var p = ln.split(/[,，\t]/);
    if (p.length > 1) roster.push({ cls: p[0].trim(), name: p[1].trim() });
    else roster.push({ cls: 'other', name: p[0].trim() });
  });
  if (roster.length) { document.getElementById('pasteBox').classList.remove('show'); afterRoster(); }
}

function afterRoster() {
  var sel = document.getElementById('cls');
  var seen = [];
  roster.forEach(function (s) { if (seen.indexOf(s.cls) < 0) seen.push(s.cls); });
  sel.innerHTML = '<option value="all">全部（' + seen.length + ' 个班）</option>';
  seen.forEach(function (c) {
    var n = roster.filter(function (s) { return s.cls === c; }).length;
    sel.innerHTML += '<option value="' + c + '">' + (CLASS_LABELS[c] || c) + '（' + n + ' 人）</option>';
  });
  render();
}

/* ================= 渲染 ================= */
function nameClass(n) { return 'name n' + Math.min(4, Math.max(2, n.length)); }

function sheet(name, color) {
  var d = document.createElement('div');
  d.className = 'sheet';
  var art = color.items.map(function (k) {
    return '<svg viewBox="0 0 100 100" fill="none" stroke="#000" stroke-width="2.6" ' +
           'stroke-linecap="round" stroke-linejoin="round">' + ART[k].svg + '</svg>';
  }).join('');
  d.innerHTML =
    '<div class="meta">名字：<u></u>　学号：<u></u></div>' +
    '<div class="cue">写一写</div>' +
    '<div class="' + nameClass(name) + '">' + name + '</div>' +
    '<div class="cue">画一画' + color.label + '。</div>' +
    '<div class="art">' + art + '</div>' +
    '<div class="think">想一想，还有什么是' + color.label + '？</div>' +
    '<div class="box"></div>';
  return d;
}

function render() {
  var out = document.getElementById('out');
  out.innerHTML = '';
  var cls = document.getElementById('cls').value;
  var withSample = document.getElementById('sample').checked;
  var chosen = COLORS.filter(function (c) {
    var b = document.querySelector('input[data-color="' + c.key + '"]');
    return b && b.checked;
  });
  var people = roster.filter(function (s) { return cls === 'all' || s.cls === cls; });

  var groups = [];
  if (cls === 'all') {
    var seen = [];
    people.forEach(function (s) { if (seen.indexOf(s.cls) < 0) seen.push(s.cls); });
    seen.forEach(function (c) { groups.push(people.filter(function (s) { return s.cls === c; })); });
  } else {
    groups.push(people);
  }

  var n = 0;
  chosen.forEach(function (color) {
    groups.forEach(function (g) {
      if (withSample) { out.appendChild(sheet(SAMPLE_NAME, color)); n++; }
      g.forEach(function (s) { out.appendChild(sheet(s.name, color)); n++; });
    });
  });

  setStatus(people.length + ' 名学生 × ' + chosen.length + ' 种颜色 ＝ ' + n + ' 页');
}

/* ================= 启动 ================= */
(function init() {
  var list = document.getElementById('colorList');
  COLORS.forEach(function (c, i) {
    var id = 'c_' + c.key;
    list.insertAdjacentHTML('beforeend',
      '<label><input type="checkbox" data-color="' + c.key + '" id="' + id + '"' +
      (i === 0 ? ' checked' : '') + '> ' + c.label + '</label>');
  });
  list.insertAdjacentHTML('beforeend',
    '<label style="color:#6b6459"><a href="#" id="allOn">全选</a>　<a href="#" id="allOff">全不选</a></label>');

  document.getElementById('allOn').onclick = function (e) {
    e.preventDefault();
    document.querySelectorAll('[data-color]').forEach(function (b) { b.checked = true; });
    render();
  };
  document.getElementById('allOff').onclick = function (e) {
    e.preventDefault();
    document.querySelectorAll('[data-color]').forEach(function (b) { b.checked = false; });
    render();
  };

  list.addEventListener('change', render);
  document.getElementById('cls').addEventListener('change', render);
  document.getElementById('sample').addEventListener('change', render);
  document.getElementById('reload').onclick = loadRoster;
  document.getElementById('usePaste').onclick = usePasted;
  document.getElementById('print').onclick = function () { window.print(); };

  loadRoster();
})();
</script>
