<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>荣誉殿堂 管理</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --green: #1B4332; --gold: #C9A227; --bg: #F7F3EC;
      --panel: #fff; --ink: #172033; --muted: #687386;
      --line: #d9dee8; --red: #dc2626; --blue: #2563eb;
      --shadow: 0 4px 20px rgba(15,23,42,.10);
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "KaiTi-CJK","LXGW WenKai Lite",Arial,sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }

    /* ── Login overlay ── */
    #loginOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(135deg, var(--green), #0f2718);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-box {
      background: #fff; border-radius: 20px; padding: 40px 36px;
      width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.3);
    }
    .login-icon { font-size: 3rem; margin-bottom: 12px; }
    .login-title { font-size: 1.4rem; font-weight: bold; color: var(--green); margin-bottom: 4px; }
    .login-sub { font-size: .85rem; color: var(--muted); margin-bottom: 24px; font-family: Arial,sans-serif; }
    .login-input {
      width: 100%; padding: 13px 16px; font-size: 1.3rem; text-align: center;
      letter-spacing: 6px; border: 2px solid var(--line); border-radius: 10px;
      outline: none; margin-bottom: 14px; font-family: Arial,sans-serif; color: var(--ink);
      transition: border-color .2s;
    }
    .login-input:focus { border-color: var(--green); }
    .login-btn {
      width: 100%; padding: 13px; font-size: 1rem; font-weight: bold;
      background: var(--green); color: #fff; border: none; border-radius: 10px;
      cursor: pointer; transition: background .2s;
    }
    .login-btn:hover { background: #145028; }
    .login-err { color: var(--red); font-size: .85rem; margin-top: 10px; min-height: 20px; }

    /* ── Header ── */
    .site-header {
      background: linear-gradient(135deg, var(--green), #0f2718);
      padding: 14px 24px; display: flex; align-items: center;
      justify-content: space-between; box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }
    .header-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,.7); text-decoration: none; font-size: .9rem;
      font-family: Arial,sans-serif; transition: opacity .2s;
    }
    .header-back:hover { opacity: .85; }
    .header-title { color: #fff; font-size: 1.4rem; font-weight: bold; letter-spacing: 1px; }
    .logout-btn {
      background: transparent; border: 1px solid rgba(255,255,255,.3);
      color: rgba(255,255,255,.65); padding: 6px 14px; border-radius: 8px;
      cursor: pointer; font-size: .82rem; font-family: Arial,sans-serif;
      transition: all .2s;
    }
    .logout-btn:hover { background: rgba(255,255,255,.1); color: #fff; }

    /* ── Wrap ── */
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 18px 60px; }

    /* ── Panels ── */
    .panel {
      background: var(--panel); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px;
    }
    .panel-title {
      font-size: 1.1rem; font-weight: bold; color: var(--green);
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }

    /* ── Month nav ── */
    .month-nav {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .nav-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--green); color: #fff; cursor: pointer;
      font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: background .2s, transform .15s;
    }
    .nav-btn:hover:not(:disabled) { background: var(--gold); transform: scale(1.1); color: #153026; }
    .nav-btn:disabled { background: #ccc; cursor: default; }
    .month-label { font-size: 1.1rem; font-weight: bold; color: var(--green); min-width: 140px; }
    .refresh-btn {
      margin-left: auto; background: #f1f5f9; border: 1px solid var(--line);
      border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: .85rem;
      color: var(--muted); transition: background .2s;
    }
    .refresh-btn:hover { background: #e2e8f0; color: var(--ink); }

    /* ── Award table ── */
    .award-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    .award-table th { background: #f8fafc; padding: 9px 10px; text-align: left; border-bottom: 2px solid var(--line); font-weight: 700; }
    .award-table td { padding: 9px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    .award-table tr:hover td { background: #fafbfc; }
    .badge-type {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: .78rem; font-weight: bold; color: #fff;
    }
    .badge-cw { background: var(--green); }
    .badge-ma { background: #1E3A8A; }
    .badge-pr { background: #5B21B6; }
    .del-btn {
      background: #fee2e2; color: var(--red); border: none; border-radius: 6px;
      padding: 5px 10px; cursor: pointer; font-size: .8rem; transition: background .2s;
    }
    .del-btn:hover { background: #fca5a5; }

    /* ── State ── */
    .state-box { text-align: center; padding: 32px 20px; color: var(--muted); font-size: .95rem; }
    .spinner {
      width: 38px; height: 38px; border: 3px solid #E8E0D0;
      border-top-color: var(--green); border-radius: 50%;
      animation: spin .7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Upload section ── */
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 640px) { .upload-grid { grid-template-columns: 1fr; } }
    label.field-label { display: block; font-size: .82rem; font-weight: 800; color: #334155; margin-bottom: 5px; }
    select.field-select, input[type="month"].field-input {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--line);
      border-radius: 10px; font-family: inherit; font-size: .95rem; background: #fff; outline: none;
      transition: border-color .2s;
    }
    select.field-select:focus, input[type="month"].field-input:focus { border-color: var(--green); }

    .drop-zone {
      border: 2px dashed #a7c4b5; background: #f0faf5; border-radius: 14px;
      padding: 28px 20px; text-align: center; cursor: pointer; transition: background .2s;
    }
    .drop-zone:hover, .drop-zone.drag-over { background: #dcfce7; border-color: var(--green); }
    .drop-icon { font-size: 2rem; margin-bottom: 8px; }
    .drop-hint { font-size: .85rem; color: var(--muted); margin-top: 4px; font-family: Arial,sans-serif; }
    #pdfInput { display: none; }

    .parse-status { font-size: .85rem; color: var(--muted); margin-top: 10px; min-height: 20px; font-family: Arial,sans-serif; }
    .parse-status.ok  { color: #16a34a; }
    .parse-status.err { color: var(--red); }

    /* ── Student selection table ── */
    .sel-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .sel-table th { background: #f8fafc; padding: 9px 10px; text-align: left; border-bottom: 2px solid var(--line); }
    .sel-table td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
    .sel-table tr.selected td { background: #f0fdf4; }
    .sel-table input[type="checkbox"] { width: 17px; height: 17px; cursor: pointer; accent-color: var(--green); }
    .score-pill {
      display: inline-block; min-width: 34px; padding: 2px 8px;
      border-radius: 12px; font-weight: bold; text-align: center; font-size: .85rem;
    }
    .score-high { background: #dcfce7; color: #15803d; }
    .score-mid  { background: #fef9c3; color: #854d0e; }
    .score-low  { background: #fee2e2; color: var(--red); }

    .select-all-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: .88rem; }
    .select-all-row button {
      padding: 5px 12px; border: 1px solid var(--line); border-radius: 7px;
      background: #f8fafc; cursor: pointer; font-size: .82rem; transition: background .2s;
    }
    .select-all-row button:hover { background: #e2e8f0; }

    /* ── Save bar ── */
    .save-bar {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding-top: 14px; border-top: 1px solid var(--line); margin-top: 14px;
    }
    .save-btn {
      background: var(--green); color: #fff; border: none; border-radius: 10px;
      padding: 11px 26px; font-size: 1rem; font-weight: bold; cursor: pointer;
      transition: background .2s; font-family: inherit;
    }
    .save-btn:hover:not(:disabled) { background: #145028; }
    .save-btn:disabled { opacity: .5; cursor: not-allowed; }
    .save-status { font-size: .88rem; font-family: Arial,sans-serif; }
    .save-status.ok  { color: #16a34a; }
    .save-status.err { color: var(--red); }

    /* ── Unmatched warning ── */
    .unmatched-box {
      background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px;
      padding: 12px 16px; margin-top: 10px; font-size: .85rem;
    }
    .unmatched-box strong { color: #c2410c; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .award-table, .sel-table { font-size: .8rem; }
      .wrap { padding: 14px 10px 50px; }
    }
  </style>
</head>
<body>

<!-- ── Login Overlay ──────────────────────────────────────────────────────── -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="login-icon">🏆</div>
    <div class="login-title">荣誉殿堂 管理</div>
    <div class="login-sub">Hall of Fame Admin</div>
    <input class="login-input" id="pwInput" type="password" placeholder="••••••" autocomplete="current-password" />
    <button class="login-btn" id="loginBtn">登录</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <a href="../teachers.html" class="header-back">
    <svg viewBox="0 0 24 24" fill="none" style="width:20px;height:20px;flex-shrink:0">
      <path d="M15 6L9 12L15 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    返回工具台
  </a>
  <div class="header-title">🏆 荣誉殿堂 管理</div>
  <button class="logout-btn" onclick="logout()">退出登录</button>
</header>

<!-- ── Main ───────────────────────────────────────────────────────────────── -->
<div class="wrap">

  <!-- ① 月度奖项管理 -->
  <div class="panel">
    <div class="panel-title">📅 月度奖项管理</div>
    <div class="month-nav">
      <button class="nav-btn" id="prevMonthBtn" onclick="changeViewMonth(-1)">◀</button>
      <div class="month-label" id="viewMonthLabel">—</div>
      <button class="nav-btn" id="nextMonthBtn" onclick="changeViewMonth(1)">▶</button>
      <button class="refresh-btn" onclick="loadMonthAwards()">↻ 刷新</button>
    </div>
    <div id="awardListArea">
      <div class="state-box"><div class="spinner"></div><p>正在加载…</p></div>
    </div>
  </div>

  <!-- ② PDF 上传 + 选人 -->
  <div class="panel">
    <div class="panel-title">📄 上传四会字报告 · 选取大师奖</div>

    <div class="upload-grid">
      <div>
        <label class="field-label">获奖月份</label>
        <input class="field-input" id="awardMonthPicker" type="month" />
      </div>
      <div>
        <label class="field-label">奖项类型</label>
        <select class="field-select" id="awardTypeSelect">
          <option value="chinese_words">🏆 四会字大师奖</option>
          <option value="mathematics">📐 数学大师奖</option>
          <option value="progression">🌟 最佳进步奖</option>
        </select>
      </div>
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
      <div class="drop-icon">📂</div>
      <div>点击或拖拽上传 ESGI 学生报告 PDF</div>
      <div class="drop-hint">支持 ESGI Student Detail Report（多学生合并文件）</div>
      <input id="pdfInput" type="file" accept="application/pdf" />
    </div>
    <div class="parse-status" id="parseStatus"></div>

    <!-- Student selection -->
    <div id="selectionArea" style="display:none; margin-top:18px;">
      <div class="select-all-row">
        <span id="selCount">已选 0 人</span>
        <button onclick="selectAll(true)">全选</button>
        <button onclick="selectAll(false)">全不选</button>
        <button onclick="selectTopN(5)">选前 5 名</button>
      </div>
      <div style="overflow:auto;">
        <table class="sel-table">
          <thead>
            <tr>
              <th style="width:36px">选</th>
              <th>学生姓名</th>
              <th>四会字得分</th>
              <th>B</th><th>1</th><th>2</th><th>3</th><th>4</th>
            </tr>
          </thead>
          <tbody id="selTbody"></tbody>
        </table>
      </div>

      <div class="save-bar">
        <button class="save-btn" id="saveBtn" onclick="saveAwards()">💾 保存所选学生的荣誉奖项</button>
        <span class="save-status" id="saveStatus"></span>
      </div>
      <div id="unmatchedBox" style="display:none" class="unmatched-box"></div>
    </div>
  </div>

</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var PROJECT_ID = 'sow12t1i';
var DATASET = 'production';
var SANITY_BASE = 'https://' + PROJECT_ID + '.api.sanity.io/v2023-05-03/data/query/' + DATASET;

// ── Month navigation (browser) ───────────────────────────────────────────────
var _now = new Date();
var viewYear  = _now.getFullYear();
var viewMonth = _now.getMonth() + 1; // 1-12
// Default to current month
var MONTHS_ZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function pad(n) { return String(n).padStart(2, '0'); }

function updateViewMonthLabel() {
  document.getElementById('viewMonthLabel').textContent =
    viewYear + ' 年 ' + MONTHS_ZH[viewMonth - 1];
}

function changeViewMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  if (viewMonth > 12) { viewMonth = 1;  viewYear++; }
  updateViewMonthLabel();
  loadMonthAwards();
}

// ── Load existing awards for view month ─────────────────────────────────────
var AWARD_TYPE_LABELS = {
  chinese_words: { label: '四会字大师奖', cls: 'badge-cw' },
  mathematics:   { label: '数学大师奖',   cls: 'badge-ma' },
  progression:   { label: '最佳进步奖',   cls: 'badge-pr' },
};

function esc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function loadMonthAwards() {
  var area = document.getElementById('awardListArea');
  area.innerHTML = '<div class="state-box"><div class="spinner"></div><p>正在加载…</p></div>';

  var ym = viewYear + '-' + pad(viewMonth);
  var query = '*[_type=="hallOfFame" && string::startsWith(awardMonth,"' + ym + '")] | order(_createdAt asc)' +
    '{_id, awardType, awardTitle, sightWordScore, awardMonth, "studentName":studentRef->name}';
  var url = SANITY_BASE + '?query=' + encodeURIComponent(query);

  fetch(url)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      var list = Array.isArray(data.result) ? data.result : [];
      if (!list.length) {
        area.innerHTML = '<div class="state-box"><div style="font-size:2rem">🌟</div><p>本月暂无奖项记录</p></div>';
        return;
      }
      var rows = list.map(function(item) {
        var cfg = AWARD_TYPE_LABELS[item.awardType] || AWARD_TYPE_LABELS.chinese_words;
        var scoreHtml = (item.sightWordScore != null) ? esc(item.sightWordScore) + ' 字' : '—';
        return '<tr>' +
          '<td><b>' + esc(item.studentName || '—') + '</b></td>' +
          '<td><span class="badge-type ' + cfg.cls + '">' + cfg.label + '</span></td>' +
          '<td>' + scoreHtml + '</td>' +
          '<td>' + esc(item.awardMonth ? item.awardMonth.slice(0,7) : '—') + '</td>' +
          '<td><button class="del-btn" onclick="deleteAward(\'' + esc(item._id) + '\', this)">删除</button></td>' +
          '</tr>';
      }).join('');
      area.innerHTML =
        '<table class="award-table">' +
        '<thead><tr><th>学生</th><th>奖项</th><th>四会字得分</th><th>月份</th><th>操作</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '</table>';
    })
    .catch(function(e) {
      area.innerHTML = '<div class="state-box"><div style="font-size:2rem">❌</div><p>' + esc(e.message) + '</p></div>';
    });
}

function deleteAward(docId, btn) {
  if (!confirm('确定删除该奖项记录？')) return;
  btn.disabled = true;
  btn.textContent = '…';
  fetch('/api/hall-of-fame-import', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({action: 'delete', docId: docId}),
    credentials: 'same-origin',
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok) {
        var row = btn.closest('tr');
        if (row) row.remove();
        // Check if table is now empty
        var tbody = document.querySelector('#awardListArea tbody');
        if (tbody && !tbody.querySelector('tr')) {
          loadMonthAwards();
        }
      } else {
        alert('删除失败：' + (data.error || '未知错误'));
        btn.disabled = false;
        btn.textContent = '删除';
      }
    })
    .catch(function(e) {
      alert('网络错误：' + e.message);
      btn.disabled = false;
      btn.textContent = '删除';
    });
}

// ── PDF Parsing (reuses ESGI report format) ──────────────────────────────────
var SIGHT_WORDS_TEST = 'Chinese Sight Words';
var SIGHT_WORDS_TOTAL = 50;
var parsedStudents = [];

function normalizeNameKey(s) {
  return String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
function isHeaderLine(s) {
  var n = normalizeNameKey(s);
  return !n || /^\d{1,2}\s+\d{1,2}\s+\d{4}$/.test(n) || /^\d+$/.test(n) ||
    n.includes('student detail report') || n.includes('subject') ||
    n.includes('teacher') || n.includes('class') || n.includes('student') ||
    n.includes('wang class') || n.includes('mr wang') || n.includes('homeroom') ||
    n === 'k chinese' || n === 'chinese sight words' ||
    ['b','score','scores','test session date','correct','incorrect','notes','summary'].some(function(x){ return n.startsWith(x); });
}
function looksLikeName(s) {
  return !isHeaderLine(s) &&
    /^[\p{Lu}][\p{L}''\-]+(?:\s+[\p{Lu}][\p{L}''\-]+)+$/u.test(s) && s.length < 80;
}
function findNameInText(text) {
  var m = String(text || '').match(/Student:\s*([^\n]+)/);
  if (!m) return '';
  var name = m[1].trim();
  return looksLikeName(name) ? name : '';
}
function findStudentName(page1) {
  var n1 = findNameInText(page1);
  if (n1) return n1;
  var lines = page1.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
  var idx = lines.findIndex(function(l){ return l === SIGHT_WORDS_TEST; });
  var search = idx > 0 ? lines.slice(0, idx) : lines.slice(0, 14);
  for (var i = search.length - 1; i >= 0; i--) {
    if (looksLikeName(search[i])) return search[i];
  }
  return '';
}
function extractSightWords(text) {
  var idx = text.indexOf(SIGHT_WORDS_TEST);
  if (idx < 0) return null;
  var rest = text.slice(idx, idx + 500);
  var m = rest.match(/Score:\s*([0-9NT\s\/]+)/i);
  if (!m) return null;
  var nums = (m[1].match(/\d+/g) || []).map(Number);
  if (nums.length < 2) return null;
  var b = nums[0], q1 = nums[1], q2 = nums[2], q3 = nums[3], q4 = nums[4];
  var latest = (q4 != null && isFinite(q4)) ? q4 : nums[nums.length - 1];
  return { baseline: b, q1: q1 != null ? q1 : null, q2: q2 != null ? q2 : null,
           q3: q3 != null ? q3 : null, q4: q4 != null ? q4 : null, latest: latest };
}
function hasValidSightWords(sw) {
  return !!(sw && isFinite(sw.latest));
}
function parsePages(pages) {
  var byName = new Map();
  for (var i = 0; i < pages.length; i++) {
    var p1 = pages[i] || '';
    var name = findStudentName(p1);
    if (!name || isHeaderLine(name)) continue;
    var sw = extractSightWords(p1);
    var key = normalizeNameKey(name);
    var prev = byName.get(key);
    var prevScore = prev && prev.sw && isFinite(prev.sw.latest) ? prev.sw.latest : -1;
    var currScore = sw && isFinite(sw.latest) ? sw.latest : -1;
    if (!prev || currScore > prevScore) {
      byName.set(key, {name: name, sw: sw});
    }
  }
  return Array.from(byName.values());
}

// ── Drag-and-drop setup ──────────────────────────────────────────────────────
var dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  var file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
document.getElementById('pdfInput').addEventListener('change', function(e) {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function setParseStatus(msg, cls) {
  var el = document.getElementById('parseStatus');
  el.textContent = msg;
  el.className = 'parse-status' + (cls ? ' ' + cls : '');
}

async function handleFile(file) {
  setParseStatus('正在解析 PDF…', '');
  parsedStudents = [];
  document.getElementById('selectionArea').style.display = 'none';
  try {
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({data: buf}).promise;
    var pages = [];
    for (var i = 1; i <= pdf.numPages; i++) {
      var page = await pdf.getPage(i);
      var content = await page.getTextContent();
      pages.push(content.items.map(function(it){ return it.str; }).join('\n'));
    }
    parsedStudents = parsePages(pages).filter(function(s){ return !isHeaderLine(s.name); });
    if (!parsedStudents.length) {
      setParseStatus('未能解析到学生数据，请确认 PDF 格式是否正确。', 'err');
      return;
    }
    // Sort by score descending
    parsedStudents.sort(function(a, b) {
      var sa = a.sw ? a.sw.latest : -1;
      var sb = b.sw ? b.sw.latest : -1;
      return sb - sa;
    });
    setParseStatus('解析完成，共找到 ' + parsedStudents.length + ' 名学生。请选择获奖名单后保存。', 'ok');
    renderSelectionTable();
    document.getElementById('selectionArea').style.display = 'block';
  } catch(e) {
    setParseStatus('PDF 解析失败：' + e.message, 'err');
  }
}

function scoreClass(score) {
  if (score == null) return '';
  if (score >= 40) return 'score-high';
  if (score >= 20) return 'score-mid';
  return 'score-low';
}

function renderSelectionTable() {
  var tbody = document.getElementById('selTbody');
  tbody.innerHTML = parsedStudents.map(function(s, idx) {
    var sw = s.sw;
    var latest = sw ? sw.latest : null;
    var latestHtml = (latest != null)
      ? '<span class="score-pill ' + scoreClass(latest) + '">' + latest + '</span>'
      : '<span style="color:var(--muted)">—</span>';
    return '<tr id="srow-' + idx + '">' +
      '<td><input type="checkbox" id="chk-' + idx + '" onchange="onCheckChange()"  /></td>' +
      '<td><b>' + esc(s.name) + '</b></td>' +
      '<td>' + latestHtml + ' <span style="color:var(--muted);font-size:.78rem">/ ' + SIGHT_WORDS_TOTAL + '</span></td>' +
      '<td>' + esc(sw ? sw.baseline : '—') + '</td>' +
      '<td>' + esc(sw && sw.q1 != null ? sw.q1 : '—') + '</td>' +
      '<td>' + esc(sw && sw.q2 != null ? sw.q2 : '—') + '</td>' +
      '<td>' + esc(sw && sw.q3 != null ? sw.q3 : '—') + '</td>' +
      '<td>' + esc(sw && sw.q4 != null ? sw.q4 : '—') + '</td>' +
      '</tr>';
  }).join('');
  onCheckChange();
}

function onCheckChange() {
  var count = 0;
  parsedStudents.forEach(function(_, i) {
    var chk = document.getElementById('chk-' + i);
    var row = document.getElementById('srow-' + i);
    if (chk && chk.checked) { count++; if (row) row.classList.add('selected'); }
    else { if (row) row.classList.remove('selected'); }
  });
  document.getElementById('selCount').textContent = '已选 ' + count + ' 人';
  document.getElementById('saveBtn').disabled = (count === 0);
}

function selectAll(checked) {
  parsedStudents.forEach(function(_, i) {
    var chk = document.getElementById('chk-' + i);
    if (chk) chk.checked = checked;
  });
  onCheckChange();
}

function selectTopN(n) {
  // Students are already sorted by score desc; select top N with scores
  var selected = 0;
  parsedStudents.forEach(function(s, i) {
    var chk = document.getElementById('chk-' + i);
    if (!chk) return;
    var score = s.sw ? s.sw.latest : null;
    if (score != null && selected < n) { chk.checked = true; selected++; }
    else { chk.checked = false; }
  });
  onCheckChange();
}

// ── Save ─────────────────────────────────────────────────────────────────────
function setSaveStatus(msg, cls) {
  var el = document.getElementById('saveStatus');
  el.textContent = msg;
  el.className = 'save-status' + (cls ? ' ' + cls : '');
}

function saveAwards() {
  var monthVal = document.getElementById('awardMonthPicker').value; // 'YYYY-MM'
  if (!monthVal) { setSaveStatus('请先选择获奖月份！', 'err'); return; }
  var awardType = document.getElementById('awardTypeSelect').value;

  var awards = [];
  parsedStudents.forEach(function(s, i) {
    var chk = document.getElementById('chk-' + i);
    if (chk && chk.checked) {
      awards.push({
        studentName: s.name,
        awardType: awardType,
        sightWordScore: s.sw ? s.sw.latest : null,
      });
    }
  });

  if (!awards.length) { setSaveStatus('请至少选择一名学生！', 'err'); return; }

  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setSaveStatus('正在保存…', '');
  document.getElementById('unmatchedBox').style.display = 'none';

  fetch('/api/hall-of-fame-import', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({action: 'create', month: monthVal, awards: awards}),
    credentials: 'same-origin',
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      btn.disabled = false;
      if (!data.ok) { setSaveStatus('保存失败：' + (data.error || '未知错误'), 'err'); return; }
      var s = data.summary;
      setSaveStatus('✅ 已保存 ' + s.created + ' 条记录！', 'ok');
      if (s.unmatchedNames && s.unmatchedNames.length) {
        var box = document.getElementById('unmatchedBox');
        box.style.display = '';
        box.innerHTML = '<strong>⚠️ 以下学生姓名未在 Sanity 中找到匹配，请手动添加：</strong><br>' +
          s.unmatchedNames.map(function(n){ return esc(n); }).join('、');
      }
      // Refresh month browser if the month matches
      var browserYM = viewYear + '-' + pad(viewMonth);
      if (monthVal === browserYM) loadMonthAwards();
    })
    .catch(function(e) {
      btn.disabled = false;
      setSaveStatus('网络错误：' + e.message, 'err');
    });
}

// ── Auth ──────────────────────────────────────────────────────────────────────
function showLogin() {
  document.getElementById('loginOverlay').style.display = 'flex';
}
function hideLogin() {
  document.getElementById('loginOverlay').style.display = 'none';
}

function checkAuth() {
  // Try a protected endpoint; if 401, show login; otherwise init
  fetch('/api/hall-of-fame-import', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({action: 'ping'}),
    credentials: 'same-origin',
  })
    .then(function(r) {
      if (r.status === 401) { showLogin(); }
      else { hideLogin(); init(); }
    })
    .catch(function() { hideLogin(); init(); });
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  var pw = document.getElementById('pwInput').value;
  document.getElementById('loginErr').textContent = '';
  fetch('/api/contacts-login', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({password: pw}),
    credentials: 'same-origin',
  })
    .then(function(r) { return r.json().then(function(d){ return {ok: r.ok, data: d}; }); })
    .then(function(res) {
      if (!res.ok) {
        document.getElementById('loginErr').textContent = res.data.error || '密码错误';
        return;
      }
      hideLogin();
      init();
    })
    .catch(function(e) {
      document.getElementById('loginErr').textContent = '网络错误：' + e.message;
    });
}

function logout() {
  document.cookie = 'contacts_session=; Max-Age=0; Path=/';
  location.reload();
}

// ── Init ─────────────────────────────────────────────────────────────────────
function init() {
  // Set default award month picker to current month
  var now = new Date();
  var ym = now.getFullYear() + '-' + pad(now.getMonth() + 1);
  document.getElementById('awardMonthPicker').value = ym;

  updateViewMonthLabel();
  loadMonthAwards();
}

// Start: probe auth
checkAuth();
</script>
</body>
