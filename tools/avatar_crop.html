<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>头像裁剪 · 教师工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--mint:#5eb8a8;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"LXGW WenKai Lite",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);text-decoration:none;font-size:14px;
      padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.panel{background:var(--panel);border-radius:20px;box-shadow:0 14px 36px rgba(15,23,42,.09);padding:18px;margin:14px 0}
h1{margin:0 0 6px;font-size:24px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.7;margin:0}
.drop{border:2px dashed #bfdbfe;background:#eff6ff;border-radius:16px;padding:22px;text-align:center;margin-top:12px}
.drop.hot{background:#dbeafe;border-color:var(--blue)}
.editor{display:grid;grid-template-columns:minmax(0,420px) 260px;gap:18px;align-items:start;justify-content:center}
.stage{position:relative;background:
   linear-gradient(45deg,#eef1f6 25%,transparent 25%),linear-gradient(-45deg,#eef1f6 25%,transparent 25%),
   linear-gradient(45deg,transparent 75%,#eef1f6 75%),linear-gradient(-45deg,transparent 75%,#eef1f6 75%);
   background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;
   border-radius:14px;overflow:hidden;touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
.stage canvas{display:block;width:100%;height:auto}
/* 逻辑画布仍是 560px 以保证导出精度，这里只限制屏幕显示尺寸，
   否则在笔记本上预览会大到需要缩放页面才看得全。 */
.stage{max-width:380px;margin:0 auto}
label{display:block;font-size:11.5px;font-weight:800;margin:12px 0 4px;color:#334155}
input[type=range]{width:100%}
select,input[type=number]{width:100%;border:1px solid var(--line);border-radius:11px;padding:9px 10px;font:inherit;background:#fff}
.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer;width:100%;margin-top:8px}
.btn.ghost{background:#e2e8f0;color:#334155}
.btn.mint{background:var(--mint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;margin-top:10px}
.thumb{flex:0 0 auto;width:72px;text-align:center;cursor:pointer;opacity:.55;transition:.15s}
.thumb.on{opacity:1}
.thumb .box{width:72px;height:72px;border-radius:12px;border:2px solid transparent;overflow:hidden;background:#eef1f6}
.thumb.on .box{border-color:var(--blue)}
.thumb.done .box{border-color:var(--mint)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .nm{font-size:10px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}
.hint{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:10px}
.sm{font-size:11.5px;color:var(--muted)}
@media(max-width:820px){.editor{grid-template-columns:1fr}}
</style>
  <link rel="stylesheet" href="../css/tools.css" />
</head>
<body>
<main class="wrap">
  <div class="tool-backbar"><a class="tool-back" href="index.html"><i class="fas fa-arrow-left"></i> 返回教师工具</a></div>

  <section class="panel">
    <h1>头像裁剪</h1>
    <p class="sub">
      一次拖入全班照片，逐张拖动 / 缩放把头部放进圆框，导出 PNG（圆外透明）。
      <b>文件名保持不变</b>，导出后直接丢进「头像批量上传」就能按名字匹配学生。
      全部在你的浏览器里处理，照片不会上传到任何服务器。
    </p>
    <div class="drop" id="drop">
      <input id="file" type="file" accept="image/*" multiple />
      <div class="sm" style="margin-top:8px">支持 JPG / PNG / WebP / HEIC（HEIC 需浏览器支持）。</div>
    </div>
    <div class="strip" id="strip"></div>
    <div class="status" id="status">等待选择照片。</div>
  </section>

  <section class="panel" id="editorPanel" hidden>
    <div class="editor">
      <div>
        <div class="stage" id="stage"><canvas id="cv"></canvas></div>
        <div class="hint">
          <b>拖动</b>照片移动位置，<b>滚轮</b>或下方滑块缩放。方向键微调，按住 Shift 步长更大。
        </div>
      </div>
      <div>
        <label>缩放</label>
        <input type="range" id="zoom" min="0.2" max="4" step="0.005" value="1" />
        <label>输出尺寸（像素）</label>
        <select id="size">
          <option value="600">600 × 600（与现有头像一致）</option>
          <option value="400">400 × 400</option>
          <option value="800">800 × 800</option>
          <option value="1000">1000 × 1000</option>
        </select>
        <label>形状</label>
        <select id="shape">
          <option value="circle">圆形（圆外透明）</option>
          <option value="square">方形</option>
        </select>
        <button class="btn ghost" id="fitBtn">重置到合适位置</button>
        <button class="btn ghost" id="applyAll">把当前缩放套用到全部</button>
        <button class="btn" id="nextBtn">保存并下一张 →</button>
        <button class="btn mint" id="zipBtn">打包下载全部</button>
        <div class="sm" style="margin-top:10px" id="progress"></div>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const VIEW = 560;                       // on-screen editing canvas, in CSS px
cv.width = cv.height = VIEW;

let items = [];       // {file, name, img, scale, ox, oy, done}
let cur = -1;

const setStatus = m => { $('status').textContent = m; };

/* ---------- intake ---------- */
$('file').addEventListener('change', e => intake([...e.target.files]));
const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => intake([...e.dataTransfer.files].filter(f => f.type.startsWith('image/'))));

async function intake(files){
  if(!files.length) return;
  items.forEach(i => i.url && URL.revokeObjectURL(i.url));
  items = [];
  setStatus(`正在载入 ${files.length} 张…`);
  for(const f of files){
    const url = URL.createObjectURL(f);
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error(f.name + ' 无法解码'));
      im.src = url;
    }).catch(err => { console.warn(err); return null; });
    if(!img) continue;
    items.push({ file:f, url, name:f.name, img, scale:1, ox:0, oy:0, done:false });
  }
  if(!items.length){ setStatus('没有可用的图片。'); return; }
  $('editorPanel').hidden = false;
  renderStrip();
  select(0);
  setStatus(`已载入 ${items.length} 张。逐张调整后可打包下载。`);
}

/* ---------- framing ---------- */
function fit(it){
  // Fill the circle: the shorter side of the photo spans the frame.
  const s = VIEW / Math.min(it.img.width, it.img.height);
  it.scale = s;
  it.ox = (VIEW - it.img.width * s) / 2;
  // Faces sit above centre in a portrait, so bias the default framing upward
  // rather than centring the whole photo — saves an adjustment on most shots.
  const h = it.img.height * s;
  it.oy = h > VIEW ? -(h - VIEW) * 0.32 : (VIEW - h) / 2;
}

function draw(){
  const it = items[cur];
  ctx.clearRect(0,0,VIEW,VIEW);
  if(!it) return;
  ctx.save();
  ctx.drawImage(it.img, it.ox, it.oy, it.img.width*it.scale, it.img.height*it.scale);
  ctx.restore();
  // dim outside the crop shape so the framing is obvious while dragging
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.beginPath();
  ctx.rect(0,0,VIEW,VIEW);
  if($('shape').value === 'circle') ctx.arc(VIEW/2, VIEW/2, VIEW/2, 0, Math.PI*2, true);
  else { ctx.moveTo(0,0); ctx.rect(0,0,VIEW,VIEW); }
  ctx.fill('evenodd');
  ctx.restore();
  if($('shape').value === 'circle'){
    ctx.strokeStyle = 'rgba(37,99,235,.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(VIEW/2, VIEW/2, VIEW/2-1, 0, Math.PI*2); ctx.stroke();
  }
}

function select(i){
  cur = i;
  const it = items[cur];
  if(it && it.scale === 1 && it.ox === 0 && it.oy === 0) fit(it);
  $('zoom').value = it ? it.scale : 1;
  renderStrip();
  draw();
  $('progress').textContent = `第 ${cur+1} / ${items.length} 张 · ${it ? it.name : ''}`;
}

function renderStrip(){
  $('strip').innerHTML = items.map((it,i) =>
    `<div class="thumb ${i===cur?'on':''} ${it.done?'done':''}" data-i="${i}">
       <div class="box"><img src="${it.url}" alt=""></div>
       <div class="nm" title="${it.name}">${it.name}</div>
     </div>`).join('');
  $('strip').querySelectorAll('.thumb').forEach(t =>
    t.addEventListener('click', () => select(Number(t.dataset.i))));
}

/* ---------- interaction ---------- */
let drag = null;
const stage = $('stage');
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(VIEW/r.width), y:(e.clientY-r.top)*(VIEW/r.height) };
}
stage.addEventListener('pointerdown', e => {
  if(cur < 0) return;
  stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
  const p = toCanvas(e); drag = { x:p.x, y:p.y, ox:items[cur].ox, oy:items[cur].oy };
});
stage.addEventListener('pointermove', e => {
  if(!drag) return;
  const p = toCanvas(e);
  items[cur].ox = drag.ox + (p.x - drag.x);
  items[cur].oy = drag.oy + (p.y - drag.y);
  draw();
});
['pointerup','pointercancel'].forEach(ev => stage.addEventListener(ev, () => { drag = null; stage.classList.remove('dragging'); }));

stage.addEventListener('wheel', e => {
  if(cur < 0) return;
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * 0.0016), toCanvas(e));
}, { passive:false });

function zoomAt(factor, at){
  const it = items[cur];
  const ns = Math.min(4, Math.max(0.2, it.scale * factor));
  const k = ns / it.scale;
  // keep the point under the cursor fixed
  it.ox = at.x - (at.x - it.ox) * k;
  it.oy = at.y - (at.y - it.oy) * k;
  it.scale = ns;
  $('zoom').value = ns;
  draw();
}

$('zoom').addEventListener('input', e => {
  if(cur < 0) return;
  zoomAt(Number(e.target.value) / items[cur].scale, { x:VIEW/2, y:VIEW/2 });
});
$('shape').addEventListener('change', draw);
$('fitBtn').addEventListener('click', () => { if(cur>=0){ fit(items[cur]); $('zoom').value = items[cur].scale; draw(); } });
$('applyAll').addEventListener('click', () => {
  if(cur < 0) return;
  const s = items[cur].scale;
  items.forEach((it,i) => { if(i===cur) return; const k = s/it.scale; it.ox = VIEW/2 - (VIEW/2-it.ox)*k; it.oy = VIEW/2 - (VIEW/2-it.oy)*k; it.scale = s; });
  setStatus('已把当前缩放套用到全部照片，位置仍可逐张微调。');
});
$('nextBtn').addEventListener('click', () => {
  if(cur < 0) return;
  items[cur].done = true;
  select(Math.min(items.length-1, cur+1));
});

document.addEventListener('keydown', e => {
  if(cur < 0 || $('editorPanel').hidden) return;
  const step = e.shiftKey ? 10 : 2;
  const map = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] };
  if(map[e.key]){ e.preventDefault(); items[cur].ox += map[e.key][0]; items[cur].oy += map[e.key][1]; draw(); }
});

/* ---------- export ---------- */
function renderOut(it){
  const size = Number($('size').value);
  const k = size / VIEW;                       // editing canvas maps 1:1 to output
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  if($('shape').value === 'circle'){
    x.save();
    x.beginPath(); x.arc(size/2, size/2, size/2, 0, Math.PI*2); x.clip();
  }
  x.drawImage(it.img, it.ox*k, it.oy*k, it.img.width*it.scale*k, it.img.height*it.scale*k);
  if($('shape').value === 'circle') x.restore();
  return c;
}

const outName = n => n.replace(/\.[^.]+$/, '') + '.png';

$('zipBtn').addEventListener('click', async () => {
  if(!items.length) return;
  $('zipBtn').disabled = true;
  setStatus('正在导出…');
  try{
    const zip = new JSZip();
    for(let i=0;i<items.length;i++){
      const blob = await new Promise(res => renderOut(items[i]).toBlob(res, 'image/png'));
      zip.file(outName(items[i].name), blob);
      setStatus(`正在导出 ${i+1}/${items.length}…`);
    }
    const out = await zip.generateAsync({ type:'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out);
    a.download = 'avatars.zip';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    setStatus(`已导出 ${items.length} 张，文件名保持原样。接下来可以到「头像批量上传」写入 Sanity。`);
  }catch(err){
    setStatus('导出失败：' + err.message);
  }finally{ $('zipBtn').disabled = false; }
});
</script>
</body>
</html>
