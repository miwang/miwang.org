<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大象班牛奶饼干分组 🥛🍪</title>

    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="icon" type="image/png" href="../images/elephant.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />

    <style>
        :root {
            --milk-color: #E3F2FD;
            --cookie-color: #FFF3E0;
            --bg-color: #f4f7f6;
            --card-border: #3949AB;
            --main-teal: #598586;
            --font-main: "KaiTi-CJK", "LXGW WenKai Lite", sans-serif;
            --nav-btn-bg: rgba(255,255,255,0.12);
            --nav-btn-border: rgba(255,255,255,0.28);
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            overflow: hidden; padding-top: 60px;
        }
        .mecc-nav-back { background: transparent !important; border: none !important; padding: 0 !important; font-size: 1.05rem !important; }

        .nav-controls {
            display: none; position: absolute; left: 50%; transform: translateX(-50%);
            height: 100%; align-items: center; justify-content: center; gap: 6px; pointer-events: none;
        }
        .nav-btn {
            pointer-events: auto; padding: 8px 14px; border: 1px solid var(--nav-btn-border);
            background: var(--nav-btn-bg); color: white; font-weight: bold; cursor: pointer;
            font-size: 0.95rem; transition: background 0.12s ease, border-color 0.12s ease;
            white-space: nowrap; border-radius: 6px; font-family: var(--font-main) !important;
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .nav-btn:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.45); }
        .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .nav-btn.center-btn {
            font-size: 1.08rem; background: rgba(255,255,255,0.18);
            border: 1.5px solid rgba(255,255,255,0.52); min-width: 220px;
        }
        .nav-btn.center-btn.is-milk { background: #0D47A1; }
        .nav-btn.center-btn.is-cookie { background: #E65100; }
        .back-btn-home, .controls, #status-bar { display: none !important; }

        #attendance-section {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 10px;
        }
        #attendance-section h1 { margin: 0 0 6px 0; font-size: 1.8rem; color: #3949AB; }
        .attendance-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 10vw, 120px), 1fr));
            gap: clamp(8px, 1.2vw, 16px); width: 100%; max-width: 1400px; padding: 10px; justify-content: center;
            overflow-y: auto; max-height: calc(100vh - 160px); align-content: start;
        }
        .student-card {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center;
            cursor: pointer; background: white; border-radius: 10px; padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 2px solid transparent;
            font-weight: bold; font-size: clamp(0.8rem, 1.3vw, 1.1rem); transition: all 0.18s ease; height: 100%;
        }
        .student-card img { width: clamp(50px, 6vw, 75px); height: clamp(50px, 6vw, 75px); border-radius: 50%; object-fit: cover; background: #eee; margin-bottom: 6px; }
        .student-card.absent { opacity: 0.3; filter: grayscale(100%); background: #eee; transform: scale(0.95); }
        .btn-finished {
            font-size: 1.5rem; padding: 12px 40px; background-color: #4CAF50; color: white; border:none; border-radius: 8px;
            font-weight: bold; cursor: pointer; white-space: nowrap; font-family: var(--font-main) !important;
            box-shadow: 0 4px 0 #388E3C; transition: 0.1s;
        }
        .btn-finished:active { transform: translateY(4px); box-shadow: none; }

        #pairing-section { display: none; flex-grow: 1; flex-direction: column; padding: 5px; position: relative; }
        #pairs-container {
            flex-grow: 1; display: grid; gap: 10px; padding: 5px 15px;
            justify-content: center; align-content: stretch; opacity: 0; transition: opacity 0.18s ease-in;
            grid-template-rows: repeat(auto-fit, minmax(0, 1fr)); contain: layout paint style;
        }
        .pair-card {
            display: flex; justify-content: space-between; align-items: center; background: white; padding: 5px;
            border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.07); border: 3px solid var(--card-border);
            overflow: hidden; height: 100%; position: relative; contain: layout paint;
        }
        .role-box {
            flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 8px; position: relative; gap: 4px; border: 3px solid transparent;
            transition: none; transform: translateZ(0);
        }
        .role-box img {
            width: min(14vh, 120px); height: min(14vh, 120px); border-radius: 50%; object-fit: cover; background: #eee;
            border: 4px solid white; box-shadow: 0 3px 8px rgba(0,0,0,0.08); display: block; z-index: 5;
        }
        .target-img { visibility: hidden; }
        .role-name {
            font-size: clamp(1.1rem, 2.4vh, 1.7rem); font-weight: bold; margin-top: 2px; line-height: 1; white-space: nowrap; z-index: 5; text-align: center;
        }
        .role-icon {
            position: absolute; top: 8px; left: 8px; font-size: clamp(1.35rem, 2.7vh, 1.9rem);
            line-height: 1; z-index: 8; pointer-events: none; user-select: none;
            opacity: 0.98; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.18));
        }
        .milk-side { background-color: var(--milk-color); color: #0D47A1; }
        .cookie-side { background-color: var(--cookie-color); color: #E65100; }

        #pairs-container.turn-milk .milk-side,
        #pairs-container.turn-cookie .cookie-side {
            background-color: #fff !important;
            box-shadow: 0 0 0 3px #4CAF50 inset;
            z-index: 2; opacity: 1;
        }
        #pairs-container.turn-milk .cookie-side,
        #pairs-container.turn-cookie .milk-side {
            opacity: 0.22;
        }

        .vs-text { font-size: clamp(0.8rem, 2vh, 1.2rem); color: #ccc; font-weight: bold; width: 40px; flex-shrink: 0; text-align: center; }

        .flying-avatar {
            position: absolute; width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid white; background:#eee;
            box-shadow: 0 6px 16px rgba(0,0,0,0.22); z-index: 9999; pointer-events: none; left: 0; top: 0;
            transform: translate3d(var(--start-x), var(--start-y), 0) scale(0.12);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
            transition-delay: var(--delay); will-change: transform;
        }
        .flying-avatar.fly { transform: translate3d(var(--target-x), var(--target-y), 0) scale(var(--target-scale)); }
        #animation-overlay {
            position: absolute; inset: 0; z-index: 9000; display: none; background: rgba(244,247,246,0.2); overflow: hidden; pointer-events: none;
        }

        @media (max-width: 768px) {
            body { padding-top: 54px !important; }
            .nav-controls { gap: 2px; }
            .nav-btn { padding: 7px 10px; font-size: 0.82rem; }
            .nav-btn svg { width: 14px; height: 14px; }
            .nav-btn.center-btn { min-width: 170px; font-size: 0.95rem; }
            .attendance-grid { padding-bottom: 20px; }
        }
    </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/tools.css" />
</head>
<body>
<div id="attendance-section">
        <h1 id="main-title">🐘 大象班今天谁没有来？</h1>
        <div class="attendance-grid" id="student-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #3949AB; font-size: 1.2rem;">
                正在连接云端获取大象班学生档案...
            </div>
        </div>
        <div style="margin-top: 15px; padding-bottom: 10px;">
            <button class="btn-finished" id="btn-start-group" style="display:none;" onclick="startGroupingWithAnimation()">点名完成，开始分组</button>
        </div>
    </div>

    <div id="pairing-section">
        <div id="animation-overlay"></div>
        <div id="pairs-container"></div>
    </div>

    <script>
        // 🌟 自动计算当前学年逻辑
        const now = new Date();
        const currentMonth = now.getMonth(); // 0 = 1月, 11 = 12月
        const currentYear = now.getFullYear();
        // 美国通常 8月(month>=7) 开始新学年
        const startYear = currentMonth >= 7 ? currentYear : currentYear - 1;
        const endYear = startYear + 1;
        const academicYearStr = `${startYear.toString().slice(-2)}-${endYear.toString().slice(-2)}`;

        // 🌟 动态拼接云端查询语句
        const PROJECT_ID = 'sow12t1i';
        const DATASET = 'production';
        const QUERY = encodeURIComponent(`*[_type == "student" && className == "elephant" && academicYear == "${academicYearStr}"] | order(_createdAt asc) { "id": _id, name, "img": avatar.asset->url }`);
        const API_URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

        let allStudents = [];
        let presentStudents = [], currentPairs = [], turnState = 0;

        const ICONS = {
            replay: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 0 15.3 6.4"/><polyline points="3 16 3 12 7 12"/><path d="M21 12A9 9 0 0 0 5.7 5.6"/><polyline points="21 8 21 12 17 12"/></svg>`,
            shuffle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>`,
            play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 6v12l10-6z"/></svg>`,
            switch: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`
        };

        window.onload = async () => {
            MECC_CONFIG.renderGlobalNav("大象班牛奶饼干分组");
            
            // 🌟 动态更新标题显示当前学年
            document.getElementById('main-title').innerHTML = `🐘 大象班今天谁没有来？ <span style="font-size:1.1rem; color:#888;">(${academicYearStr}学年)</span>`;

            const nav = document.querySelector('.mecc-global-nav');
            const controls = document.createElement('div');
            controls.className = 'nav-controls';
            controls.id = 'nav-logic-bar';
            controls.innerHTML = `
                <button class="nav-btn" onclick="resetToAttendance()">${ICONS.replay}<span>重新点名</span></button>
                <button class="nav-btn center-btn" id="nav-turn-btn" onclick="toggleTurn()">${ICONS.play}<span>准备好了吗？ 点我开始</span></button>
                <button class="nav-btn" onclick="reshuffleWithAnimation()">${ICONS.shuffle}<span>重新组合</span></button>
            `;
            nav.appendChild(controls);

            // 🌟 请求 Sanity 数据
            try {
                const res = await fetch(API_URL).then(r => r.json());
                allStudents = res.result || [];
                
                if(allStudents.length === 0) {
                    document.getElementById('student-grid').innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #e74c3c; font-size: 1.2rem;">${academicYearStr} 学年还没有大象班的学生哦，请去 Sanity 后台添加！</div>`;
                } else {
                    renderAttendance();
                    document.getElementById('btn-start-group').style.display = 'block';
                }
            } catch(e) {
                document.getElementById('student-grid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #e74c3c; font-size: 1.2rem;">获取学生名单失败，请检查网络。</div>';
            }
        };

        function renderAttendance() {
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';
            allStudents.forEach(student => {
                const div = document.createElement('div');
                div.className = `student-card ${student.isAbsent ? 'absent' : ''}`;
                const imgUrl = student.img || 'https://via.placeholder.com/150/EEEEEE/999999?text=🧑';
                div.innerHTML = `<img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/150/EEEEEE/999999?text=🧑'"><div>${student.name}</div>`;
                div.onclick = () => {
                    div.classList.toggle('absent');
                    student.isAbsent = div.classList.contains('absent');
                };
                grid.appendChild(div);
            });
        }

        function startGroupingWithAnimation() {
            presentStudents = allStudents.filter(s => !s.isAbsent);
            if (presentStudents.length < 2) return alert("人数不足！请至少保证 2 人在场。");
            document.getElementById('attendance-section').style.display = 'none';
            document.getElementById('pairing-section').style.display = 'flex';
            document.querySelector('.mecc-nav-title').style.display = 'none';
            document.getElementById('nav-logic-bar').style.display = 'flex';
            reshuffleWithAnimation();
        }

        function reshuffleWithAnimation() {
            updateTurnUI();
            let tempPool = [...presentStudents].sort(() => Math.random() - 0.5);
            currentPairs = [];
            while (tempPool.length >= 2) currentPairs.push([tempPool.pop(), tempPool.pop()]);
            if (tempPool.length === 1) currentPairs[0].push(tempPool.pop());
            renderPairsSmart();
            requestAnimationFrame(() => executeFlyingAnimation());
        }

        function renderPairsSmart() {
            const container = document.getElementById('pairs-container');
            container.innerHTML = '';
            container.style.opacity = '0';
            container.classList.remove('turn-milk', 'turn-cookie');
            const cols = currentPairs.length <= 6 ? 2 : (currentPairs.length <= 9 ? 3 : 4);
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            currentPairs.forEach(pair => {
                const img0 = pair[0].img || 'https://via.placeholder.com/150/EEEEEE/999999?text=🧑';
                const img1 = pair[1].img || 'https://via.placeholder.com/150/EEEEEE/999999?text=🧑';
                
                let html = `
                    <div class="pair-card">
                        <div class="role-box milk-side">
                            <span class="role-icon">🥛</span>
                            <img src="${img0}" id="target-img-${pair[0].id}" class="target-img">
                            <div class="role-name">${pair[0].name}</div>
                        </div>
                        <div class="vs-text">VS</div>
                        <div class="role-box cookie-side">
                            <span class="role-icon">🍪</span>
                            <img src="${img1}" id="target-img-${pair[1].id}" class="target-img">
                            <div class="role-name">${pair[1].name}</div>
                        </div>
                `;
                if (pair.length === 3) {
                    const img2 = pair[2].img || 'https://via.placeholder.com/150/EEEEEE/999999?text=🧑';
                    html += `
                        <div class="role-box cookie-side" style="margin-left:4px">
                            <span class="role-icon">🍪</span>
                            <img src="${img2}" id="target-img-${pair[2].id}" class="target-img">
                            <div class="role-name">${pair[2].name}</div>
                        </div>
                    `;
                }
                html += `</div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function executeFlyingAnimation() {
            const overlay = document.getElementById('animation-overlay');
            const pairsContainer = document.getElementById('pairs-container');
            overlay.innerHTML = '';
            overlay.style.display = 'block';
            pairsContainer.style.opacity = '1';

            const rect = document.getElementById('pairing-section').getBoundingClientRect();
            const centerX = rect.width / 2 - 32;
            const centerY = rect.height / 2 - 32;

            const targetsData = presentStudents.map(student => {
                const targetImg = document.getElementById(`target-img-${student.id}`);
                return targetImg ? { tRect: targetImg.getBoundingClientRect(), avatarUrl: student.img } : null;
            }).filter(Boolean);

            const frag = document.createDocumentFragment();
            const flyingEls = [];
            targetsData.forEach((item, i) => {
                const avatar = document.createElement('img');
                avatar.src = item.avatarUrl || 'https://via.placeholder.com/150/EEEEEE/999999?text=🧑';
                avatar.className = 'flying-avatar';
                const t = item.tRect;
                const targetX = t.left - rect.left + t.width / 2 - 32;
                const targetY = t.top - rect.top + t.height / 2 - 32;
                avatar.style.setProperty('--start-x', `${centerX}px`);
                avatar.style.setProperty('--start-y', `${centerY}px`);
                avatar.style.setProperty('--target-x', `${targetX}px`);
                avatar.style.setProperty('--target-y', `${targetY}px`);
                avatar.style.setProperty('--target-scale', `${t.width / 65}`);
                avatar.style.setProperty('--delay', `${i * 14}ms`);
                frag.appendChild(avatar);
                flyingEls.push(avatar);
            });
            overlay.appendChild(frag);
            requestAnimationFrame(() => {
                flyingEls.forEach(el => el.classList.add('fly'));
            });
            setTimeout(() => {
                overlay.style.display = 'none';
                document.querySelectorAll('.target-img').forEach(img => img.style.visibility = 'visible');
            }, 650 + Math.max(0, flyingEls.length - 1) * 14);
        }

        function toggleTurn() {
            const btn = document.getElementById('nav-turn-btn');
            const container = document.getElementById('pairs-container');
            if (turnState === 0 || turnState === 2) {
                turnState = 1;
                btn.classList.add('is-milk');
                btn.classList.remove('is-cookie');
                btn.innerHTML = `${ICONS.switch}<span>牛奶说，点我换饼干</span>`;
                container.classList.remove('turn-cookie');
                container.classList.add('turn-milk');
            } else {
                turnState = 2;
                btn.classList.add('is-cookie');
                btn.classList.remove('is-milk');
                btn.innerHTML = `${ICONS.switch}<span>饼干说，点我换牛奶</span>`;
                container.classList.remove('turn-milk');
                container.classList.add('turn-cookie');
            }
        }

        function updateTurnUI() {
            turnState = 0;
            const b = document.getElementById('nav-turn-btn');
            const container = document.getElementById('pairs-container');
            if (b) {
                b.classList.remove('is-milk', 'is-cookie');
                b.innerHTML = `${ICONS.play}<span>准备好了吗？ 点我开始</span>`;
            }
            container.classList.remove('turn-milk', 'turn-cookie');
        }

        function resetToAttendance() {
            document.getElementById('attendance-section').style.display = 'flex';
            document.getElementById('pairing-section').style.display = 'none';
            document.querySelector('.mecc-nav-title').style.display = 'block';
            document.getElementById('nav-logic-bar').style.display = 'none';
        }
    </script>
</body>
</html>
