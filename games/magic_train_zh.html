<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚂 魔法识字小火车</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
        }
        *, h1, .instruction, .block, .shadow-text, .bubble-text { font-family: var(--kaiti) !important; font-weight: bold; }
        .font-en { font-family: var(--wenkai) !important; }

        body {
            background: linear-gradient(to bottom, #a1e4ff 0%, #ffffff 70%, #76d476 70%, #45b645 100%);
            margin: 0; padding: 0; height: 100vh; overflow: hidden; text-align: center; user-select: none; position: relative;
        }

        /* 🌟 极简返回：仅箭头和文字，无背景 */
        .back-link-pure {
            position: fixed; top: 25px; left: 25px; text-decoration: none;
            font-size: 1.1rem; color: #333333; z-index: 999;
            display: flex; align-items: center; gap: 5px;
            transition: opacity 0.2s;
        }
        .back-link-pure:hover { opacity: 0.7; }
        .back-link-pure svg { width: 24px; height: 24px; }

        h1 { color: #ff5722; font-size: clamp(1.8rem, 4vh, 2.6rem); margin: 65px 0 5px; }
        .instruction { font-size: clamp(1.1rem, 2.5vh, 1.4rem); color: #333; margin-bottom: 10px; }
        
        #blocks-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; min-height: 100px; }
        .block {
            width: 80px; height: 80px; background: #ffeb3b; border-radius: 18px;
            font-size: 3rem; color: #d84315; display: flex; align-items: center; justify-content: center;
            cursor: grab; box-shadow: 0 6px 0 #fbc02d, 0 10px 15px rgba(0,0,0,0.1); transition: 0.2s;
        }

        #train-track-wrapper { position: absolute; bottom: 80px; width: 100%; transform: translateX(-120vw); }
        #train-container { display: flex; justify-content: center; align-items: flex-end; gap: 12px; }
        .locomotive { font-size: 6rem; position: relative; z-index: 5; order: 99; }
        .steam { position: absolute; top: -10px; right: 20px; width: 20px; height: 20px; background: rgba(255,255,255,0.8); border-radius: 50%; opacity: 0; animation: smoke 2s infinite; }
        @keyframes smoke { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

        .train-car { width: 110px; height: 85px; background: #03a9f4; border: 4px solid #fff; border-radius: 15px; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.4s; }
        .train-car::after, .train-car::before { content: ""; position: absolute; bottom: -16px; width: 22px; height: 22px; background: #333; border: 3px solid #ccc; border-radius: 50%; }
        .train-car::before { left: 15px; } .train-car::after { right: 15px; }

        .shadow-text { font-size: 3rem; color: rgba(255,255,255,0.3); }
        .train-car.filled { background: #4caf50; transform: scale(1.04); }
        .bubble { position: absolute; top: -120px; background: white; padding: 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 6px 15px rgba(0,0,0,0.15); opacity: 0; transform: translateY(15px); transition: 0.4s ease-out; pointer-events: none; min-width: 90px; }
        .bubble img { width: 85px; height: 85px; border-radius: 8px; object-fit: contain; margin-bottom: 4px; }
        .bubble-text { font-size: 1.2rem; color: #e91e63; }
        .bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent; }
        .train-car.filled .bubble { opacity: 1; transform: translateY(0); }
        .train-departing { transform: translateX(150vw) !important; transition: transform 3.5s ease-in !important; }
    </style>
</head>
<body>

    <a href="../teachers.html" class="back-link-pure">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="4"/>
            <path d="M65 50 H35 M45 35 L35 50 L45 65" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回工具台
    </a>

    <div id="game-wrapper">
        <h1 class="font-en">Magic Word Train</h1>
        <div class="instruction">请把中文四会字放到火车上。</div>
        <div id="blocks-container"></div>
        <div id="train-track-wrapper">
            <div id="train-container">
                <div class="locomotive" id="loco"><div class="steam"></div>🚂</div>
            </div>
        </div>
    </div>

<script>
    let synth = window.speechSynthesis;
    // 🌟 修复：跳转时立即停止语音
    window.addEventListener('beforeunload', () => { synth.cancel(); });
    window.addEventListener('pagehide', () => { synth.cancel(); });

    let fullWordList = [];
    let preferredVoice = null;

    function initVoices() {
        let voices = synth.getVoices();
        preferredVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Xiaoxiao') || v.name.includes('Google') || v.name.includes('Microsoft'))) 
                        || voices.find(v => v.lang.includes('zh')) || voices[0];
    }
    if (speechSynthesis.onvoiceschanged !== undefined) { speechSynthesis.onvoiceschanged = initVoices; }

    fetch('../data/sight_words.json').then(r => r.json()).then(data => {
        fullWordList = data.sight_words_list;
        initVoices();
        startGame();
    });

    function speak(text, callback) {
        synth.cancel();
        let u = new SpeechSynthesisUtterance(text);
        u.voice = preferredVoice; u.rate = 0.85; u.pitch = 1.1;
        if (callback) u.onend = callback;
        synth.speak(u);
    }

    function startGame() {
        const wrapper = document.getElementById('train-track-wrapper');
        const bc = document.getElementById('blocks-container');
        const tc = document.getElementById('train-container');
        wrapper.style.transition = 'none'; wrapper.classList.remove('train-departing');
        wrapper.style.transform = 'translateX(-120vw)'; void wrapper.offsetWidth; 
        bc.innerHTML = ''; tc.innerHTML = '<div class="locomotive"><div class="steam" style="animation-delay:0s"></div><div class="steam" style="animation-delay:0.6s"></div>🚂</div>';

        const selected = [...fullWordList].sort(() => 0.5 - Math.random()).slice(0, 4);
        selected.forEach(word => {
            const car = document.createElement('div');
            car.className = 'train-car'; car.dataset.char = word.char;
            const phrase = word.phrases.split(',')[0].trim();
            const imgPath = `../images/sight_words_phrases/${phrase}.webp`;
            car.innerHTML = `<div class="bubble"><img src="${imgPath}" onerror="this.style.display='none';"><span class="bubble-text">${phrase}</span></div><div class="shadow-text">${word.char}</div>`;
            car.ondragover = e => e.preventDefault(); car.ondrop = handleDrop;
            tc.insertBefore(car, tc.querySelector('.locomotive'));
        });

        setTimeout(() => {
            wrapper.style.transition = 'transform 2s cubic-bezier(0.45, 0.05, 0.55, 0.95)'; wrapper.style.transform = 'translateX(0)';
            selected.sort(() => 0.5 - Math.random()).forEach(word => {
                const b = document.createElement('div'); b.className = 'block'; b.draggable = true; b.innerText = word.char;
                b.ondragstart = e => e.dataTransfer.setData('text', word.char); bc.appendChild(b);
            });
        }, 400);
    }

    function handleDrop(e) {
        const char = e.dataTransfer.getData('text');
        if (char === this.dataset.char && !this.classList.contains('filled')) {
            this.classList.add('filled');
            document.querySelectorAll('.block').forEach(b => { if(b.innerText === char) b.style.visibility = 'hidden'; });
            speak(`${char}。${this.querySelector('.bubble-text').innerText}的${char}。`, () => { checkWin(); });
        }
    }

    function checkWin() {
        if (document.querySelectorAll('.train-car.filled').length === 4) {
            setTimeout(() => {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                speak("小火车出发啦！", () => {
                    document.getElementById('train-track-wrapper').classList.add('train-departing');
                    setTimeout(startGame, 4000); 
                });
            }, 500);
        }
    }
</script>
</body>
</html>
