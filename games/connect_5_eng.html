<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥛 Connect 5 🍪</title>

<link rel="icon" type="image/png" href="../favicon.png">

<link rel="stylesheet" href="../css/style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />

<style>
    body { 
        background-color: #fff9ea !important; margin: 0 !important; min-height: 100vh; overflow-y: auto; 
        display: flex !important; justify-content: center; align-items: center; position: relative;
    }

    .back-btn-home {
        position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none;
        font-size: 1.2rem; font-weight: bold; z-index: 50; background: rgba(0, 0, 0, 0.05); 
        padding: 8px 15px; border-radius: 20px; transition: transform 0.2s, background 0.2s;
    }
    .back-btn-home:hover { transform: scale(1.05); background: rgba(0, 0, 0, 0.1); }

    #setup-view {
        display: flex; flex-direction: column; align-items: center; background: white; padding: 24px 24px 20px;
        border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;
        width: min(680px, 92vw);
    }
    #setup-view h1 { color: #333; margin: 0 0 6px 0; font-size: 28px; }
    #setup-view .instructions { color: #666; margin: 0 0 14px 0; font-size: 14px; font-weight: bold; }
    
    .controls { margin-bottom: 12px; display: flex; gap: 10px; justify-content: center; }
    .controls .btn {
        padding: 8px 20px; font-size: 1rem; background-color: #ecf0f1; color: #555;
        border: 2px solid #bdc3c7; border-radius: 50px; cursor: pointer; font-weight: bold; transition: transform 0.2s, background-color 0.2s; 
    }
    .controls .btn:hover { transform: scale(1.05); background-color: #dcdde1; }
    .controls .btn.start-btn { background-color: #4CAF50; color: white; border-color: #4CAF50; }
    .controls .btn.start-btn:hover { background-color: #45a049; }

    #char-grid {
        display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px;
        padding: 16px; background: #f8f9fa; border-radius: 15px; width: 100%; border: 2px dashed #ccc;
    }

    .char-card {
        width: 100%; height: 48px; display: flex; justify-content: center; align-items: center;
        font-size: 1.8rem; background-color: white; color: #333; border-radius: 10px;
        cursor: pointer; transition: all 0.2s; border: 3px solid transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif !important; 
    }
    .char-card.selected { background-color: #74b9ff; color: white; border: 3px solid #fbc531; transform: scale(1.1); z-index: 2; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }

    #game-view { display: none; width: 100%; max-width: 1400px; flex-direction: row; justify-content: space-between; align-items: center; padding: 20px; position: relative; }

    .side-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.3; transform: scale(0.85); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .side-panel .logo { font-size: 110px; filter: grayscale(80%); transition: all 0.4s; }
    .side-panel .name { font-size: 36px; font-weight: bold; margin-top: 15px; color: #777; transition: all 0.4s; }
    .side-panel.active { opacity: 1; transform: scale(1.1); }
    .side-panel.active .logo { filter: grayscale(0%); }
    .side-panel.p1.active .logo { filter: drop-shadow(0 0 25px #74b9ff); }
    .side-panel.p1.active .name { color: #0984e3; text-shadow: 0 0 10px rgba(116, 185, 255, 0.5); }
    .side-panel.p2.active .logo { filter: drop-shadow(0 0 25px #fbc531); }
    .side-panel.p2.active .name { color: #e1b12c; text-shadow: 0 0 10px rgba(251, 197, 49, 0.5); }

    #board-container { flex: 2; display: flex; flex-direction: column; align-items: center; position: relative; }
    #board { display: grid; grid-template-columns: repeat(9, 65px); gap: 8px; background-color: #dcdde1; padding: 12px; border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
    
    .cell { 
        width: 65px; height: 65px; background-color: white; border-radius: 8px; display: flex; justify-content: center; align-items: center; 
        font-size: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); user-select: none; transition: all 0.2s ease; position: relative; 
        font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif !important; 
    }
    .cell:hover { transform: scale(1.08); background-color: #fdfdfd; z-index: 2; }
    .cell.p1 { background-color: #74b9ff; color: white; transform: scale(0.95); box-shadow: inset 0 4px 8px rgba(0,0,0,0.15); }
    .cell.p1::after { content: '🥛'; position: absolute; bottom: 2px; right: 2px; font-size: 16px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); font-family: sans-serif !important; }
    .cell.p2 { background-color: #fbc531; color: white; transform: scale(0.95); box-shadow: inset 0 4px 8px rgba(0,0,0,0.15); }
    .cell.p2::after { content: '🍪'; position: absolute; bottom: 2px; right: 2px; font-size: 16px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); font-family: sans-serif !important; }
    .cell.p1:hover, .cell.p2:hover { transform: scale(1.02); }
    .cell.winning-cell { z-index: 10; border: 3px solid #ff4757; animation: winPulse 1.2s infinite; }
    
    @keyframes winPulse { 0% { transform: scale(1.05); box-shadow: 0 0 10px 2px #ff4757; } 50% { transform: scale(1.15); box-shadow: 0 0 20px 6px #ff4757; } 100% { transform: scale(1.05); box-shadow: 0 0 10px 2px #ff4757; } }

    /* 🌟 改名：改为 return-setup-btn，防止和 style.css 冲突 */
    .return-setup-btn { padding: 8px 25px; font-size: 16px; background-color: transparent; color: #999; border: 2px solid #ddd; border-radius: 30px; cursor: pointer; margin-top: 30px; transition: all 0.3s; font-weight: bold; font-family: "LXGW WenKai Lite", system-ui, sans-serif !important; }
    .return-setup-btn:hover { background-color: #ecf0f1; color: #555; border-color: #ccc; }

    #trophy-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #trophy-overlay.show { opacity: 1; pointer-events: auto; }
    .trophy-icon { font-size: 150px; transform: scale(0); filter: drop-shadow(0 0 40px gold); }
    #trophy-overlay.show .trophy-icon { animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
    @keyframes popIn { 0% { transform: scale(0) rotate(-20deg); } 80% { transform: scale(1.2) rotate(10deg); } 100% { transform: scale(1) rotate(0deg); } }
    .overlay-text { color: white; font-size: 50px; font-weight: bold; margin: 30px 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
    .close-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background-color: #f1c40f; color: #333; border: none; border-radius: 40px; cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.4); margin-top: 20px; }
    .close-btn:hover { background-color: #f39c12; transform: scale(1.05) translateY(-3px); }

    @media (max-width: 768px) {
        /* 返回按钮：纯文字 */
        .back-btn-home {
            background: none !important; padding: 4px 0 !important;
            font-size: 0.95rem !important; top: 14px !important; left: 16px !important;
            border-radius: 0 !important; color: #555 !important;
        }

        /* 选词界面 */
        #setup-view { padding: 20px 12px !important; margin-top: 44px; width: 100%; box-sizing: border-box; }
        #setup-view h1 { font-size: 1.8rem !important; }
        #setup-view .instructions { font-size: 0.95rem !important; margin-bottom: 16px !important; }
        .controls { gap: 8px !important; flex-wrap: wrap; justify-content: center; }
        .controls .btn { padding: 8px 16px !important; font-size: 1rem !important; }
        #char-grid {
            grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)) !important;
            gap: 6px !important; padding: 12px !important;
        }
        .char-card { height: 40px !important; font-size: 1.3rem !important; }

        /* 游戏界面：竖版布局 */
        #game-view {
            flex-direction: column !important;
            align-items: center !important;
            padding: 8px !important;
            gap: 8px !important;
        }

        /* 玩家面板：横向小条 */
        .side-panel {
            flex-direction: row !important;
            transform: scale(1) !important;
            opacity: 1 !important;
            gap: 10px !important;
            padding: 6px 16px !important;
            border-radius: 30px !important;
            background: rgba(0,0,0,0.04) !important;
            width: 90% !important;
            justify-content: center !important;
        }
        .side-panel .logo { font-size: 2rem !important; filter: grayscale(60%) !important; }
        .side-panel .name { font-size: 1.2rem !important; margin-top: 0 !important; }
        .side-panel.active { transform: scale(1.03) !important; }
        .side-panel.p1.active .logo { filter: drop-shadow(0 0 8px #74b9ff) !important; }
        .side-panel.p2.active .logo { filter: drop-shadow(0 0 8px #fbc531) !important; }

        /* 棋盘容器 */
        #board-container { flex: none !important; width: 100% !important; }

        /* 棋盘格子：用 vw 自适应 */
        #board {
            grid-template-columns: repeat(9, calc((100vw - 60px) / 9)) !important;
            gap: 3px !important;
            padding: 6px !important;
        }
        .cell {
            width: calc((100vw - 60px) / 9) !important;
            height: calc((100vw - 60px) / 9) !important;
            font-size: calc((100vw - 60px) / 9 * 0.55) !important;
            border-radius: 4px !important;
        }
        .cell::after { font-size: 10px !important; }

        .return-setup-btn { margin-top: 10px !important; font-size: 0.9rem !important; padding: 6px 18px !important; }
    }
</style>
</head>
<body>

    <a href="../parents.html" class="back-btn-home">⬅️ Back to Parents Hub</a>

    <div id="setup-view">
        <h1>🥛 Connect 5 🍪</h1>
        <div class="instructions">
            Rule: <span style="color: #ff4757;">Get 5 in a row to win!</span><br>
            <span style="font-size: 14px; font-weight: normal; color: #888;">(Select characters to practice. Auto-saves your last selection.)</span>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="selectAll()">Select All</button>
            <button class="btn" onclick="clearAll()">Clear</button>
            <button class="btn start-btn" onclick="startGame()">Start Game</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-view">
        <div class="side-panel p1" id="panel-1"><div class="logo">🥛</div><div class="name">Milk</div></div>
        <div id="board-container">
            <div id="board"></div>
            <button class="return-setup-btn" onclick="showSetup()">← Back to Setup</button>
        </div>
        <div class="side-panel p2" id="panel-2"><div class="logo">🍪</div><div class="name">Cookie</div></div>
    </div>

    <div id="trophy-overlay"><div class="trophy-icon">🏆</div><div class="overlay-text" id="overlay-msg">Congratulations!</div><button class="close-btn" onclick="closeTrophy()">View Board</button></div>

<script>
    const rows = 7; const cols = 9;
    let boardState = []; let boardWords = []; let currentPlayer = 1; let hasShownTrophy = false; 

    const allChars = [
        '四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太',
        '六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也',
        '八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有',
        '要','是','了','去'
    ];
    
    function loadSavedWords() { return JSON.parse(localStorage.getItem('connect5ParentWords')) || []; }
    function saveWords(wordsArray) { localStorage.setItem('connect5ParentWords', JSON.stringify(wordsArray)); }

    window.onload = () => {
        const grid = document.getElementById('char-grid');
        const savedWords = loadSavedWords();

        allChars.forEach(char => {
            const card = document.createElement('div');
            card.className = 'char-card';
            card.innerText = char;
            if (savedWords.includes(char)) { card.classList.add('selected'); }
            card.onclick = () => card.classList.toggle('selected');
            grid.appendChild(card);
        });
    };

    function selectAll() { document.querySelectorAll('.char-card').forEach(card => card.classList.add('selected')); }
    function clearAll() { document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected')); }
    function showSetup() { document.getElementById('game-view').style.display = 'none'; document.getElementById('setup-view').style.display = 'flex'; }

    function startGame() {
        const selectedElements = document.querySelectorAll('.char-card.selected');
        let words = Array.from(selectedElements).map(el => el.innerText);
        
        if (words.length === 0) { alert("Please select at least one character!"); return; }

        saveWords(words); 

        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';

        boardWords = [];
        while(boardWords.length < (rows * cols)) { boardWords = boardWords.concat(words); }
        boardWords = boardWords.slice(0, rows * cols); 

        for (let i = boardWords.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [boardWords[i], boardWords[j]] = [boardWords[j], boardWords[i]];
        }

        boardState = []; currentPlayer = 1; hasShownTrophy = false;
        for (let r = 0; r < rows; r++) { let row = []; for (let c = 0; c < cols; c++) { row.push(0); } boardState.push(row); }
        renderBoard(); evaluateGameState();
    }

    function claimCell(r, c) {
        let currentState = boardState[r][c];
        if (currentState === 0) { boardState[r][c] = currentPlayer; currentPlayer = currentPlayer === 1 ? 2 : 1; } 
        else if (currentState === 1) { boardState[r][c] = 2; } 
        else if (currentState === 2) { boardState[r][c] = 0; }
        renderBoard(); evaluateGameState();
    }

    function renderBoard() {
        const boardEl = document.getElementById('board'); boardEl.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let cell = document.createElement('div'); cell.className = 'cell'; cell.id = `cell-${r}-${c}`; 
                if (boardState[r][c] === 1) cell.classList.add('p1');
                if (boardState[r][c] === 2) cell.classList.add('p2');
                cell.innerText = boardWords[r * cols + c];
                cell.addEventListener('click', () => claimCell(r, c));
                boardEl.appendChild(cell);
            }
        }
    }

    function evaluateGameState() {
        const panel1 = document.getElementById('panel-1'); const panel2 = document.getElementById('panel-2');
        let winCells1 = checkWinForPlayer(1); let winCells2 = checkWinForPlayer(2);
        panel1.classList.remove('active'); panel2.classList.remove('active');
        if (!winCells1 && !winCells2) { hasShownTrophy = false; if (currentPlayer === 1) { panel1.classList.add('active'); } else { panel2.classList.add('active'); } return; }
        if (winCells1) { panel1.classList.add('active'); applyWinHighlight(winCells1); if (!hasShownTrophy) showTrophy("🥛 Milk"); return; }
        if (winCells2) { panel2.classList.add('active'); applyWinHighlight(winCells2); if (!hasShownTrophy) showTrophy("🍪 Cookie"); return; }
    }

    function checkWinForPlayer(player) {
        const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (boardState[r][c] !== player) continue;
                for (let [dr, dc] of directions) {
                    let count = 1; let winningCells = [[r, c]]; let nr = r + dr, nc = c + dc;
                    while (nr >= 0 && nr < rows && nc >= 0 && nc < cols && boardState[nr][nc] === player) { count++; winningCells.push([nr, nc]); nr += dr; nc += dc; }
                    if (count >= 5) return winningCells; 
                }
            }
        }
        return null;
    }

    function applyWinHighlight(cells) { cells.forEach(([r, c]) => { let cellEl = document.getElementById(`cell-${r}-${c}`); if (cellEl) cellEl.classList.add('winning-cell'); }); }
    function showTrophy(winnerName) {
        const overlay = document.getElementById('trophy-overlay'); const msg = document.getElementById('overlay-msg');
        msg.style.color = winnerName.includes("Milk") ? "#74b9ff" : "#fbc531"; msg.innerHTML = `🏆 ${winnerName} Wins! 🏆`;
        overlay.classList.add('show'); hasShownTrophy = true; 
    }
    function closeTrophy() { document.getElementById('trophy-overlay').classList.remove('show'); }
</script>

</body>
</html>
