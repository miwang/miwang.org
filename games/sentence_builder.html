<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="head-title">句子排排队 - MECC</title>
    
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/sentences_data.js"></script>
    <style>
        :root {
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
        }

        /* 🌟 核心修复 1：统一设置中文默认 UI 字体为楷体 */
        body, .play-back-btn, .btn-action, .reading-hint, .tag-row-label { 
            font-family: var(--kaiti) !important; 
        }

        .font-zh { font-family: var(--kaiti) !important; }
        .font-en { font-family: var(--wenkai) !important; }

        body { 
            background-color: #fff9ea; margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh; width: 100vw;
            position: relative; padding-top: 60px;
        }

        #list-view { display: flex; flex-direction: column; min-height: calc(100vh - 60px); width: 100%; }
        .list-header { text-align: center; padding: 15px 0 10px 0; flex-shrink: 0; }

        #gallery-view {
            flex: 1; display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px; padding: 15px 40px 40px; box-sizing: border-box;
            align-content: start;
        }
        .sentence-card {
            background: white; border: 4px solid var(--main-teal); border-radius: 22px;
            overflow: hidden; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07); display: flex; flex-direction: column;
        }
        .sentence-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }

        .card-img-wrapper { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #fdfdfd; border-bottom: 2px solid #eee; flex-shrink: 0; }
        .sentence-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .sentence-card .card-info { padding: 12px 10px; text-align: center; font-size: 1.1rem; font-weight: bold; color: #333; background: white; flex: 1; display: flex; align-items: center; justify-content: center; }

        #play-view { display: none; position: fixed; top:0; left:0; height: 100dvh; width: 100vw; flex-direction: column; align-items: center; padding: 6px 15px 10px; box-sizing: border-box; background: #fff9ea; z-index: 10000; overflow: hidden; }
        
        .play-top-bar { width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box; flex-shrink: 0; }
        
        .play-back-btn { 
            color: #444; text-decoration: none; font-size: 1.1rem; font-weight: bold; 
            background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            padding: 6px 20px; border-radius: 30px; border: 1.5px solid rgba(255,255,255,0.5); 
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; 
            /* 🌟 核心修复：移除了写死的 font-family: var(--wenkai); */
        }
        .play-back-btn:hover { background: rgba(255,255,255,0.8); transform: scale(1.02); }
        .circle-arrow-icon { width: 20px; height: 20px; }

        .btn-action { background: #2ecc71; color: white; border: none; padding: 8px 28px; border-radius: 40px; cursor: pointer; font-size: 1.3rem; font-weight: bold; box-shadow: 0 4px 0 #27ae60; }

        .play-layout { 
            display: flex; flex-direction: column; width: 100%; flex: 1; gap: 15px; 
            padding: 10px 20px; box-sizing: border-box; min-height: 0; overflow: hidden;
        }
        .desktop-top-row { 
            display: flex; flex-direction: row; flex: 1; gap: 15px; min-height: 0; justify-content: center; width: 100%;
        }
        .side-pool { 
            flex: 1.2 1 200px; max-width: 380px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; overflow-y: auto; overflow-x: hidden;
            padding: 10px; box-sizing: border-box;
        }
        .image-stage { 
            flex: 2.2 1 500px; max-width: 1200px; 
            background: white no-repeat center center / contain; 
            border: 5px solid var(--main-teal); border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .drop-zone-wrapper { flex: 0 0 auto; width: 100%; display: flex; justify-content: center; }
        .drop-zone {
            height: 14vh; min-height: 90px; width: 100%; max-width: 1800px; 
            background: rgba(89, 133, 134, 0.08); border: 3px dashed var(--main-teal); border-radius: 25px; 
            display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; 
            gap: 8px; padding: 10px 15px; box-sizing: border-box; transition: background 0.2s; overflow: hidden; 
        }
        .drop-zone.active-hover { background: rgba(89, 133, 134, 0.25); border-style: solid; }

        .word-brick {
            padding: clamp(10px, 1.5vh, 20px) clamp(16px, 2.5vw, 45px); 
            border-radius: 20px; 
            font-size: clamp(1.5rem, 3vw + 0.5rem, 4.5rem); 
            font-weight: bold; color: #1e2e46; cursor: pointer;
            box-shadow: 0 10px 0 rgba(0,0,0,0.12); margin: 0; white-space: nowrap; flex-shrink: 0;
            user-select: none; touch-action: none; position: relative; transition: font-size 0.2s, padding 0.2s;
            max-width: 100%; box-sizing: border-box;
        }
        .word-brick.dragging { opacity: 0.6; transform: scale(1.1); z-index: 99999; position: fixed !important; pointer-events: none; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transition: none; }

        #reading-overlay { position: fixed; inset: 0; background: #fff9ea; z-index: 10005; display: none; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        
        .reading-char-box {
            display: flex; justify-content: center; align-items: center; aspect-ratio: 1 / 1;
            border: 2px solid rgba(0,0,0,0.05); box-sizing: border-box; border-radius: 12px;
            color: #1e2e46; font-weight: bold; transition: all 0.2s;
        }
        .punctuation-box { border: none !important; background: transparent !important; box-shadow: none !important; color: #888 !important; }

        .reading-hint { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            font-size: 1.2rem; color: #666; letter-spacing: 2px; 
            background: rgba(255, 255, 255, 0.85); padding: 8px 24px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); pointer-events: none; animation: pulse 2s infinite; 
            white-space: nowrap; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .tts-btn {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px); border: 3px solid var(--main-teal); border-radius: 50%;
            width: 60px; height: 60px; font-size: 30px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s, background 0.2s; z-index: 10006;
        }

        @media (max-width: 768px) {
            body { padding-top: 56px; }
            .tts-btn { top: 10px; left: 10px; width: 45px; height: 45px; font-size: 22px; border-width: 2px; }
            .reading-hint { font-size: 0.9rem; bottom: 20px; padding: 6px 18px; }
            .list-header { padding: 12px 16px 8px !important; }

            #gallery-view { grid-template-columns: 1fr !important; gap: 14px !important; padding: 10px 16px 24px !important; }
            .card-img-wrapper { aspect-ratio: 2 / 1 !important; }
            .sentence-card img { object-position: center center !important; }
            .sentence-card .card-info { padding: 10px !important; font-size: 1.1rem !important; }

            #play-view { padding: 4px 8px 6px !important; height: 100dvh !important; justify-content: flex-start !important; }
            .play-top-bar { height: 38px !important; padding: 0 4px !important; }
            .play-back-btn { padding: 4px 12px; font-size: 0.95rem; }
            .btn-action { padding: 5px 12px !important; font-size: 0.8rem !important; border-radius: 20px !important; }

            .play-layout { display: flex; flex-direction: column; padding: 5px; gap: 5px; }
            .desktop-top-row { display: contents; } 
            .image-stage { order: 1; flex: 0 0 28dvh !important; border-radius: 16px !important; border-width: 3px !important; min-height: 28dvh; }
            .drop-zone-wrapper { order: 2; padding: 0; }
            .drop-zone { height: 10vh !important; min-height: 70px !important; padding: 5px 10px !important; gap: 4px !important; border-radius: 16px !important; }
            #word-pool-left { order: 3; flex-direction: row; flex-wrap: wrap; padding: 5px; max-width: none; flex: 0 0 auto; min-height: unset; justify-content: center; overflow: visible; }
            #word-pool-right { order: 4; flex-direction: row; flex-wrap: wrap; padding: 0 5px 5px; max-width: none; flex: 0 0 auto; min-height: unset; justify-content: center; overflow: visible; }

            .word-brick { font-size: clamp(1.2rem, 4.5vw, 2rem) !important; padding: 8px 16px !important; border-radius: 12px !important; margin: 4px !important; box-shadow: 0 5px 0 rgba(0,0,0,0.12) !important; }
        }

        .tag-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; padding: 0 20px; }
        .tag-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; }
        .tag-row-label { font-size: 0.7rem; color: #aaa; margin-right: 4px; align-self: center; white-space: nowrap; letter-spacing: 1px; }
        .tag-pill { padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; border: 2px solid transparent; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tag-pill.theme { background: #e8f5f5; color: #4a7a7b; border-color: #c5dfdf; }
        .tag-pill.theme:hover { background: #d0ecec; border-color: var(--main-teal); }
        .tag-pill.theme.active { background: var(--main-teal); color: white; border-color: var(--main-teal); }
        .tag-pill.keyword { background: #fef9e7; color: #9a7c1e; border-color: #f5e6a3; }
        .tag-pill.keyword:hover { background: #fdf0c8; border-color: #f3b236; }
        .tag-pill.keyword.active { background: #f3b236; color: #1e2e46; border-color: #d4922a; }
        .tag-pill.all { background: #f0f0f0; color: #666; border-color: #ddd; }
        .tag-pill.all:hover { background: #e4e4e4; }
        .tag-pill.all.active { background: #555; color: white; border-color: #555; }

        @keyframes correctFlash { 0% { box-shadow: 0 0 0 0 rgba(243,178,54,0); background: transparent; } 50% { box-shadow: 0 0 60px 20px rgba(89,133,134,0.8); background: rgba(89,133,134,0.1); } 100% { box-shadow: 0 0 0 0 rgba(243,178,54,0); background: transparent; } }
        .drop-zone.correct-flash { animation: correctFlash 1s ease-in-out; }
    </style>
</head>
<body>

    <div id="list-view">
        <div class="list-header">
            <div class="tag-bar" id="tag-bar"></div>
        </div>
        <div id="gallery-view"></div>
    </div>

    <div id="play-view">
        <div class="play-top-bar">
            <div class="play-back-btn" id="btn-close" onclick="closePlay()">
                <svg class="circle-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="16" y1="12" x2="8" y2="12"></line>
                    <polyline points="12 8 8 12 12 16"></polyline>
                </svg>
                <span id="close-text">返回列表</span>
            </div>
            <div id="success-controls" style="visibility: hidden; display: flex;">
                <button class="btn-action" id="btn-read-mode" onclick="enterReadingMode()">📖 全屏读字</button>
            </div>
        </div>
        <div class="play-layout">
            <div class="desktop-top-row">
                <div id="word-pool-left" class="side-pool"></div>
                <div class="image-stage" id="main-image"></div>
                <div id="word-pool-right" class="side-pool"></div>
            </div>
            <div class="drop-zone-wrapper">
                <div class="drop-zone" id="drop-zone"></div>
            </div>
        </div>
    </div>

    <div id="reading-overlay" onclick="this.style.display='none'">
        <button class="tts-btn" onclick="event.stopPropagation(); readCurrentSentence();" title="朗读句子">🔊</button>
        <div id="full-container" style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center;"></div>
        <div class="reading-hint" id="ui-hint">点击任意位置返回</div>
    </div>

    <script>
        const LANG = MECC_CONFIG.getLang();
        const t = {
            zh: { title: "句子排排队", all: "全部", byWord: "按字词：", backList: "返回列表", readMode: "📖 全屏读字", hint: "点击任意位置返回", empty: "没有匹配的句子", error: "未能加载数据，请检查配置" },
            en: { title: "Sentence Builder", all: "All", byWord: "By Word:", backList: "Back to List", readMode: "📖 Full Screen Read", hint: "Click anywhere to return", empty: "No sentences match.", error: "Failed to load data." }
        }[LANG];

        const listView = document.getElementById('list-view');
        const playView = document.getElementById('play-view');
        const leftPool = document.getElementById('word-pool-left');
        const rightPool = document.getElementById('word-pool-right');
        const zone = document.getElementById('drop-zone');
        let currentLevelIdx = 0, currentData = null;
        let activeThemeTag = null, activeKeyword = null;
        
        let allSentences = []; 
        let currentFilteredList = [];

        // --- 🌟 三级朗读降级系统（带 iOS 解锁） ---
        let globalAudio = new Audio();

        async function playUnifiedAudio(text) {
            if (!text) return;
            
            // 💡 iOS 防拦截核心：同步触发一个静音的播放，拿到系统播放授权
            globalAudio.pause();
            globalAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
            globalAudio.play().catch(() => {});

            const localPath = `../audio/sentences/${encodeURIComponent(text)}.mp3`;
            const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;

            try {
                const localRes = await fetch(localPath, { method: 'HEAD' }).catch(() => null);
                if (localRes && localRes.ok && localRes.headers.get('content-type') && localRes.headers.get('content-type').includes('audio')) {
                    globalAudio.src = localPath;
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            try {
                const azureRes = await fetch(azureUrl).catch(() => null);
                if (azureRes && azureRes.ok && azureRes.headers.get('content-type') && azureRes.headers.get('content-type').includes('audio')) {
                    const audioBlob = await azureRes.blob();
                    globalAudio.src = URL.createObjectURL(audioBlob);
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN'; msg.rate = 0.85; msg.pitch = 1.1;
            window.speechSynthesis.speak(msg);
        }

        window.onload = () => {
            MECC_CONFIG.renderGlobalNav(t.title);
            document.getElementById('head-title').innerText = t.title + " - MECC";
            
            document.getElementById('close-text').innerText = t.backList;
            document.getElementById('btn-read-mode').innerText = t.readMode;
            document.getElementById('ui-hint').innerText = t.hint;

            // 🌟 核心修复 2：英文环境动态添加英文字体类
            if (LANG === 'en') {
                const enElements = ['close-text', 'btn-read-mode', 'ui-hint'];
                enElements.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('font-en');
                });
            }

            fetch(`../data/sentences.json?v=${new Date().getTime()}`)
                .then(res => res.json())
                .then(data => {
                    allSentences = (data.sentence_list || []).map(item => ({
                        words: item.words ? item.words.split(/[,，、]/).map(w => w.trim()).filter(w => w) : [],
                        punctuation: item.punctuation || "", image: item.image || "",
                        tags: item.tags ? item.tags.split(/[,，、]/).map(t => t.trim()).filter(t => t) : []
                    }));
                    initGallery();
                }).catch(err => { document.getElementById('gallery-view').innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#e74c3c;">${t.error}</div>`; });
        };

        function splitFonts(text) { return text.split('').map(char => `<span class="${/[a-zA-Z0-9\s\p{P}]/u.test(char) ? 'font-en' : 'font-zh'}">${char}</span>`).join(''); }

        function getColorForWord(word) {
            if (typeof colorDictionary !== 'undefined' && colorDictionary[word]) return colorDictionary[word];
            let hash = 0; for (let i = 0; i < word.length; i++) hash = word.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash % 360)}, 65%, 88%)`; 
        }

        function buildTagBar() {
            const themeKeys = typeof tagDefinitions !== 'undefined' ? Object.keys(tagDefinitions) : [];
            const kw = typeof keywordTags !== 'undefined' ? keywordTags : [];
            const bar = document.getElementById('tag-bar');
            
            let allText = LANG === 'en' 
                ? `All <span class="font-zh" style="font-size:0.85rem;opacity:0.75;margin-left:4px;">「全部」</span>`
                : `「全部」<span class="font-en" style="font-size:0.65rem;opacity:0.75;margin-left:2px;">All</span>`;

            let html = `<div class="tag-row"><div class="tag-pill all ${!activeThemeTag && !activeKeyword ? 'active' : ''}" onclick="clearFilters()" style="display:flex;align-items:center;">${allText}</div>`;
            
            themeKeys.forEach(tag => {
                const def = tagDefinitions[tag];
                let innerText = LANG === 'en' 
                    ? `${def.en} <span class="font-zh" style="font-size:0.85rem;opacity:0.75;margin-left:4px;">「${def.zh}」</span>`
                    : `「${def.zh}」<span class="font-en" style="font-size:0.65rem;opacity:0.75;margin-left:2px;">${def.en}</span>`;
                html += `<div class="tag-pill theme ${activeThemeTag === tag ? 'active' : ''}" onclick="toggleThemeTag('${tag}')" style="display:flex;align-items:center;">${innerText}</div>`;
            });
            
            // 🌟 核心修复 3：去掉 tag-row-label 上的写死字体
            html += `</div><div class="tag-row"><span class="tag-row-label ${LANG === 'en' ? 'font-en' : ''}">${t.byWord}</span>`;
            
            kw.forEach(k => {
                let innerText = LANG === 'en' 
                    ? `${k.en} <span class="font-zh" style="font-size:0.85rem;opacity:0.75;margin-left:4px;">「${k.zh}」</span>`
                    : `「${k.zh}」<span class="font-en" style="font-size:0.65rem;opacity:0.75;margin-left:2px;">${k.en}</span>`;
                html += `<div class="tag-pill keyword ${activeKeyword === k.zh ? 'active' : ''}" onclick="toggleKeyword('${k.zh}')" style="display:flex;align-items:center;">${innerText}</div>`;
            });
            html += `</div>`;
            bar.innerHTML = html;
        }

        function toggleThemeTag(tag) { activeThemeTag = activeThemeTag === tag ? null : tag; activeKeyword = null; refreshGallery(); }
        function toggleKeyword(kw) { activeKeyword = activeKeyword === kw ? null : kw; activeThemeTag = null; refreshGallery(); }
        function clearFilters() { activeThemeTag = null; activeKeyword = null; refreshGallery(); }

        function refreshGallery() {
            buildTagBar();
            currentFilteredList = allSentences.filter(s => {
                let matchT = true; if (activeThemeTag) matchT = s.tags && s.tags.includes(activeThemeTag);
                let matchK = true; if (activeKeyword) {
                    const kwDef = (typeof keywordTags !== 'undefined' ? keywordTags : []).find(k => k.zh === activeKeyword);
                    matchK = kwDef && kwDef.match ? kwDef.match.some(m => s.words.includes(m)) : (s.words && s.words.includes(activeKeyword));
                }
                return matchT && matchK;
            });
            renderGalleryCards(currentFilteredList);
        }

        function renderGalleryCards(list) {
            const gallery = document.getElementById('gallery-view');
            if (list.length === 0) { gallery.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px 0;">${t.empty}</div>`; return; }
            gallery.innerHTML = list.map((item, i) => `
                <div class="sentence-card" onclick="startLevel(${i})">
                    <div class="card-img-wrapper"><img src="${item.image}" onerror="this.style.display='none'"></div>
                    <div class="card-info font-zh">${item.words.join('')}${item.punctuation || ''}</div>
                </div>
            `).join('');
        }

        function initGallery() {
            listView.style.display = 'flex'; playView.style.display = 'none'; refreshGallery();
            window.addEventListener('resize', () => { if (playView.style.display === 'flex') autoSizeZone(); });
        }

        function startLevel(index) {
            currentData = currentFilteredList[index];
            if (!currentData) return;
            listView.style.display = 'none'; playView.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            zone.innerHTML = ''; leftPool.innerHTML = ''; rightPool.innerHTML = '';
            zone.dataset.locked = ''; document.getElementById('success-controls').style.visibility = 'hidden';
            
            let imgPath = currentData.image;
            if(imgPath && !imgPath.startsWith('/') && !imgPath.startsWith('http')) imgPath = '../' + imgPath;
            document.getElementById('main-image').style.backgroundImage = `url('${imgPath}')`;

            const shuffledWords = [...currentData.words].sort(() => Math.random() - 0.5);
            shuffledWords.forEach((word, idx) => {
                const brick = document.createElement('div');
                brick.className = 'word-brick'; brick.innerHTML = splitFonts(word);
                const color = getColorForWord(word);
                brick.style.backgroundColor = color; brick.dataset.word = word; brick.dataset.pool = idx % 2 === 0 ? 'left' : 'right';
                addTouchLogic(brick);
                if (idx % 2 === 0) leftPool.appendChild(brick); else rightPool.appendChild(brick);
            });
            autoSizeZone();
        }

        function getInsertTarget(clientX, clientY, draggingEl) {
            const siblings = [...zone.querySelectorAll('.word-brick')].filter(s => s !== draggingEl && !s.classList.contains('auto-punctuation'));
            if (siblings.length === 0) return null;
            const nextInRow = siblings.find(sib => { const box = sib.getBoundingClientRect(); return clientX < box.left + box.width / 2; });
            return nextInRow || null; 
        }

        function autoSizeZone() {
            const bricks = [...zone.querySelectorAll('.word-brick')];
            if (bricks.length === 0) return;
            const isMobile = window.innerWidth <= 768;
            const availW = zone.clientWidth - 30 - (bricks.length - 1) * (isMobile ? 4 : 8) - 40;
            bricks.forEach(b => b.style.maxWidth = 'none');
            let lo = 12, hi = isMobile ? 32 : 65, best = 12;
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                bricks.forEach(b => { b.style.fontSize = mid + 'px'; b.style.padding = `${Math.round(mid*0.25)}px ${Math.round(mid*0.5)}px`; });
                if (bricks.reduce((s, b) => s + b.scrollWidth, 0) <= availW) { best = mid; lo = mid + 1; } else hi = mid - 1;
            }
            bricks.forEach(b => { b.style.fontSize = best + 'px'; b.style.padding = `${Math.round(best*0.25)}px ${Math.round(best*0.5)}px`; b.style.maxWidth = ''; });
        }

        function addTouchLogic(el) {
            let startX, startY;
            const moveHandler = (e) => {
                if (!el.classList.contains('dragging')) return; e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                el.style.left = (touch.clientX - startX) + 'px'; el.style.top = (touch.clientY - startY) + 'px';
                const zoneRect = zone.getBoundingClientRect();
                const isOverZone = touch.clientX > zoneRect.left - 80 && touch.clientX < zoneRect.right + 80 && touch.clientY > zoneRect.top - 80 && touch.clientY < zoneRect.bottom + 80;
                const oldIndicator = zone.querySelector('.insert-indicator'); if (oldIndicator) oldIndicator.remove();
                if (isOverZone) {
                    zone.classList.add('active-hover');
                    const indicator = document.createElement('div'); indicator.className = 'insert-indicator';
                    indicator.style.cssText = 'width:4px; min-height:40px; align-self:stretch; background:#ff6b6b; border-radius:4px; flex-shrink:0; pointer-events:none; margin: 0 4px;';
                    zone.insertBefore(indicator, getInsertTarget(touch.clientX, touch.clientY, el));
                } else zone.classList.remove('active-hover');
            };
            const endHandler = (e) => {
                if (!el.classList.contains('dragging')) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                el.classList.remove('dragging'); el.style.left = ''; el.style.top = ''; zone.classList.remove('active-hover');
                const indicator = zone.querySelector('.insert-indicator');
                if (indicator) { zone.insertBefore(el, indicator); indicator.remove(); } 
                else {
                    const zoneRect = zone.getBoundingClientRect();
                    if (touch.clientX >= zoneRect.left - 80 && touch.clientX <= zoneRect.right + 80 && touch.clientY >= zoneRect.top - 80  && touch.clientY <= zoneRect.bottom + 80) zone.insertBefore(el, getInsertTarget(touch.clientX, touch.clientY, el));
                    else { el.style.fontSize = ''; el.style.padding = ''; el.style.maxWidth = ''; if (el.dataset.pool === 'left') leftPool.appendChild(el); else rightPool.appendChild(el); }
                }
                autoSizeZone(); check();
                document.removeEventListener('mousemove', moveHandler); document.removeEventListener('touchmove', moveHandler);
            };
            const startHandler = (e) => {
                if (zone.dataset.locked === '1') return;
                const touch = e.touches ? e.touches[0] : e; const rect = el.getBoundingClientRect();
                startX = touch.clientX - rect.left; startY = touch.clientY - rect.top;
                el.classList.add('dragging'); el.style.left = (touch.clientX - startX) + 'px'; el.style.top = (touch.clientY - startY) + 'px';
                document.addEventListener('mousemove', moveHandler, {passive: false}); document.addEventListener('touchmove', moveHandler, {passive: false});
                document.addEventListener('mouseup', endHandler, {once: true}); document.addEventListener('touchend', endHandler, {once: true});
            };
            el.addEventListener('mousedown', startHandler); el.addEventListener('touchstart', startHandler, {passive: false});
        }

        function autoSizeReading() {
            const overlay = document.getElementById('reading-overlay'); const boxes = [...document.querySelectorAll('.reading-char-box')];
            if (boxes.length === 0) return;
            const availW = overlay.clientWidth * 0.90; const availH = overlay.clientHeight - 120;
            let lo = 20, hi = 300, best = 20;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1; const margin = Math.round(mid * 0.1);
                let rowW = 0, rows = 1;
                boxes.forEach(b => { if (rowW + (mid + margin * 2) > availW && rowW > 0) { rows++; rowW = (mid + margin * 2); } else rowW += (mid + margin * 2); });
                if (rows * (mid + margin * 2) <= availH) { best = mid; lo = mid + 1; } else hi = mid - 1;
            }
            boxes.forEach(b => {
                b.style.width = best + 'px'; b.style.height = best + 'px'; b.style.margin = Math.round(best * 0.1) + 'px';
                if (!b.classList.contains('punctuation-box')) { b.style.fontSize = (best * 0.7) + 'px'; b.style.borderRadius = Math.round(best * 0.15) + 'px'; b.style.boxShadow = `0 ${Math.max(2, Math.round(best * 0.08))}px 0 rgba(0,0,0,0.12)`; } 
                else b.style.fontSize = (best * 0.5) + 'px';
            });
        }

        function check() {
            const current = [...zone.querySelectorAll('.word-brick')].map(b => b.dataset.word).join('');
            if (current === currentData.words.join('')) {
                zone.dataset.locked = '1'; document.getElementById('success-controls').style.visibility = 'visible';
                if (typeof MECC_AUDIO !== 'undefined' && MECC_AUDIO.playSfx) MECC_AUDIO.playSfx('tada'); 
                autoSizeZone(); 
                const punc = currentData.punctuation || '';
                if (punc && !zone.querySelector('.auto-punctuation')) {
                    const lastBrick = zone.querySelector('.word-brick:last-of-type');
                    const puncEl = document.createElement('span'); puncEl.className = 'auto-punctuation font-zh'; puncEl.textContent = punc;
                    puncEl.style.cssText = `font-size:${lastBrick ? getComputedStyle(lastBrick).fontSize : '3rem'}; font-weight:bold; color:#666; align-self:center; pointer-events:none; flex-shrink:0; margin-left:2px;`;
                    zone.appendChild(puncEl);
                }
                zone.classList.remove('correct-flash'); void zone.offsetWidth; zone.classList.add('correct-flash');
                setTimeout(() => zone.classList.remove('correct-flash'), 1000);
            }
        }

        function enterReadingMode() {
            const container = document.getElementById('full-container'); container.innerHTML = '';
            currentData.words.forEach(word => {
                const color = getColorForWord(word);
                Array.from(word).forEach(char => {
                    const box = document.createElement('div'); box.className = 'reading-char-box'; box.innerHTML = splitFonts(char); box.style.backgroundColor = color; container.appendChild(box);
                });
            });
            const punc = currentData.punctuation || '';
            if (punc) { const box = document.createElement('div'); box.className = 'reading-char-box punctuation-box font-zh'; box.textContent = punc; container.appendChild(box); }
            document.getElementById('reading-overlay').style.display = 'flex'; requestAnimationFrame(autoSizeReading);
        }

        function readCurrentSentence() { 
            const fullText = currentData.words.join('') + (currentData.punctuation || '');
            playUnifiedAudio(fullText); 
        }

        function closePlay() { listView.style.display = 'flex'; playView.style.display = 'none'; document.body.style.overflow = ''; }
    </script>
