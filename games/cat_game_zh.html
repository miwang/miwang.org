<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>😸 小猫在哪里？ 😸</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @import url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css');
        :root {
            /* 🌟 沿用您最满意的万无一失字体链 */
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
            --accent-yellow: #f3b236;
        }

        /* 暴力覆盖，确保字体全局统一 */
        *, h1, h2, .btn, .char-card, .name, #result-text { font-family: var(--kaiti) !important; font-weight: bold; }
        .score, .font-en { font-family: var(--wenkai) !important; }

        body {
            margin: 0; padding: 0; background-color: #1f2e46; color: white;
            overflow: auto; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; width: 100vw; user-select: none;
        }

        /* 🌟 统一磨砂返回按钮 */
        .back-btn-home {
            position: fixed; top: 15px; left: 20px; color: #fff; text-decoration: none;
            font-size: 1.1rem; z-index: 999; 
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 8px 20px; border-radius: 40px; border: 1.5px solid rgba(255,255,255,0.2);
            transition: 0.2s;
        }
        .back-btn-home:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.25); }

        /* --- 🌟 游戏顶栏：彻底解决重叠 --- */
        .game-top-bar {
            width: 100%; height: 12vh; display: none; /* 初始隐藏 */
            align-items: center; justify-content: center; position: relative; padding: 0 20px;
        }

        .game-header { font-size: 3rem; color: var(--accent-yellow); letter-spacing: 5px; margin: 0; }

        /* 🌟 记分牌：放在右侧，并缩小比例防止撞车 */
        #vs-scoreboard {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%) scale(0.9);
            display: flex; align-items: center; gap: 15px; 
            background: rgba(255, 255, 255, 0.1); padding: 8px 20px; 
            border-radius: 50px; border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .player-box { display: flex; align-items: center; gap: 10px; }
        .player-box .name { font-size: 1.2rem; color: #fff; }
        .player-box .score { font-size: 2.5rem; color: var(--accent-yellow); min-width: 40px; text-align: center; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent-yellow); background: white; }

        /* --- 选词界面：宽屏布局 --- */
        #start-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; min-height: 100vh; padding: 4px 20px 12px; box-sizing: border-box; }
        #start-screen h1 { font-size: 2rem; margin-bottom: 8px; color: var(--accent-yellow); }
        .controls { margin-bottom: 12px; display: flex; gap: 16px; }
        .btn { padding: clamp(6px, 0.8vh, 10px) clamp(16px, 2vw, 26px); font-size: clamp(0.9rem, 1.2vw, 1.2rem); background-color: var(--main-teal); color: white; border: 2px solid var(--accent-yellow); border-radius: 50px; cursor: pointer; transition: 0.2s; }
        .btn-start { background-color: var(--accent-yellow); color: #1f2e46; box-shadow: 0 4px 0 #d49a2a; }

        #char-grid {
            display: grid; grid-template-columns: repeat(13, 1fr); gap: clamp(5px, 0.8vw, 10px);
            max-width: 1250px; width: 95%; padding: clamp(10px, 1.5vh, 20px);
            background: rgba(255, 255, 255, 0.08); border-radius: 16px; border: 2px dashed rgba(243, 178, 54, 0.4);
        }
        .char-card {
            aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center;
            font-size: 2rem; background-color: #f0f0f0; color: #333; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .char-card.selected { background-color: var(--main-teal); color: var(--accent-yellow); border: 3px solid var(--accent-yellow); transform: scale(1.05); }

        /* --- 游戏区 --- */
        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100vh; position: relative; overflow: hidden; }
        .game-board { flex: 1; display: flex; align-items: center; justify-content: center; gap: 40px; z-index: 2; }
        
        .card-container { position: relative; width: clamp(120px, 18vw, 220px); height: clamp(120px, 18vw, 220px); }
        .char-circle { 
            position: absolute; inset: 0; background-color: var(--main-teal); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; font-size: 8rem; 
            color: var(--accent-yellow); cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            border: 5px solid transparent; transition: 0.2s; 
        }
        .char-circle:hover { transform: translateY(-10px); border-color: var(--accent-yellow); }

        .hidden-cat { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(3.5rem, 7vw, 8rem); opacity: 0; }
        .cat-found-anim { animation: bounceCat 0.5s infinite; opacity: 1 !important; }
        @keyframes bounceCat { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -80%); } }
        .fly-away { animation: magicVanish 0.8s forwards; pointer-events: none; }
        @keyframes magicVanish { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0) translateY(-500px) rotate(360deg); opacity: 0; } }

        .footer { height: 20vh; width: 100%; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #result-text { font-size: 2.8rem; color: var(--main-teal); margin-bottom: 10px; }
        .bottom-wave { position: absolute; bottom: -30vh; width: 150vw; height: 60vh; background-color: #ffffff; border-radius: 50%; z-index: 1; }

        @media (max-width: 768px) {
            body { height: 100dvh; }

            /* 返回按钮 */
            .back-btn-home { font-size: 0.85rem !important; padding: 5px 10px !important; top: 8px !important; left: 10px !important; z-index: 999 !important; }

            /* 选词界面 */
            #start-screen { padding: 52px 12px 12px !important; justify-content: flex-start !important; overflow-y: auto; }
            #start-screen h1 { font-size: 1.6rem !important; margin-bottom: 10px !important; }
            .controls { gap: 8px !important; flex-wrap: wrap; margin-bottom: 12px !important; }
            .btn { padding: 8px 16px !important; font-size: 1rem !important; }
            #char-grid { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)) !important; gap: 6px !important; padding: 12px !important; max-width: 100% !important; }
            .char-card { font-size: 1.3rem !important; }

            /* 游戏界面 */
            .game-header { font-size: 1.4rem !important; letter-spacing: 2px !important; }
            #vs-scoreboard { position: static !important; transform: none !important; margin-left: auto; padding: 5px 12px !important; gap: 8px !important; }
            .player-box .score { font-size: 1.6rem !important; }
            .player-box .name { font-size: 0.9rem !important; }
            .avatar { width: 28px !important; height: 28px !important; }
            .game-top-bar { 
                height: auto !important; 
                flex-direction: column !important;
                padding: 8px 0 6px !important; 
                gap: 6px !important;
                align-items: center !important;
                width: 100% !important;
            }
            .game-header { font-size: 1.6rem !important; letter-spacing: 2px !important; width: 100% !important; text-align: center !important; }
            #vs-scoreboard { 
                position: static !important; transform: none !important; 
                width: 90% !important; max-width: 360px !important;
                display: flex !important; justify-content: center !important;
                margin: 0 auto !important;
                padding: 6px 16px !important; gap: 12px !important;
            }

            #game-screen { justify-content: flex-start !important; padding-top: 38px !important; padding-bottom: 110px !important; box-sizing: border-box !important; }
            .game-board { 
                display: grid !important; 
                grid-template-columns: 1fr 1fr !important;
                gap: 12px !important; 
                padding: 0 16px !important;
                margin-top: 4vh !important;
                width: 100% !important;
                flex: none !important;
            }
            .card-container { width: 42vw !important; height: 42vw !important; }
            .char-circle { font-size: 15vw !important; }
            .hidden-cat { font-size: 17vw !important; }
            .bottom-wave { display: none !important; }
            .footer { margin-top: 16px !important; height: auto !important; padding: 0 !important; flex-direction: column !important; align-items: center !important; gap: 10px !important; }
            #result-text { font-size: 1.3rem !important; }
            .btn-back-setup { position: fixed !important; bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important; left: 50% !important; transform: translateX(-50%) !important; z-index: 999 !important; background: rgba(255,255,255,0.12) !important; border-color: rgba(255,255,255,0.3) !important; color: rgba(255,255,255,0.7) !important; font-size: 0.9rem !important; padding: 8px 24px !important; white-space: nowrap !important; }
        }
    </style>
</head>
<body>

    <a href="../teachers.html" class="back-btn-home">⬅️ 返回工具台</a>

    <div id="start-screen">
        <h1>😸 小猫在哪里？ 😸</h1>
        <div class="controls">
            <button class="btn" onclick="selectAll()">全选</button>
            <button class="btn" onclick="clearAll()">清空</button>
            <button class="btn btn-start" onclick="startGame()">开始游戏</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-screen">
        <div class="game-top-bar" id="game-top-bar">
            <h1 class="game-header">小猫在哪里？</h1>
            <div id="vs-scoreboard">
                <div class="player-box">
                    <img src="../favicon.png" class="avatar">
                    <span class="name">王老师</span>
                    <span class="score" id="score-teacher">0</span>
                </div>
                <div style="font-size: 1.2rem; font-weight: bold; color: #ff4757; font-style: italic;">VS</div>
                <div class="player-box">
                    <span class="score" id="score-student">0</span>
                    <span class="name">小朋友</span>
                    <div style="font-size: 2rem;">👧👦</div>
                </div>
            </div>
        </div>

        <div class="game-board" id="board"></div>

        <div class="footer">
            <div id="result-text">小猫在 ______ 的后面。</div>
            <button class="btn" id="next-btn" onclick="nextRound()" style="display:none; background: #3498db; border-color:#2980b9;">下一组 ➔</button>
            <button class="btn btn-back-setup" onclick="backToSetup()" style="background:transparent; border-color:rgba(255,255,255,0.3); color:rgba(255,255,255,0.6); font-size:0.9rem; padding:6px 16px; margin-top:4px;">← 返回字库</button>
        </div>
        <div class="bottom-wave"></div>
    </div>

    <script>
        const allChars = ['四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太','六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也','八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有','要','是','了','去'];
        let selectedChars = []; let teacherScore = 0; let studentScore = 0; let wrongAttempts = 0; let roundOver = false; let currentChars = []; let targetIdx = -1;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if(!audioCtx) audioCtx = new AudioCtx(); if(audioCtx.state==='suspended') audioCtx.resume(); }

        function playSfx(type) {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if(type === 'swoosh') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(50, now+0.4);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.4);
                osc.start(); osc.stop(now+0.4);
            } else if(type === 'tada') {
                osc.type = 'triangle'; [523, 659, 783, 1046].forEach((f, i) => osc.frequency.setValueAtTime(f, now + i*0.1));
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.6);
                osc.start(); osc.stop(now+0.6);
            } else if(type === 'teacherWin') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(400, now+0.1); osc.frequency.linearRampToValueAtTime(200, now+0.2); osc.frequency.linearRampToValueAtTime(500, now+0.3);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now+0.5);
                osc.start(); osc.stop(now+0.5);
            }
        }

        window.onload = () => {
            const grid = document.getElementById('char-grid');
            const saved = JSON.parse(localStorage.getItem('catGameWords')) || [];
            allChars.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card' + (saved.includes(char) ? ' selected' : '');
                card.innerText = char; card.onclick = () => card.classList.toggle('selected');
                grid.appendChild(card);
            });
        };

        function backToSetup() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('game-top-bar').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }

        function selectAll() { document.querySelectorAll('.char-card').forEach(c => c.classList.add('selected')); }
        function clearAll() { document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected')); }

        function startGame() {
            selectedChars = Array.from(document.querySelectorAll('.char-card.selected')).map(el => el.innerText);
            if (selectedChars.length < 4) { alert("请至少选择4个字来玩小猫藏猫猫哦！"); return; }
            localStorage.setItem('catGameWords', JSON.stringify(selectedChars));
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('game-top-bar').style.display = 'flex';
            nextRound();
        }

        function nextRound() {
            const board = document.getElementById('board'); board.innerHTML = '';
            document.getElementById('result-text').innerText = '小猫在 ______ 的后面。';
            document.getElementById('result-text').style.color = '#598586';
            document.getElementById('next-btn').style.display = 'none';
            wrongAttempts = 0; roundOver = false;
            currentChars = [...selectedChars].sort(() => Math.random() - 0.5).slice(0, 4);
            targetIdx = Math.floor(Math.random() * 4);
            currentChars.forEach((char, i) => {
                const container = document.createElement('div'); container.className = 'card-container';
                const cat = document.createElement('div'); cat.className = 'hidden-cat'; cat.innerText = '😸'; cat.id = 'cat-'+i;
                const circle = document.createElement('div'); circle.className = 'char-circle'; circle.innerText = char; circle.id = 'circle-'+i;
                circle.onclick = () => {
                    if (roundOver || circle.classList.contains('fly-away')) return;
                    circle.classList.add('fly-away');
                    if (i === targetIdx) {
                        roundOver = true; playSfx('tada'); cat.classList.add('cat-found-anim');
                        studentScore++; document.getElementById('score-student').innerText = studentScore;
                        document.getElementById('result-text').innerText = `找到啦！是“${char}”！小朋友加一分！`;
                        document.getElementById('next-btn').style.display = 'block';
                    } else {
                        playSfx('swoosh'); wrongAttempts++;
                        if (wrongAttempts === 3) {
                            roundOver = true; teacherScore++; document.getElementById('score-teacher').innerText = teacherScore;
                            document.getElementById('result-text').innerText = `王老师截胡成功！`;
                            document.getElementById('result-text').style.color = '#ff4757';
                            playSfx('teacherWin');
                            setTimeout(() => {
                                playSfx('tada');
                                document.getElementById('circle-'+targetIdx).classList.add('fly-away');
                                document.getElementById('cat-'+targetIdx).classList.add('cat-found-anim');
                                document.getElementById('result-text').innerText = `哈哈！躲在“${currentChars[targetIdx]}”后面！`;
                                document.getElementById('next-btn').style.display = 'block';
                            }, 1000);
                        }
                    }
                };
                container.appendChild(cat); container.appendChild(circle); board.appendChild(container);
            });
        }
    </script>
</body>
</html>
