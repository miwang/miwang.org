<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍎 果园摘水果 🍎</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @import url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css');
        :root {
            --kaiti-font: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
        }
        * { box-sizing: border-box; font-family: var(--kaiti-font) !important; }
        body { margin: 0; padding: 0; background: #87CEEB; overflow: hidden; height: 100vh; width: 100vw; user-select: none; }

        .back-btn-home { position: absolute; top: 20px; left: 20px; color: #555; text-decoration: none; font-size: 1.2rem; z-index: 1000; background: rgba(255, 255, 255, 0.8); padding: 10px 20px; border-radius: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* --- 选字界面 --- */
        #start-screen {
            position: absolute; inset: 0; background: #fff9ea; z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        #start-screen h1 { font-size: 3rem; color: #e74c3c; margin: 10px 0; }
        
        /* 优化后的网格，适配 51 个字 */
        .word-grid {
            display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px;
            max-width: 1100px; background: white; padding: 20px; border-radius: 20px; border: 4px solid #f3b236;
            max-height: 60vh; overflow-y: auto;
        }
        .word-item {
            width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; background: #f0f0f0; border-radius: 10px; cursor: pointer; border: 2px solid transparent;
        }
        .word-item.selected { background: #e74c3c; color: white; border-color: #f3b236; transform: scale(1.05); }
        
        .ctrl-btns { margin: 15px 0; display: flex; gap: 15px; }
        .btn { padding: 12px 35px; font-size: 1.4rem; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-start { background: #e74c3c; color: white; box-shadow: 0 5px 0 #c0392b; }
        .btn-start:active { transform: translateY(3px); box-shadow: 0 2px 0 #c0392b; }

        /* --- 游戏界面 --- */
        #game-screen { display: none; width: 100%; height: 100%; position: relative; background: linear-gradient(to bottom, #87CEEB 0%, #e0f7fa 100%); }
        .task-bar { position: absolute; top: 30px; width: 80%; left: 10%; background: rgba(255,255,255,0.95); border-radius: 60px; padding: 15px; text-align: center; border: 6px solid #e74c3c; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #task-text { font-size: 3.5rem; color: #2c3e50; font-weight: bold; margin: 0; }
        
        .fruit { position: absolute; width: 115px; height: 115px; display: flex; justify-content: center; align-items: center; font-size: 3.2rem; font-weight: bold; color: white; z-index: 50; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .apple { background: #e74c3c; border-radius: 50% 50% 48% 48%; border: 4px solid #c0392b; }
        .pear { background: #f1c40f; border-radius: 45% 45% 50% 50%; border: 4px solid #d4ac0d; width: 105px; }
        .grape { background: #9b59b6; border-radius: 50%; border: 4px solid #8e44ad; width: 95px; height: 115px; }

        #basket { position: absolute; bottom: 40px; left: 50%; width: 280px; height: 140px; transform: translateX(-50%); background: #d35400; border-radius: 15px 15px 80px 80px; border: 8px solid #a04000; display: flex; justify-content: center; align-items: center; z-index: 60; touch-action: none; transition: background 0.2s; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        #basket::before { content: '🧺'; font-size: 4.5rem; opacity: 0.4; }
        
        .catch-correct { background-color: #2ecc71 !important; transform: translateX(-50%) scale(1.1) !important; }
        .catch-wrong { background-color: #e74c3c !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(-50%); } 25% { transform: translateX(-58%); } 75% { transform: translateX(-42%); } }

        .score-board { position: absolute; top: 180px; right: 40px; background: #f3b236; color: #1e2e46; padding: 15px 30px; border-radius: 30px; font-size: 2rem; font-weight: bold; z-index: 100; border: 4px solid white; }
    </style>
</head>
<body>

    <a href="../teachers.html" class="back-btn-home">⬅️ 返回工具台</a>

    <div id="start-screen">
        <h1>🍎 果园摘水果</h1>
        <div class="ctrl-btns">
            <button class="btn" onclick="selectAll()">全选本页字</button>
            <button class="btn" onclick="clearAll()">全部清空</button>
        </div>
        <div id="word-grid" class="word-grid"></div>
        <div class="ctrl-btns">
            <button class="btn btn-start" onclick="startGame()">选好了，去摘水果！</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="task-bar"><p id="task-text">准备好...</p></div>
        <div class="score-board">积分: <span id="score">0</span></div>
        <div id="basket"></div>
    </div>

    <script>
        // 🌟 字库同步：51个字
        const allWords = ['四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太','六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也','八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有','要','是','了'];
        let selectedWords = [];
        let currentTarget = "";
        let score = 0;
        let gameActive = false;
        let audioCtx;

        window.onload = () => {
            const grid = document.getElementById('word-grid');
            const saved = JSON.parse(localStorage.getItem('orchardWords')) || ['大','小','天'];
            allWords.forEach(w => {
                const div = document.createElement('div');
                div.className = 'word-item' + (saved.includes(w) ? ' selected' : '');
                div.innerText = w;
                div.onclick = () => div.classList.toggle('selected');
                grid.appendChild(div);
            });
        };

        function selectAll() { document.querySelectorAll('.word-item').forEach(i => i.classList.add('selected')); }
        function clearAll() { document.querySelectorAll('.word-item').forEach(i => i.classList.remove('selected')); }

        // 🌟 动感BGM生成器
        function startBgm() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const notes = [261.6, 329.6, 392.0, 523.2];
            let step = 0;
            setInterval(() => {
                if(!gameActive) return;
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.connect(g); g.connect(audioCtx.destination);
                osc.frequency.value = notes[step % 4];
                g.gain.setValueAtTime(0.04, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                step++;
            }, 200);
        }

        function playSfx(isCorrect) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if(isCorrect) {
                osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                g.gain.setValueAtTime(0.2, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            } else {
                osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            }
            osc.start(); osc.stop(now + 0.3);
        }

        function startGame() {
            selectedWords = Array.from(document.querySelectorAll('.word-item.selected')).map(el => el.innerText);
            if(selectedWords.length < 2) { alert("老师，请至少选两个字哦！"); return; }
            localStorage.setItem('orchardWords', JSON.stringify(selectedWords));
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            gameActive = true;
            startBgm();
            refreshTask();
            createFruit();
        }

        const basket = document.getElementById('basket');
        const canvas = document.getElementById('game-screen');
        let isDragging = false;

        const moveHandler = (e) => {
            if (!isDragging) return;
            let x = (e.clientX || (e.touches ? e.touches[0].clientX : 0));
            let left = x - canvas.offsetLeft;
            if (left < 140) left = 140;
            if (left > window.innerWidth - 140) left = window.innerWidth - 140;
            basket.style.left = left + 'px';
        };
        basket.onmousedown = () => isDragging = true;
        window.onmouseup = () => isDragging = false;
        window.onmousemove = moveHandler;
        basket.ontouchmove = (e) => { e.preventDefault(); isDragging = true; moveHandler(e); };

        function createFruit() {
            if (!gameActive) return;
            const fruit = document.createElement('div');
            const word = selectedWords[Math.floor(Math.random() * selectedWords.length)];
            const types = ['apple', 'pear', 'grape'];
            const type = types[Math.floor(Math.random() * 3)];
            
            fruit.className = `fruit ${type}`;
            fruit.innerText = word;
            fruit.style.left = Math.random() * (window.innerWidth - 130) + 'px';
            fruit.style.top = '-130px';
            canvas.appendChild(fruit);

            let speed = 4 + Math.random() * 3.5;
            function fall() {
                if (!fruit.parentNode || !gameActive) return;
                let top = parseFloat(fruit.style.top);
                top += speed;
                fruit.style.top = top + 'px';
                
                const bRect = basket.getBoundingClientRect();
                const fRect = fruit.getBoundingClientRect();
                if (fRect.bottom > bRect.top + 25 && fRect.right > bRect.left && fRect.left < bRect.right && fRect.top < bRect.bottom) {
                    handleCatch(word, fruit); return;
                }
                if (top > window.innerHeight) fruit.remove();
                else requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
            setTimeout(createFruit, 1600);
        }

        function handleCatch(word, el) {
            const isCorrect = (word === currentTarget);
            playSfx(isCorrect);
            if(isCorrect) {
                score += 10; document.getElementById('score').innerText = score;
                basket.classList.add('catch-correct');
                setTimeout(() => { basket.classList.remove('catch-correct'); refreshTask(); }, 400);
            } else {
                basket.classList.add('catch-wrong');
                setTimeout(() => basket.classList.remove('catch-wrong'), 400);
            }
            el.remove();
        }

        function refreshTask() {
            currentTarget = selectedWords[Math.floor(Math.random() * selectedWords.length)];
            document.getElementById('task-text').innerText = `请摘掉：“${currentTarget}”`;
        }
    </script>
</body>
</html>
