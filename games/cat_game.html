<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where is the Cat? 😸</title>
    
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* 只保留找小猫游戏专属的卡片样式 */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        #prompt-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #598586;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 90%;
            margin-bottom: 30px;
        }

        .flashcard {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            cursor: pointer;
            border: 4px solid transparent;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .flashcard:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.15);
        }

        /* 翻牌后的隐藏表情 */
        .hidden-emoji {
            display: none;
            font-size: 4rem;
        }

        .flashcard.revealed .chinese-char {
            display: none;
        }

        .flashcard.revealed .hidden-emoji {
            display: block;
        }

        @media (max-width: 600px) {
            .card-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .flashcard { height: 100px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="../index.html" class="back-btn">⬅️ Back</a>
        <h1>Where is the Cat? 😸</h1>
    </div>

    <div class="game-area">
        <div id="prompt-text">Find the cat under the cards!</div>
        
        <div class="card-grid" id="card-grid">
            </div>

        <button class="btn" onclick="startNewGame()">Play Again 🔄</button>
    </div>

    <script>
        // 游戏词库
        const wordList = ['大', '小', '多', '少', '上', '下', '水', '火', '山', '石', '田', '土'];
        let currentWords = [];
        let catIndex = -1;
        let gameActive = true;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playWinSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.2); 
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }

        function playErrorSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }

        function startNewGame() {
            gameActive = true;
            document.getElementById('prompt-text').innerText = "Find the cat under the cards!";
            document.getElementById('prompt-text').style.color = "#598586";

            // 随机抽取6个字
            let shuffled = [...wordList].sort(() => 0.5 - Math.random());
            currentWords = shuffled.slice(0, 6);
            
            // 随机藏一只猫
            catIndex = Math.floor(Math.random() * 6);

            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';

            currentWords.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = 'flashcard';
                card.onclick = () => revealCard(index, card, word);
                
                card.innerHTML = `
                    <div class="chinese-char">${word}</div>
                    <div class="hidden-emoji">${index === catIndex ? '😸' : '❌'}</div>
                `;
                grid.appendChild(card);
            });
        }

        function revealCard(index, cardElement, word) {
            if (!gameActive || cardElement.classList.contains('revealed')) return;
            
            cardElement.classList.add('revealed');

            if (index === catIndex) {
                // 找到小猫了！(使用全局定义的 success-anim 弹跳动画)
                playWinSound();
                cardElement.classList.add('success-anim');
                document.getElementById('prompt-text').innerText = `You found the cat under "${word}"! 🎉`;
                document.getElementById('prompt-text').style.color = "#4CAF50";
                gameActive = false; // 结束本局
            } else {
                // 没找到 (使用全局定义的 error-anim 摇晃动画)
                playErrorSound();
                cardElement.classList.add('error-anim');
                // 动画结束后移除类名，方便重复触发
                setTimeout(() => cardElement.classList.remove('error-anim'), 400);
            }
        }

        startNewGame();
    </script>
</body>
</html>
