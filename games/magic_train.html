<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="head-title">🚂 魔法识字小火车 - MECC</title>
    
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
        }

        body, .instruction, .block, .shadow-text, .bubble-text { 
            font-family: var(--kaiti) !important; 
            font-weight: bold; 
        }

        .font-en { 
            font-family: var(--wenkai) !important; 
        }

        body {
            background: linear-gradient(to bottom, #a1e4ff 0%, #ffffff 70%, #76d476 70%, #45b645 100%);
            margin: 0; padding: 0; height: 100dvh; overflow: hidden;
            text-align: center; user-select: none; position: relative;
            padding-top: 60px; display: flex; flex-direction: column;
        }

        #game-wrapper {
            display: flex; flex-direction: column; align-items: center;
            flex: 1; min-height: 0; padding: 0 12px;
        }

        .instruction { 
            font-size: clamp(1rem, 2.5vh, 1.4rem); 
            color: #333; 
            margin-top: clamp(8px,2vh,20px); 
            margin-bottom: clamp(6px,1.5vh,10px); 
            flex-shrink: 0; 
        }

        #blocks-container { display: flex; justify-content: center; gap: clamp(10px,3vw,20px); margin-bottom: clamp(8px,2vh,20px); flex-shrink: 0; }
        .block {
            width: clamp(65px,10vw,90px); height: clamp(65px,10vw,90px);
            background: #ffeb3b; border-radius: 18px;
            font-size: clamp(2rem,6vw,3rem); color: #d84315;
            display: flex; align-items: center; justify-content: center;
            cursor: grab; box-shadow: 0 6px 0 #fbc02d, 0 10px 15px rgba(0,0,0,0.1); transition: 0.2s;
        }

        #train-track-wrapper {
            flex: 1; min-height: 0;
            display: flex; align-items: center; justify-content: center;
            width: 100%; transform: translateX(-120vw);
        }
        #train-container { display: flex; justify-content: center; align-items: flex-end; gap: clamp(8px,2vw,12px); padding: 0 8px; flex-wrap: nowrap; }
        .locomotive { font-size: clamp(4rem,8vw,6rem); position: relative; z-index: 5; order: 99; flex-shrink: 0; transform: scaleX(-1); }
        .steam { position: absolute; top: -10px; right: 20px; width: 20px; height: 20px; background: rgba(255,255,255,0.8); border-radius: 50%; opacity: 0; animation: smoke 2s infinite; }
        @keyframes smoke { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(-50px) scale(1.5); opacity: 0; } }

        .train-car { width: clamp(80px,12vw,110px); height: clamp(65px,9vw,85px); background: #03a9f4; border: 4px solid #fff; border-radius: 15px; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: 0.4s; flex-shrink: 0; }
        .train-car::after, .train-car::before { content: ""; position: absolute; bottom: -16px; width: 22px; height: 22px; background: #333; border: 3px solid #ccc; border-radius: 50%; }
        .train-car::before { left: 15px; } .train-car::after { right: 15px; }

        /* 🌟 新增：放错位置时的晃动特效 */
        .wrong-car-anim { 
            animation: carShake 0.4s cubic-bezier(.36,.07,.19,.97) both; 
            border-color: #ff4757 !important; 
            background-color: #ffebee !important;
        }
        @keyframes carShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .shadow-text { font-size: clamp(2rem,5vw,3rem); color: rgba(255,255,255,0.3); }
        .car-img { width: clamp(55px,9vw,78px); height: clamp(55px,9vw,78px); border-radius: 8px; object-fit: contain; }
        .train-car.filled { background: #4caf50; transform: scale(1.04); border-color: #fff !important; }
        .bubble { position: absolute; top: -115px; background: white; padding: 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 6px 15px rgba(0,0,0,0.15); opacity: 0; transform: translateY(15px); transition: 0.4s ease-out; pointer-events: none; min-width: 80px; }
        .bubble img { width: 75px; height: 75px; border-radius: 8px; object-fit: contain; margin-bottom: 4px; }
        .bubble-text { font-size: 1rem; color: #e91e63; }
        .bubble::after { content: ""; position: absolute; bottom: -8px; left: 50%; margin-left: -8px; border-width: 8px 8px 0; border-style: solid; border-color: white transparent transparent; }
        .train-car.filled .bubble { opacity: 1; transform: translateY(0); }
        .train-departing { transform: translateX(150vw) !important; transition: transform 3.5s ease-in !important; }

        #drag-ghost {
            position: fixed; pointer-events: none; z-index: 9999;
            width: clamp(60px,14vw,88px); height: clamp(60px,14vw,88px);
            background: #ffeb3b; border-radius: 18px;
            font-size: clamp(2rem,8vw,3rem); color: #d84315;
            display: none; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transform: translate(-50%, -50%) scale(1.15);
            font-family: var(--kaiti) !important; font-weight: bold;
        }

        @media (max-width: 768px) {
            body { padding-top: 56px; }
            .mecc-nav-back span { display: none; }
            #game-wrapper { padding: 0 8px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="instruction" id="ui-instruction">正在连接云端字库...</div>
        <div id="blocks-container"></div>
        <div id="train-track-wrapper">
            <div id="train-container">
                <div class="locomotive" id="loco"><div class="steam"></div>🚂</div>
            </div>
        </div>
    </div>
    <div id="drag-ghost"></div>

<script>
    let fullWordList = [];
    let sanityAudioMap = {};
    let globalWrongAudioUrl = ''; // 存储云端放错音效

    const LANG = MECC_CONFIG.getLang();
    const t = {
        zh: { title: "🚂 魔法识字小火车", instruction: "请把四会字放到火车上。", winMsg: "呜呜呜！小火车出发啦！", wrong: "放错位置了哦！" },
        en: { title: "🚂 Magic Word Train", instruction: "Drag the characters onto the train.", winMsg: "Choo choo! The train is departing!", wrong: "Try again!" }
    }[LANG];

    const PROJECT_ID = 'sow12t1i';
    const DATASET = 'production';
    // 🌟 获取字词数据的同时，获取全局游戏音效中的 wrong 音效
    const QUERY = encodeURIComponent(`{
      "words": *[_type == "word"] | order(_createdAt asc) {
        char, phrases, "audioUrl": audio.asset->url, phrase_list[]{text, "imageUrl": image.asset->url}
      },
      "audio": *[_type == "gameAudio"][0] {"wrong": wrong.asset->url}
    }`);
    const API_URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

    let globalAudio = new Audio();

    async function playUnifiedAudio(text, sanityAudioUrl) {
        if (!text && !sanityAudioUrl) return;
        globalAudio.pause();
        globalAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
        globalAudio.play().catch(() => {});

        if (sanityAudioUrl) {
            globalAudio.src = sanityAudioUrl;
            await globalAudio.play().catch(e => console.warn("播放失败", e));
            return;
        }

        const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;
        try {
            const azureRes = await fetch(azureUrl).catch(() => null);
            if (azureRes && azureRes.ok && azureRes.headers.get('content-type')?.includes('audio')) {
                const audioBlob = await azureRes.blob();
                globalAudio.src = URL.createObjectURL(audioBlob);
                await globalAudio.play();
                return; 
            }
        } catch(e) {}

        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN'; msg.rate = 0.85;
        window.speechSynthesis.speak(msg);
    }

    // 🌟 播放放错位置的反馈音效
    function playWrongSfx() {
        if (globalWrongAudioUrl) {
            const wrongAudio = new Audio(globalWrongAudioUrl);
            wrongAudio.play().catch(() => {});
        } else {
            // 兜底本地音效
            const localWrong = new Audio('../audio/wrong.mp3');
            localWrong.play().catch(() => {});
        }
    }

    window.onload = async () => {
        MECC_CONFIG.renderGlobalNav(t.title.replace(/🚂/g, '').trim());
        document.getElementById('head-title').innerText = t.title + " - MECC";
        
        try {
            const res = await fetch(API_URL).then(r => r.json());
            const list = res.result.words || [];
            globalWrongAudioUrl = res.result.audio?.wrong || ''; // 🌟 获取云端音效
            
            list.forEach(item => {
                if (item.audioUrl) sanityAudioMap[item.char] = item.audioUrl;
                let phraseText = item.char;
                let phraseImg = '';
                
                if (item.phrase_list && item.phrase_list.length > 0) {
                    phraseText = item.phrase_list[0].text || item.char;
                    phraseImg = item.phrase_list[0].imageUrl || '';
                } else if (item.phrases && typeof item.phrases === 'string') {
                    phraseText = item.phrases.split(/[,，、]/)[0].trim();
                }
                
                fullWordList.push({ char: item.char, phrase: phraseText, phraseImg: phraseImg });
            });

            document.getElementById('ui-instruction').innerText = t.instruction;
            if (LANG === 'en') document.getElementById('ui-instruction').classList.add('font-en');

            if (fullWordList.length > 0) startGame();
        } catch (e) {
            document.getElementById('ui-instruction').innerText = "加载失败，请重试。";
        }
    };

    function startGame() {
        const wrapper = document.getElementById('train-track-wrapper');
        const bc = document.getElementById('blocks-container');
        const tc = document.getElementById('train-container');
        wrapper.style.transition = 'none';
        wrapper.classList.remove('train-departing');
        wrapper.style.transform = 'translateX(-120vw)';
        void wrapper.offsetWidth;
        bc.innerHTML = '';
        tc.innerHTML = '<div class="locomotive"><div class="steam" style="animation-delay:0s"></div><div class="steam" style="animation-delay:0.6s"></div>🚂</div>';

        const selected = [...fullWordList].sort(() => 0.5 - Math.random()).slice(0, MECC_CONFIG.GAME.TRAIN_LENGTH);

        selected.forEach(word => {
            const car = document.createElement('div');
            car.className = 'train-car'; car.dataset.char = word.char;
            const charImgPath = `${MECC_CONFIG.PATH.SIGHT_WORDS_IMAGES}${word.char}.webp`;
            const phraseImgPath = word.phraseImg || `${MECC_CONFIG.PATH.SIGHT_WORDS_IMAGES}${word.phrase}.webp`;
            car.innerHTML = `<div class="bubble"><img src="${phraseImgPath}" onerror="this.style.display='none';"><span class="bubble-text">${word.phrase}</span></div><img class="car-img" src="${charImgPath}" onerror="this.style.display='none'; this.parentNode.querySelector('.shadow-text').style.display='flex';"><div class="shadow-text" style="display:none">${word.char}</div>`;
            car.addEventListener('click', onCarClick);
            car.ondragover = e => e.preventDefault();
            car.ondrop = handleDrop;
            tc.insertBefore(car, tc.querySelector('.locomotive'));
        });

        setTimeout(() => {
            wrapper.style.transition = 'transform 2s cubic-bezier(0.45, 0.05, 0.55, 0.95)';
            wrapper.style.transform = 'translateX(0)';
            selected.sort(() => 0.5 - Math.random()).forEach(word => {
                const b = document.createElement('div');
                b.className = 'block'; b.innerText = word.char; b.dataset.phrase = word.phrase;
                b.draggable = true;
                b.ondragstart = e => e.dataTransfer.setData('text', word.char);
                b.addEventListener('click', onBlockClick);
                b.addEventListener('touchstart', onTouchStart, { passive: true });
                bc.appendChild(b);
            });
        }, 400);
    }

    let selectedChar  = null;
    let selectedBlock = null;
    const ghost = document.getElementById('drag-ghost');

    // 🌟 增强版反馈函数：支持成功与失败
    function tryFillCar(car, char, block) {
        if (car.classList.contains('filled')) return;

        if (car.dataset.char === char) {
            // 成功逻辑
            car.classList.add('filled');
            block.style.visibility = 'hidden';
            block.style.boxShadow  = '';
            const phrase = block.dataset.phrase || char;
            if (phrase === char) {
                playUnifiedAudio(char, sanityAudioMap[char]);
            } else {
                playUnifiedAudio(`${phrase}的${char}`);
            }
            checkWin();
        } else {
            // 🌟 失败反馈：播放错音效并触发晃动动画
            playWrongSfx();
            car.classList.add('wrong-car-anim');
            setTimeout(() => car.classList.remove('wrong-car-anim'), 450);
        }
    }

    function onBlockClick(e) {
        const block = e.currentTarget;
        if (block.style.visibility === 'hidden') return;
        document.querySelectorAll('.block').forEach(b => {
            if (b.style.visibility !== 'hidden') b.style.boxShadow = '0 6px 0 #fbc02d, 0 10px 15px rgba(0,0,0,0.1)';
        });
        selectedChar = block.innerText;
        selectedBlock = block;
        block.style.boxShadow = '0 0 0 5px #ff5722, 0 0 20px rgba(255,87,34,0.5)';
        playUnifiedAudio(selectedChar, sanityAudioMap[selectedChar]);
    }

    function onCarClick(e) {
        if (!selectedChar || !selectedBlock) return;
        tryFillCar(e.currentTarget, selectedChar, selectedBlock);
        document.querySelectorAll('.block').forEach(b => {
            if (b.style.visibility !== 'hidden') b.style.boxShadow = '0 6px 0 #fbc02d, 0 10px 15px rgba(0,0,0,0.1)';
        });
        selectedChar = null; selectedBlock = null;
    }

    function onTouchStart(e) {
        const block = e.currentTarget;
        if (block.style.visibility === 'hidden') return;
        const char = block.innerText;
        playUnifiedAudio(char, sanityAudioMap[char]);

        const startX = e.touches[0].clientX, startY = e.touches[0].clientY;
        let isDragging = false;

        const onMove = (me) => {
            const dx = me.touches[0].clientX - startX, dy = me.touches[0].clientY - startY;
            if (!isDragging && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
                isDragging = true;
                ghost.innerText = char; ghost.style.display = 'flex';
            }
            if (isDragging) {
                me.preventDefault();
                ghost.style.left = me.touches[0].clientX + 'px';
                ghost.style.top = me.touches[0].clientY + 'px';
            }
        };

        const onEnd = (ue) => {
            document.removeEventListener('touchmove', onMove);
            ghost.style.display = 'none';
            if (isDragging) {
                const touch = ue.changedTouches[0];
                const el = document.elementFromPoint(touch.clientX, touch.clientY);
                const car = el && el.closest('.train-car');
                if (car) tryFillCar(car, char, block);
            }
        };
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd, { once: true });
    }

    function handleDrop(e) {
        e.preventDefault();
        const char = e.dataTransfer.getData('text');
        const block = [...document.querySelectorAll('.block')].find(b => b.innerText === char && b.style.visibility !== 'hidden');
        if (block) tryFillCar(this, char, block);
    }

    function checkWin() {
        if (document.querySelectorAll('.train-car.filled').length === MECC_CONFIG.GAME.TRAIN_LENGTH) {
            setTimeout(() => {
                MECC_UI.fireConfetti();
                playUnifiedAudio(t.winMsg);
                document.getElementById('train-track-wrapper').classList.add('train-departing');
                setTimeout(startGame, 4500);
            }, 3000);
        }
    }
</script>
</body>
</html>
