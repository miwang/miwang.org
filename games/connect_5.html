<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥛 自由五子棋 🍪</title>

<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />

<style>
    /* 🌟 全系统统一字体 */
    :root {
        --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
        --wenkai: "LXGW WenKai Lite", sans-serif;
    }
    * { box-sizing: border-box; font-family: var(--kaiti) !important; }
    
    body { background-color: #fff9ea; margin: 0; min-height: 100vh; width: 100vw; overflow: auto; display: flex; justify-content: center; align-items: flex-start; position: relative; padding-top: 8px; padding-bottom: 16px; box-sizing: border-box; }

    /* 🌟 磨砂返回按钮 */
    .back-btn-home {
        position: fixed; top: 14px; left: 16px; color: #555; text-decoration: none;
        font-size: 1.1rem; font-weight: bold; z-index: 50; 
        background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px);
        padding: 10px 20px; border-radius: 40px; border: 1.5px solid rgba(255,255,255,0.6);
        transition: 0.2s;
    }
    .back-btn-home:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.6); }

    /* 🌟 宽屏设置页面：由 800px 扩大至 1200px */
    #setup-view {
        display: flex; flex-direction: column; align-items: center; background: transparent; padding: 4px 30px 12px;
        border-radius: 30px; box-shadow: none; text-align: center; 
        width: 95%; max-width: 1200px;
    }
    #setup-view h1 { color: #598586; margin: 0 0 2px 0; font-size: clamp(1.4rem, 2.5vw, 2.6rem); letter-spacing: clamp(1px, 0.3vw, 4px); }
    #setup-view .instructions { color: #666; margin: 0 0 8px 0; font-size: clamp(0.85rem, 1.1vw, 1.1rem); }
    
    .controls { margin-bottom: 8px; display: flex; gap: 12px; justify-content: center; }
    .controls .btn {
        padding: clamp(6px, 0.8vh, 10px) clamp(16px, 2vw, 26px); font-size: clamp(0.9rem, 1.2vw, 1.2rem); background-color: #f8f9fa; color: #555;
        border: 2px solid #ddd; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .controls .btn:hover { background-color: #eee; transform: translateY(-2px); }
    .controls .btn.start-btn { background-color: #2ecc71; color: white; border-color: #27ae60; box-shadow: 0 4px 0 #27ae60; }
    .controls .btn.start-btn:active { transform: translateY(2px); box-shadow: none; }

    /* 🌟 字库网格：改为 13 列，填满横向空间 */
    #char-grid {
        display: grid; 
        grid-template-columns: repeat(13, 1fr); /* 🌟 增加列数，减少行数 */
        gap: clamp(5px, 0.8vw, 10px); justify-content: center;
        padding: clamp(10px, 1.5vh, 20px); background: rgba(89, 133, 134, 0.05); 
        border-radius: 16px; width: 100%; border: 2px dashed #598586;
    }
    .char-card {
        aspect-ratio: 1 / 1; display: flex; justify-content: center; align-items: center;
        font-size: clamp(1.2rem, 1.8vw, 2rem); background-color: white; color: #333; border-radius: 12px;
        cursor: pointer; transition: all 0.2s; border: 2px solid #eee; 
        box-shadow: 0 4px 8px rgba(0,0,0,0.05); user-select: none;
    }
    .char-card.selected { background-color: #74b9ff; color: white; border: 3px solid #fbc531; transform: scale(1.05); z-index: 2; box-shadow: 0 6px 15px rgba(116, 185, 255, 0.4); }

    /* 游戏对战界面保持原有的宽屏大气风格 */
    #game-view {
        display: none; width: 100%; max-width: 1400px; flex-direction: row; justify-content: space-between; align-items: center; padding: 20px; position: fixed; top: 0; left: 0; height: 100vh; box-sizing: border-box;
    }
    .side-panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.3; transform: scale(0.85); transition: 0.4s; }
    .side-panel .logo { font-size: min(110px, 12vh); filter: grayscale(80%); }
    .side-panel .name { font-size: min(36px, 4vh); font-weight: bold; margin-top: 10px; color: #777; }
    .side-panel.active { opacity: 1; transform: scale(1.1); }
    .side-panel.active .logo { filter: grayscale(0%); }
    .side-panel.p1.active .logo { filter: drop-shadow(0 0 30px #74b9ff); }
    .side-panel.p1.active .name { color: #0984e3; }
    .side-panel.p2.active .logo { filter: drop-shadow(0 0 30px #fbc531); }
    .side-panel.p2.active .name { color: #e1b12c; }

    #board-container { flex: 2; display: flex; flex-direction: column; align-items: center; }
    #board { display: grid; grid-template-columns: repeat(9, min(65px, 10.5vh, 6.5vw)); gap: min(9px, 1.1vh); background-color: #598586; padding: min(13px, 1.6vh); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    
    .cell { width: min(65px, 10.5vh, 6.5vw); height: min(65px, 10.5vh, 6.5vw); background-color: white; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: min(34px, 5.5vh, 3.5vw); cursor: pointer; transition: 0.2s; position: relative; }
    .cell.p1 { background-color: #74b9ff; color: white; transform: scale(0.95); }
    .cell.p2 { background-color: #fbc531; color: white; transform: scale(0.95); }
    .cell.winning-cell { border: 4px solid #ff4757; animation: winPulse 1.2s infinite; }
    
    @keyframes winPulse { 0%, 100% { transform: scale(1.05); } 50% { transform: scale(1.15); box-shadow: 0 0 20px #ff4757; } }

    #trophy-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
    .trophy-icon { font-size: 150px; animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    .overlay-text { color: white; font-size: 60px; font-weight: bold; margin: 30px 0; }

    @media (max-width: 768px) {
        body { height: 100dvh; overflow: hidden; }

        /* 返回按钮 */
        .back-btn-home { font-size: 0.9rem !important; padding: 6px 12px !important; top: 12px !important; left: 12px !important; }

        /* 选词界面 */
        #setup-view { padding: 16px 10px !important; margin-top: 44px; overflow-y: auto; height: calc(100dvh - 44px); }
        #setup-view h1 { font-size: 1.8rem !important; margin-bottom: 4px !important; }
        #setup-view .instructions { font-size: 0.9rem !important; margin-bottom: 10px !important; }
        .controls { gap: 8px !important; flex-wrap: wrap; margin-bottom: 10px !important; }
        .controls .btn { padding: 8px 14px !important; font-size: 1rem !important; }
        #char-grid { grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)) !important; gap: 6px !important; padding: 12px !important; }
        .char-card { font-size: 1.3rem !important; }

        /* 游戏界面：竖版 */
        #game-view { flex-direction: column !important; align-items: center !important; padding: 8px !important; gap: 8px !important; padding-top: 50px !important; }
        .side-panel { flex-direction: row !important; transform: scale(1) !important; opacity: 1 !important; gap: 10px !important; padding: 6px 16px !important; border-radius: 30px !important; background: rgba(89,133,134,0.15) !important; width: 90% !important; justify-content: center !important; }
        .side-panel .logo { font-size: 2rem !important; filter: grayscale(60%) !important; }
        .side-panel .name { font-size: 1.2rem !important; margin-top: 0 !important; }
        .side-panel.active { transform: scale(1.03) !important; }
        #board-container { flex: none !important; width: 100% !important; }
        #board { grid-template-columns: repeat(9, calc((100vw - 44px) / 9)) !important; gap: 3px !important; padding: 6px !important; }
        .cell { width: calc((100vw - 44px) / 9) !important; height: calc((100vw - 44px) / 9) !important; font-size: calc((100vw - 44px) / 9 * 0.55) !important; border-radius: 4px !important; }
        #board-container .btn { margin-top: 10px !important; font-size: 0.9rem !important; padding: 6px 18px !important; }
    }
</style>
</head>
<body>

    <a href="../teachers.html" class="back-btn-home">⬅️ 返回工具台</a>

    <div id="setup-view">
        <h1 class="font-zh">🥛 自由五子棋 🍪</h1>
        <div class="instructions font-zh">
            规则：<span style="color: #ff4757; font-weight: bold;">连成五个即获胜！</span>
            <span style="font-size: 16px; color: #888;"> (系统会自动记忆上次的选择)</span>
        </div>
        
        <div class="controls">
            <button class="btn font-zh" onclick="selectAll()">全选</button>
            <button class="btn font-zh" onclick="clearAll()">清空</button>
            <button class="btn start-btn font-zh" onclick="startGame()">进入对战擂台</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-view">
        <div class="side-panel p1" id="panel-1"><div class="logo">🥛</div><div class="name font-zh">牛奶队</div></div>
        <div id="board-container"><div id="board"></div><button class="btn font-zh" style="margin-top:25px;" onclick="showSetup()">← 返回修改字库</button></div>
        <div class="side-panel p2" id="panel-2"><div class="logo">🍪</div><div class="name font-zh">饼干队</div></div>
    </div>

    <div id="trophy-overlay" onclick="closeTrophy()">
        <div class="trophy-icon">🏆</div>
        <div class="overlay-text font-zh" id="overlay-msg">恭喜获胜！</div>
        <div style="color:rgba(255,255,255,0.6); font-size: 20px;">点击任意位置继续</div>
    </div>

<script>
    const rows = 7; const cols = 9;
    let boardState = []; let boardWords = []; let currentPlayer = 1;

    const allChars = [
        '四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太',
        '六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也',
        '八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有',
        '要','是','了','去'
    ];
    
    function loadSavedWords() { return JSON.parse(localStorage.getItem('connect5TeacherWords')) || []; }
    function saveWords(wordsArray) { localStorage.setItem('connect5TeacherWords', JSON.stringify(wordsArray)); }

    window.onload = () => {
        const grid = document.getElementById('char-grid');
        const savedWords = loadSavedWords();
        allChars.forEach(char => {
            const card = document.createElement('div');
            card.className = 'char-card font-zh';
            card.innerText = char;
            if (savedWords.includes(char)) card.classList.add('selected');
            card.onclick = () => card.classList.toggle('selected');
            grid.appendChild(card);
        });
    };

    function selectAll() { document.querySelectorAll('.char-card').forEach(card => card.classList.add('selected')); }
    function clearAll() { document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected')); }
    function showSetup() { document.getElementById('game-view').style.display = 'none'; document.getElementById('setup-view').style.display = 'flex'; }

    function startGame() {
        const selected = document.querySelectorAll('.char-card.selected');
        let words = Array.from(selected).map(el => el.innerText);
        if (words.length === 0) { alert("请先选字！"); return; }
        saveWords(words);
        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        boardWords = []; while(boardWords.length < (rows * cols)) { boardWords = boardWords.concat(words); }
        boardWords = boardWords.slice(0, rows * cols).sort(() => Math.random() - 0.5);
        boardState = Array.from({length: rows}, () => Array(cols).fill(0));
        currentPlayer = 1; renderBoard(); evaluateGameState();
    }

    function claimCell(r, c) {
        if (boardState[r][c] === 0) { boardState[r][c] = currentPlayer; currentPlayer = currentPlayer === 1 ? 2 : 1; } 
        else if (boardState[r][c] === 1) { boardState[r][c] = 2; } 
        else { boardState[r][c] = 0; }
        renderBoard(); evaluateGameState();
    }

    function renderBoard() {
        const b = document.getElementById('board'); b.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let div = document.createElement('div'); div.className = 'cell font-zh';
                if (boardState[r][c] === 1) div.classList.add('p1');
                if (boardState[r][c] === 2) div.classList.add('p2');
                div.innerText = boardWords[r * cols + c];
                div.onclick = () => claimCell(r, c);
                b.appendChild(div);
            }
        }
    }

    function evaluateGameState() {
        const p1 = document.getElementById('panel-1'); const p2 = document.getElementById('panel-2');
        p1.classList.remove('active'); p2.classList.remove('active');
        let w1 = checkWin(1); let w2 = checkWin(2);
        if (w1) { p1.classList.add('active'); highlight(w1); showTrophy("牛奶队"); }
        else if (w2) { p2.classList.add('active'); highlight(w2); showTrophy("饼干队"); }
        else { if(currentPlayer === 1) p1.classList.add('active'); else p2.classList.add('active'); }
    }

    function checkWin(p) {
        const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (boardState[r][c] !== p) continue;
                for (let [dr, dc] of dirs) {
                    let win = [[r, c]];
                    for(let i=1; i<5; i++) {
                        let nr = r+dr*i, nc = c+dc*i;
                        if(nr>=0 && nr<rows && nc>=0 && nc<cols && boardState[nr][nc] === p) win.push([nr,nc]); else break;
                    }
                    if(win.length >= 5) return win;
                }
            }
        }
        return null;
    }

    function highlight(cells) { cells.forEach(([r, c]) => { document.getElementById('board').children[r*cols+c].classList.add('winning-cell'); }); }
    function showTrophy(name) { 
        document.getElementById('overlay-msg').innerText = `🏆 恭喜${name}获胜！`; 
        document.getElementById('trophy-overlay').style.display = 'flex'; 
    }
    function closeTrophy() { document.getElementById('trophy-overlay').style.display = 'none'; }
</script>
</body>
</html>
