<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥛 自由五子棋 🍪 - MECC</title>

    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        * { box-sizing: border-box; font-family: "STKaiti","Kaiti SC","KaiTi","楷体","LXGW WenKai Lite",serif !important; }

        body { background-color: #fff9ea; margin: 0; display: flex; flex-direction: column; align-items: center; padding-top: 60px; overflow: auto; min-height: 100vh; }

        #setup-view { width: 95%; max-width: 1100px; text-align: center; padding-top: 16px; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
        #char-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 10px; padding: 20px; background: rgba(89,133,134,0.05); border-radius: 16px; border: 2px dashed #598586; }
        .char-card { aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; background: white; border-radius: 10px; cursor: pointer; border: 2px solid #eee; transition: 0.2s; }
        .char-card.selected { background: #74b9ff; color: white; border-color: #fbc531; transform: scale(1.05); }

        #game-view { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; min-height: calc(100vh - 60px); gap: 20px; }
        .battle-area { display: flex; align-items: center; justify-content: center; gap: clamp(30px, 6vw, 60px); }

        .side-panel { display: flex; flex-direction: column; align-items: center; opacity: 0.25; transition: 0.4s; }
        .side-panel.active { opacity: 1; transform: scale(1.12); }
        .side-panel .icon { font-size: min(90px, 11vh); }
        .side-panel .name { font-size: 1.6rem; font-weight: bold; margin-top: 8px; color: #598586; }

        #board { display: grid; grid-template-columns: repeat(9, 65px); gap: 8px; background: #598586; padding: 12px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .cell { width: 65px; height: 65px; background: white; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; transition: 0.2s; }
        .cell:hover { background: #f0f8ff; }
        .cell.p1 { background: #74b9ff; color: white; }
        .cell.p2 { background: #fbc531; color: white; }

        #btn-back-game { background: none; border: 1.5px solid #ccc; color: #888; border-radius: 30px; padding: 8px 24px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        #btn-back-game:hover { border-color: #598586; color: #598586; }

        @media (max-width: 768px) {
            body { padding-top: 56px; overflow: hidden; height: 100dvh; align-items: stretch; }
            .mecc-nav-back span { display: none; }
            #setup-view { width: 100%; max-width: 100%; height: calc(100dvh - 56px); display: flex; flex-direction: column; padding: 8px 8px 6px; overflow: hidden; gap: 6px; }
            .controls { margin-bottom: 0; gap: 8px; flex-shrink: 0; }
            .btn { font-size: 0.9rem !important; padding: 7px 14px !important; }
            #char-grid { grid-template-columns: repeat(8, 1fr); grid-auto-rows: 1fr; gap: 4px; padding: 8px; flex: 1; min-height: 0; }
            .char-card { aspect-ratio: unset; font-size: clamp(0.9rem, 5vw, 1.4rem); }

            #game-view { padding: 4px 4px 4px; flex: 1; height: auto; min-height: unset; justify-content: space-between; gap: 3px; width: 100%; }
            .battle-area { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; flex: 1; min-height: 0; }
            #side-1 { order: 0; flex-direction: row; gap: 6px; opacity: 0.45; transform: none !important; justify-content: center; align-items: center; background: rgba(116,185,255,0.12); border-radius: 10px; padding: 4px 16px; width: 100%; flex-shrink: 0; }
            #board { order: 1; }
            #side-2 { order: 2; flex-direction: row; gap: 6px; opacity: 0.45; transform: none !important; justify-content: center; align-items: center; background: rgba(251,197,49,0.12); border-radius: 10px; padding: 4px 16px; width: 100%; flex-shrink: 0; }
            .side-panel.active { opacity: 1; }
            #side-1.active { opacity: 1; background: rgba(116,185,255,0.28); }
            #side-2.active { opacity: 1; background: rgba(251,197,49,0.28); }
            .side-panel .icon { font-size: 1.6rem; }
            .side-panel .name { font-size: 0.95rem; margin-top: 0; }
            #btn-back-game { display: none; }
            #board { --cell: calc((100vw - 16px - 8 * 3px) / 9); grid-template-columns: repeat(9, var(--cell)); gap: 3px; padding: 6px; border-radius: 12px; width: 100%; }
            .cell { width: var(--cell, 40px); height: var(--cell, 40px); font-size: clamp(1rem, 4vw, 1.5rem); border-radius: 6px; }
        }
    </style>
</head>
<body>
    <div id="setup-view">
        <div class="controls">
            <button class="btn" id="btn-all"   onclick="selectAll()">全选字库</button>
            <button class="btn" style="background:#eee;color:#555" id="btn-clear" onclick="clearAll()">全部清空</button>
            <button class="btn" style="background:#2ecc71;color:white" id="btn-start" onclick="startGame()">开始对战</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-view">
        <div class="battle-area">
            <div class="side-panel" id="side-1">
                <div class="icon">🥛</div>
                <div class="name" id="name-1">牛奶</div>
            </div>
            <div id="board"></div>
            <div class="side-panel" id="side-2">
                <div class="icon">🍪</div>
                <div class="name" id="name-2">饼干</div>
            </div>
        </div>
        <button id="btn-back-game" onclick="backToSetup()">← 重新选字</button>
    </div>

    <script>
        const LANG = MECC_CONFIG.getLang();
        const t = {
            zh: { title: "自由五子棋", selectAll: "全选字库", clear: "全部清空", start: "开始对战", p1: "牛奶", p2: "饼干", backGame: "← 重新选字", alertEmpty: "请先选择一些汉字哦！" },
            en: { title: "Connect Five", selectAll: "Select All", clear: "Clear", start: "Start Game", p1: "Milk", p2: "Cookie", backGame: "← Back to Selection", alertEmpty: "Please select some characters first!" }
        }[LANG];

        let boardState = Array.from({length: 7}, () => Array(9).fill(0));
        let boardWords = [];
        let currentPlayer = 1;

        // 🌟 终极强壮的发音降级系统
        let globalAudio = new Audio();
        let audioUnlocked = false;

        const unlockInteraction = () => {
            if (audioUnlocked) return;
            globalAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
            globalAudio.play().then(() => { audioUnlocked = true; }).catch(()=>{});
            document.removeEventListener('touchstart', unlockInteraction);
            document.removeEventListener('mousedown', unlockInteraction);
        };
        document.addEventListener('touchstart', unlockInteraction, { passive: true });
        document.addEventListener('mousedown', unlockInteraction, { passive: true });

        async function playUnifiedAudio(text) {
            if (!text) return;
            if (!audioUnlocked) {
                globalAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
                globalAudio.play().catch(()=>{});
                audioUnlocked = true;
            }

            const localPath = `../audio/sight_words_phrases/${encodeURIComponent(text)}.mp3`;
            const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;

            try {
                const localRes = await fetch(localPath, { method: 'HEAD' }).catch(() => null);
                if (localRes && localRes.ok && localRes.headers.get('content-type') && localRes.headers.get('content-type').includes('audio')) {
                    globalAudio.src = localPath;
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            try {
                const azureRes = await fetch(azureUrl).catch(() => null);
                if (azureRes && azureRes.ok && azureRes.headers.get('content-type') && azureRes.headers.get('content-type').includes('audio')) {
                    const audioBlob = await azureRes.blob();
                    globalAudio.src = URL.createObjectURL(audioBlob);
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN'; msg.rate = 0.85; msg.pitch = 1.1;
            window.speechSynthesis.speak(msg);
        }

        window.onload = async () => {
            MECC_CONFIG.renderGlobalNav(t.title);
            document.getElementById('btn-all').innerText      = t.selectAll;
            document.getElementById('btn-clear').innerText    = t.clear;
            document.getElementById('btn-start').innerText    = t.start;
            document.getElementById('name-1').innerText       = t.p1;
            document.getElementById('name-2').innerText       = t.p2;
            document.getElementById('btn-back-game').innerText = t.backGame;

            const grid = document.getElementById('char-grid');
            const words = await MECC_DATA.getSightWords();
            words.forEach(item => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerText = item.char;
                card.onclick = () => {
                    MECC_AUDIO.playSfx('swoosh');
                    playUnifiedAudio(item.char);
                    card.classList.toggle('selected');
                };
                grid.appendChild(card);
            });
        };

        function startGame() {
            const selected = Array.from(document.querySelectorAll('.char-card.selected')).map(el => el.innerText);
            if (selected.length === 0) { MECC_UI.showToast(t.alertEmpty, "error"); return; }

            MECC_AUDIO.playSfx('tada');
            boardState = Array.from({length: 7}, () => Array(9).fill(0));
            boardWords = [];
            currentPlayer = 1;
            while (boardWords.length < 63) boardWords = boardWords.concat(selected);
            boardWords = boardWords.slice(0, 63).sort(() => Math.random() - 0.5);

            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';

            const navBack = document.querySelector('.mecc-nav-back');
            if (navBack) { navBack.href = '#'; navBack.onclick = (e) => { e.preventDefault(); backToSetup(); }; }

            renderBoard();
            updateTurn();
        }

        function backToSetup() {
            MECC_AUDIO.stopAll();
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('setup-view').style.display = '';
            const navBack = document.querySelector('.mecc-nav-back');
            if (navBack) { navBack.href = MECC_CONFIG.getBackHref(); navBack.onclick = null; }
        }

        function renderBoard() {
            const b = document.getElementById('board');
            b.innerHTML = '';
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (boardState[r][c] === 1) cell.classList.add('p1');
                    if (boardState[r][c] === 2) cell.classList.add('p2');
                    const word = boardWords[r * 9 + c];
                    cell.innerText = word;
                    cell.onclick = () => {
                        MECC_AUDIO.playSfx('swoosh');
                        playUnifiedAudio(word);
                        if (boardState[r][c] === 0) {
                            boardState[r][c] = currentPlayer;
                            currentPlayer = currentPlayer === 1 ? 2 : 1;
                        } else if (boardState[r][c] === 1) boardState[r][c] = 2;
                        else boardState[r][c] = 0;
                        renderBoard();
                        updateTurn();
                    };
                    b.appendChild(cell);
                }
            }
        }

        function updateTurn() {
            document.getElementById('side-1').classList.toggle('active', currentPlayer === 1);
            document.getElementById('side-2').classList.toggle('active', currentPlayer === 2);
        }

        function selectAll() { MECC_AUDIO.playSfx('swoosh'); document.querySelectorAll('.char-card').forEach(c => c.classList.add('selected')); }
        function clearAll() { document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected')); }
    </script>
</body>
</html>
