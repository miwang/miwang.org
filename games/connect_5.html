<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥛 自由五子棋 🍪 - MECC</title>

    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        * { box-sizing: border-box; }
        
        body, .btn, .char-card, .name, .cell, #btn-back-game, .win-msg { 
            font-family: "STKaiti","Kaiti SC","KaiTi","楷体","LXGW WenKai Lite",serif !important; 
        }

        .font-en { font-family: "LXGW WenKai Lite", sans-serif !important; }

        body { background-color: #fff9ea; margin: 0; display: flex; flex-direction: column; align-items: center; padding-top: 60px; overflow: auto; min-height: 100vh; }

        #setup-view { width: 95%; max-width: 1100px; text-align: center; padding-top: 16px; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
        #char-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 10px; padding: 20px; background: rgba(89,133,134,0.05); border-radius: 16px; border: 2px dashed #598586; }
        .char-card { aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; background: white; border-radius: 10px; cursor: pointer; border: 2px solid #eee; transition: 0.2s; }
        .char-card.selected { background: #74b9ff; color: white; border-color: #fbc531; transform: scale(1.05); }

        #game-view { display: none; width: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; min-height: calc(100vh - 60px); gap: 20px; }
        .battle-area { display: flex; align-items: center; justify-content: center; gap: clamp(30px, 6vw, 60px); }

        .side-panel { display: flex; flex-direction: column; align-items: center; opacity: 0.25; transition: 0.4s; }
        .side-panel.active { opacity: 1; transform: scale(1.12); }
        .side-panel .icon { font-size: min(90px, 11vh); }
        .side-panel .name { font-size: 1.6rem; font-weight: bold; margin-top: 8px; color: #598586; }

        #board { display: grid; grid-template-columns: repeat(9, 65px); gap: 8px; background: #598586; padding: 12px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 10; }
        .cell { width: 65px; height: 65px; background: white; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 1.8rem; cursor: pointer; transition: 0.2s; }
        .cell:hover { background: #f0f8ff; }
        .cell.p1 { background: #74b9ff; color: white; }
        .cell.p2 { background: #fbc531; color: white; }

        #btn-back-game { background: none; border: 1.5px solid #ccc; color: #888; border-radius: 30px; padding: 8px 24px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        #btn-back-game:hover { border-color: #598586; color: #598586; }

        #win-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); z-index: 999; 
            flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .win-content { text-align: center; animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .win-icon { font-size: 8rem; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)); }
        .win-msg { color: white; font-size: 2.5rem; margin-bottom: 30px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .win-btns { display: flex; justify-content: center; align-items: center; gap: 20px; width: 100%; }
        
        #fireworks-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            body { padding-top: 56px; overflow: hidden; height: 100dvh; align-items: stretch; }
            #setup-view { width: 100%; height: calc(100dvh - 56px); padding: 8px; overflow: hidden; }
            #char-grid { grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 8px; }
            .char-card { font-size: 1.2rem; }
            #game-view { padding: 4px; flex: 1; justify-content: space-between; }
            .battle-area { flex-direction: column; gap: 3px; }
            #board { --cell: calc((100vw - 40px) / 9); grid-template-columns: repeat(9, var(--cell)); gap: 3px; padding: 6px; }
            .cell { width: var(--cell); height: var(--cell); font-size: 1.2rem; }
            .win-icon { font-size: 5rem; }
            .win-msg { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div id="win-overlay">
        <div class="win-content">
            <div class="win-icon" id="winner-icon">🥛</div>
            <div class="win-msg" id="winner-text">恭喜牛奶获胜！</div>
            <div class="win-btns">
                <button class="btn" id="btn-restart" style="background:#2ecc71; color:white; padding: 12px 30px;" onclick="restartGame()">再来一局</button>
                <button class="btn" id="btn-back-setup-overlay" style="background:#fff; color:#333; padding: 12px 30px;" onclick="closeWinOverlay(); backToSetup();">返回选字</button>
            </div>
        </div>
    </div>
    <canvas id="fireworks-canvas"></canvas>

    <div id="setup-view">
        <div class="controls">
            <button class="btn" id="btn-all" onclick="selectAll()">全选字库</button>
            <button class="btn" style="background:#eee;color:#555" id="btn-clear" onclick="clearAll()">全部清空</button>
            <button class="btn" style="background:#2ecc71;color:white" id="btn-start" onclick="startGame()">开始对战</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-view">
        <div class="battle-area">
            <div class="side-panel" id="side-1"><div class="icon">🥛</div><div class="name" id="name-1">牛奶</div></div>
            <div id="board"></div>
            <div class="side-panel" id="side-2"><div class="icon">🍪</div><div class="name" id="name-2">饼干</div></div>
        </div>
        <button id="btn-back-game" onclick="backToSetup()">← 重新选字</button>
    </div>

    <script>
        const LANG = MECC_CONFIG.getLang();
        const t = {
            zh: { title: "🥛 自由五子棋 🍪", selectAll: "全选字库", clear: "全部清空", start: "开始对战", p1: "牛奶", p2: "饼干", backGame: "← 重新选字", alertEmpty: "请先选择一些汉字哦！", win: "赢了！", restart: "再来一局" },
            en: { title: "🥛 Connect Five 🍪", selectAll: "Select All", clear: "Clear All", start: "Start Game", p1: "Milk", p2: "Cookie", backGame: "← Back to Selection", alertEmpty: "Please select characters first!", win: "is the Winner!", restart: "Play Again" }
        }[LANG];

        let boardState = Array.from({length: 7}, () => Array(9).fill(0));
        let boardWords = [];
        let currentPlayer = 1;
        let lastSelectedWords = [];

        // 🌟 核心：直连 Sanity 获取单字和音频字典
        const PROJECT_ID = 'sow12t1i';
        const DATASET = 'production';
        const QUERY = encodeURIComponent('*[_type == "word"] | order(_createdAt asc) {char, "audioUrl": audio.asset->url}');
        const API_URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

        let sanityAudioMap = {};
        let globalAudio = new Audio();

        // 🌟 统一音频降级引擎
        async function playUnifiedAudio(text, sanityAudioUrl) {
            if (!text) return;
            
            globalAudio.pause();
            globalAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
            globalAudio.play().catch(() => {});

            // 第一关：优先云端定制音频
            if (sanityAudioUrl) {
                globalAudio.src = sanityAudioUrl;
                await globalAudio.play().catch(e => console.warn("Sanity音频播放失败", e));
                return;
            }

            const localPath = `../audio/sight_words_phrases/${encodeURIComponent(text)}.mp3`;
            const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;

            // 第二关：本地录音
            try {
                const localRes = await fetch(localPath, { method: 'HEAD' }).catch(() => null);
                if (localRes && localRes.ok && localRes.headers.get('content-type') && localRes.headers.get('content-type').includes('audio')) {
                    globalAudio.src = localPath;
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            // 第三关：Azure 晓晓
            try {
                const azureRes = await fetch(azureUrl).catch(() => null);
                if (azureRes && azureRes.ok && azureRes.headers.get('content-type') && azureRes.headers.get('content-type').includes('audio')) {
                    const audioBlob = await azureRes.blob();
                    globalAudio.src = URL.createObjectURL(audioBlob);
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            // 兜底：系统自带语音
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN'; msg.rate = 0.85; msg.pitch = 1.1;
            window.speechSynthesis.speak(msg);
        }

        window.onload = async () => {
            MECC_CONFIG.renderGlobalNav(t.title.replace(/🥛|🍪/g, '').trim());

            // 国际化文案替换
            document.title = `${t.title} - MECC`;
            document.getElementById('btn-all').innerText = t.selectAll;
            document.getElementById('btn-clear').innerText = t.clear;
            document.getElementById('btn-start').innerText = t.start;
            document.getElementById('name-1').innerText = t.p1;
            document.getElementById('name-2').innerText = t.p2;
            document.getElementById('btn-back-game').innerText = t.backGame;
            document.getElementById('btn-restart').innerText = t.restart;
            document.getElementById('btn-back-setup-overlay').innerText = t.backGame.replace('← ', '');

            // 英文环境适配
            if (LANG === 'en') {
                ['btn-all', 'btn-clear', 'btn-start', 'name-1', 'name-2', 'btn-back-game', 'winner-text', 'btn-restart', 'btn-back-setup-overlay'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('font-en');
                });
            }

            const grid = document.getElementById('char-grid');
            
            // 🌟 获取 Sanity 云端数据
            try {
                const res = await fetch(API_URL).then(r => r.json());
                const list = res.result || [];
                
                list.forEach(item => {
                    if (item.audioUrl) sanityAudioMap[item.char] = item.audioUrl;

                    const card = document.createElement('div');
                    card.className = 'char-card';
                    card.innerText = item.char;
                    card.onclick = () => { 
                        MECC_AUDIO.playSfx('swoosh'); 
                        playUnifiedAudio(item.char, sanityAudioMap[item.char]); 
                        card.classList.toggle('selected'); 
                    };
                    grid.appendChild(card);
                });
            } catch (e) {
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#e74c3c;">获取字库失败，请检查网络！</div>`;
            }
        };

        function startGame() {
            const selected = Array.from(document.querySelectorAll('.char-card.selected')).map(el => el.innerText);
            if (selected.length === 0) { MECC_UI.showToast(t.alertEmpty, "error"); return; }
            lastSelectedWords = selected;
            restartGame();
        }

        function restartGame() {
            closeWinOverlay();
            boardState = Array.from({length: 7}, () => Array(9).fill(0));
            currentPlayer = 1;
            boardWords = [];
            while (boardWords.length < 63) boardWords = boardWords.concat(lastSelectedWords);
            boardWords = boardWords.slice(0, 63).sort(() => Math.random() - 0.5);

            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            renderBoard();
            updateTurn();
        }

        function backToSetup() {
            closeWinOverlay();
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('setup-view').style.display = 'block';
        }

        function renderBoard() {
            const b = document.getElementById('board');
            b.innerHTML = '';
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (boardState[r][c] === 1) cell.classList.add('p1');
                    if (boardState[r][c] === 2) cell.classList.add('p2');
                    const word = boardWords[r * 9 + c];
                    cell.innerText = word;
                    cell.onclick = () => {
                        if (boardState[r][c] === 0) { boardState[r][c] = currentPlayer; currentPlayer = currentPlayer === 1 ? 2 : 1; }
                        else if (boardState[r][c] === 1) boardState[r][c] = 2;
                        else boardState[r][c] = 0;
                        
                        renderBoard();
                        updateTurn();
                        
                        let win = checkWin();
                        if (win) {
                            showWinEffect(win);
                        } else {
                            MECC_AUDIO.playSfx('swoosh');
                            playUnifiedAudio(word, sanityAudioMap[word]);
                        }
                    };
                    b.appendChild(cell);
                }
            }
        }

        function updateTurn() {
            document.getElementById('side-1').classList.toggle('active', currentPlayer === 1);
            document.getElementById('side-2').classList.toggle('active', currentPlayer === 2);
        }

        function checkWin() {
            for (let r = 0; r < 7; r++) {
                for (let c = 0; c < 9; c++) {
                    let p = boardState[r][c]; if (p === 0) continue;
                    if (c+4<9 && p===boardState[r][c+1] && p===boardState[r][c+2] && p===boardState[r][c+3] && p===boardState[r][c+4]) return p;
                    if (r+4<7 && p===boardState[r+1][c] && p===boardState[r+2][c] && p===boardState[r+3][c] && p===boardState[r+4][c]) return p;
                    if (r+4<7 && c+4<9 && p===boardState[r+1][c+1] && p===boardState[r+2][c+2] && p===boardState[r+3][c+3] && p===boardState[r+4][c+4]) return p;
                    if (r+4<7 && c-4>=0 && p===boardState[r+1][c-1] && p===boardState[r+2][c-2] && p===boardState[r+3][c-3] && p===boardState[r+4][c-4]) return p;
                }
            }
            return 0;
        }

        function showWinEffect(p) {
            MECC_AUDIO.playSfx('tada');
            
            const icon = p === 1 ? "🥛" : "🍪";
            const name = p === 1 ? t.p1 : t.p2;
            
            playUnifiedAudio(name + t.win);
            
            document.getElementById('winner-icon').innerText = icon;
            document.getElementById('winner-text').innerText = `🎉 ${name} ${t.win}`;
            document.getElementById('win-overlay').style.display = 'flex';
            startFireworks();
        }

        function closeWinOverlay() {
            document.getElementById('win-overlay').style.display = 'none';
            stopFireworks();
        }

        let fwId;
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function startFireworks() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.1) {
                    const x = Math.random() * canvas.width;
                    const colors = ['#ff74b9', '#fbc531', '#4cd137', '#487eb0', '#e84118'];
                    for(let i=0; i<30; i++) particles.push({
                        x, y: canvas.height, 
                        vx: Math.random() * 6 - 3, vy: Math.random() * -15 - 5,
                        color: colors[Math.floor(Math.random()*colors.length)],
                        life: 100
                    });
                }
                particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                    if (p.life <= 0) particles.splice(i, 1);
                });
                fwId = requestAnimationFrame(loop);
            }
            loop();
        }
        function stopFireworks() { cancelAnimationFrame(fwId); ctx.clearRect(0,0,canvas.width,canvas.height); }

        function selectAll() { document.querySelectorAll('.char-card').forEach(c => c.classList.add('selected')); }
        function clearAll() { document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected')); }
    </script>
</body>
</html>
