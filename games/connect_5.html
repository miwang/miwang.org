<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥛 自由五子棋 🍪</title>
<style>
    /* 强制全局使用楷体 */
    * { 
        box-sizing: border-box;
        font-family: '楷体', 'Kaiti', 'STKaiti', serif !important; 
    }
    
    body { 
        background-color: #fff9ea; 
        margin: 0;
        min-height: 100vh;
        overflow-y: auto; 
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    /* ================= 设置界面样式 ================= */
    #setup-view {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        text-align: center;
    }
    #setup-view h1 { color: #333; margin: 0 0 10px 0; font-size: 40px; }
    #setup-view .instructions { color: #666; margin: 0 0 25px 0; font-size: 20px; font-weight: bold; }
    
    textarea { 
        width: 500px; 
        height: 100px; 
        padding: 15px; 
        font-size: 22px; 
        border-radius: 12px; 
        border: 2px dashed #ccc; 
        resize: vertical; 
        line-height: 1.5;
        white-space: pre-wrap; 
        word-wrap: break-word;
        margin-bottom: 25px;
    }
    textarea:focus { border-color: #74b9ff; outline: none; }
    
    .start-btn { 
        padding: 15px 40px; 
        font-size: 24px; 
        font-weight: bold;
        cursor: pointer; 
        background-color: #4CAF50; 
        color: white; 
        border: none; 
        border-radius: 30px; 
        transition: transform 0.2s, box-shadow 0.2s; 
    }
    .start-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }

    /* ================= 游戏擂台界面样式 ================= */
    #game-view {
        display: none; /* 初始隐藏 */
        width: 100%;
        max-width: 1400px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        position: relative;
    }

    /* 左右侧边栏队徽 */
    .side-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0.3; /* 没轮到的时候变更暗一点，突出当前回合队伍 */
        transform: scale(0.85); 
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .side-panel .logo { font-size: 110px; filter: grayscale(80%); transition: all 0.4s; }
    .side-panel .name { font-size: 36px; font-weight: bold; margin-top: 15px; color: #777; transition: all 0.4s; }

    /* 高亮激活状态 */
    .side-panel.active { opacity: 1; transform: scale(1.1); }
    .side-panel.active .logo { filter: grayscale(0%); }
    
    .side-panel.p1.active .logo { filter: drop-shadow(0 0 25px #74b9ff); }
    .side-panel.p1.active .name { color: #0984e3; text-shadow: 0 0 10px rgba(116, 185, 255, 0.5); }
    
    .side-panel.p2.active .logo { filter: drop-shadow(0 0 25px #fbc531); }
    .side-panel.p2.active .name { color: #e1b12c; text-shadow: 0 0 10px rgba(251, 197, 49, 0.5); }

    /* 中间棋盘区 */
    #board-container {
        flex: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
    }

    #board { 
        display: grid; 
        grid-template-columns: repeat(9, 65px); 
        gap: 8px; 
        background-color: #dcdde1; 
        padding: 12px; 
        border-radius: 12px; 
        box-shadow: 0 8px 25px rgba(0,0,0,0.2); 
    }
    .cell { 
        width: 65px; 
        height: 65px; 
        background-color: white; 
        border-radius: 8px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        font-size: 30px; 
        cursor: pointer; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        user-select: none; 
        transition: all 0.2s ease; 
        position: relative; 
    }
    .cell:hover { transform: scale(1.08); background-color: #fdfdfd; z-index: 2; }
    
    .cell.p1 { background-color: #74b9ff; color: white; transform: scale(0.95); box-shadow: inset 0 4px 8px rgba(0,0,0,0.15); }
    .cell.p1::after { content: '🥛'; position: absolute; bottom: 2px; right: 2px; font-size: 16px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); }

    .cell.p2 { background-color: #fbc531; color: white; transform: scale(0.95); box-shadow: inset 0 4px 8px rgba(0,0,0,0.15); }
    .cell.p2::after { content: '🍪'; position: absolute; bottom: 2px; right: 2px; font-size: 16px; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3)); }
    
    .cell.p1:hover, .cell.p2:hover { transform: scale(1.02); }

    .cell.winning-cell { z-index: 10; border: 3px solid #ff4757; animation: winPulse 1.2s infinite; }
    @keyframes winPulse {
        0% { transform: scale(1.05); box-shadow: 0 0 10px 2px #ff4757; }
        50% { transform: scale(1.15); box-shadow: 0 0 20px 6px #ff4757; }
        100% { transform: scale(1.05); box-shadow: 0 0 10px 2px #ff4757; }
    }

    /* 将返回按钮移至底部并优化样式 */
    .back-btn {
        padding: 8px 25px;
        font-size: 18px;
        background-color: transparent;
        color: #999;
        border: 2px solid #ddd;
        border-radius: 30px;
        cursor: pointer;
        margin-top: 30px; /* 放在棋盘下方并留出间距 */
        transition: all 0.3s;
    }
    .back-btn:hover { 
        background-color: #ecf0f1; 
        color: #555;
        border-color: #ccc;
    }

    /* ================= 奖杯弹窗 ================= */
    #trophy-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #trophy-overlay.show { opacity: 1; pointer-events: auto; }
    
    .trophy-icon { font-size: 150px; transform: scale(0); filter: drop-shadow(0 0 40px gold); }
    #trophy-overlay.show .trophy-icon { animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
    @keyframes popIn { 0% { transform: scale(0) rotate(-20deg); } 80% { transform: scale(1.2) rotate(10deg); } 100% { transform: scale(1) rotate(0deg); } }
    
    .overlay-text { color: white; font-size: 50px; font-weight: bold; margin: 30px 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
    
    .close-btn {
        padding: 15px 40px; font-size: 24px; font-weight: bold;
        background-color: #f1c40f; color: #333; border: none; border-radius: 40px;
        cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.4); margin-top: 20px;
    }
    .close-btn:hover { background-color: #f39c12; transform: scale(1.05) translateY(-3px); }
</style>
</head>
<body>

    <div id="setup-view">
        <h1>🥛 自由五子棋 🍪</h1>
        <div class="instructions">
            规则：<span style="color: #ff4757;">连成五个即获胜！</span><br>
            <span style="font-size: 16px; font-weight: normal; color: #888;">(若点错，再次点击可切换队伍或变回空白)</span>
        </div>
        
        <textarea id="wordList" title="用逗号或空格隔开即可">是,小,去,我,目,你,白,四,头,有,几,多,山,月,人,要,日,手,花,五,个,六,少,八</textarea>
        <button class="start-btn" onclick="startGame()">进入对战擂台</button>
    </div>

    <div id="game-view">
        
        <div class="side-panel p1" id="panel-1">
            <div class="logo">🥛</div>
            <div class="name">牛奶队</div>
        </div>

        <div id="board-container">
            <div id="board"></div>
            <button class="back-btn" onclick="showSetup()">← 返回修改字库重新开局</button>
        </div>

        <div class="side-panel p2" id="panel-2">
            <div class="logo">🍪</div>
            <div class="name">饼干队</div>
        </div>

    </div>

    <div id="trophy-overlay">
        <div class="trophy-icon">🏆</div>
        <div class="overlay-text" id="overlay-msg">恭喜获胜！</div>
        <button class="close-btn" onclick="closeTrophy()">继续查看棋盘</button>
    </div>

<script>
    const rows = 7;
    const cols = 9;
    let boardState = []; 
    let boardWords = []; 
    let currentPlayer = 1; 
    let hasShownTrophy = false; 

    function showSetup() {
        document.getElementById('game-view').style.display = 'none';
        document.getElementById('setup-view').style.display = 'flex';
    }

    function startGame() {
        let rawInput = document.getElementById('wordList').value;
        let words = rawInput.split(/[,，\s]+/).filter(w => w.trim() !== '');
        
        if (words.length === 0) {
            alert("请输入至少一个字！");
            return;
        }

        document.getElementById('setup-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';

        boardWords = [];
        while(boardWords.length < (rows * cols)) {
            boardWords = boardWords.concat(words); 
        }
        boardWords = boardWords.slice(0, rows * cols); 

        for (let i = boardWords.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [boardWords[i], boardWords[j]] = [boardWords[j], boardWords[i]];
        }

        boardState = [];
        currentPlayer = 1;
        hasShownTrophy = false;
        
        for (let r = 0; r < rows; r++) {
            let row = [];
            for (let c = 0; c < cols; c++) {
                row.push(0); 
            }
            boardState.push(row);
        }

        renderBoard();
        evaluateGameState();
    }

    function claimCell(r, c) {
        let currentState = boardState[r][c];

        if (currentState === 0) {
            boardState[r][c] = currentPlayer;
            currentPlayer = currentPlayer === 1 ? 2 : 1;
        } else if (currentState === 1) {
            boardState[r][c] = 2; 
        } else if (currentState === 2) {
            boardState[r][c] = 0; 
        }

        renderBoard();
        evaluateGameState();
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`; 
                
                if (boardState[r][c] === 1) cell.classList.add('p1');
                if (boardState[r][c] === 2) cell.classList.add('p2');
                
                cell.innerText = boardWords[r * cols + c];
                cell.addEventListener('click', () => claimCell(r, c));
                
                boardEl.appendChild(cell);
            }
        }
    }

    function evaluateGameState() {
        const panel1 = document.getElementById('panel-1');
        const panel2 = document.getElementById('panel-2');
        
        let winCells1 = checkWinForPlayer(1);
        let winCells2 = checkWinForPlayer(2);

        panel1.classList.remove('active');
        panel2.classList.remove('active');

        if (!winCells1 && !winCells2) {
            hasShownTrophy = false;
            if (currentPlayer === 1) {
                panel1.classList.add('active');
            } else {
                panel2.classList.add('active');
            }
            return;
        }

        if (winCells1) {
            panel1.classList.add('active'); 
            applyWinHighlight(winCells1);
            if (!hasShownTrophy) showTrophy("🥛 牛奶队");
            return;
        }
        
        if (winCells2) {
            panel2.classList.add('active');
            applyWinHighlight(winCells2);
            if (!hasShownTrophy) showTrophy("🍪 饼干队");
            return;
        }
    }

    function checkWinForPlayer(player) {
        const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (boardState[r][c] !== player) continue;

                for (let [dr, dc] of directions) {
                    let count = 1;
                    let winningCells = [[r, c]]; 
                    let nr = r + dr, nc = c + dc;
                    
                    while (nr >= 0 && nr < rows && nc >= 0 && nc < cols && boardState[nr][nc] === player) {
                        count++;
                        winningCells.push([nr, nc]);
                        nr += dr; nc += dc;
                    }
                    if (count >= 5) return winningCells; 
                }
            }
        }
        return null;
    }

    function applyWinHighlight(cells) {
        cells.forEach(([r, c]) => {
            let cellEl = document.getElementById(`cell-${r}-${c}`);
            if (cellEl) cellEl.classList.add('winning-cell');
        });
    }

    function showTrophy(winnerName) {
        const overlay = document.getElementById('trophy-overlay');
        const msg = document.getElementById('overlay-msg');
        
        msg.style.color = winnerName.includes("牛奶队") ? "#74b9ff" : "#fbc531";
        msg.innerHTML = `🏆 恭喜 ${winnerName} 获胜！ 🏆`;
        
        overlay.classList.add('show');
        hasShownTrophy = true; 
    }

    function closeTrophy() {
        document.getElementById('trophy-overlay').classList.remove('show');
    }
</script>

</body>
</html>
