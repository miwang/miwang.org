<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🚪 这是谁？ 🚪</title>

    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        @import url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css');

        :root {
            --kaiti-font: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --teal: #598586;
            --gold: #f3b236;
            --cream: #fff9ea;
            --green: #4CAF50;
            --red: #ff4757;
            --nav-h: 60px;
            --bottom-btn-space: 54px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--cream);
            font-family: var(--kaiti-font) !important;
            -webkit-font-smoothing: antialiased;
        }

        body {
            padding-top: var(--nav-h);
            color: #1e2e46;
            overflow-x: hidden;
        }

        h1, h2, div, p, button, span, input {
            font-family: var(--kaiti-font) !important;
        }

        .container {
            min-height: calc(100svh - var(--nav-h));
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 12px 8px;
        }

        #memory-screen,
        #play-screen {
            width: min(100%, 1480px);
        }

        #memory-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: 4px;
        }

        .timer-box {
            font-size: clamp(1.7rem, 4.2vh, 3.6rem);
            color: var(--red);
            font-weight: bold;
            line-height: 1.05;
            text-align: center;
        }

        .memory-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            align-items: stretch;
        }

        .memory-card {
            background: rgba(255,255,255,0.92);
            border-radius: 22px;
            padding: 10px 8px;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(30,46,70,0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
            min-height: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .memory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(30,46,70,0.10);
        }

        .memory-card:active { transform: translateY(1px) scale(0.99); }

        .memory-card img {
            height: min(16vh, 180px);
            width: auto;
            max-width: 100%;
            object-fit: contain;
            display: block;
        }

        .memory-card p {
            font-size: clamp(1.2rem, 2.9vh, 2.35rem);
            margin: 4px 0 0;
            color: #333;
            font-weight: bold;
            line-height: 1.08;
        }

        .start-btn {
            background: linear-gradient(180deg, #2e3f66 0%, #1e2e46 100%);
            color: var(--gold);
            border: none;
            padding: 12px 40px;
            border-radius: 999px;
            font-size: clamp(1.2rem, 2.6vh, 1.8rem);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(30,46,70,0.22);
            margin-top: 2px;
            -webkit-tap-highlight-color: transparent;
        }

        .start-btn:active { transform: translateY(2px); }

        #play-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            min-height: calc(100svh - var(--nav-h) - 4px);
            padding-bottom: var(--bottom-btn-space);
        }

        .status-msg {
            font-size: clamp(1.55rem, 3.4vh, 2.8rem);
            color: #333;
            font-weight: bold;
            min-height: 1.25em;
            line-height: 1.08;
            text-align: center;
            margin-top: 0;
            padding: 0 8px;
        }

        .game-stage {
            position: relative;
            width: min(98%, 1080px);
            height: min(40vh, 440px);
            min-height: 210px;
            background: url('../images/family/door.webp') no-repeat center bottom;
            background-size: cover;
            border: 7px solid var(--teal);
            border-radius: 32px;
            box-shadow: 0 10px 24px rgba(30,46,70,0.08);
            overflow: hidden;
        }

        #char-container {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 95%;
            opacity: 0;
            transition: opacity 0.32s ease-out;
            background-repeat: no-repeat;
            background-position: bottom center;
            background-size: contain;
        }

        .answer-grid {
            width: min(98%, 1000px);
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            align-items: stretch;
        }

        .ans-btn {
            background: #f3b236;
            color: #1e2e46;
            border: none;
            padding: 12px 8px;
            border-radius: 20px;
            font-size: clamp(1.15rem, 2.2vh, 1.75rem);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 0 #d49a2a;
            transition: transform 0.12s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 58px;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .ans-btn:active {
            transform: translateY(3px);
            box-shadow: 0 4px 0 #d49a2a;
        }

        .ans-btn.wrong {
            background: #ff4757 !important;
            color: white !important;
            box-shadow: 0 7px 0 #c0392b !important;
        }

        .ans-btn.correct {
            background: #4CAF50 !important;
            color: white !important;
            box-shadow: 0 7px 0 #3e8e41 !important;
        }

        .next-btn {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: max(2px, env(safe-area-inset-bottom));
            z-index: 9500;
            background: linear-gradient(180deg, #2e3f66 0%, #1e2e46 100%);
            color: var(--gold);
            border: none;
            padding: 10px 36px;
            border-radius: 999px;
            font-size: clamp(1.1rem, 2.1vh, 1.55rem);
            font-weight: bold;
            cursor: pointer;
            visibility: hidden;
            box-shadow: 0 8px 18px rgba(30,46,70,0.22);
            min-width: min(68vw, 340px);
            -webkit-tap-highlight-color: transparent;
        }

        .next-btn.show { visibility: visible; }
        .next-btn:active { transform: translateX(-50%) translateY(2px); }

        @media (max-width: 980px) {
            .memory-grid, .answer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .memory-card img { height: min(15vh, 132px); }
            #play-screen { gap: 6px; padding-bottom: 48px; }
            .game-stage { height: min(28vh, 285px); min-height: 162px; }
            .answer-grid { width: 100%; gap: 10px; grid-auto-rows: 1fr; }
            .ans-btn { min-height: clamp(54px, 8vh, 78px); padding: 8px 6px; font-size: clamp(1.02rem, 3.5vw, 1.55rem); }
        }

        @media (max-width: 768px) {
            :root { --nav-h: 54px; --bottom-btn-space: 46px; }
            .container { min-height: calc(100dvh - var(--nav-h)); padding: 5px 10px 6px; }
            #memory-screen { gap: 6px; justify-content: flex-start; }
            .timer-box { font-size: clamp(1.3rem, 4.5vw, 2.1rem); }
            .memory-grid { gap: 8px; }
            .memory-card { border-radius: 17px; padding: 7px 6px; }
            .memory-card img { height: min(11vh, 90px); }
            .memory-card p { font-size: clamp(0.9rem, 5vw, 1.5rem); margin-top: 2px; }
            .start-btn { width: min(84vw, 320px); padding: 10px 14px; font-size: 1.08rem; }
            #play-screen { gap: 5px; padding-bottom: var(--bottom-btn-space); }
            .status-msg { font-size: clamp(1.04rem, 4.6vw, 1.6rem); min-height: 1.45em; }
            .game-stage { width: 100%; height: min(22vh, 180px); min-height: 128px; border-width: 5px; border-radius: 20px; }
            .answer-grid { gap: 8px; width: 100%; }
            .ans-btn { min-height: clamp(56px, 9.2vh, 88px); padding: 8px 4px; border-radius: 15px; font-size: clamp(1.02rem, 5.8vw, 1.52rem); box-shadow: 0 5px 0 #d49a2a; }
            .ans-btn.wrong { box-shadow: 0 5px 0 #c0392b !important; }
            .ans-btn.correct { box-shadow: 0 5px 0 #3e8e41 !important; }
            .next-btn { width: min(78vw, 290px); min-width: 0; padding: 9px 14px; font-size: 1.02rem; bottom: 1px; }
        }

        @media (max-width: 420px) {
            .game-stage { height: min(20vh, 165px); }
            .status-msg { font-size: clamp(0.98rem, 4.5vw, 1.42rem); }
            .ans-btn { font-size: clamp(0.98rem, 5.5vw, 1.36rem); min-height: clamp(54px, 8.6vh, 78px); }
        }

        @media (max-height: 820px) && (max-width: 980px) {
            .container { padding-top: 4px; padding-bottom: 4px; }
            .timer-box { font-size: clamp(1.2rem, 4vw, 1.85rem); }
            .memory-card img { height: min(10vh, 82px); }
            .memory-card p { font-size: clamp(0.88rem, 4.5vw, 1.35rem); }
            .start-btn { font-size: 1rem; padding: 9px 14px; }
            #play-screen { gap: 4px; padding-bottom: 42px; }
            .status-msg { font-size: clamp(0.96rem, 4.2vw, 1.4rem); }
            .game-stage { height: min(18vh, 150px); min-height: 118px; }
            .ans-btn { min-height: clamp(50px, 8vh, 68px); padding: 8px 4px; font-size: clamp(0.95rem, 4.6vw, 1.24rem); }
        }

        @media (min-width: 700px) && (max-width: 1100px) && (max-height: 900px) {
            .container { padding-top: 4px; }
            .timer-box { font-size: clamp(1.35rem, 3.2vh, 2rem); }
            .memory-card img { height: min(10vh, 88px); }
            .memory-card p { font-size: clamp(0.92rem, 2.5vh, 1.45rem); }
            .start-btn { padding: 10px 20px; font-size: 1.05rem; }
            #play-screen { padding-bottom: 44px; }
            .status-msg { font-size: clamp(1rem, 2.8vh, 1.48rem); }
            .game-stage { height: min(16vh, 140px); min-height: 114px; }
            .answer-grid { gap: 8px; }
            .ans-btn { min-height: clamp(50px, 7vh, 66px); padding: 8px 6px; font-size: clamp(1rem, 2.2vh, 1.3rem); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="memory-screen">
            <div class="timer-box" id="countdown"></div>
            <div class="memory-grid" id="memory-grid"></div>
            <button class="start-btn" id="ui-start-btn" onclick="startGame()"></button>
        </div>

        <div id="play-screen">
            <div class="status-msg" id="msg"></div>
            <div class="game-stage">
                <div id="char-container"></div>
            </div>
            <div id="btn-container" class="answer-grid"></div>
            <button class="next-btn" id="next-btn" onclick="nextRound()"></button>
        </div>
    </div>

    <script>
        const LANG = MECC_CONFIG.getLang();
        const t = {
            zh: { navTitle: "这是谁？", timer: "倒计时", start: "开始挑战！", next: "下一位家人", success: "你真棒！是", back: "返回工具台", restart: "重新记忆", wrong: "不对哦", allDone: "全认识了！" },
            en: { navTitle: "Who is it?", timer: "Timer", start: "Start!", next: "Next Person", success: "Great job! It's ", back: "Back to Parents Portal", restart: "Restart", wrong: "Try again", allDone: "Amazing!" }
        }[LANG];

        const members = ['爷爷', '奶奶', '爸爸', '妈妈', '哥哥', '姐姐', '弟弟', '妹妹'];
        const pinyinMap = {
            '爷爷':'yeye', '奶奶':'nainai', '爸爸':'baba', '妈妈':'mama',
            '哥哥':'gege', '姐姐':'jiejie', '弟弟':'didi', '妹妹':'meimei'
        };

        let remainingMembers = [];
        let timeLeft = 60;
        let timerId = null;
        let currentTarget = null;
        let isLocked = false;

        let audioUnlocked = false;
        let audioCtx = null;
        const audioUrls = { doorbell: '../audio/doorbell.mp3', correct: '../audio/correct.mp3', wrong: '../audio/wrong.mp3' };
        const sfxPool = {};

        function createAudioPool(name, src, count = 4) {
            sfxPool[name] = Array.from({ length: count }, () => {
                const a = new Audio(src); a.preload = 'auto'; a.playsInline = true; return a;
            });
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) {
                    audioCtx = new Ctx(); const buffer = audioCtx.createBuffer(1, 1, 22050);
                    const source = audioCtx.createBufferSource(); source.buffer = buffer;
                    source.connect(audioCtx.destination);
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    source.start(0);
                }
            } catch (e) {}

            Object.values(sfxPool).flat().forEach(a => {
                try {
                    a.muted = true; const p = a.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
                    } else { a.muted = false; }
                } catch (e) { a.muted = false; }
            });
        }

        function playSfx(name) {
            unlockAudio();
            const pool = sfxPool[name]; if (!pool) return;
            const a = pool.find(x => x.paused || x.ended) || pool[0];
            try { a.currentTime = 0; a.play().catch(() => null); } catch (e) {}
        }

        // ==========================================
        // 🌟 统一的三级音频降级系统
        // ==========================================
        let globalAudio = null;

    async function playUnifiedAudio(text) {
        if (!text) return;
        if (globalAudio) { globalAudio.pause(); globalAudio = null; }

        const localPath = `../audio/sentences/${encodeURIComponent(text)}.mp3`;
        const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;

        try {
            const localRes = await fetch(localPath, { method: 'HEAD' }).catch(() => null);
            if (localRes && localRes.ok && localRes.headers.get('content-type') && localRes.headers.get('content-type').includes('audio')) {
                globalAudio = new Audio(localPath);
                await globalAudio.play();
                return; 
            }
        } catch(e) {}

        try {
            const azureRes = await fetch(azureUrl);
            if (azureRes.ok && azureRes.headers.get('content-type') && azureRes.headers.get('content-type').includes('audio')) {
                const audioBlob = await azureRes.blob();
                globalAudio = new Audio(URL.createObjectURL(audioBlob));
                await globalAudio.play();
                return; 
            }
        } catch(e) {}

        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-CN'; msg.rate = 0.85; msg.pitch = 1.1;
        window.speechSynthesis.speak(msg);
    }
        // ==========================================

        function updateCountdown() { document.getElementById('countdown').innerText = `${t.timer}: ${timeLeft}s`; }

        function updateNavBackText() {
            const btn = document.querySelector('.mecc-nav-back'); if (!btn) return;
            const isMobile = window.innerWidth <= 768; const label = btn.dataset.mode === 'restart' ? t.restart : t.back;
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px;flex-shrink:0;"><circle cx="12" cy="12" r="10"></circle><line x1="16" y1="12" x2="8" y2="12"></line><polyline points="12 8 8 12 12 16"></polyline></svg>${isMobile ? '' : `<span>${label}</span>`}`;
            btn.style.gap = isMobile ? '0px' : '6px';
        }

        function autoFitAnswerButtons() {
            const grid = document.getElementById('btn-container'); if (!grid) return;
            const buttons = [...grid.querySelectorAll('.ans-btn')]; if (!buttons.length) return;
            buttons.forEach(btn => btn.style.fontSize = '');
            const maxFont = window.innerWidth <= 768 ? 26 : 34; const minFont = window.innerWidth <= 768 ? 16 : 18;
            let chosen = maxFont;
            for (let size = maxFont; size >= minFont; size--) {
                buttons.forEach(btn => btn.style.fontSize = size + 'px');
                const fits = buttons.every(btn => btn.scrollHeight <= btn.clientHeight + 1 && btn.scrollWidth <= btn.clientWidth + 1);
                if (fits) { chosen = size; break; }
            }
            buttons.forEach(btn => btn.style.fontSize = chosen + 'px');
        }

        window.onload = () => {
            createAudioPool('doorbell', audioUrls.doorbell, 3);
            createAudioPool('correct', audioUrls.correct, 3);
            createAudioPool('wrong', audioUrls.wrong, 3);

            MECC_CONFIG.renderGlobalNav(t.navTitle);
            const btn = document.querySelector('.mecc-nav-back');
            if (btn) { btn.dataset.mode = 'back'; updateNavBackText(); }

            document.getElementById('ui-start-btn').innerText = t.start;
            document.getElementById('next-btn').innerText = t.next;
            updateCountdown();

            document.getElementById('memory-grid').innerHTML = members.map(m => `
                <div class="memory-card" onclick="sayName('${m}')">
                    <img src="../images/family/${pinyinMap[m]}.webp" alt="${m}">
                    <p>${m}</p>
                </div>`).join('');

            document.getElementById('btn-container').innerHTML = members.map(m => `<button class="ans-btn" onclick="check(this, '${m}')">${m}</button>`).join('');

            autoFitAnswerButtons();
            window.addEventListener('resize', () => { updateNavBackText(); autoFitAnswerButtons(); });

            timerId = setInterval(() => { timeLeft--; updateCountdown(); if (timeLeft <= 0) startGame(); }, 1000);
            ['touchstart', 'touchend', 'pointerdown', 'click'].forEach(evt => { document.addEventListener(evt, unlockAudio, { passive: true, once: true }); });
        };

        function startGame() {
            unlockAudio(); clearInterval(timerId); remainingMembers = [...members];
            document.getElementById('memory-screen').style.display = 'none'; document.getElementById('play-screen').style.display = 'flex';
            const btn = document.querySelector('.mecc-nav-back');
            if (btn) { btn.removeAttribute('href'); btn.dataset.mode = 'restart'; updateNavBackText(); btn.onclick = (e) => { e.preventDefault(); location.reload(); }; }
            nextRound(); autoFitAnswerButtons();
        }

        function nextRound() {
            if (remainingMembers.length === 0) { alert(t.allDone); remainingMembers = [...members]; }
            isLocked = false; currentTarget = remainingMembers.splice(Math.floor(Math.random() * remainingMembers.length), 1)[0];
            document.getElementById('msg').innerText = "";
            const charDiv = document.getElementById('char-container');
            charDiv.style.opacity = "0"; charDiv.style.backgroundImage = "none";
            document.getElementById('next-btn').classList.remove('show');
            document.querySelectorAll('.ans-btn').forEach(b => { b.classList.remove('wrong', 'correct'); });
            playSfx('doorbell'); autoFitAnswerButtons();
        }

        function check(btn, name) {
            sayName(name);
            if (name === currentTarget) {
                if (!btn.classList.contains('correct')) {
                    btn.classList.add('correct');
                    document.getElementById('msg').innerText = `${t.success}${name}！`; document.getElementById('msg').style.color = "#4CAF50";
                    const charDiv = document.getElementById('char-container');
                    charDiv.style.backgroundImage = `url('../images/family/${pinyinMap[name]}.webp')`; charDiv.style.opacity = "1";
                    document.getElementById('next-btn').classList.add('show');
                    if (!isLocked) { setTimeout(() => playSfx('correct'), 220); }
                }
                isLocked = true;
            } else {
                btn.classList.add('wrong');
                if (!isLocked) { document.getElementById('msg').innerText = t.wrong; document.getElementById('msg').style.color = "#ff4757"; playSfx('wrong'); }
            }
        }
    </script>
</body>
</html>
