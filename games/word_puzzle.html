<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">四会字认读拼图</title>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* 🌟 核心修复 1：强制引入 LXGW 字体 */
        @import url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css');

        /* 🌟 核心修复 2：明确区分中英文的字体类 */
        .font-zh { font-family: "KaiTi-CJK", "LXGW WenKai Lite", serif !important; }
        .font-en { font-family: "LXGW WenKai Lite", system-ui, -apple-system, sans-serif !important; }

        :root {
            --piece-size: 115px;
            --board-gap: 18px;
            --board-pad-y: 30px;
            --board-pad-x: 40px;
        }

        body {
            overflow: hidden; 
            touch-action: none;
            user-select: none;
            background-color: #f5f1e7; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        /* 🌟 导航栏布局与文字 */
        .mecc-global-nav {
            display: flex;
            align-items: center;
            justify-content: space-between; 
            padding: 0 25px;
            box-sizing: border-box;
            height: 60px;
        }

        .mecc-nav-title {
            position: absolute; 
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            white-space: nowrap;
        }

        .nav-controls {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
        }

        .btn-refresh { 
            background: transparent; 
            color: #ffffff; 
            border: 2px solid rgba(255, 255, 255, 0.6); 
            border-radius: 12px; 
            padding: 5px 14px; 
            font-size: 1.05rem;  
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            box-shadow: none; 
            transition: all 0.2s ease;
        }
        
        .btn-refresh:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffffff;
        }

        .btn-refresh:active { 
            transform: scale(0.95); 
        }

        .btn-refresh svg {
            width: 22px; height: 22px;
            stroke-width: 7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .game-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 棋盘 */
        .puzzle-board {
            background-color: #faf8f5;
            border: 6px solid #8b2b2b; 
            border-radius: 12px;
            padding: var(--board-pad-y) var(--board-pad-x);
            box-shadow: 0 15px 35px rgba(139, 43, 43, 0.15), inset 0 0 20px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: var(--board-gap); 
            z-index: 1;
            position: relative;
        }

        .puzzle-board::before {
            content: '';
            position: absolute;
            top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px solid #d4af37;
            border-radius: 6px;
            pointer-events: none;
        }

        .drop-slot {
            width: var(--piece-size); 
            height: var(--piece-size);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center; 
            transition: transform 0.1s;
        }

        .slot-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* 空白坑位的呼吸灯特效 */
        @keyframes emptySlotGlow {
            0%, 100% { stroke: rgba(139, 43, 43, 0.2); stroke-width: 6; }
            50% { stroke: rgba(243, 178, 54, 0.85); stroke-width: 9; }
        }
        
        body.game-unlocked .drop-slot:not(.filled) .slot-stroke {
            animation: emptySlotGlow 1.8s infinite ease-in-out;
        }

        .slot-img-inner {
            transition: opacity 0.4s ease;
            pointer-events: none; 
        }

        /* 3D 闪卡容器 */
        .wood-block {
            position: absolute;
            width: var(--piece-size);  
            height: var(--piece-size);
            z-index: 10;
            perspective: 1000px;
        }

        .flip-inner {
            position: relative;
            width: 100%; height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); 
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.2));
        }

        .wood-block.is-flipped .flip-inner { transform: rotateY(180deg); }

        .flip-front, .flip-back {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .flip-back { transform: rotateY(180deg); }

        .wood-block .flip-front { opacity: 1; transition: opacity 0.1s 0.25s; }
        .wood-block.is-flipped .flip-front { opacity: 0; }
        .wood-block .flip-back { opacity: 0; transition: opacity 0.1s 0.25s; }
        .wood-block.is-flipped .flip-back { opacity: 1; }

        .wood-block svg { width: 100%; height: 100%; pointer-events: none; overflow: visible !important; }
        .front-img-inner { transition: opacity 0.4s ease; }

        /* 拖拽状态与锁定状态 */
        .wood-block.ready-to-drag { cursor: grab; }
        .wood-block.ready-to-drag.dragging {
            cursor: grabbing; transition: none; transform: scale(1.15) !important; z-index: 999;
        }
        
        .wood-block.locked {
            cursor: pointer; 
            pointer-events: auto; 
            width: 100%; height: 100%; 
            transform: none !important;
        }
        .wood-block.locked .flip-inner { transform: rotateY(180deg); }

        @keyframes popReady {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); }
            100% { transform: rotateY(180deg) scale(1); }
        }
        .pop-ready { animation: popReady 0.35s ease-in-out; }

        /* 游戏规则提示横幅 */
        .rule-banner {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(253, 250, 245, 0.95);
            border: 3px solid #e6c27a;
            padding: 10px 25px;
            border-radius: 30px;
            color: #8b2b2b;
            font-weight: bold;
            font-size: 1.15rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            z-index: 50;
            text-align: center;
            white-space: nowrap;
            transition: all 0.4s ease;
        }

        .rule-banner.unlocked {
            background: #598586;
            border-color: #3e6061;
            color: white;
            transform: translateX(-50%) scale(1.05);
        }

        @keyframes rainbowStroke {
            0%   { stroke: #ff4757; filter: drop-shadow(0 0 10px #ff4757); }
            33%  { stroke: #2ed573; filter: drop-shadow(0 0 10px #2ed573); }
            66%  { stroke: #1e90ff; filter: drop-shadow(0 0 10px #1e90ff); }
            100% { stroke: #ff4757; filter: drop-shadow(0 0 10px #ff4757); }
        }
        .wood-block.locked .flip-back svg path:first-child {
            animation: rainbowStroke 2.5s linear infinite; stroke-width: 6; 
        }

        .ghost-img {
            position: fixed; width: var(--piece-size); height: var(--piece-size); z-index: 1000;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3)); pointer-events: none;
        }

        /* 通关弹窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none; transition: 0.4s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-box {
            background: #fffdf8; padding: 40px 60px; border-radius: 24px; text-align: center;
            border: 6px solid #8b2b2b; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-box { transform: scale(1); }
        
        .modal-title { font-size: 2.2rem; color: #8b2b2b; margin-bottom: 30px; font-weight: bold; }
        .modal-btns { display: flex; gap: 20px; justify-content: center; }
        .m-btn {
            border: none; border-radius: 12px; padding: 12px 25px; font-size: 1.3rem; font-weight: bold;
            cursor: pointer; transition: transform 0.1s; text-decoration: none; display: flex; align-items: center;
        }
        .m-btn.play { background: #598586; color: white; box-shadow: 0 5px 0 #3e6061; }
        .m-btn.exit { background: #e0e0e0; color: #333; box-shadow: 0 5px 0 #bdbdbd; }
        .m-btn:active { transform: translateY(5px); box-shadow: 0 0 0 transparent !important; }

        @keyframes tada {
            0% { transform: scale(1); }
            10%, 20% { transform: scale(0.9) rotate(-3deg); }
            30%, 50%, 70%, 90% { transform: scale(1.1) rotate(3deg); }
            40%, 60%, 80% { transform: scale(1.1) rotate(-3deg); }
            100% { transform: scale(1); }
        }
        .success-anim { animation: tada 0.5s forwards; }
        
        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20%, 60% { transform: rotateY(180deg) translateX(-8px) rotate(-5deg); }
            40%, 80% { transform: rotateY(180deg) translateX(8px) rotate(5deg); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        @media (max-width: 900px) {
            :root {
                --piece-size: 72px;
                --board-gap: 8px;
                --board-pad-y: 12px;
                --board-pad-x: 12px;
            }

            body {
                overflow: auto;
                touch-action: manipulation;
            }

            .game-container {
                align-items: flex-start;
                padding-top: 10px;
            }

            .puzzle-board {
                grid-template-columns: repeat(5, 1fr);
            }

            .rule-banner {
                bottom: 8px;
                max-width: calc(100vw - 16px);
                white-space: normal;
                font-size: 0.95rem;
                line-height: 1.35;
                padding: 8px 14px;
            }
        }

        @media (max-width: 640px) {
            :root {
                --piece-size: 62px;
            }
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position:absolute;">
        <defs>
            <clipPath id="biscuitClip" clipPathUnits="userSpaceOnUse">
                <path d="M60,6 C90,-6 126,30 114,60 C126,90 90,126 60,114 C30,126 -6,90 6,60 C-6,30 30,-6 60,6 Z"/>
            </clipPath>
        </defs>
    </svg>

    <nav class="mecc-global-nav">
        <a id="nav-back-link" href="../teachers.html" class="mecc-nav-back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span id="nav-back-text" class="font-zh">返回工具台</span>
        </a>
        <h1 id="nav-title" class="mecc-nav-title font-zh">四会字认读拼图</h1>
        <div class="nav-controls">
            <button onclick="renderPage()" class="btn-refresh font-zh">
                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor">
                    <path d="M 45 18 C 20 22 10 45 15 65 C 20 85 45 90 65 80 C 85 70 90 45 80 25" />
                    <path d="M 60 20 L 80 25 L 75 45" />
                </svg>
                <span id="btn-refresh-text">换一局</span>
            </button>
        </div>
    </nav>

    <div class="game-container" id="gameContainer">
        <div class="puzzle-board" id="boardZone">
            <div id="loading-text" class="font-zh" style="grid-column: span 5; text-align: center; color: #8b2b2b;">正在研墨取字...</div>
        </div>
        
        <div id="ruleText" class="rule-banner font-zh"></div>
    </div>

    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div id="modal-title" class="modal-title font-zh">🎉 太棒啦！拼图完成！</div>
            <div class="modal-btns">
                <a id="modal-btn-exit" href="../teachers.html" class="m-btn exit font-zh">退出返回</a>
                <button id="modal-btn-play" onclick="startNextRound()" class="m-btn play font-zh">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================
        // 语言与路由检测逻辑
        // =====================================
        const urlParams = new URLSearchParams(window.location.search);
        const isEnglish = urlParams.get('role') === 'parents' || document.referrer.includes('parents.html');
        const LANG = isEnglish ? 'en' : 'zh';
        
        // 🌟 核心修复 3：如果是英文模式，瞬间把所有静态 UI 文字的“外套”换成 font-en (强制使用 LXGW)
        // 🌟 英文模式下的优雅字体切换
if (isEnglish) {
    // 1. 触发 common_nav.css 里写好的专属导航栏英文规则
    document.getElementById('nav-back-link').classList.add('en');
    document.getElementById('nav-title').classList.add('en');

    // 2. 其余普通元素（比如“换一局”按钮），利用 style.css 的全局类名切换
    document.querySelectorAll('.font-zh').forEach(el => {
        el.classList.remove('font-zh');
        el.classList.add('font-en');
    });
}
        
        const t = {
            zh: {
                title: "四会字认读拼图",
                back: "返回工具台",
                refresh: "换一局",
                loading: "正在研墨取字...",
                rule: "💡 请先点击所有卡片完成认读，全部翻开后即可开始拼图哦！",
                unlocked: "🌟 认读完成！快把汉字拖进对应的空位里吧！",
                successTitle: "🎉 太棒啦！拼图完成！",
                exit: "退出返回",
                playAgain: "再玩一次",
                backUrl: "../teachers.html"
            },
            en: {
                title: "Character Puzzle",
                back: "Back to Parents Portal",
                refresh: "New Game",
                loading: "Loading characters...",
                rule: "💡 Tap all cards to review the words. The puzzle unlocks after all cards are flipped!",
                unlocked: "🌟 Review complete! Now drag the characters to the correct slots!",
                successTitle: "🎉 Awesome! Puzzle Completed!",
                exit: "Exit",
                playAgain: "Play Again",
                backUrl: "../parents.html"
            }
        }[LANG];

        document.title = t.title;
        document.getElementById('nav-title').innerText = t.title;
        document.getElementById('nav-back-text').innerText = t.back;
        document.getElementById('btn-refresh-text').innerText = t.refresh;
        document.getElementById('loading-text').innerText = t.loading;
        document.getElementById('modal-title').innerText = t.successTitle;
        document.getElementById('modal-btn-exit').innerText = t.exit;
        document.getElementById('modal-btn-play').innerText = t.playAgain;
        
        document.getElementById('nav-back-link').href = t.backUrl;
        document.getElementById('modal-btn-exit').href = t.backUrl;

        // =====================================
        // Azure TTS 统一音频播放
        // =====================================
        let globalAudio = new Audio();
        async function playUnifiedAudio(text, sanityAudioUrl) {
            if (!text) return;
            globalAudio.pause();
            globalAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
            globalAudio.play().catch(() => {});

            if (sanityAudioUrl) {
                globalAudio.src = sanityAudioUrl;
                await globalAudio.play().catch(e => e);
                return;
            }

            const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;
            try {
                const azureRes = await fetch(azureUrl).catch(() => null);
                if (azureRes && azureRes.ok) {
                    const audioBlob = await azureRes.blob();
                    globalAudio.src = URL.createObjectURL(audioBlob);
                    await globalAudio.play();
                    return; 
                }
            } catch(e) {}

            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN'; msg.rate = 0.85; msg.pitch = 1.1;
            window.speechSynthesis.speak(msg);
        }

        // 欢快的通关庆祝音效
        function playHappySound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine';

                osc.frequency.setValueAtTime(987.77, ctx.currentTime); // B5
                osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.1); // E6

                gain.gain.setValueAtTime(0, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);

                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.4);
            } catch(e){}
        }

        // 可爱的卡通果冻弹簧音 (Boop)
        function playBoopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine';
                
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } catch(e){}
        }

        // =====================================
        // 游戏核心逻辑
        // =====================================
        const PROJECT_ID = 'sow12t1i'; 
        const DATASET = 'production';         
        const query = encodeURIComponent(`*[_type == "word" && defined(image)]{ char, "imageUrl": image.asset->url, "audioUrl": audio.asset->url }`);
        const sanityUrl = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${query}`;

        const boardZone = document.getElementById('boardZone');
        const gameContainer = document.getElementById('gameContainer');
        const ruleBanner = document.getElementById('ruleText');
        const DEFAULT_PIECE_SIZE = 115; // 与 CSS :root 的默认 --piece-size 保持一致
        const MOBILE_BREAKPOINT = 900;
        const MOBILE_SIDE_MARGIN = 8;
        const MOBILE_MIN_COLS = 3;
        const MOBILE_MAX_COLS = 5;
        const MOBILE_MIN_GAP = 8;
        const MOBILE_SPACING_BELOW_BOARD = 12;
        const MOBILE_MIN_TOP_FALLBACK = 76;

        let allWords = [];
        const ITEMS_PER_PAGE = 15; 
        let matchedCount = 0;
        let flippedCount = 0; 

        const toyColors = ['#ff8fa3', '#80ed99', '#7cd4fd', '#ffdc5e', '#e4c1f9', '#ffb5a7'];
        const pathStr = "M60,6 C90,-6 126,30 114,60 C126,90 90,126 60,114 C30,126 -6,90 6,60 C-6,30 30,-6 60,6 Z";
        
        function generateSlotSVG(imageUrl) {
            const imgTag = imageUrl ? `<image href="${imageUrl}" x="8" y="8" width="104" height="104" preserveAspectRatio="xMidYMid slice" clip-path="url(#biscuitClip)" opacity="0" class="slot-img-inner" />` : '';
            return `<svg class="slot-bg" viewBox="-15 -15 150 150" xmlns="http://www.w3.org/2000/svg">
                <path d="${pathStr}" fill="#e6dfd1" />
                ${imgTag}
                <path class="slot-stroke" d="${pathStr}" fill="none" stroke="rgba(139, 43, 43, 0.2)" stroke-width="6" />
            </svg>`;
        }

        function generateSVGBlock(color, char, isFront, imageUrl) {
            const fillColor = isFront ? "#fcfcfc" : color;
            let contentHtml = "";
            if (isFront && imageUrl) {
                contentHtml = `<image href="${imageUrl}" x="8" y="8" width="104" height="104" preserveAspectRatio="xMidYMid slice" clip-path="url(#biscuitClip)" class="front-img-inner" />`;
            } else if (!isFront) {
                // 🌟 木块上动态生成的汉字坚决保留 font-zh，永远使用楷体
                contentHtml = `<text x="60" y="60" dominant-baseline="central" class="font-zh" font-size="58" font-weight="bold" fill="#111" text-anchor="middle">${char}</text>`;
            }
            return `<svg viewBox="-15 -15 150 150" xmlns="http://www.w3.org/2000/svg">
                <path d="${pathStr}" fill="${fillColor}" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
                ${contentHtml}
            </svg>`;
        }

        async function fetchSanityAndInit() {
            try {
                const response = await fetch(sanityUrl);
                const result = await response.json();
                allWords = result.result || [];
                if (allWords.length > 0) {
                    renderPage();
                } else {
                    boardZone.innerHTML = `<div class="${isEnglish ? 'font-en' : 'font-zh'}">未找到数据 / No data found</div>`;
                }
            } catch (error) { 
                boardZone.innerHTML = `<div class="${isEnglish ? 'font-en' : 'font-zh'}">网络错误 / Network Error</div>`; 
            }
        }

        function startNextRound() {
            document.getElementById('successModal').classList.remove('active');
            renderPage();
        }

        function arrangeGrid(blocks) {
            const cssPieceSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--piece-size')) || DEFAULT_PIECE_SIZE;
            const w = blocks[0]?.offsetWidth || cssPieceSize; 
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const isMobile = screenW <= MOBILE_BREAKPOINT;

            if (isMobile) {
                const containerRect = gameContainer.getBoundingClientRect();
                const boardRect = boardZone.getBoundingClientRect();
                const gap = Math.max(MOBILE_MIN_GAP, Math.round(w * 0.1));
                const cols = Math.max(MOBILE_MIN_COLS, Math.min(MOBILE_MAX_COLS, Math.floor((screenW - MOBILE_SIDE_MARGIN * 2 + gap) / (w + gap))));
                const totalW = cols * w + (cols - 1) * gap;
                const startX = Math.max(MOBILE_SIDE_MARGIN, (screenW - totalW) / 2);
                // 先把棋盘底部换算到 gameContainer 的局部坐标，再在其下方留出固定间距摆放拖拽卡片
                const startY = Math.max(boardRect.bottom - containerRect.top + MOBILE_SPACING_BELOW_BOARD, MOBILE_MIN_TOP_FALLBACK);

                blocks.forEach((block, i) => {
                    const r = Math.floor(i / cols);
                    const c = i % cols;
                    const posX = startX + c * (w + gap);
                    const posY = startY + r * (w + gap);
                    block.style.left = `${posX}px`;
                    block.style.top = `${posY}px`;
                    block.style.setProperty('--rot', Math.floor(Math.random() * 12 - 6));
                    block.style.transform = `rotate(${block.style.getPropertyValue('--rot')}deg)`;
                });
                return;
            }

            const sidebarWidth = 250; 
            const cols = 2; 
            const startY = 80;
            const usableH = screenH - startY - 20;

            const placeBlocks = (arr, isLeft) => {
                const startX = isLeft ? 20 : screenW - sidebarWidth + 20;
                const rows = Math.ceil(arr.length / cols);
                const hStep = Math.min(w + 15, usableH / rows); 
                const wStep = (sidebarWidth - 40 - w) / (cols - 1);

                arr.forEach((block, i) => {
                    const r = Math.floor(i / cols);
                    const c = i % cols;
                    
                    let posX = startX + c * wStep;
                    if (arr.length <= cols && i === 0 && arr.length === 1) {
                         posX = startX + (sidebarWidth - 40 - w)/2;
                    }
                    
                    let posY = startY + r * hStep + (Math.random() * 8); 

                    block.style.left = `${posX}px`;
                    block.style.top = `${posY}px`;
                    block.style.setProperty('--rot', Math.floor(Math.random() * 20 - 10));
                    block.style.transform = `rotate(${block.style.getPropertyValue('--rot')}deg)`;
                });
            };
            
            const leftArr = blocks.slice(0, 8);
            const rightArr = blocks.slice(8, 15);
            
            placeBlocks(leftArr, true);
            placeBlocks(rightArr, false);
        }

        function renderPage() {
            boardZone.innerHTML = '';
            document.querySelectorAll('.wood-block, .ghost-img').forEach(b => b.remove());
            
            document.body.classList.remove('game-unlocked');
            matchedCount = 0;
            flippedCount = 0; 
            ruleBanner.innerText = t.rule;
            ruleBanner.style.opacity = '1';
            ruleBanner.classList.remove('unlocked');

            const currentWords = [...allWords].sort(() => Math.random() - 0.5).slice(0, ITEMS_PER_PAGE);
            const shuffledForPanels = [...currentWords].sort(() => Math.random() - 0.5);

            currentWords.forEach((item) => {
                const slot = document.createElement('div');
                slot.className = 'drop-slot';
                slot.id = `slot-${item.char}`;
                slot.dataset.char = item.char;
                slot.innerHTML = generateSlotSVG(item.imageUrl);
                boardZone.appendChild(slot);
            });

            setTimeout(() => {
                let createdBlocks = [];
                shuffledForPanels.forEach((item) => {
                    const block = document.createElement('div');
                    block.className = 'wood-block';
                    block.dataset.char = item.char;
                    const bgColor = toyColors[currentWords.findIndex(w => w.char === item.char) % toyColors.length];
                    
                    block.innerHTML = `
                        <div class="flip-inner">
                            <div class="flip-front">
                                ${generateSVGBlock(bgColor, item.char, true, item.imageUrl)}
                            </div>
                            <div class="flip-back">
                                ${generateSVGBlock(bgColor, item.char, false, null)}
                            </div>
                        </div>
                    `;

                    gameContainer.appendChild(block);
                    createdBlocks.push(block);

                    block.addEventListener('click', function handleReviewClick() {
                        if (block.classList.contains('is-flipped')) return; 
                        
                        playUnifiedAudio(item.char, item.audioUrl);
                        
                        const frontImg = block.querySelector('.front-img-inner');
                        if(frontImg) frontImg.style.opacity = '0';
                        
                        block.classList.add('is-flipped'); 
                        
                        if (item.imageUrl) {
                            setTimeout(() => animateImageFlight(item, block, checkAllFlipped), 150);
                        } else {
                            setTimeout(() => checkAllFlipped(), 600);
                        }
                    });
                });

                arrangeGrid(createdBlocks);
            }, 50);
        }

        function checkAllFlipped() {
            flippedCount++;
            if (flippedCount === ITEMS_PER_PAGE) {
                ruleBanner.innerText = t.unlocked;
                ruleBanner.classList.add('unlocked');
                
                document.body.classList.add('game-unlocked');

                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                    osc.start(); osc.stop(ctx.currentTime + 0.5);
                } catch(e) {}

                const blocks = document.querySelectorAll('.wood-block');
                blocks.forEach((block, idx) => {
                    setTimeout(() => {
                        block.classList.add('ready-to-drag');
                        makeDraggable(block);
                        const inner = block.querySelector('.flip-inner');
                        inner.classList.add('pop-ready');
                        setTimeout(() => inner.classList.remove('pop-ready'), 350);
                    }, idx * 60); 
                });
            }
        }

        function animateImageFlight(item, block, callback) {
            const targetSlot = document.getElementById(`slot-${item.char}`);
            if (!targetSlot) return;

            const blockRect = block.getBoundingClientRect();
            const slotRect = targetSlot.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();

            const ghost = document.createElement('div');
            ghost.className = 'ghost-img';
            ghost.innerHTML = `<svg viewBox="-15 -15 150 150" xmlns="http://www.w3.org/2000/svg">
                <image href="${item.imageUrl}" x="8" y="8" width="104" height="104" preserveAspectRatio="xMidYMid slice" clip-path="url(#biscuitClip)" />
            </svg>`;
            
            ghost.style.left = (blockRect.left - containerRect.left) + 'px';
            ghost.style.top = (blockRect.top - containerRect.top) + 'px';
            gameContainer.appendChild(ghost);
            
            ghost.getBoundingClientRect(); 

            ghost.style.left = (slotRect.left - containerRect.left) + 'px';
            ghost.style.top = (slotRect.top - containerRect.top) + 'px';

            setTimeout(() => {
                ghost.remove();
                const slotImg = targetSlot.querySelector('.slot-img-inner');
                
                if (slotImg) {
                    slotImg.setAttribute('opacity', '0.85'); 
                    targetSlot.style.cursor = 'pointer';
                    targetSlot.onclick = (e) => {
                        if (!targetSlot.classList.contains('filled')) {
                            playUnifiedAudio(item.char, item.audioUrl);
                            targetSlot.style.transform = 'scale(0.95)';
                            setTimeout(() => { targetSlot.style.transform = 'scale(1)'; }, 100);
                        }
                    };
                }
                
                callback(); 
            }, 600);
        }

        function makeDraggable(element) {
            let startX = 0, startY = 0, initialLeft = 0, initialTop = 0, isDragging = false;
            
            element.addEventListener('pointerdown', (e) => {
                if (!element.classList.contains('ready-to-drag') || element.classList.contains('locked')) return;
                isDragging = true;
                element.classList.add('dragging');
                element.setPointerCapture(e.pointerId);
                
                element.style.transition = 'none';

                initialLeft = parseFloat(element.style.left) || 0;
                initialTop = parseFloat(element.style.top) || 0;
                startX = e.clientX; startY = e.clientY;
            });

            element.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                element.style.left = `${initialLeft + e.clientX - startX}px`;
                element.style.top = `${initialTop + e.clientY - startY}px`;
            });

            element.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                element.classList.remove('dragging');
                element.releasePointerCapture(e.pointerId);
                checkCollision(element, initialLeft, initialTop);
            });
        }

        function checkCollision(element, oldLeft, oldTop) {
            const slots = document.querySelectorAll('.drop-slot:not(.filled)');
            const elRect = element.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            
            const elCenterX = elRect.left + elRect.width / 2;
            const elCenterY = elRect.top + elRect.height / 2;
            let isMatched = false;

            slots.forEach(slot => {
                const slotRect = slot.getBoundingClientRect();
                if (elCenterX > slotRect.left && elCenterX < slotRect.right && elCenterY > slotRect.top && elCenterY < slotRect.bottom) {
                    if (element.dataset.char === slot.dataset.char) {
                        isMatched = true;

                        slot.classList.add('filled');
                        slot.querySelectorAll('.slot-img-inner, .slot-bg').forEach(el => el.style.opacity = '0');
                        
                        element.style.position = 'absolute';
                        element.style.left = '0px';
                        element.style.top = '0px';
                        element.style.transform = 'none';
                        element.classList.add('locked', 'success-anim');
                        slot.appendChild(element); 
                        
                        const wordData = allWords.find(w => w.char === element.dataset.char);
                        if (wordData) {
                            playUnifiedAudio(wordData.char, wordData.audioUrl);

                            element.onclick = (e) => {
                                e.stopPropagation(); 
                                playUnifiedAudio(wordData.char, wordData.audioUrl);
                                element.style.transform = 'scale(0.95)';
                                setTimeout(() => { element.style.transform = 'none'; }, 100);
                            };
                        }

                        matchedCount++;
                        if (matchedCount === ITEMS_PER_PAGE) {
                            ruleBanner.style.opacity = '0';
                            document.body.classList.remove('game-unlocked'); 
                            
                            setTimeout(() => { playHappySound(); }, 400);
                            setTimeout(() => { document.getElementById('successModal').classList.add('active'); }, 1200);
                        }
                    }
                }
            });

            if (!isMatched) {
                playBoopSound(); 

                element.style.transition = 'all 0.3s ease';
                element.style.left = `${oldLeft}px`;
                element.style.top = `${oldTop}px`;
                setTimeout(() => { element.style.transition = 'none'; }, 300);

                element.querySelector('.flip-inner').classList.add('shake-anim');
                setTimeout(() => { element.querySelector('.flip-inner').classList.remove('shake-anim'); }, 400);
            }
        }

        fetchSanityAndInit();
        
        window.addEventListener('resize', () => {
            const blocks = Array.from(document.querySelectorAll('.wood-block:not(.locked)'));
            if(blocks.length > 0) arrangeGrid(blocks);
        });
    </script>
</body>
