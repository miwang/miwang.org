<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where is the Cat? 😸</title>
    
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <link rel="stylesheet" href="../css/style.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css" />

    <style>
        /* 🌟 body 自动吸收 style.css 字体，加 !important 防止排版被 style.css 干扰 */
        body {
            margin: 0 !important; padding: 0 !important;
            background-color: #1f2e46 !important; color: white;
            overflow: hidden; display: flex !important; flex-direction: column; align-items: center;
            height: 100vh; user-select: none;
        }

        .back-btn-home {
            position: absolute; top: 20px; left: 20px; color: #e0e0e0; text-decoration: none;
            font-size: 1.1rem; font-weight: bold; z-index: 50; background: rgba(255, 255, 255, 0.15);
            padding: 8px 18px; border-radius: 20px; transition: transform 0.2s, background 0.2s;
            border: none;
        }
        .back-btn-home:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.25); color: #fff; }

        #star-container {
            position: absolute; top: 20px; right: 30px; font-size: 2rem; color: #f3b236;
            display: none; align-items: center; gap: 10px; z-index: 10;
            background: rgba(255, 255, 255, 0.1); padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .star-icon { font-size: 2.5rem; }
        @keyframes starPop { 0% { transform: scale(1); } 50% { transform: scale(1.6); color: #fff; } 100% { transform: scale(1); } }
        .pop-anim { animation: starPop 0.4s ease-in-out; }

        #start-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 90%; height: 100%; padding-top: 30px; z-index: 10;
        }
        #start-screen h1 { font-size: 2.5rem; margin-bottom: 15px; color: #f3b236; }
        .controls { margin-bottom: 20px; }
        .btn {
            padding: 12px 25px; font-size: 1.2rem; background-color: #598586; color: #f3b236;
            border: 2px solid #f3b236; border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s, background-color 0.2s;
            margin: 0 10px; 
        }
        .btn:hover { transform: scale(1.05); background-color: #4a6f70; }

        #char-grid {
            display: grid; grid-template-columns: repeat(10, 50px); gap: 10px; justify-content: center;
            padding: 20px; background: rgba(255, 255, 255, 0.1); border-radius: 15px; max-width: 100%;
        }
        
        /* 🌟 汉字卡片坚守楷体阵地 */
        .char-card {
            width: 100%; height: 50px; display: flex; justify-content: center; align-items: center;
            font-size: 1.8rem; background-color: #e0e0e0; color: #333; border-radius: 10px;
            cursor: pointer; transition: all 0.2s; border: 3px solid transparent; box-sizing: border-box; 
            font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif !important; 
        }
        .char-card.selected { background-color: #598586; color: #f3b236; border: 3px solid #f3b236; transform: scale(1.1); z-index: 2; }

        @media (max-width: 650px) {
            #start-screen h1 { font-size: 1.8rem; }
            #char-grid { grid-template-columns: repeat(10, 32px); gap: 5px; padding: 10px; }
            .char-card { height: 32px; font-size: 1.2rem; border-radius: 6px; border-width: 2px; }
        }

        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; position: relative; }
        .header { display: flex; align-items: center; justify-content: center; margin-top: 50px; font-size: 3.5rem; letter-spacing: 2px; background: none; box-shadow: none; color: white;}
        .game-board { display: flex; gap: 40px; margin-top: 100px; z-index: 2; }
        .card-container { position: relative; width: 180px; height: 180px; }
        
        .hidden-cat { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; opacity: 0; transition: opacity 0.3s; }
        @keyframes bounceCat { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -80%); } }
        .cat-found-anim { animation: bounceCat 0.5s ease-in-out infinite; opacity: 1 !important; }

        /* 🌟 游戏中的汉字圆圈坚守楷体阵地 */
        .char-circle { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #598586; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 6rem; 
            color: #f3b236; cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.4), inset 0 0 15px rgba(255,255,255,0.2); 
            transition: transform 0.1s; border: 4px solid transparent;
            font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif !important; 
        }
        .char-circle:hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 15px 25px rgba(0,0,0,0.6), inset 0 0 20px rgba(255,255,255,0.4); border-color: #f3b236; }
        .char-circle:active { transform: scale(0.95); }

        @keyframes tornadoFly { 0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; } 50% { transform: translateY(-150px) scale(1.5) rotate(180deg); opacity: 0.8; } 100% { transform: translateY(-400px) scale(0) rotate(720deg); opacity: 0; } }
        .fly-away { animation: tornadoFly 0.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; pointer-events: none; }

        .bottom-wave { position: absolute; bottom: -35%; width: 150%; height: 80%; background-color: #ffffff; border-radius: 50%; z-index: 1; }
        .footer { margin-top: auto; margin-bottom: 25px; font-size: 2rem; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 15px; color: #598586; font-weight: bold; width:100%;}
        #next-btn { display: none; }
    </style>
</head>
<body>

    <a href="../parents.html" class="back-btn-home">⬅️ Back</a>

    <div id="star-container">
        <span class="star-icon" id="star-icon">⭐</span> x <span id="star-count">0</span>
    </div>

    <div id="start-screen">
        <h1>Select Target Characters</h1>
        <div class="controls">
            <button class="btn" onclick="selectAll()">Select All</button>
            <button class="btn" onclick="clearAll()">Clear</button>
            <button class="btn" onclick="startGame()" style="background-color: #f3b236; color: #1f2e46; border-color: #1f2e46;">Start Game</button>
        </div>
        <div id="char-grid"></div>
    </div>

    <div id="game-screen">
        <div class="header">Where is the cat?</div>
        
        <div class="game-board" id="board"></div>

        <div class="footer">
            <div id="result-text">The cat is behind ______.</div>
            <button class="btn" id="next-btn" onclick="nextRound()">Next Round ➔</button>
        </div>

        <div class="bottom-wave"></div>
    </div>

    <script>
        const allChars = [
            '四','大','我','手','上','爱','和','长','五','小','会','口','下','天','土','太',
            '六','日','不','头','左','白','木','门','七','月','飞','目','右','的','叶','也',
            '八','几','个','耳','中','山','花','九','多','你','人','看','水','十','少','有',
            '要','是','了','去'
        ];

        let selectedChars = [];
        let currentTargetIndex = -1;
        let currentChars = [];
        let totalStars = 0;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSwooshSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function playTadaSound() {
            initAudio(); const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc1.type = 'triangle'; osc2.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc1.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            osc2.frequency.setValueAtTime(1046.50, audioCtx.currentTime); osc2.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.1); 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            osc1.start(); osc2.start(); osc1.stop(audioCtx.currentTime + 0.6); osc2.stop(audioCtx.currentTime + 0.6);
        }
        
        function playStarSound() {
            initAudio(); const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.2); 
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        window.onload = () => {
            const grid = document.getElementById('char-grid');
            allChars.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerText = char;
                card.onclick = () => card.classList.toggle('selected');
                grid.appendChild(card);
            });
        };

        function selectAll() { document.querySelectorAll('.char-card').forEach(card => card.classList.add('selected')); }
        function clearAll() { document.querySelectorAll('.char-card').forEach(card => card.classList.remove('selected')); }

        function startGame() {
            initAudio(); 
            const selectedElements = document.querySelectorAll('.char-card.selected');
            selectedChars = Array.from(selectedElements).map(el => el.innerText);
            
            if (selectedChars.length < 4) {
                alert("Please select at least 4 characters to start!");
                return;
            }

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            document.getElementById('star-container').style.display = 'flex'; 
            nextRound();
        }

        function nextRound() {
            const board = document.getElementById('board');
            const resultText = document.getElementById('result-text');
            const nextBtn = document.getElementById('next-btn');
            
            board.innerHTML = '';
            resultText.innerText = 'The cat is behind ______.';
            resultText.style.color = '#598586';
            nextBtn.style.display = 'none';
            currentChars = [];

            let tempChars = [...selectedChars];
            for (let i = tempChars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tempChars[i], tempChars[j]] = [tempChars[j], tempChars[i]];
            }
            currentChars = tempChars.slice(0, 4);
            currentTargetIndex = Math.floor(Math.random() * 4);

            for (let i = 0; i < 4; i++) {
                const container = document.createElement('div');
                container.className = 'card-container';

                const cat = document.createElement('div');
                cat.className = 'hidden-cat';
                cat.innerText = '😸';
                cat.id = 'cat-' + i;
                if (i === currentTargetIndex) cat.style.opacity = '1';

                const circle = document.createElement('div');
                circle.className = 'char-circle';
                circle.innerText = currentChars[i];
                circle.onclick = function() { reveal(i, this, cat); };

                container.appendChild(cat);
                container.appendChild(circle);
                board.appendChild(container);
            }
        }

        function reveal(index, circleElement, catElement) {
            if (circleElement.classList.contains('fly-away')) return;
            circleElement.classList.add('fly-away');

            if (index === currentTargetIndex) {
                playTadaSound();
                setTimeout(addStar, 400); 
                
                catElement.classList.add('cat-found-anim');
                const charFound = currentChars[index];
                document.getElementById('result-text').innerText = `The cat is behind "${charFound}"!`;
                document.getElementById('result-text').style.color = '#4CAF50';
                document.getElementById('next-btn').style.display = 'block';
                
                const allCircles = document.querySelectorAll('.char-circle');
                allCircles.forEach(c => c.style.pointerEvents = 'none');
            } else {
                playSwooshSound();
            }
        }
        
        function addStar() {
            totalStars++;
            document.getElementById('star-count').innerText = totalStars;
            playStarSound();
            
            const starIcon = document.getElementById('star-icon');
            starIcon.classList.remove('pop-anim');
            void starIcon.offsetWidth; 
            starIcon.classList.add('pop-anim');
        }
    </script>
</body>
</html>
