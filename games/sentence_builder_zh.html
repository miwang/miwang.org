<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>句子排排队</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/sentences_data.js"></script>
    <style>
        :root {
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
        }

        .font-zh { font-family: var(--kaiti) !important; }
        .font-en { font-family: var(--wenkai) !important; }

        body { 
            background-color: #fff9ea; margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh; width: 100vw;
            position: relative;
        }

        .glass-btn {
            position: absolute; top: 20px; left: 25px; color: #444; text-decoration: none;
            font-size: 1.2rem; font-weight: bold; z-index: 9999; 
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 10px 28px; border-radius: 40px; 
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.5); transform: scale(1.05); }

        /* --- 1. 画廊列表页 --- */
        #list-view { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }
        .list-header { text-align: center; padding: 65px 0 10px 0; flex-shrink: 0; }
        .list-header h1 { font-size: 3.2rem; color: var(--main-teal); margin: 0; letter-spacing: 5px; }

        #gallery-view {
            flex: 1; display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px; padding: 15px 40px; box-sizing: border-box;
            align-content: start;
        }
        .sentence-card {
            background: white; border: 4px solid var(--main-teal); border-radius: 22px;
            overflow: hidden; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07); display: flex; flex-direction: column;
        }
        .sentence-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.12); }

        .card-img-wrapper { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #fdfdfd; border-bottom: 2px solid #eee; flex-shrink: 0; }
        .sentence-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .sentence-card .card-info { padding: 12px 10px; text-align: center; font-size: 1.1rem; font-weight: bold; color: #333; background: white; flex: 1; display: flex; align-items: center; justify-content: center; }

        /* --- 2. 练习界面 --- */
        #play-view { display: none; position: fixed; top:0; left:0; height: 100dvh; width: 100vw; flex-direction: column; align-items: center; padding: 6px 15px 10px; box-sizing: border-box; background: #fff9ea; z-index: 8000; overflow: hidden; }
        
        .play-top-bar { width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; box-sizing: border-box; flex-shrink: 0; }
        .play-back-btn { color: #444; text-decoration: none; font-size: 1.1rem; font-weight: bold; background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 6px 20px; border-radius: 30px; border: 1.5px solid rgba(255,255,255,0.5); cursor: pointer; transition: 0.2s; }
        .play-back-btn:hover { background: rgba(255,255,255,0.7); }
        .btn-action { background: #2ecc71; color: white; border: none; padding: 8px 28px; border-radius: 40px; cursor: pointer; font-size: 1.3rem; font-weight: bold; box-shadow: 0 4px 0 #27ae60; }

        .play-layout { 
            display: flex; flex-direction: column; width: 100%; flex: 1; gap: 15px; 
            padding: 10px 20px; box-sizing: border-box; min-height: 0; overflow: hidden;
        }
        .desktop-top-row { 
            display: flex; flex-direction: row; flex: 1; gap: 15px; min-height: 0; justify-content: center; width: 100%;
        }
        .side-pool { 
            flex: 1.2 1 200px; max-width: 380px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; overflow-y: auto; overflow-x: hidden;
            padding: 10px; box-sizing: border-box;
        }
        .image-stage { 
            flex: 2.2 1 500px; max-width: 1200px; 
            background: white no-repeat center center / cover; 
            border: 5px solid var(--main-teal); border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .drop-zone-wrapper { flex: 0 0 auto; width: 100%; display: flex; justify-content: center; }
        .drop-zone {
            height: 14vh; min-height: 90px; width: 100%; max-width: 1800px; 
            background: rgba(89, 133, 134, 0.08); border: 3px dashed var(--main-teal); border-radius: 25px; 
            display: flex; flex-wrap: nowrap; justify-content: center; align-items: center; 
            gap: 8px; padding: 10px 15px; box-sizing: border-box; transition: background 0.2s; overflow: hidden; 
        }
        .drop-zone.active-hover { background: rgba(89, 133, 134, 0.25); border-style: solid; }

        .word-brick {
            padding: clamp(10px, 1.5vh, 20px) clamp(16px, 2.5vw, 45px); 
            border-radius: 20px; 
            font-size: clamp(1.5rem, 3vw + 0.5rem, 4.5rem); 
            font-weight: bold; color: #1e2e46; cursor: pointer;
            box-shadow: 0 10px 0 rgba(0,0,0,0.12); margin: 0; white-space: nowrap; flex-shrink: 0;
            user-select: none; touch-action: none; position: relative; transition: font-size 0.2s, padding 0.2s;
            max-width: 100%; box-sizing: border-box;
        }
        .word-brick.dragging { opacity: 0.6; transform: scale(1.1); z-index: 99999; position: fixed !important; pointer-events: none; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transition: none; }

        /* ── 全屏朗读界面 ── */
        #reading-overlay { position: fixed; inset: 0; background: #fff9ea; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        
        /* 🌟 恢复背景颜色的独立字框 */
        .reading-char-box {
            display: flex; justify-content: center; align-items: center;
            aspect-ratio: 1 / 1;
            /* 移除写死的白色背景，让 JS 动态注入颜色 */
            border: 2px solid rgba(0,0,0,0.05); /* 添加柔和的边线质感 */
            box-sizing: border-box;
            border-radius: 12px;
            color: #1e2e46;
            font-weight: bold;
            transition: all 0.2s;
        }
        .punctuation-box {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            color: #888 !important;
        }

        .reading-hint { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            font-size: 1.2rem; color: #666; letter-spacing: 2px; 
            background: rgba(255, 255, 255, 0.85); padding: 8px 24px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            pointer-events: none; animation: pulse 2s infinite; 
            white-space: nowrap; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

        .tts-btn {
            position: absolute; top: 15px; left: 15px; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px); border: 3px solid var(--main-teal); border-radius: 50%;
            width: 60px; height: 60px; font-size: 30px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.2s, background 0.2s; z-index: 10001;
        }
        .tts-btn:hover { transform: scale(1.1); background: #fff; }
        .tts-btn:active { transform: scale(0.95); }

        @media (max-width: 768px) {
            .tts-btn { top: 10px; left: 10px; width: 45px; height: 45px; font-size: 22px; border-width: 2px; }
            .reading-hint { font-size: 0.9rem; bottom: 20px; padding: 6px 18px; }
            .glass-btn { top: 10px !important; left: 10px !important; font-size: 0.85rem !important; padding: 6px 14px !important; }
            .list-header { padding: 52px 16px 8px !important; }
            .list-header h1 { font-size: 2rem !important; letter-spacing: 3px !important; }

            #gallery-view { grid-template-columns: 1fr !important; gap: 14px !important; padding: 10px 16px 24px !important; }
            .card-img-wrapper { aspect-ratio: 2 / 1 !important; }
            .sentence-card img { object-position: center center !important; }
            .sentence-card .card-info { padding: 10px !important; font-size: 1.1rem !important; }

            #play-view { padding: 4px 8px 6px !important; height: 100dvh !important; justify-content: flex-start !important; }
            .play-top-bar { height: 38px !important; padding: 0 4px !important; }
            .btn-action { padding: 5px 12px !important; font-size: 0.8rem !important; border-radius: 20px !important; }

            .play-layout { display: flex; flex-direction: column; padding: 5px; gap: 5px; }
            .desktop-top-row { display: contents; } 
            .image-stage { order: 1; flex: 0 0 28dvh !important; border-radius: 16px !important; border-width: 3px !important; min-height: 28dvh; }
            .drop-zone-wrapper { order: 2; padding: 0; }
            .drop-zone { height: 10vh !important; min-height: 70px !important; padding: 5px 10px !important; gap: 4px !important; border-radius: 16px !important; }
            #word-pool-left { order: 3; flex-direction: row; flex-wrap: wrap; padding: 5px; max-width: none; flex: 0 0 auto; min-height: unset; justify-content: center; overflow: visible; }
            #word-pool-right { order: 4; flex-direction: row; flex-wrap: wrap; padding: 0 5px 5px; max-width: none; flex: 0 0 auto; min-height: unset; justify-content: center; overflow: visible; }

            .word-brick { font-size: clamp(1.2rem, 4.5vw, 2rem) !important; padding: 8px 16px !important; border-radius: 12px !important; margin: 4px !important; box-shadow: 0 5px 0 rgba(0,0,0,0.12) !important; }
        }

        .tag-bar { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 10px; padding: 0 20px; }
        .tag-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; }
        .tag-row-label { font-size: 0.7rem; color: #aaa; margin-right: 4px; align-self: center; white-space: nowrap; letter-spacing: 1px; }
        .tag-pill { padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; border: 2px solid transparent; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .tag-pill.theme { background: #e8f5f5; color: #4a7a7b; border-color: #c5dfdf; }
        .tag-pill.theme:hover { background: #d0ecec; border-color: var(--main-teal); }
        .tag-pill.theme.active { background: var(--main-teal); color: white; border-color: var(--main-teal); }
        .tag-pill.keyword { background: #fef9e7; color: #9a7c1e; border-color: #f5e6a3; }
        .tag-pill.keyword:hover { background: #fdf0c8; border-color: #f3b236; }
        .tag-pill.keyword.active { background: #f3b236; color: #1e2e46; border-color: #d4922a; }
        .tag-pill.all { background: #f0f0f0; color: #666; border-color: #ddd; }
        .tag-pill.all:hover { background: #e4e4e4; }
        .tag-pill.all.active { background: #555; color: white; border-color: #555; }

        .mgr-toggle { background: none; border: 1px dashed #ccc; color: #999; padding: 6px 18px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .mgr-toggle:hover { color: var(--main-teal); border-color: var(--main-teal); }
        .manager-box { background: white; padding: 24px; border-radius: 20px; width: 460px; max-width: 95vw; max-height: 85vh; overflow-y: auto; border: 4px solid var(--main-teal); position: relative; }
        .mgr-title { font-size: 1.2rem; font-weight: bold; color: var(--main-teal); margin-bottom: 12px; }
        .mgr-row { margin-bottom: 10px; }
        .mgr-row label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        .mgr-input { width: 100%; padding: 8px 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; box-sizing: border-box; }
        .mgr-input:focus { border-color: var(--main-teal); outline: none; }
        .mgr-tag-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .mgr-tag-chip { padding: 4px 12px; border-radius: 14px; font-size: 0.8rem; border: 2px solid #ddd; background: white; color: #555; cursor: pointer; transition: 0.15s; }
        .mgr-tag-chip.selected { background: var(--main-teal); color: white; border-color: var(--main-teal); }
        .mgr-save-btn { width: 100%; padding: 10px; background: var(--main-teal); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 8px; transition: 0.2s; }
        .mgr-save-btn:hover { background: #4a7374; }
        .mgr-divider { height: 1px; background: #eee; margin: 16px 0 10px; }
        .mgr-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
        .mgr-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #f8f9fa; border-radius: 8px; font-size: 0.85rem; }
        .mgr-item-del { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 1rem; padding: 2px 6px; }

        @keyframes correctFlash {
            0%   { box-shadow: 0 0 0 0 rgba(243,178,54,0); background: transparent; }
            20%  { box-shadow: 0 0 30px 12px rgba(243,178,54,0.9); background: rgba(243,178,54,0.15); }
            50%  { box-shadow: 0 0 60px 20px rgba(89,133,134,0.8); background: rgba(89,133,134,0.1); }
            80%  { box-shadow: 0 0 30px 12px rgba(243,178,54,0.6); background: rgba(243,178,54,0.1); }
            100% { box-shadow: 0 0 0 0 rgba(243,178,54,0); background: transparent; }
        }
        .drop-zone.correct-flash { animation: correctFlash 1s ease-in-out; }
    </style>
</head>
<body>

    <div id="list-view">
        <a href="../teachers.html" class="glass-btn font-zh">⬅️ 返回工具台</a>
        <div class="list-header">
            <h1 class="font-zh">🧩 句子排排队 🧩</h1>
            <div class="tag-bar" id="tag-bar"></div>
        </div>
        <div id="gallery-view"></div>
        <div style="text-align:center;padding:10px 0 20px;">
            <button class="mgr-toggle font-zh" onclick="openManager()">⚙️ 句子管理</button>
        </div>
    </div>

    <div id="manager-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10001; align-items:center; justify-content:center;">
        <div class="manager-box">
            <button onclick="closeManager()" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.4rem;cursor:pointer;color:#999;">✕</button>
            <div class="mgr-title font-zh">📝 添加新句子</div>
            <div class="mgr-row">
                <label class="font-zh">词语（逗号分隔）</label>
                <input id="mgr-words" class="mgr-input font-zh" placeholder="我，喜欢，苹果">
            </div>
            <div class="mgr-row">
                <label class="font-zh">图片地址</label>
                <input id="mgr-image" class="mgr-input font-en" placeholder="../images/sentences/apple.jpg">
            </div>
            <div class="mgr-row">
                <label class="font-zh">主题标签（可多选）</label>
                <div id="mgr-tags" class="mgr-tag-grid"></div>
            </div>
            <button class="mgr-save-btn font-zh" onclick="saveMgrSentence()">✅ 保存句子</button>
            <div class="mgr-divider"></div>
            <div class="mgr-title font-zh" style="font-size:1rem;margin-top:6px;">📋 自定义句子列表</div>
            <div id="mgr-custom-list" class="mgr-list"></div>
        </div>
    </div>

    <div id="play-view">
        <div class="play-top-bar">
            <div class="play-back-btn font-zh" onclick="closePlay()">⬅️ 返回列表</div>
            <div id="success-controls" style="visibility: hidden; display: flex;">
                <button class="btn-action font-zh" onclick="enterReadingMode()">📖 全屏读字</button>
            </div>
        </div>
        <div class="play-layout">
            <div class="desktop-top-row">
                <div id="word-pool-left" class="side-pool"></div>
                <div class="image-stage" id="main-image"></div>
                <div id="word-pool-right" class="side-pool"></div>
            </div>
            <div class="drop-zone-wrapper">
                <div class="drop-zone" id="drop-zone"></div>
            </div>
        </div>
    </div>

    <div id="reading-overlay" onclick="this.style.display='none'">
        <button class="tts-btn" onclick="event.stopPropagation(); readCurrentSentence();" title="朗读句子">🔊</button>
        <div id="full-container" style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center;"></div>
        <div class="reading-hint font-zh">点击任意位置返回</div>
    </div>

    <script>
        const listView = document.getElementById('list-view');
        const playView = document.getElementById('play-view');
        const leftPool = document.getElementById('word-pool-left');
        const rightPool = document.getElementById('word-pool-right');
        const zone = document.getElementById('drop-zone');
        let currentLevelIdx = 0, currentData = null;
        let activeThemeTag = null, activeKeyword = null;
        let currentFilteredList = [];

        function splitFonts(text) {
            return text.split('').map(char => {
                const isEn = /[a-zA-Z0-9\s\p{P}]/u.test(char);
                return `<span class="${isEn ? 'font-en' : 'font-zh'}">${char}</span>`;
            }).join('');
        }

        function buildTagBar() {
            const { themeTags, keywordTags: kw } = getAllTags();
            const bar = document.getElementById('tag-bar');
            let html = '';
            html += `<div class="tag-row">`;
            html += `<div class="tag-pill all font-zh ${!activeThemeTag && !activeKeyword ? 'active' : ''}" onclick="clearFilters()">全部 <span class="font-en" style="font-size:0.7rem;">All</span></div>`;
            themeTags.forEach(t => {
                const def = tagDefinitions[t] || { zh: t, en: t };
                const isActive = activeThemeTag === t;
                html += `<div class="tag-pill theme font-zh ${isActive ? 'active' : ''}" onclick="toggleThemeTag('${t}')">${def.zh} <span class="font-en" style="font-size:0.7rem;opacity:0.7;">${def.en}</span></div>`;
            });
            html += `</div>`;
            html += `<div class="tag-row">`;
            html += `<span class="tag-row-label font-zh">按字词：</span>`;
            kw.forEach(k => {
                const isActive = activeKeyword === k.zh;
                html += `<div class="tag-pill keyword font-zh ${isActive ? 'active' : ''}" onclick="toggleKeyword('${k.zh}')">「${k.zh}」<span class="font-en" style="font-size:0.65rem;opacity:0.7;margin-left:2px;">${k.en}</span></div>`;
            });
            html += `</div>`;
            bar.innerHTML = html;
        }

        function toggleThemeTag(tag) { activeThemeTag = activeThemeTag === tag ? null : tag; activeKeyword = null; refreshGallery(); }
        function toggleKeyword(kw) { activeKeyword = activeKeyword === kw ? null : kw; activeThemeTag = null; refreshGallery(); }
        function clearFilters() { activeThemeTag = null; activeKeyword = null; refreshGallery(); }

        function refreshGallery() {
            buildTagBar();
            currentFilteredList = filterSentences(activeThemeTag, activeKeyword);
            renderGalleryCards(currentFilteredList);
        }

        function renderGalleryCards(list) {
            const gallery = document.getElementById('gallery-view');
            if (list.length === 0) {
                gallery.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#999;font-size:1.1rem;padding:40px 0;" class="font-zh">没有匹配的句子</div>';
                return;
            }
            gallery.innerHTML = list.map((item, i) => `
                <div class="sentence-card" onclick="startLevel(${i})">
                    <div class="card-img-wrapper"><img src="${item.image}" onerror="this.style.display='none'"></div>
                    <div class="card-info font-zh">${item.words.join('')}${item.punctuation || ''}</div>
                </div>
            `).join('');
        }

        function initGallery() {
            listView.style.display = 'flex';
            playView.style.display = 'none';
            refreshGallery();
            window.addEventListener('resize', () => {
                if (playView.style.display === 'flex') { autoSizeZone(); }
            });
        }

        function startLevel(index) {
            currentData = currentFilteredList[index];
            if (!currentData) return;
            listView.style.display = 'none';
            playView.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            zone.innerHTML = ''; leftPool.innerHTML = ''; rightPool.innerHTML = '';
            zone.dataset.locked = '';
            document.getElementById('success-controls').style.visibility = 'hidden';
            document.getElementById('main-image').style.backgroundImage = `url('${currentData.image}')`;

            const shuffledWords = [...currentData.words].sort(() => Math.random() - 0.5);
            shuffledWords.forEach((word, idx) => {
                const brick = document.createElement('div');
                brick.className = 'word-brick';
                brick.innerHTML = splitFonts(word);
                const color = colorDictionary[word] || "#e0e0e0";
                brick.style.backgroundColor = color;
                brick.dataset.word = word;
                brick.dataset.color = color;
                brick.dataset.pool = idx % 2 === 0 ? 'left' : 'right';
                addTouchLogic(brick);
                
                if (idx % 2 === 0) {
                    leftPool.appendChild(brick);
                } else {
                    rightPool.appendChild(brick);
                }
            });
            autoSizeZone();
        }

        function openManager() { document.getElementById('manager-overlay').style.display = 'flex'; renderMgrTags(); renderMgrList(); }
        function closeManager() { document.getElementById('manager-overlay').style.display = 'none'; refreshGallery(); }
        function renderMgrTags() {
            const container = document.getElementById('mgr-tags');
            container.innerHTML = Object.entries(tagDefinitions).map(([key, def]) => `<div class="mgr-tag-chip font-zh" data-tag="${key}" onclick="this.classList.toggle('selected')">${def.zh}</div>`).join('');
        }
        function renderMgrList() {
            const list = getCustomSentences();
            const container = document.getElementById('mgr-custom-list');
            if (list.length === 0) { container.innerHTML = '<div style="color:#999;font-size:0.85rem;text-align:center;padding:10px;" class="font-zh">暂无自定义句子</div>'; return; }
            container.innerHTML = list.map(s => `<div class="mgr-item"><span class="font-zh">${s.words.join(' ')}</span><button class="mgr-item-del" onclick="deleteMgrSentence(${s._id})">✕</button></div>`).join('');
        }
        function saveMgrSentence() {
            const wordsRaw = document.getElementById('mgr-words').value.trim();
            const image = document.getElementById('mgr-image').value.trim();
            if (!wordsRaw) { alert('请输入词语'); return; }
            const words = wordsRaw.split(/[,，、]/).map(w => w.trim()).filter(w => w);
            const selectedTags = [...document.querySelectorAll('#mgr-tags .mgr-tag-chip.selected')].map(el => el.dataset.tag);
            addCustomSentence({ words, image: image || '', tags: selectedTags });
            document.getElementById('mgr-words').value = ''; document.getElementById('mgr-image').value = '';
            document.querySelectorAll('#mgr-tags .mgr-tag-chip').forEach(el => el.classList.remove('selected'));
            renderMgrList(); alert('句子已保存！');
        }
        function deleteMgrSentence(id) { if (confirm('确定删除这个句子吗？')) { deleteCustomSentence(id); renderMgrList(); } }

        function getInsertTarget(clientX, clientY, draggingEl) {
            const siblings = [...zone.querySelectorAll('.word-brick')].filter(s => s !== draggingEl && !s.classList.contains('auto-punctuation'));
            if (siblings.length === 0) return null;
            const nextInRow = siblings.find(sib => {
                const box = sib.getBoundingClientRect();
                return clientX < box.left + box.width / 2;
            });
            return nextInRow || null; 
        }

        function autoSizeZone() {
            const bricks = [...zone.querySelectorAll('.word-brick')];
            if (bricks.length === 0) return;

            const isMobile = window.innerWidth <= 768;
            const maxFontSize = isMobile ? 32 : 65; 
            const minFontSize = 12; 
            
            const zonePadding = 30; 
            const gap = isMobile ? 4 : 8; 
            const availW = zone.clientWidth - zonePadding - (bricks.length - 1) * gap - 40;

            bricks.forEach(b => { b.style.maxWidth = 'none'; });

            let lo = minFontSize, hi = maxFontSize, best = minFontSize;
            
            while (lo <= hi) {
                const mid = Math.floor((lo + hi) / 2);
                bricks.forEach(b => {
                    b.style.fontSize = mid + 'px';
                    b.style.padding = `${Math.round(mid*0.25)}px ${Math.round(mid*0.5)}px`;
                });
                const totalW = bricks.reduce((s, b) => s + b.scrollWidth, 0);
                
                if (totalW <= availW) {
                    best = mid;
                    lo = mid + 1; 
                } else {
                    hi = mid - 1; 
                }
            }

            bricks.forEach(b => {
                b.style.fontSize = best + 'px';
                b.style.padding = `${Math.round(best*0.25)}px ${Math.round(best*0.5)}px`;
                b.style.maxWidth = ''; 
            });
        }

        function addTouchLogic(el) {
            let startX, startY;
            const moveHandler = (e) => {
                if (!el.classList.contains('dragging')) return;
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                el.style.left = (touch.clientX - startX) + 'px';
                el.style.top = (touch.clientY - startY) + 'px';
                
                const zoneRect = zone.getBoundingClientRect();
                const hitSlop = 80; 
                const isOverZone = touch.clientX > zoneRect.left - hitSlop && touch.clientX < zoneRect.right + hitSlop &&
                                   touch.clientY > zoneRect.top - hitSlop && touch.clientY < zoneRect.bottom + hitSlop;

                const oldIndicator = zone.querySelector('.insert-indicator');
                if (oldIndicator) oldIndicator.remove();

                if (isOverZone) {
                    zone.classList.add('active-hover');
                    const target = getInsertTarget(touch.clientX, touch.clientY, el);
                    const indicator = document.createElement('div');
                    indicator.className = 'insert-indicator';
                    indicator.style.cssText = 'width:4px; min-height:40px; align-self:stretch; background:#ff6b6b; border-radius:4px; flex-shrink:0; pointer-events:none; margin: 0 4px;';
                    zone.insertBefore(indicator, target);
                } else {
                    zone.classList.remove('active-hover');
                }
            };

            const endHandler = (e) => {
                if (!el.classList.contains('dragging')) return;
                const touch = e.changedTouches ? e.changedTouches[0] : e;
                el.classList.remove('dragging');
                el.style.left = ''; el.style.top = '';
                zone.classList.remove('active-hover');

                const indicator = zone.querySelector('.insert-indicator');
                if (indicator) {
                    zone.insertBefore(el, indicator);
                    indicator.remove();
                } else {
                    const zoneRect = zone.getBoundingClientRect();
                    const hitSlop = 80; 
                    const isInside = touch.clientX >= zoneRect.left - hitSlop && touch.clientX <= zoneRect.right + hitSlop &&
                                     touch.clientY >= zoneRect.top - hitSlop  && touch.clientY <= zoneRect.bottom + hitSlop;
                    if (isInside) {
                        zone.insertBefore(el, getInsertTarget(touch.clientX, touch.clientY, el));
                    } else {
                        el.style.fontSize = ''; el.style.padding = ''; el.style.maxWidth = '';
                        if (el.dataset.pool === 'left') leftPool.appendChild(el);
                        else rightPool.appendChild(el);
                    }
                }
                autoSizeZone(); 
                check();
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('touchmove', moveHandler);
            };

            const startHandler = (e) => {
                if (zone.dataset.locked === '1') return;
                const touch = e.touches ? e.touches[0] : e;
                const rect = el.getBoundingClientRect();
                
                startX = touch.clientX - rect.left;
                startY = touch.clientY - rect.top;
                
                el.classList.add('dragging');
                el.style.left = (touch.clientX - startX) + 'px';
                el.style.top = (touch.clientY - startY) + 'px';
                
                document.addEventListener('mousemove', moveHandler, {passive: false});
                document.addEventListener('touchmove', moveHandler, {passive: false});
                document.addEventListener('mouseup', endHandler, {once: true});
                document.addEventListener('touchend', endHandler, {once: true});
            };
            el.addEventListener('mousedown', startHandler);
            el.addEventListener('touchstart', startHandler, {passive: false});
        }

        /* 🌟 将单字拆分进独立方框，并注入背景颜色 */
        function autoSizeReading() {
            const overlay = document.getElementById('reading-overlay');
            const boxes = [...document.querySelectorAll('.reading-char-box')];
            if (boxes.length === 0) return;
            
            const availW = overlay.clientWidth * 0.90;
            const availH = overlay.clientHeight - 120;

            let lo = 20, hi = 300, best = 20;
            while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                const margin = Math.round(mid * 0.1);
                const boxSize = mid; 
                
                let rowW = 0, rows = 1;
                const totalBoxW = boxSize + margin * 2;
                
                boxes.forEach(b => {
                    if (rowW + totalBoxW > availW && rowW > 0) { rows++; rowW = totalBoxW; }
                    else rowW += totalBoxW;
                });
                
                const totalH = rows * (boxSize + margin * 2);
                if (totalH <= availH) { best = mid; lo = mid + 1; }
                else hi = mid - 1;
            }
            
            const margin = Math.round(best * 0.1);
            boxes.forEach(b => {
                b.style.width = best + 'px';
                b.style.height = best + 'px';
                b.style.fontSize = (best * 0.7) + 'px'; 
                b.style.margin = margin + 'px';
                
                if (!b.classList.contains('punctuation-box')) {
                    b.style.borderRadius = Math.round(best * 0.15) + 'px';
                    // 使用柔和的阴影代替粗边框，配合背景色效果更好
                    b.style.boxShadow = `0 ${Math.max(2, Math.round(best * 0.08))}px 0 rgba(0,0,0,0.12)`;
                } else {
                    b.style.fontSize = (best * 0.5) + 'px'; 
                }
            });
        }

        function check() {
            const current = [...zone.querySelectorAll('.word-brick')].map(b => b.dataset.word).join('');
            if (current === currentData.words.join('')) {
                zone.dataset.locked = '1';
                document.getElementById('success-controls').style.visibility = 'visible';
                new Audio('../audio/correct.mp3').play().catch(()=>null);
                
                autoSizeZone(); 

                const punc = currentData.punctuation || '';
                if (punc && !zone.querySelector('.auto-punctuation')) {
                    const lastBrick = zone.querySelector('.word-brick:last-of-type');
                    const brickSize = lastBrick ? getComputedStyle(lastBrick).fontSize : '3rem';
                    const puncEl = document.createElement('span');
                    puncEl.className = 'auto-punctuation font-zh';
                    puncEl.textContent = punc;
                    puncEl.style.cssText = `font-size:${brickSize}; font-weight:bold; color:#666; align-self:center; pointer-events:none; flex-shrink:0; margin-left:2px;`;
                    zone.appendChild(puncEl);
                }
                zone.classList.remove('correct-flash');
                void zone.offsetWidth;
                zone.classList.add('correct-flash');
                setTimeout(() => zone.classList.remove('correct-flash'), 1000);
            }
        }

        function enterReadingMode() {
            const container = document.getElementById('full-container');
            container.innerHTML = '';
            
            currentData.words.forEach(word => {
                const color = colorDictionary[word] || "#e0e0e0";
                Array.from(word).forEach(char => {
                    const box = document.createElement('div');
                    box.className = 'reading-char-box';
                    box.innerHTML = splitFonts(char);
                    // 🌟 核心：将词语对应的颜色作为字格的背景色填入！
                    box.style.backgroundColor = color;
                    container.appendChild(box);
                });
            });
            
            const punc = currentData.punctuation || '';
            if (punc) {
                const box = document.createElement('div');
                box.className = 'reading-char-box punctuation-box font-zh';
                box.textContent = punc;
                container.appendChild(box);
            }
            
            document.getElementById('reading-overlay').style.display = 'flex';
            requestAnimationFrame(autoSizeReading);
        }

        function readCurrentSentence() {
            if (!currentData || !('speechSynthesis' in window)) { alert("抱歉，您的浏览器不支持语音朗读功能。"); return; }
            window.speechSynthesis.cancel();
            const textToRead = currentData.words.join('') + (currentData.punctuation || '');
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.85; 
            utterance.pitch = 1.0; 
            window.speechSynthesis.speak(utterance);
        }

        function closePlay() { 
            listView.style.display = 'flex'; 
            playView.style.display = 'none'; 
            document.body.style.overflow = '';
        }
        window.onload = initGallery;
    </script>
