<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>颜色日 · Color Days</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css">
<style>
:root{
  font-size:18px;
  --ink:#2E2A28;
  --ink-soft:#6B625C;
  --paper:#FFFDF7;
  --card:#FFFFFF;
  --line:rgba(46,42,40,.14);
  --day:#E23B2E;          /* overwritten per day */
  --day-soft:#E23B2E22;
  --shadow:0 .35rem 1.1rem rgba(46,42,40,.13);
  --radius:1.1rem;
}
@media (min-width:900px){ :root{ font-size:20px; } }
@media (min-width:1300px){ :root{ font-size:23px; } }
@media (min-width:1700px){ :root{ font-size:27px; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:"LXGW WenKai Lite","LXGW WenKai","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(60rem 40rem at 12% -10%, #FFF3D6 0%, transparent 60%),
    radial-gradient(50rem 36rem at 95% 8%, #E8F4FF 0%, transparent 62%),
    radial-gradient(48rem 40rem at 50% 115%, #FFE9F2 0%, transparent 60%),
    linear-gradient(#FFFDF7,#FDF6EA);
  overflow:hidden;
  user-select:none;
}
.blob{position:fixed;border-radius:50%;filter:blur(3.2rem);opacity:.5;pointer-events:none;z-index:0}
.blob.a{width:22rem;height:22rem;left:-7rem;top:-6rem;background:#FFD9A8}
.blob.b{width:20rem;height:20rem;right:-6rem;bottom:-7rem;background:#BFE3FF}

/* ---------- bunting ---------- */
#bunting{position:fixed;top:0;left:0;right:0;height:1.5rem;display:flex;z-index:3;pointer-events:none}
#bunting i{flex:1;height:100%;clip-path:polygon(0 0,100% 0,50% 100%);opacity:.85}

/* ---------- shell ---------- */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  width:min(96vw,72rem);max-height:100vh;margin:0 auto;padding:2rem .8rem .8rem}
.topbar{display:flex;align-items:center;gap:.5rem;flex:0 0 auto;padding:.15rem 0 .5rem}
.topbar .spacer{flex:1}
.chip{
  border:none;background:var(--card);color:var(--ink);
  font-family:inherit;font-size:.82rem;font-weight:700;
  padding:.4rem .85rem;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;
  display:inline-flex;align-items:center;gap:.3rem;line-height:1.2;
  text-decoration:none;
}
.chip:active{transform:translateY(1px)}
.chip.tone{background:var(--day);color:#fff}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- home ---------- */
.home-head{text-align:center;flex:0 0 auto;padding:.2rem 0 .9rem}
.home-head h1{margin:0;font-size:2.1rem;letter-spacing:.06em}
.home-head p{margin:.25rem 0 0;color:var(--ink-soft);font-size:.85rem}
.grid-days{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr));
  gap:.7rem;padding:.2rem .2rem 1rem;align-content:start;
}
.daytile{
  border:none;cursor:pointer;font-family:inherit;color:inherit;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:.85rem .5rem .7rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;
}
.daytile:active{transform:translateY(2px)}
.daytile .swatch{width:3.2rem;height:3.2rem;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09)}
.daytile b{font-size:1.05rem;font-weight:700}
.daytile small{color:var(--ink-soft);font-size:.68rem;letter-spacing:.04em}

/* ---------- day menu ---------- */
.day-hero{flex:0 0 auto;display:flex;align-items:center;gap:1rem;padding:.3rem .3rem 1rem}
.day-hero .disc{width:5rem;height:5rem;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09), var(--shadow)}
.day-hero h2{margin:0;font-size:2.4rem;line-height:1}
.day-hero .en{color:var(--ink-soft);font-size:.9rem;letter-spacing:.12em;margin-top:.2rem}
.grid-stations{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));
  gap:.7rem;padding-bottom:1rem;align-content:start;
}
.station{
  border:none;cursor:pointer;font-family:inherit;color:inherit;text-align:left;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:.9rem .85rem;display:flex;flex-direction:column;gap:.3rem;
  border-top:.28rem solid var(--day);
}
.station:active{transform:translateY(2px)}
.station .ico{font-size:1.7rem;line-height:1}
.station b{font-size:1rem}
.station small{color:var(--ink-soft);font-size:.72rem;line-height:1.4}

/* ---------- generic activity frame ---------- */
.act{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.6rem}
.act-q{flex:0 0 auto;text-align:center;font-size:1.5rem;font-weight:700;line-height:1.25}
.act-q .sub{display:block;font-size:.72rem;font-weight:400;color:var(--ink-soft);letter-spacing:.08em;margin-top:.2rem}
.act-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;overflow:hidden}
.act-foot{flex:0 0 auto;display:flex;justify-content:center;gap:.5rem;padding-bottom:.2rem}

.verdict{font-size:1.5rem;font-weight:700;min-height:2rem;text-align:center}
.verdict.good{color:#1E7A46}
.verdict.retry{color:#B4562C}
@keyframes popIn{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .34s cubic-bezier(.22,1.2,.4,1)}

/* ---------- 听一听 / swatch picking ---------- */
.swatch-row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
.swatch-btn{
  width:7.5rem;height:7.5rem;border-radius:1.4rem;border:none;cursor:pointer;
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(0,0,0,.08);
}
.swatch-btn:active{transform:scale(.96)}
.swatch-btn.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
.prompt-word{font-size:3.4rem;font-weight:700;letter-spacing:.08em}

/* ---------- 翻牌 ---------- */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;width:min(100%,34rem)}
.flip{
  aspect-ratio:1/1;border:none;border-radius:1.1rem;cursor:pointer;font-family:inherit;
  background:var(--day);box-shadow:var(--shadow);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  font-size:2.6rem;
}
.flip.open{background:var(--card);color:var(--ink)}
.flip span.zh{font-size:.95rem;font-weight:700}
.flip .qm{opacity:.85}

/* ---------- 数一数 ---------- */
.count-tray{
  display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;align-items:center;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:1.2rem;width:min(100%,34rem);min-height:8rem;
}
.count-tray span{font-size:3.2rem;line-height:1}
.num-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.num-btn{
  width:4.2rem;height:4.2rem;border-radius:1rem;border:none;cursor:pointer;font-family:inherit;
  background:var(--card);box-shadow:var(--shadow);font-size:1.9rem;font-weight:700;color:var(--ink);
}
.num-btn:active{transform:translateY(2px)}
.num-btn.dim{opacity:.35}

/* ---------- 大拇指 ---------- */
.judge-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:1.4rem 2rem;text-align:center;display:flex;flex-direction:column;gap:.4rem;align-items:center;
}
.judge-card .big{font-size:5rem;line-height:1}
.judge-card .claim{font-size:1.9rem;font-weight:700}
.thumb-row{display:flex;gap:1.4rem}
.thumb{
  width:6rem;height:6rem;border-radius:1.6rem;border:none;cursor:pointer;
  background:var(--card);box-shadow:var(--shadow);font-size:2.8rem;
}
.thumb:active{transform:translateY(2px)}

/* ---------- 分类拖拽 ---------- */
.sort-wrap{display:flex;flex-direction:column;gap:.7rem;width:100%;height:100%;align-items:center;justify-content:space-between;padding-bottom:.2rem}
.sort-pool{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;min-height:5.4rem;align-items:center}
.token{
  width:4.6rem;height:4.6rem;border-radius:1rem;background:var(--card);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;cursor:grab;touch-action:none;
}
.token.dragging{cursor:grabbing;z-index:99;box-shadow:0 .8rem 1.6rem rgba(0,0,0,.24);transform:scale(1.1)}
.token.gone{opacity:0;pointer-events:none}
.bins{display:flex;gap:1rem;width:100%;justify-content:center}
.bin{
  flex:1 1 0;max-width:16rem;min-height:7.5rem;border-radius:var(--radius);
  border:.22rem dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;
  padding:.6rem;transition:background .15s,border-color .15s;
}
.bin.hot{border-color:var(--day);background:var(--day-soft)}
.bin b{font-size:1.05rem}
.bin .caught{display:flex;flex-wrap:wrap;gap:.25rem;justify-content:center;font-size:1.4rem}

/* ---------- 混色 ---------- */
.mix-stage{position:relative;width:min(100%,30rem);height:14rem;touch-action:none}
.mix-circle{
  position:absolute;width:8.5rem;height:8.5rem;border-radius:50%;cursor:grab;touch-action:none;
  mix-blend-mode:multiply;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
}
.mix-answer{
  display:flex;align-items:center;gap:.7rem;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:.7rem 1.2rem;font-size:1.5rem;font-weight:700;
}
.mix-answer .dot{width:2.4rem;height:2.4rem;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}

/* ---------- 投票表 ---------- */
.chart{
  flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;
  gap:.4rem;padding:.4rem .2rem 0;
}
.bar-col{flex:1 1 0;max-width:4rem;display:flex;flex-direction:column;align-items:center;gap:.35rem;height:100%;cursor:pointer}
.bar-track{flex:1 1 auto;width:100%;display:flex;align-items:flex-end;min-height:0}
.bar{width:100%;border-radius:.45rem .45rem .2rem .2rem;min-height:.3rem;transition:height .25s cubic-bezier(.2,.9,.3,1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.bar-col .n{font-size:1.05rem;font-weight:700;line-height:1}
.bar-col .lb{font-size:.62rem;color:var(--ink-soft);line-height:1;text-align:center}
.bar-col.today .lb{color:var(--ink);font-weight:700}
.bar-col.today .n{color:var(--day)}

.hint{text-align:center;color:var(--ink-soft);font-size:.72rem;line-height:1.5;padding:0 1rem}
.teacher-note{
  background:#FFF6DA;border-radius:.8rem;padding:.6rem .9rem;font-size:.72rem;color:#6A5A2E;
  line-height:1.5;max-width:34rem;text-align:center;
}
::-webkit-scrollbar{width:.5rem;height:.5rem}
::-webkit-scrollbar-thumb{background:rgba(46,42,40,.2);border-radius:99px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob a"></div><div class="blob b"></div>
<div id="bunting"></div>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ============================================================
   颜色日 · Color Days
   13 个颜色日 × 7 个课堂活动。单文件，无外部依赖（字体除外）。
   加新颜色 = 在 DAYS 里加一条数据，页面代码不用动。
   ============================================================ */

const DAYS = [
  { zh:"红色", en:"Red", hex:"#E23B2E",
    items:[["🍎","苹果"],["🍓","草莓"],["🌹","玫瑰"],["🚒","消防车"],["🐞","瓢虫"],["❤️","心"]],
    mix:null },
  { zh:"橙色", en:"Orange", hex:"#F08019",
    items:[["🍊","橘子"],["🥕","胡萝卜"],["🎃","南瓜"],["🏀","篮球"],["🦊","狐狸"],["🧡","心"]],
    mix:["红色","黄色"] },
  { zh:"黄色", en:"Yellow", hex:"#F2C31B",
    items:[["🍌","香蕉"],["☀️","太阳"],["🌻","向日葵"],["🧀","奶酪"],["🐥","小鸡"],["🍋","柠檬"]],
    mix:null },
  { zh:"绿色", en:"Green", hex:"#3FA45B",
    items:[["🌳","树"],["🥦","西兰花"],["🐸","青蛙"],["🍀","四叶草"],["🥒","黄瓜"],["🐢","乌龟"]],
    mix:["黄色","蓝色"] },
  { zh:"蓝色", en:"Blue", hex:"#2E74C9",
    items:[["🌊","海"],["🫐","蓝莓"],["🐳","鲸鱼"],["👖","裤子"],["💧","水"],["🐟","鱼"]],
    mix:null },
  { zh:"紫色", en:"Purple", hex:"#8352C4",
    items:[["🍇","葡萄"],["🍆","茄子"],["🦄","独角兽"],["☂️","雨伞"],["🔮","球"],["💜","心"]],
    mix:["红色","蓝色"] },
  { zh:"棕色", en:"Brown", hex:"#8B5A2B",
    items:[["🐻","熊"],["🍫","巧克力"],["🥔","土豆"],["🌰","栗子"],["🐴","马"],["🪵","木头"]],
    mix:["红色","绿色"] },
  { zh:"黑色", en:"Black", hex:"#2B2B2B",
    items:[["🐈‍⬛","猫"],["🦇","蝙蝠"],["🕶️","眼镜"],["🎩","帽子"],["🐜","蚂蚁"],["⚫","圆"]],
    mix:null },
  { zh:"白色", en:"White", hex:"#F2F2EE",
    items:[["☁️","云"],["🥛","牛奶"],["⛄","雪人"],["🦢","天鹅"],["🥚","蛋"],["🦷","牙"]],
    mix:null },
  { zh:"粉色", en:"Pink", hex:"#F08CB4",
    items:[["🌸","花"],["🐷","猪"],["🍑","桃子"],["🎀","蝴蝶结"],["🦩","火烈鸟"],["💗","心"]],
    mix:["红色","白色"] },
  { zh:"灰色", en:"Gray", hex:"#9A9A96",
    items:[["🐘","大象"],["🐺","狼"],["🌧️","雨"],["🪨","石头"],["🐭","老鼠"],["🐦","鸟"]],
    mix:["黑色","白色"] },
  { zh:"彩虹", en:"Rainbow", hex:"#6BA8D8", rainbow:true,
    items:[["🌈","彩虹"],["🎨","颜料"],["🦜","鹦鹉"],["🍬","糖"],["🎈","气球"],["🖍️","蜡笔"]],
    mix:null },
  { zh:"爱国日", en:"Patriotic", hex:"#20418C", patriotic:true,
    items:[["🇺🇸","国旗"],["⭐","星星"],["🎆","烟花"],["🦅","鹰"],["🔵","蓝色"],["⚪","白色"]],
    mix:null }
];

const NUMERALS = ["一","二","三","四","五"];

const STATIONS = [
  { id:"listen", ico:"👂", zh:"听一听，指一指", sub:"老师说颜色，学生指出来。不用开口。" },
  { id:"flip",   ico:"🃏", zh:"翻一翻",       sub:"翻开卡片，看看这个颜色有什么东西。" },
  { id:"count",  ico:"🔢", zh:"数一数",       sub:"屏幕上有几个？说出数字就行。" },
  { id:"judge",  ico:"👍", zh:"对不对？",     sub:"这个东西是这个颜色吗？举手表决。" },
  { id:"sort",   ico:"🧺", zh:"分一分",       sub:"把是今天颜色的拖进筐里。" },
  { id:"mix",    ico:"🎨", zh:"调一调",       sub:"两个圆圈叠起来，看看变成什么色。" },
  { id:"vote",   ico:"📊", zh:"今天穿了吗",   sub:"数今天穿这个颜色的人，点一下长一格。" }
];

/* ---------------- 状态 ---------------- */
let view = { name:"home", day:0, station:null };
let muted = false;
const stage = document.getElementById("stage");
const topbar = document.getElementById("topbar");

/* ---------------- 投票数据（跨天累积，存在本机浏览器里） ---------------- */
const VOTE_KEY = "colorday.votes.v1";
let votes = {};
function loadVotes(){
  try{ votes = JSON.parse(localStorage.getItem(VOTE_KEY)) || {}; }catch(e){ votes = {}; }
}
function saveVotes(){
  try{ localStorage.setItem(VOTE_KEY, JSON.stringify(votes)); }catch(e){}
}
loadVotes();

/* ---------------- 声音 ---------------- */
let ac=null;
function actx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function tone(freq,dur,type,vol,delay){
  if(muted) return; const c=actx(); if(!c) return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||.16,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
const sfxTap     = ()=> tone(520,.07,"triangle",.11);
const sfxGood    = ()=>{ tone(660,.14,"sine",.16,0); tone(880,.14,"sine",.16,.09); tone(1180,.24,"sine",.14,.18); };
const sfxRetry   = ()=>{ tone(320,.16,"sine",.12,0); tone(250,.20,"sine",.10,.11); };
const sfxReveal  = ()=>{ tone(740,.10,"triangle",.13,0); tone(990,.14,"triangle",.11,.07); };

/* 中文朗读（有中文语音就读，没有就静默跳过） */
function speak(text){
  try{
    if(muted || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=.75;
    const v=speechSynthesis.getVoices().find(v=>/zh|Chinese/i.test(v.lang+v.name));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- 小工具 ---------------- */
const el=(t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function day(){ return DAYS[view.day]; }
function otherDays(){ return DAYS.filter((d,i)=>i!==view.day && !d.rainbow && !d.patriotic); }
function findDay(zh){ return DAYS.find(d=>d.zh===zh); }

function setTheme(hex){
  document.documentElement.style.setProperty("--day",hex);
  document.documentElement.style.setProperty("--day-soft",hex+"22");
}

/* 彩带 */
(function bunting(){
  const b=document.getElementById("bunting");
  const pal=DAYS.filter(d=>!d.rainbow&&!d.patriotic).map(d=>d.hex);
  for(let i=0;i<26;i++){ const f=el("i"); f.style.background=pal[i%pal.length]; b.appendChild(f); }
})();

/* ---------------- 顶栏 ---------------- */
function renderTop(){
  topbar.innerHTML="";
  if(view.name!=="home"){
    const back=el("button","chip",view.name==="day" ? "← 所有颜色" : "← "+day().zh+"日");
    back.onclick=()=>{ sfxTap(); view.name==="day" ? go("home") : go("day",view.day); };
    topbar.appendChild(back);
  }
  topbar.appendChild(el("div","spacer"));
  if(view.name==="station"){
    const again=el("button","chip tone","↻ 再来一个");
    again.onclick=()=>{ sfxTap(); renderStage(); };
    topbar.appendChild(again);
  }
  if(view.name==="home"){
    const worksheet=el("a","chip","🖨️ 打印练习纸");
    worksheet.href="../tools/color-days-worksheet.html";
    topbar.appendChild(worksheet);
  }
  const m=el("button","chip", muted?"🔇 静音":"🔊 有声");
  m.onclick=()=>{ muted=!muted; if(!muted) sfxTap(); renderTop(); };
  topbar.appendChild(m);
}

function go(name,dayIdx,station){
  view={name, day: dayIdx==null?view.day:dayIdx, station:station||null};
  if(name==="home") setTheme("#E23B2E"); else setTheme(day().hex);
  renderTop(); renderStage();
  stage.scrollTop=0;
}

/* ============================================================
   首页
   ============================================================ */
function renderHome(){
  const head=el("div","home-head");
  head.innerHTML='<h1>颜色日</h1><p>Color Days · 点一个颜色开始</p>';
  stage.appendChild(head);
  const grid=el("div","grid-days");
  DAYS.forEach((d,i)=>{
    const t=el("button","daytile");
    const sw=el("div","swatch");
    if(d.rainbow) sw.style.background="conic-gradient(#E23B2E,#F08019,#F2C31B,#3FA45B,#2E74C9,#8352C4,#E23B2E)";
    else if(d.patriotic) sw.style.background="linear-gradient(135deg,#B22234 33%,#FFFFFF 33% 66%,#20418C 66%)";
    else sw.style.background=d.hex;
    t.appendChild(sw);
    t.appendChild(el("b",null,d.zh));
    t.appendChild(el("small",null,d.en));
    t.onclick=()=>{ sfxTap(); go("day",i); };
    grid.appendChild(t);
  });
  stage.appendChild(grid);
}

/* ============================================================
   某一天的活动菜单
   ============================================================ */
function renderDay(){
  const d=day();
  const hero=el("div","day-hero");
  const disc=el("div","disc");
  if(d.rainbow) disc.style.background="conic-gradient(#E23B2E,#F08019,#F2C31B,#3FA45B,#2E74C9,#8352C4,#E23B2E)";
  else if(d.patriotic) disc.style.background="linear-gradient(135deg,#B22234 33%,#FFFFFF 33% 66%,#20418C 66%)";
  else disc.style.background=d.hex;
  const txt=el("div");
  txt.appendChild(el("h2",null,"今天是"+d.zh+(d.zh.endsWith("日")?"":"日")+"！"));
  txt.appendChild(el("div","en",d.en+" Day"));
  hero.appendChild(disc); hero.appendChild(txt);
  stage.appendChild(hero);

  const grid=el("div","grid-stations");
  STATIONS.forEach(s=>{
    if(s.id==="mix" && !d.mix && !d.rainbow) return;   // 原色/爱国日没有调色环节
    const b=el("button","station");
    b.appendChild(el("div","ico",s.ico));
    b.appendChild(el("b",null,s.zh));
    b.appendChild(el("small",null,s.sub));
    b.onclick=()=>{ sfxTap(); go("station",view.day,s.id); };
    grid.appendChild(b);
  });
  stage.appendChild(grid);
}

/* ============================================================
   活动 1 · 听一听，指一指
   ============================================================ */
function actListen(){
  const d=day();
  const distract=shuffle(otherDays()).slice(0,3);
  const opts=shuffle([d,...distract]);

  const q=el("div","act-q");
  q.innerHTML='哪个是？<span class="sub">老师念颜色，学生指出来</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const word=el("div","prompt-word",d.zh);
  const say=el("button","chip tone","🔊 再说一遍");
  say.onclick=()=>speak(d.zh);
  const row=el("div","swatch-row");
  const verdict=el("div","verdict");

  opts.forEach(o=>{
    const b=el("button","swatch-btn");
    b.style.background = o.rainbow
      ? "conic-gradient(#E23B2E,#F08019,#F2C31B,#3FA45B,#2E74C9,#8352C4,#E23B2E)" : o.hex;
    b.onclick=()=>{
      if(o===d){
        sfxGood(); verdict.textContent="对了！"+d.zh; verdict.className="verdict good pop";
        row.querySelectorAll("button").forEach(x=>x.disabled=true);
        setTimeout(renderStage,1400);
      }else{
        sfxRetry(); b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        verdict.textContent="再试试"; verdict.className="verdict retry";
      }
    };
    row.appendChild(b);
  });

  body.appendChild(word); body.appendChild(say); body.appendChild(row); body.appendChild(verdict);
  stage.appendChild(body);
  speak(d.zh);
}

/* ============================================================
   活动 2 · 翻一翻
   ============================================================ */
function actFlip(){
  const d=day();
  const q=el("div","act-q");
  q.innerHTML=d.zh+'的东西<span class="sub">点开卡片，一起说出名字</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const grid=el("div","card-grid");
  d.items.forEach(([emo,zh])=>{

    c.innerHTML='<div class="qm">？</div>';
    c.onclick=()=>{
      if(c.classList.contains("open")) { speak(zh); return; }
      sfxReveal(); c.classList.add("open","pop");
      c.innerHTML="";
      c.appendChild(el("div",null,emo));
      c.appendChild(el("span","zh",zh));
      speak(zh);
    };

/* ============================================================
   活动 3 · 数一数
   ============================================================ */
function actCount(){
  const d=day();
  const n=1+rnd(5);
  const [emo,zh]=pick(d.items);

  const q=el("div","act-q");
  q.innerHTML='有几个？<span class="sub">Count them — 说数字就可以</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const tray=el("div","count-tray");
  for(let i=0;i<n;i++){ const s=el("span",null,emo); s.style.animationDelay=(i*.07)+"s"; s.className="pop"; tray.appendChild(s); }
  const row=el("div","num-row");
  const verdict=el("div","verdict");

  NUMERALS.forEach((num,i)=>{
    const b=el("button","num-btn",num);
    b.onclick=()=>{
      if(i+1===n){
        sfxGood();
        verdict.textContent=num+"个"+zh;
        verdict.className="verdict good pop";
        speak(num+"个"+zh);
        row.querySelectorAll("button").forEach(x=>x.disabled=true);
        setTimeout(renderStage,1800);
      }else{
        sfxRetry(); b.classList.add("dim");
        verdict.textContent="再数一遍"; verdict.className="verdict retry";
      }
    };
    row.appendChild(b);
  });

  body.appendChild(tray); body.appendChild(row); body.appendChild(verdict);
  stage.appendChild(body);

  const note=el("div","act-foot");
  const n2=el("div","teacher-note","量词提示：这些东西都用「个」。铅笔、蜡笔要用「支」，先不混着教。");
  note.appendChild(n2);
  stage.appendChild(note);
}

/* ============================================================
   活动 4 · 对不对？
   ============================================================ */
function actJudge(){
  const d=day();
  const truthy=Math.random()<.5;
  let emo,zh,claimColor;
  if(truthy){
    [emo,zh]=pick(d.items); claimColor=d;
  }else{
    const other=pick(otherDays());
    [emo,zh]=pick(other.items); claimColor=d;
  }

  const q=el("div","act-q");
  q.innerHTML='对不对？<span class="sub">Thumbs up or down</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const card=el("div","judge-card");
  card.appendChild(el("div","big",emo));
  card.appendChild(el("div","claim",claimColor.zh+"的"+zh));
  const row=el("div","thumb-row");
  const verdict=el("div","verdict");

  function answer(up){
    const right = (up===truthy);
    if(right){
      sfxGood();
      verdict.textContent = truthy ? "对！"+d.zh+"的"+zh : "不对，"+zh+"不是"+d.zh+"的";
      verdict.className="verdict good pop";
      row.querySelectorAll("button").forEach(x=>x.disabled=true);
      setTimeout(renderStage,1900);
    }else{
      sfxRetry(); verdict.textContent="再看看"; verdict.className="verdict retry";
    }
  }
  const up=el("button","thumb","👍"); up.onclick=()=>answer(true);
  const dn=el("button","thumb","👎"); dn.onclick=()=>answer(false);
  row.appendChild(up); row.appendChild(dn);

  body.appendChild(card); body.appendChild(row); body.appendChild(verdict);
  stage.appendChild(body);
}

/* ============================================================
   活动 5 · 分一分（拖拽，支持触摸屏）
   ============================================================ */
function actSort(){
  const d=day();
  const mine=shuffle(d.items).slice(0,3);
  const theirs=shuffle(otherDays()).slice(0,3).map(o=>pick(o.items));
  const pool=shuffle([...mine.map(x=>[x,true]), ...theirs.map(x=>[x,false])]);

  const q=el("div","act-q");
  q.innerHTML='把'+d.zh+'的拖进筐里<span class="sub">Drag the '+d.en.toLowerCase()+' ones into the basket</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const wrap=el("div","sort-wrap");
  const poolEl=el("div","sort-pool");
  const bins=el("div","bins");
  const binYes=el("div","bin"); binYes.appendChild(el("b",null,d.zh+" ✓")); const caughtY=el("div","caught"); binYes.appendChild(caughtY);
  const binNo =el("div","bin"); binNo.appendChild(el("b",null,"不是 ✗"));  const caughtN=el("div","caught"); binNo.appendChild(caughtN);
  bins.appendChild(binYes); bins.appendChild(binNo);
  const verdict=el("div","verdict");

  let left=pool.length;
  pool.forEach(([[emo,zh],isMine])=>{
    const t=el("div","token",emo);
    t.dataset.mine=isMine?"1":"0"; t.dataset.zh=zh;
    makeDraggable(t);
    poolEl.appendChild(t);
  });

  function makeDraggable(t){
    let sx,sy,ox,oy,dragging=false;
    t.addEventListener("pointerdown",e=>{
      dragging=true; t.setPointerCapture(e.pointerId);
      const r=t.getBoundingClientRect();
      sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
      t.classList.add("dragging");
      t.style.position="fixed"; t.style.left=ox+"px"; t.style.top=oy+"px"; t.style.margin="0";
      sfxTap();
    });
    t.addEventListener("pointermove",e=>{
      if(!dragging) return;
      t.style.left=(ox+e.clientX-sx)+"px"; t.style.top=(oy+e.clientY-sy)+"px";
      const over=hit(e.clientX,e.clientY);
      binYes.classList.toggle("hot",over===binYes);
      binNo.classList.toggle("hot",over===binNo);
    });
    const end=e=>{
      if(!dragging) return; dragging=false;
      t.classList.remove("dragging");
      binYes.classList.remove("hot"); binNo.classList.remove("hot");
      const over=hit(e.clientX,e.clientY);
      const mine=t.dataset.mine==="1";
      if(over && ((over===binYes)===mine)){
        sfxGood();
        const c=(over===binYes?caughtY:caughtN);
        c.appendChild(el("span",null,t.textContent));
        t.classList.add("gone"); left--;
        verdict.textContent=""; verdict.className="verdict";
        if(left===0){
          verdict.textContent="全对了！"; verdict.className="verdict good pop";
          setTimeout(renderStage,1700);
        }
      }else{
        if(over){ sfxRetry(); verdict.textContent="放错筐啦"; verdict.className="verdict retry"; }
        t.style.position=""; t.style.left=""; t.style.top=""; t.style.margin="";
      }
    };
    t.addEventListener("pointerup",end);
    t.addEventListener("pointercancel",end);
  }
  function hit(x,y){
    for(const b of [binYes,binNo]){
      const r=b.getBoundingClientRect();
      if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom) return b;
    }
    return null;
  }

  wrap.appendChild(poolEl); wrap.appendChild(verdict); wrap.appendChild(bins);
  body.appendChild(wrap);
  stage.appendChild(body);
}

/* ============================================================
   活动 6 · 调一调（混色）
   ============================================================ */
function hexToRgb(h){ h=h.replace("#",""); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function rgbToHex(r){ return "#"+r.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join(""); }
function multiply(a,b){ const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex(A.map((v,i)=>v*B[i]/255)); }

function actMix(){
  const d=day();
  const [aName,bName] = d.mix || ["红色","黄色"];
  const A=findDay(aName), B=findDay(bName);
  // 用真实颜料的结果，而不是屏幕混色的结果
  const RESULT = d.mix ? d.hex : multiply(A.hex,B.hex);

  const q=el("div","act-q");
  q.innerHTML=A.zh+' + '+B.zh+' = ?<span class="sub">把两个圆圈拖到一起看看</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const st=el("div","mix-stage");
  const c1=el("div","mix-circle"); c1.style.background=A.hex; c1.style.left="1rem";  c1.style.top="2rem";
  const c2=el("div","mix-circle"); c2.style.background=B.hex; c2.style.right="1rem"; c2.style.top="2rem";
  const ans=el("div","mix-answer");
  const dot=el("div","dot"); dot.style.background="transparent"; dot.style.border="2px dashed var(--line)";
  const lbl=el("span",null,"？");
  ans.appendChild(dot); ans.appendChild(lbl);

  let solved=false;
  function drag(node,fromRight){
    let sx,sy,ox,oy,on=false;
    node.addEventListener("pointerdown",e=>{
      on=true; node.setPointerCapture(e.pointerId);
      const p=st.getBoundingClientRect(), r=node.getBoundingClientRect();
      ox=r.left-p.left; oy=r.top-p.top; sx=e.clientX; sy=e.clientY;
      node.style.left=ox+"px"; node.style.top=oy+"px"; node.style.right="auto";
      sfxTap();
    });
    node.addEventListener("pointermove",e=>{
      if(!on) return;
      const p=st.getBoundingClientRect();
      let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy;
      nx=Math.max(0,Math.min(p.width-node.offsetWidth,nx));
      ny=Math.max(0,Math.min(p.height-node.offsetHeight,ny));
      node.style.left=nx+"px"; node.style.top=ny+"px";
      check();
    });
    const end=()=>{on=false;};
    node.addEventListener("pointerup",end); node.addEventListener("pointercancel",end);
  }
  function overlap(){
    const r1=c1.getBoundingClientRect(), r2=c2.getBoundingClientRect();
    const dx=(r1.left+r1.width/2)-(r2.left+r2.width/2);
    const dy=(r1.top+r1.height/2)-(r2.top+r2.height/2);
    return Math.hypot(dx,dy) < r1.width*0.62;
  }
  function check(){
    if(solved || !overlap()) return;
    solved=true;
    sfxGood();
    dot.style.background=RESULT; dot.style.border="none";
    lbl.textContent=d.mix ? d.zh : "混合色";
    ans.classList.add("pop");
    speak(A.zh+"加"+B.zh+"，变成"+d.zh);
  }
  drag(c1); drag(c2,true);
  st.appendChild(c1); st.appendChild(c2);

  body.appendChild(st); body.appendChild(ans);
  stage.appendChild(body);

  const foot=el("div","act-foot");
  foot.appendChild(el("div","teacher-note","屏幕上是叠色效果，真实颜料的结果写在下面的圆点里。课后可以用透明杯 + 食用色素做一次真的。"));
  stage.appendChild(foot);
}

/* ============================================================
   活动 7 · 今天穿了吗（跨天累积柱状图）
   ============================================================ */
function actVote(){
  const q=el("div","act-q");
  q.innerHTML='今天穿'+day().zh+'的有几个人？<span class="sub">点柱子加一个人，长按减一个</span>';
  stage.appendChild(q);

  const chart=el("div","chart");
  const max=()=>Math.max(5,...DAYS.map(d=>votes[d.zh]||0));

  DAYS.forEach((d,i)=>{
    const col=el("div","bar-col"+(i===view.day?" today":""));
    const n=el("div","n",String(votes[d.zh]||0));
    const track=el("div","bar-track");
    const bar=el("div","bar");
    bar.style.background = d.rainbow
      ? "linear-gradient(#8352C4,#2E74C9,#3FA45B,#F2C31B,#F08019,#E23B2E)"
      : (d.patriotic ? "linear-gradient(#B22234 33%,#FFFFFF 33% 66%,#20418C 66%)" : d.hex);
    track.appendChild(bar);
    const lb=el("div","lb",d.zh);
    col.appendChild(n); col.appendChild(track); col.appendChild(lb);

    let timer=null, held=false;
    col.addEventListener("pointerdown",()=>{
      held=false;
      timer=setTimeout(()=>{
        held=true;
        votes[d.zh]=Math.max(0,(votes[d.zh]||0)-1); saveVotes(); sfxRetry(); redraw();
      },600);
    });
    const rel=()=>{
      clearTimeout(timer);
      if(!held){ votes[d.zh]=(votes[d.zh]||0)+1; saveVotes(); sfxTap(); redraw(); }
    };
    col.addEventListener("pointerup",rel);
    col.addEventListener("pointerleave",()=>clearTimeout(timer));

    chart.appendChild(col);
  });

  function redraw(){
    const m=max();
    [...chart.children].forEach((col,i)=>{
      const d=DAYS[i], v=votes[d.zh]||0;
      col.querySelector(".n").textContent=String(v);
      col.querySelector(".bar").style.height=(v/m*100)+"%";
    });
  }
  stage.appendChild(chart);

  const foot=el("div","act-foot");
  const reset=el("button","chip","清空重来");
  reset.onclick=()=>{
    if(confirm("清空所有颜色的记录？")){ votes={}; saveVotes(); renderStage(); }
  };
  foot.appendChild(reset);
  stage.appendChild(foot);

  const hint=el("div","hint","记录存在这台电脑的浏览器里，明天打开还在。十三天下来就是一张全班的颜色统计图。");
  stage.appendChild(hint);

  requestAnimationFrame(redraw);
}

/* ============================================================
   渲染分发
   ============================================================ */
const ACTS={ listen:actListen, flip:actFlip, count:actCount, judge:actJudge, sort:actSort, mix:actMix, vote:actVote };

function renderStage(){
  stage.innerHTML="";
  if(view.name==="home") return renderHome();
  if(view.name==="day")  return renderDay();
  ACTS[view.station]();
}

/* 键盘：← 返回，空格 下一个 */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"||e.key==="ArrowLeft"){
    if(view.name==="station") go("day",view.day);
    else if(view.name==="day") go("home");
  }
  if(e.key===" "&&view.name==="station"){ e.preventDefault(); renderStage(); }
});

if(window.speechSynthesis) speechSynthesis.getVoices();
go("home");
</script>
