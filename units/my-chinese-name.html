:root{
  font-size:18px;
  --ink:#2E2A28;
  --ink-soft:#6B625C;

  --card:#FFFFFF;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-zh);
  color:var(--ink);

.blob.a{width:22rem;height:22rem;left:-7rem;top:-6rem;background:#FFD9A8}
.blob.b{width:20rem;height:20rem;right:-6rem;bottom:-7rem;background:#BFE3FF}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;

.topbar{display:flex;align-items:center;gap:.5rem;flex:0 0 auto;padding:.15rem 0 .5rem}
.topbar .spacer{flex:1}
.chip{
  border:none;background:var(--card);color:var(--ink);
  font-family:inherit;font-size:.82rem;font-weight:700;
  padding:.4rem .85rem;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;
  display:inline-flex;align-items:center;gap:.3rem;line-height:1.2;
  text-decoration:none;
}
.chip:active{transform:translateY(1px)}
.chip.tone{background:var(--accent);color:#fff}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.stage.scroll{overflow-y:auto}

/* ---------- home ---------- */
.home-head{text-align:center;flex:0 0 auto;padding:.2rem 0 .8rem}
.home-head h1{margin:0;font-size:2rem;letter-spacing:.04em}
.home-head p{margin:.3rem 0 0;color:var(--ink-soft);font-size:.85rem}

.class-filter{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;flex:0 0 auto;padding-bottom:.7rem}
.class-chip{
  border:none;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;
  padding:.35rem .8rem;border-radius:999px;background:var(--card);color:var(--ink-soft);box-shadow:var(--shadow);
}
.class-chip.on{background:var(--accent);color:#fff}

.roster-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:.2rem .2rem 1rem}
.roster-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));
  gap:.7rem;
}
.student-card{
  border:none;cursor:pointer;font-family:inherit;color:inherit;text-align:center;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:.9rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;
}
.student-card:active{transform:translateY(2px)}
.student-card .pic{width:3.6rem;height:3.6rem;border-radius:50%;object-fit:cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.student-card .pic-fallback{width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.student-card b{font-size:1rem}
.student-card small{color:var(--ink-soft);font-size:.68rem}
.empty-note{text-align:center;color:var(--ink-soft);font-size:.82rem;padding:2rem 1rem;line-height:1.6}

.name-row{display:flex;gap:.4rem;align-items:flex-end}
.name-char{
  border:none;cursor:pointer;font-family:inherit;background:var(--card);color:var(--ink);

.name-char:active{transform:translateY(2px)}
.name-char .py{font-size:.62rem;font-weight:400;color:var(--ink-soft);font-family:"LXGW WenKai Lite",sans-serif;margin-top:.15rem}
.name-char.surname{border-bottom:.28rem solid #4FC3F7}
.name-char.given{border-bottom:.28rem solid var(--accent)}
.read-btn{
  border:none;cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;
  box-shadow:var(--shadow);border-radius:999px;padding:.5rem 1.2rem;font-size:.9rem;font-weight:700;

.read-btn:active{transform:translateY(2px)}

.legend i{width:.6rem;height:.6rem;border-radius:50%;display:inline-block}
.legend i.surname{background:#4FC3F7}
.legend i.given{background:var(--accent)}

.meaning-grid{display:flex;flex-direction:column;gap:.7rem;width:min(100%,34rem)}

.meaning-card.surname .glyph{background:#4FC3F722}

const DATASET = 'production';

function currentAcademicYear(){
  const now = new Date();
  const startYear = now.getMonth()>=7 ? now.getFullYear() : now.getFullYear()-1;
  return `${String(startYear).slice(-2)}-${String(startYear+1).slice(-2)}`;
}
const ACADEMIC_YEAR = currentAcademicYear();
const ROSTER_QUERY = encodeURIComponent(
  `*[_type == "student" && className in ["elephant","tiger"] && academicYear == "${ACADEMIC_YEAR}" && coalesce(status,"active") == "active"]
   | order(nameEn asc, nameZh asc, name asc)
   {nameZh, nameEn, name, className, "img": avatar.asset->url}`
);
const ROSTER_API = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${ROSTER_QUERY}`;

/* 样例小朋友：万一名单还没读到（离线 / 新学年还没录入），先看看效果 */
const SAMPLE_STUDENTS = [
  { display:"罗大韦", className:"elephant", img:null },
  { display:"陈小美", className:"tiger",    img:null },
  { display:"王强强", className:"elephant", img:null },
  { display:"李丽丽", className:"tiger",    img:null },
];

let roster = [];
let rosterLoaded = false;

(async function loadRoster(){
  try{
    const r = await fetch(ROSTER_API);
    const d = await r.json();
    roster = (d.result||[])
      .map(s => ({ display: s.nameZh || s.name || s.nameEn || "", className: s.className, img: s.img }))
      .filter(s => s.display);
  }catch(e){}
  rosterLoaded = true;
  if(view.name==="home") renderStage();
})();

function studentsForFilter(filter){
  const pool = rosterLoaded && roster.length ? roster : SAMPLE_STUDENTS;
  if(filter==="all") return pool;
  return pool.filter(s=>s.className===filter);
}

function pinyinFor(char){
  try{
    if(window.pinyinPro) return window.pinyinPro.pinyin(char,{toneType:"symbol"});
  }catch(e){}
  return "";
}

function splitSurnameGiven(name){
  for(const s of SURNAME_2){ if(name.startsWith(s)) return { surname:s, given:name.slice(s.length) }; }
  // 中文姓名的常见结构是"姓在前，名在后"，就算这个姓不在我们的小词典里，
  // 也按这个惯例把第一个字当姓，其余当名。
  return { surname:name[0], given:name.slice(1) };
}

/* ---------------- 中文朗读（跟四会字页面同一套发音引擎/同一套 fallback 链路） ---------------- */
let globalAudio = new Audio();
async function speak(text){
  if(!text) return;
  globalAudio.pause();

  const localPath = `../audio/student_names/${encodeURIComponent(text)}.mp3`;
  const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;

  try{
    const localRes = await fetch(localPath, { method:"HEAD" }).catch(()=>null);
    if(localRes && localRes.ok && localRes.headers.get("content-type") && localRes.headers.get("content-type").includes("audio")){
      globalAudio.src = localPath; await globalAudio.play(); return;
    }
  }catch(e){}

  try{
    const azureRes = await fetch(azureUrl).catch(()=>null);
    if(azureRes && azureRes.ok && azureRes.headers.get("content-type") && azureRes.headers.get("content-type").includes("audio")){
      const audioBlob = await azureRes.blob();
      globalAudio.src = URL.createObjectURL(audioBlob); await globalAudio.play(); return;
    }
  }catch(e){}

  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=.78;
    const v=speechSynthesis.getVoices().find(v=>/zh|Chinese/i.test(v.lang+v.name));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

let view = { name:"home", student:null };

function renderTop(){
  topbar.innerHTML="";
  if(view.name==="home"){

    back.href="../parents.html";

function go(name, student){

/* URL 里带 ?child=... 时（比如从"写字大挑战"练完字返回），直接打开那个小朋友的详情页 */
function openFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const child = params.get("child");
  if(child) go("detail", decodeURIComponent(child));
  else go("home");
}

  head.appendChild(el("h1",null,"我的中文名字"));
  head.appendChild(el("p",null,"My Chinese Name · 点一位小朋友，看头像、听发音、学写字"));

  if(!pool.length){
    scroll.appendChild(el("div","empty-note","还没有找到名单。No students found for this class yet."));
  }else{
    const grid=el("div","roster-grid");
    pool.forEach(s=>{
      const b=el("button","student-card");
      if(s.img){
        const img=document.createElement("img");
        img.className="pic"; img.src=s.img; img.alt=s.display;
        b.appendChild(img);
      }else{
        b.appendChild(el("div","pic-fallback","🙋"));
      }
      b.appendChild(el("b",null,s.display));
      b.appendChild(el("small",null, s.className==="elephant"?"🐘 Elephants":s.className==="tiger"?"🐯 Tigers":""));
      b.onclick=()=>go("detail", s.display);
      grid.appendChild(b);
    });
    scroll.appendChild(grid);
  }
  stage.appendChild(scroll);
}

   详情页

function studentByName(name){
  const pool = rosterLoaded && roster.length ? roster : SAMPLE_STUDENTS;
  return pool.find(s=>s.display===name) || { display:name, className:null, img:null };
}

function meaningCard(ch, isSurname){
  const card = el("div","meaning-card"+(isSurname?" surname":""));

  const glyph = el("div","glyph",ch);
  card.appendChild(glyph);

  const body = el("div","body");
  body.appendChild(el("div","tag", isSurname ? "Family Name · 姓" : "Given Name · 名"));

  const py = pinyinFor(ch);
  body.appendChild(el("div","py-line", ch + (py?"  ·  "+py:"")));

  // A character's "main" dictionary depends on whether it's sitting in the
  // surname or given-name slot, but a lot of characters are common in both
  // roles (e.g. 林/白/雷 are frequent surnames AND given-name characters), so
  // always fall back to the other dictionary before giving up.
  const primary = isSurname ? SURNAMES : GIVEN;
  const secondary = isSurname ? GIVEN : SURNAMES;
  const meaning = primary[ch] || secondary[ch];
  body.appendChild(el("div","en", meaning || "This character's story hasn't been added yet — ask your teacher what it means!"));

  const btns = el("div","row-btns");
  const playBtn = el("button","mini-btn","🔊 Say it");
  playBtn.onclick=()=>speak(ch);
  btns.appendChild(playBtn);

  const writeBtn = el("a","mini-btn write","✍️ Practice writing");
  const childParam = encodeURIComponent(view.student||"");
  writeBtn.href = `../cla/tracing.html?char=${encodeURIComponent(ch)}&from=name&child=${childParam}&role=parents`;
  btns.appendChild(writeBtn);

  body.appendChild(btns);
  card.appendChild(body);
  return card;
}

function renderDetail(){
  stage.className = "stage";
  const student = studentByName(view.student);
  const chars = chineseChars(student.display);

  const wrap = el("div","detail");

  const dhead = el("div","detail-head");
  if(student.img){
    const img=document.createElement("img");
    img.className="pic"; img.src=student.img; img.alt=student.display;
    dhead.appendChild(img);
  }else{
    dhead.appendChild(el("div","pic-fallback","🙋"));
  }

  if(!chars.length){
    dhead.appendChild(el("div",null,student.display||"—"));
    wrap.appendChild(dhead);
    wrap.appendChild(el("div","empty-note","还没有登记中文名字。No Chinese name on file yet."));
    stage.appendChild(wrap);
    return;
  }

  const { surname, given } = splitSurnameGiven(student.display);

  const nameRow = el("div","name-row");
  chars.forEach((ch,i)=>{
    const isSurname = i < surname.length;
    const btn = el("button","name-char"+(isSurname?" surname":" given"));
    btn.appendChild(document.createTextNode(ch));
    const py = el("div","py", pinyinFor(ch));
    btn.appendChild(py);
    btn.onclick=()=>speak(ch);
    nameRow.appendChild(btn);
  });
  dhead.appendChild(nameRow);

  const legend = el("div","legend");
  legend.innerHTML = '<span><i class="surname"></i>Family name</span><span><i class="given"></i>Given name</span>';
  dhead.appendChild(legend);

  const readAll = el("button","read-btn","🔊 Read My Whole Name");
  readAll.onclick=()=>speak(student.display);
  dhead.appendChild(readAll);

  wrap.appendChild(dhead);

  const grid = el("div","meaning-grid");
  chars.forEach((ch,i)=>{
    const isSurname = i < surname.length;
    grid.appendChild(meaningCard(ch, isSurname));
  });
  wrap.appendChild(grid);

  const note = el("div","teacher-note",
    "小贴士：同一个字在不同名字里可能有不同的寓意，这里给出的是最常见的一种解读。A character can carry more than one good meaning — this is just one common reading.");
  wrap.appendChild(note);

  stage.appendChild(wrap);
  speak(student.display);
}

  stage.innerHTML="";
  if(view.name==="home") return renderHome();
  return renderDetail();
}
