<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你叫什么名字 · What's Your Name</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css">
<style>
/* CJK-only KaiTi — unicode-range restricts this face to Chinese/CJK characters only,
   so Latin letters, digits, and symbols automatically fall back to LXGW WenKai Lite. */
@font-face {
  font-family: "KaiTi-CJK";
  src: local("STKaiti-SC-Regular"), local("STKaiti"), local("Kaiti SC"),
       local("BiauKai"), local("KaiTi"), local("楷体");
  unicode-range:
    U+2E80-2EFF, U+2F00-2FDF, U+3000-303F, U+3040-30FF, U+31F0-31FF,
    U+3200-32FF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FE30-FE4F,
    U+FF00-FFEF, U+20000-2A6DF;
}
:root{
  font-size:18px;
  --ink:#2E2A28;
  --ink-soft:#6B625C;
  --paper:#FFFDF7;
  --card:#FFFFFF;
  --line:rgba(46,42,40,.14);
  --accent:#F0663C;
  --accent-soft:#F0663C22;
  --shadow:0 .35rem 1.1rem rgba(46,42,40,.13);
  --radius:1.1rem;
  --font-zh:"KaiTi-CJK","LXGW WenKai Lite","LXGW WenKai",serif;
}
@media (min-width:900px){ :root{ font-size:20px; } }
@media (min-width:1300px){ :root{ font-size:23px; } }
@media (min-width:1700px){ :root{ font-size:27px; } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-zh);
  color:var(--ink);
  background:
    radial-gradient(60rem 40rem at 12% -10%, #FFF3D6 0%, transparent 60%),
    radial-gradient(50rem 36rem at 95% 8%, #E8F4FF 0%, transparent 62%),
    radial-gradient(48rem 40rem at 50% 115%, #FFE9F2 0%, transparent 60%),
    linear-gradient(#FFFDF7,#FDF6EA);
  overflow:hidden;
  user-select:none;
}
.blob{position:fixed;border-radius:50%;filter:blur(3.2rem);opacity:.5;pointer-events:none;z-index:0}
.blob.a{width:22rem;height:22rem;left:-7rem;top:-6rem;background:#FFD9A8}
.blob.b{width:20rem;height:20rem;right:-6rem;bottom:-7rem;background:#BFE3FF}

/* ---------- shell ---------- */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  width:min(96vw,72rem);max-height:100vh;margin:0 auto;padding:1.1rem .8rem .8rem}
.topbar{display:flex;align-items:center;gap:.5rem;flex:0 0 auto;padding:.15rem 0 .5rem}
.topbar .spacer{flex:1}
.chip{
  border:none;background:var(--card);color:var(--ink);
  font-family:inherit;font-size:.82rem;font-weight:700;
  padding:.4rem .85rem;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;
  display:inline-flex;align-items:center;gap:.3rem;line-height:1.2;
  text-decoration:none;
}
.chip:active{transform:translateY(1px)}
.chip.tone{background:var(--accent);color:#fff}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- home ---------- */
.home-head{text-align:center;flex:0 0 auto;padding:.2rem 0 .8rem}
.home-title-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1.1rem}
.home-title-row h1{margin:0;font-size:2rem;letter-spacing:.04em}
.home-head p{margin:.3rem 0 0;color:var(--ink-soft);font-size:.85rem}
.song-btn{
  flex:0 0 auto;border:none;background:var(--card);color:var(--ink);cursor:pointer;
  font-family:inherit;font-size:.85rem;font-weight:700;text-decoration:none;
  padding:.5rem 1.1rem;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;
  display:inline-flex;align-items:center;gap:.3rem;
}
.song-btn:active{transform:translateY(1px)}
.video-modal{
  position:fixed;inset:0;background:rgba(20,16,12,.82);z-index:50;
  display:none;align-items:center;justify-content:center;padding:2rem;
}
.video-modal.open{display:flex}
.video-modal-inner{position:relative;width:min(92vw,48rem)}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:1rem;overflow:hidden;box-shadow:0 1rem 3rem rgba(0,0,0,.4)}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.video-close{
  position:absolute;top:-2.6rem;right:0;border:none;cursor:pointer;
  background:#fff;color:var(--ink);border-radius:999px;width:2.4rem;height:2.4rem;
  font-size:1.1rem;box-shadow:var(--shadow);
}

.grid-stations{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));
  gap:.7rem;padding:.2rem .2rem 1rem;align-content:start;
}
.station{
  border:none;cursor:pointer;font-family:inherit;color:inherit;text-align:left;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:.9rem .85rem;display:flex;flex-direction:column;gap:.3rem;
  border-top:.28rem solid var(--accent);
}
.station:active{transform:translateY(2px)}
.station .ico{font-size:1.7rem;line-height:1}
.station b{font-size:1rem}
.station small{color:var(--ink-soft);font-size:.72rem;line-height:1.4}

/* ---------- generic activity frame ---------- */
.act{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.6rem}
.act-q{flex:0 0 auto;text-align:center;font-size:1.5rem;font-weight:700;line-height:1.25}
.act-q .sub{display:block;font-size:.72rem;font-weight:400;color:var(--ink-soft);letter-spacing:.08em;margin-top:.2rem}
.act-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;overflow:hidden}
.act-body.scroll{overflow-y:auto;justify-content:flex-start;padding:.15rem .15rem .6rem}
.act-foot{flex:0 0 auto;display:flex;justify-content:center;gap:.5rem;padding-bottom:.2rem}

.verdict{font-size:1.5rem;font-weight:700;min-height:2rem;text-align:center}
.verdict.good{color:#1E7A46}
.verdict.retry{color:#B4562C}
@keyframes popIn{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.pop{animation:popIn .34s cubic-bezier(.22,1.2,.4,1)}

/* ---------- 听一听 ---------- */
.choice-row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
.choice-btn{
  width:7.5rem;height:7.5rem;border-radius:1.4rem;border:none;cursor:pointer;
  background:var(--card);box-shadow:var(--shadow),inset 0 0 0 1px rgba(0,0,0,.08);
  font-size:3.2rem;display:flex;align-items:center;justify-content:center;
}
.choice-btn:active{transform:scale(.96)}
.choice-btn.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
.prompt-word{font-size:3rem;font-weight:700;letter-spacing:.08em}

/* 词语配图：四会字库里有的直接用照片，没有的用手绘小图标 */
.word-visual{width:1em;height:1em;display:inline-flex;align-items:center;justify-content:center}
.word-visual img{width:100%;height:100%;object-fit:cover;border-radius:.18em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.word-visual svg{width:100%;height:100%;display:block}

/* ---------- 翻牌 ---------- */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;width:min(100%,32rem)}
.flip{
  aspect-ratio:1/1;border:none;border-radius:1.1rem;cursor:pointer;font-family:inherit;
  background:var(--accent);box-shadow:var(--shadow);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;
  font-size:2.4rem;-webkit-appearance:none;appearance:none;overflow:hidden;padding:0;
}
.flip.open{background:var(--card);color:var(--ink)}
.flip .emo{font-size:1.5em;line-height:1}
.flip span.zh{font-size:.85rem;font-weight:700}
.flip .qm{opacity:.85}

/* ---------- 说你好 ---------- */
.greet-row{display:flex;gap:2.4rem;align-items:flex-end;justify-content:center}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:.5rem;cursor:pointer;border:none;background:none;font-family:inherit}
.avatar-wrap .bubble{background:var(--card);padding:.4rem 1rem;border-radius:999px;box-shadow:var(--shadow);font-weight:700;font-size:1.05rem}
.avatar-wrap svg{transform-origin:50% 15%}
.avatar-wrap.wave svg{animation:wave .5s ease}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.turn-card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:1rem 1.4rem;text-align:center;display:flex;flex-direction:column;gap:.3rem;align-items:center;max-width:26rem;
}
.turn-card .big{font-size:2.2rem}
.turn-card b{font-size:1.05rem}
.turn-card small{color:var(--ink-soft);font-size:.75rem;line-height:1.5}

/* ---------- 问答对话 ---------- */
.class-filter{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.class-chip{
  border:none;cursor:pointer;font-family:inherit;font-size:.78rem;font-weight:700;
  padding:.35rem .8rem;border-radius:999px;background:var(--card);color:var(--ink-soft);box-shadow:var(--shadow);
}
.class-chip.on{background:var(--accent);color:#fff}
.dialog-wrap{display:flex;flex-direction:column;gap:1.2rem;width:min(100%,42rem)}
.dialog-line{
  display:flex;align-items:center;gap:1.1rem;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:1.2rem 1.5rem;cursor:pointer;
}
.dialog-line .who{width:4rem;height:4rem;font-size:2.4rem;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dialog-line .who-photo{width:4rem;height:4rem;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:0 0 0 2px #fff,inset 0 0 0 1px rgba(0,0,0,.08)}
.dialog-line .txt{font-size:1.6rem;font-weight:700;flex:1 1 auto;line-height:1.35}
.dialog-line.q{border-left:.3rem solid var(--accent)}
.dialog-line.a{border-left:.3rem solid #4FC3F7}

/* ---------- 拼句子 ---------- */
.sentence-built{font-size:1.9rem;font-weight:700;min-height:2.6rem;letter-spacing:.05em;text-align:center}
.sentence-built .blank{color:var(--ink-soft)}
.tile-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;max-width:30rem}
.tile{
  border:none;cursor:pointer;font-family:inherit;background:var(--card);color:var(--ink);
  box-shadow:var(--shadow);border-radius:.8rem;padding:.6rem 1rem;font-size:1.3rem;font-weight:700;
}
.tile:active{transform:translateY(2px)}
.tile.used{opacity:.25;pointer-events:none}
.tile.wrong{animation:shake .4s}

/* ---------- 内圈外圈问名字（对应我们教室 6×5 的方块地毯） ---------- */
.circle-steps{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:.8rem 1.1rem;max-width:32rem;font-size:.8rem;line-height:1.7;color:var(--ink-soft);
}
.circle-steps b{color:var(--ink)}
.circle-stage{position:relative;width:300px;height:250px;flex:0 0 auto;border-radius:1rem;overflow:hidden;box-shadow:var(--shadow)}
.rug-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr)}
.rug-cell{box-shadow:inset 0 0 0 1px rgba(46,42,40,.08)}
.rug-cell.a{background:#FFE1CE}
.rug-cell.b{background:#FFF3D2}
.circle-ring-dot{
  position:absolute;width:2.3rem;height:2.3rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;box-shadow:var(--shadow),inset 0 0 0 1px rgba(0,0,0,.08);
  offset-rotate:0deg;offset-anchor:50% 50%;
}
.circle-ring-dot.in{background:#FFE3CE}
.circle-ring-dot.out{background:#DFF4FF}
.circle-ring-dot.out.spin{animation:trackmove var(--dur,5.5s) linear infinite}
.circle-ring-dot.out.spin.rev{animation-direction:reverse}
@keyframes trackmove{from{offset-distance:0%}to{offset-distance:100%}}
.circle-hub{
  position:absolute;left:50%;top:50%;width:2.6rem;height:2.6rem;margin:-1.3rem;border-radius:50%;
  background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;z-index:2;
}
.circle-status{font-size:1.15rem;font-weight:700;text-align:center;min-height:1.8rem}
.circle-controls{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center}
.round-badge{
  background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:.35rem .85rem;
  font-size:.78rem;font-weight:700;color:var(--ink-soft);
}

.hint{text-align:center;color:var(--ink-soft);font-size:.72rem;line-height:1.5;padding:0 1rem}
.teacher-note{
  background:#FFF6DA;border-radius:.8rem;padding:.6rem .9rem;font-size:.72rem;color:#6A5A2E;
  line-height:1.5;max-width:34rem;text-align:center;
}
::-webkit-scrollbar{width:.5rem;height:.5rem}
::-webkit-scrollbar-thumb{background:rgba(46,42,40,.2);border-radius:99px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============================================================

/* 词语配图：优先用"四会字"词库里现成的照片（跟 word_detail 等页面同一批素材），

const WORDS = [
  { zh:"你好", en:"Hello", img:"https://cdn.sanity.io/images/sow12t1i/production/3d4a5ff2ac9e2f7140e9df6e1a5d7f1f0beee45b-800x800.webp" },

function wordVisualNode(w){

const NAMES = ["罗大韦","陈小美","王强强","李丽丽","张明明","刘娜娜","高安安","黄乐乐"];

const GREET_HEXES = ["#4FC3F7","#FF7A63","#35D0BA","#B18CF0","#FFC94D","#F0663C"];

/* 王老师头像：问问题的那个人，跟"你几岁？我的生日"单元共用同一张照片 */

/* 两首歌，来自老师课件里用的原版视频 */
const SONGS = [

];

const STATIONS = [
  { id:"greet",    ico:"👋", zh:"说你好",          sub:"看人物打招呼，跟着说一说" },
  { id:"ask",      ico:"💬", zh:"你叫什么名字",    sub:"听问答，再和同桌试一试" },

];

/* ---------------- 状态 ---------------- */
let view = { name:"home", station:null };
let muted = false;
const stage = document.getElementById("stage");
const topbar = document.getElementById("topbar");

/* ---------------- 声音 ---------------- */
let ac=null;
function actx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
function tone(freq,dur,type,vol,delay){
  if(muted) return; const c=actx(); if(!c) return;
  const t=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol||.16,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02);
}
const sfxTap     = ()=> tone(520,.07,"triangle",.11);
const sfxGood    = ()=>{ tone(660,.14,"sine",.16,0); tone(880,.14,"sine",.16,.09); tone(1180,.24,"sine",.14,.18); };
const sfxRetry   = ()=>{ tone(320,.16,"sine",.12,0); tone(250,.20,"sine",.10,.11); };
const sfxReveal  = ()=>{ tone(740,.10,"triangle",.13,0); tone(990,.14,"triangle",.11,.07); };
const sfxTick    = ()=> tone(880,.045,"square",.05);
const sfxBell    = ()=>{ tone(1046,.16,"sine",.15,0); tone(1568,.22,"sine",.12,.1); };

/* ---------------- 中文朗读（跟四会字页面同一套发音引擎） ---------------- */
const SANITY_PROJECT_ID = 'sow12t1i';
const SANITY_DATASET = 'production';
const SANITY_WORD_QUERY = encodeURIComponent('*[_type == "word"] | order(_createdAt asc) {char, "audioUrl": audio.asset->url}');
const SANITY_WORD_API = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${SANITY_DATASET}?query=${SANITY_WORD_QUERY}`;

let sanityAudioMap = {};
(async function loadSanityAudioMap(){
  try{
    const r = await fetch(SANITY_WORD_API);
    const d = await r.json();
    (d.result||[]).forEach(w=>{ if(w.char && w.audioUrl) sanityAudioMap[w.char]=w.audioUrl; });
  }catch(e){}
})();

/* ---------------- 本学年真实学生名单（大象班 + 老虎班），带头像 ---------------- */
function currentAcademicYear(){
  const now = new Date();
  const startYear = now.getMonth()>=7 ? now.getFullYear() : now.getFullYear()-1;
  return `${String(startYear).slice(-2)}-${String(startYear+1).slice(-2)}`;
}
const ACADEMIC_YEAR = currentAcademicYear();
const SANITY_ROSTER_QUERY = encodeURIComponent(`*[_type == "student" && className in ["elephant","tiger"] && academicYear == "${ACADEMIC_YEAR}"]{name, className, "img": avatar.asset->url}`);
const SANITY_ROSTER_API = `https://${SANITY_PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${SANITY_DATASET}?query=${SANITY_ROSTER_QUERY}`;

let roster = [];
(async function loadRoster(){
  try{

  }catch(e){}

/* 当前选的班级：all / elephant / tiger，记在本机浏览器里 */
let classFilter = "all";
try{ classFilter = localStorage.getItem("wyn.classFilter") || "all"; }catch(e){}
function setClassFilter(f){
  classFilter = f;
  try{ localStorage.setItem("wyn.classFilter", f); }catch(e){}
}
function studentsForFilter(filter){
  if(filter==="all") return roster;
  return roster.filter(s=>s.className===filter);
}

/* 当天抽过的同学记一笔，全部抽完一轮之后才重新循环
   （存在本机浏览器里，跨活动共用同一份"今天抽过谁"的名单） */
const PICK_STATE_KEY = "wyn.pickState.v2";
function todayStr(){ return new Date().toISOString().slice(0,10); }
function loadPickState(){
  try{
    const s = JSON.parse(localStorage.getItem(PICK_STATE_KEY));
    if(s && s.date===todayStr()) return s;
  }catch(e){}
  return { date: todayStr(), pools:{} };
}
function savePickState(s){ try{ localStorage.setItem(PICK_STATE_KEY, JSON.stringify(s)); }catch(e){} }

/* 名单没读到（离线/新学年还没录入）时，退回到这几个通用示例名字 */
function pickStudent(filter){
  filter = filter || classFilter;
  const pool = studentsForFilter(filter);
  if(!pool.length) return { name: pick(NAMES), img:null };

  const state = loadPickState();
  if(!state.pools[filter]) state.pools[filter] = [];
  let used = state.pools[filter];
  let remaining = pool.filter(s=>!used.includes(s.name));
  if(!remaining.length){ used = []; remaining = pool; }

  const chosen = pick(remaining);
  used.push(chosen.name);
  state.pools[filter] = used;
  savePickState(state);
  return chosen;
}

let globalAudio = new Audio();

async function speak(text){
  if(muted || !text) return;
  globalAudio.pause();
  const sanityAudioUrl = sanityAudioMap[text];

  if(sanityAudioUrl){
    globalAudio.src = sanityAudioUrl;
    await globalAudio.play().catch(e=>console.warn("Sanity音频播放失败", e));
    return;
  }

  const localPath = `../audio/sight_words_phrases/${encodeURIComponent(text)}.mp3`;
  const azureUrl = `/api/tts?text=${encodeURIComponent(text)}`;

  try{
    const localRes = await fetch(localPath, { method:"HEAD" }).catch(()=>null);
    if(localRes && localRes.ok && localRes.headers.get("content-type") && localRes.headers.get("content-type").includes("audio")){
      globalAudio.src = localPath; await globalAudio.play(); return;
    }
  }catch(e){}

  try{
    const azureRes = await fetch(azureUrl).catch(()=>null);
    if(azureRes && azureRes.ok && azureRes.headers.get("content-type") && azureRes.headers.get("content-type").includes("audio")){
      const audioBlob = await azureRes.blob();
      globalAudio.src = URL.createObjectURL(audioBlob); await globalAudio.play(); return;
    }
  }catch(e){}

  try{
    if(!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="zh-CN"; u.rate=.75;
    const v=speechSynthesis.getVoices().find(v=>/zh|Chinese/i.test(v.lang+v.name));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- 小工具 ---------------- */
const el=(t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function otherWords(target){ return WORDS.filter(w=>w!==target); }

    topbar.appendChild(back);

function actListen(){
  const target = pick(WORDS);
  const distract = shuffle(otherWords(target)).slice(0,3);
  const opts = shuffle([target, ...distract]);

  const q=el("div","act-q");
  q.innerHTML='哪个是？<span class="sub">老师读词语，学生指出来</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const word=el("div","prompt-word",target.zh);
  const say=el("button","chip tone","🔊 再说一遍");
  say.onclick=()=>speak(target.zh);
  const row=el("div","choice-row");
  const verdict=el("div","verdict");

  opts.forEach(o=>{
    const b=el("button","choice-btn");
    b.appendChild(wordVisualNode(o));
    b.onclick=()=>{
      if(o===target){
        sfxGood(); verdict.textContent="对了！"+target.zh; verdict.className="verdict good pop";
        row.querySelectorAll("button").forEach(x=>x.disabled=true);
        setTimeout(renderStage,1400);
      }else{
        sfxRetry(); b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        verdict.textContent="再试试"; verdict.className="verdict retry";
      }
    };
    row.appendChild(b);
  });

  body.appendChild(word); body.appendChild(say); body.appendChild(row); body.appendChild(verdict);
  stage.appendChild(body);
  speak(target.zh);
}

function actSentence(){
  const mode = Math.random()<.5 ? "q" : "a";
  const tokens = mode==="q" ? ["你","叫","什么","名字","？"] : ["我","叫",pickStudent().name,"。"];
  const shuffled = shuffle(tokens);

  const q=el("div","act-q");
  q.innerHTML='拼一拼句子<span class="sub">按正确的顺序，点出一句话</span>';
  stage.appendChild(q);

  const body=el("div","act-body");
  const built=el("div","sentence-built");
  const blanks = ()=> "".padStart(tokens.length,"▢");
  built.innerHTML = '<span class="blank">'+blanks()+'</span>';

  const row=el("div","tile-row");
  const verdict=el("div","verdict");
  let next=0, doneStr="";

  shuffled.forEach(word=>{
    const t=el("button","tile",word);
    t.onclick=()=>{
      if(word===tokens[next]){
        sfxTap();
        doneStr+=word; next++;
        t.classList.add("used");
        const remain = tokens.length-next;
        built.innerHTML = doneStr + '<span class="blank">'+"".padStart(remain,"▢")+'</span>';
        if(next===tokens.length){
          sfxGood();
          speak(doneStr);
          verdict.textContent="对啦！"+doneStr;
          verdict.className="verdict good pop";
          row.querySelectorAll("button").forEach(x=>x.disabled=true);
          setTimeout(renderStage,1900);
        }
      }else{
        sfxRetry();
        t.classList.remove("wrong"); void t.offsetWidth; t.classList.add("wrong");
        verdict.textContent="再想想，下一个词是什么"; verdict.className="verdict retry";
      }
    };
    row.appendChild(t);
  });

  body.appendChild(built); body.appendChild(row); body.appendChild(verdict);
  stage.appendChild(body);
}

/* ============================================================
   活动 6 · 内圈外圈问名字（教室游戏工具）
   老师带全班坐成内外两个同心圆，外圈边唱边走，音乐一停，
   面对面的两人互相问名字。这里提供一个可视化的转圈 + 计时小工具。
   ============================================================ */
/* 地毯是 6×5 的方块（300×250，每格 50px）。外圈沿地毯边缘走，内圈坐在中间一圈不动。 */
const RUG_COLS = 6, RUG_ROWS = 5;
const OUTER_TRACK = "path('M40,15 H260 A25,25 0 0 1 285,40 V210 A25,25 0 0 1 260,235 H40 A25,25 0 0 1 15,210 V40 A25,25 0 0 1 40,15 Z')";
const INNER_TRACK = "path('M105,65 H195 A20,20 0 0 1 215,85 V165 A20,20 0 0 1 195,185 H105 A20,20 0 0 1 85,165 V85 A20,20 0 0 1 105,65 Z')";
const RING_DUR = 5.5;

function buildRug(){
  const grid = el("div","rug-grid");
  for(let r=0;r<RUG_ROWS;r++){
    for(let c=0;c<RUG_COLS;c++){
      grid.appendChild(el("div","rug-cell "+((r+c)%2===0?"a":"b")));
    }
  }
  return grid;
}

function buildRing(cls, n, emoji, track){
  const dots = [];
  for(let i=0;i<n;i++){
    const dot=el("div","circle-ring-dot "+(cls==="outer"?"out":"in"), emoji);
    dot.style.offsetPath = track;
    dot.style.offsetDistance = (i/n*100)+"%";
    dot.style.animationDelay = (-(i/n*RING_DUR))+"s";
    dots.push(dot);
  }
  return dots;
}

function actCircle(){
  const state = { spinning:false, round:0, dir:1 };

  const q=el("div","act-q");
  q.innerHTML='内圈外圈问名字<span class="sub">教室游戏 · 音乐停，就问好</span>';
  stage.appendChild(q);

  const body=el("div","act-body scroll");

  const steps=el("div","circle-steps");
  steps.innerHTML =
    "<b>1.</b> 全班坐在我们的方块地毯上——内圈同学坐在地毯中间那一圈，朝外坐；外圈同学坐在地毯边缘那一圈，朝内坐，正好两两面对面。<br>"+
    "<b>2.</b> 点「开始转圈」，外圈的同学一起边唱边沿着地毯边缘慢慢挪动，内圈的同学不动。<br>"+
    "<b>3.</b> 点「停下问好」，正对面的两人互相问："+
    "<b>你叫什么名字？</b> —— <b>我叫……</b><br>"+
    "<b>4.</b> 再点一次「开始」，继续下一轮，方向也会换一换。";
  body.appendChild(steps);

  const ringWrap=el("div","circle-stage");
  ringWrap.appendChild(buildRug());
  const inner = buildRing("inner", 6, "🧒", INNER_TRACK);
  const outer = buildRing("outer", 6, "🧑", OUTER_TRACK);
  inner.forEach(d=>ringWrap.appendChild(d));
  outer.forEach(d=>ringWrap.appendChild(d));
  const hub = el("div","circle-hub","🎵");
  ringWrap.appendChild(hub);
  body.appendChild(ringWrap);

  const status=el("div","circle-status","准备好了就点「开始转圈」吧");
  body.appendChild(status);

  const controls=el("div","circle-controls");
  const btn=el("button","chip tone","▶️ 开始转圈");
  const roundBadge=el("div","round-badge","第 0 轮");
  controls.appendChild(btn); controls.appendChild(roundBadge);
  body.appendChild(controls);

  btn.onclick=()=>{
    if(!state.spinning){
      sfxTap();
      state.spinning=true;
      outer.forEach(d=>{ d.classList.add("spin"); d.classList.toggle("rev", state.dir<0); });
      status.textContent="🚶 走走走，一起唱着走～";
      btn.textContent="🔔 停下问好";
      stopCircleTicker();
      circleTicker=setInterval(sfxTick,450);
    }else{
      stopCircleTicker();
      state.spinning=false;
      state.round++; state.dir*=-1;
      outer.forEach(d=>d.classList.remove("spin","rev"));
      sfxBell();
      status.textContent="🔔 停！问一问：你叫什么名字？";
      status.classList.remove("pop"); void status.offsetWidth; status.classList.add("pop");
      btn.textContent="▶️ 开始转圈";
      roundBadge.textContent="第 "+state.round+" 轮";
    }
  };

  stage.appendChild(body);

  const foot=el("div","act-foot");
  const note=el("div","teacher-note",
    "小贴士：熟练之后可以升级——两人问完名字，要跟对方击个掌，或者说一遍对方的名字，才能坐下等下一轮。");
  foot.appendChild(note);
  stage.appendChild(foot);
}

   渲染分发
   ============================================================ */
const ACTS={ greet:actGreet, ask:actAsk, listen:actListen, flip:actFlip, sentence:actSentence, circle:actCircle };

function renderStage(){
  stopCircleTicker();
  stage.innerHTML="";
  if(view.name==="home") return renderHome();
  ACTS[view.station]();
}

/* ---------------- 歌曲弹窗 ---------------- */
const videoModal=document.getElementById("videoModal");
const videoFrame=document.getElementById("videoFrame");
const videoCloseBtn=document.getElementById("videoCloseBtn");
function openVideo(id){
  videoFrame.src="https://www.youtube.com/embed/"+id+"?autoplay=1&rel=0";
  videoModal.classList.add("open");
  videoCloseBtn.focus();
}
function closeVideo(){
  videoModal.classList.remove("open");
  videoFrame.src="";
}
videoCloseBtn.onclick=()=>{ sfxTap(); closeVideo(); };
videoModal.addEventListener("click",e=>{ if(e.target===videoModal) closeVideo(); });
/* YouTube 播放器是跨域 iframe，焦点一旦进去父页面就收不到键盘事件了；
   弹窗开着的时候把焦点抢回关闭按钮上，ESC 才能一直生效 */
window.addEventListener("blur",()=>{
  if(!videoModal.classList.contains("open")) return;
  setTimeout(()=>{ if(videoModal.classList.contains("open")) videoCloseBtn.focus(); },0);
});

/* 键盘：Esc 返回 / 关弹窗，空格 换一个 */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&videoModal.classList.contains("open")){ closeVideo(); return; }
  if(e.key==="Escape"||e.key==="ArrowLeft"){
    if(view.name==="station") go("home");
  }
  if(e.key===" "&&view.name==="station"){ e.preventDefault(); renderStage(); }
});

if(window.speechSynthesis) speechSynthesis.getVoices();
go("home");
</script>
