<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生字学习 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    <style>
        :root {
            --kaiti-font: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --english-font: "LXGW WenKai Lite", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            height: 100%;
            overflow: hidden;
        }
        body { 
            background-color: #d4e4e4; 
            font-family: var(--kaiti-font) !important; 
        }
        
        .nav-top {
            background: #598586; 
            padding: 0 20px;
            height: 56px;
            box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
            border-bottom: 5px solid #f3b236;
            z-index: 1000;
        }
        .nav-top a { 
            color: #fff; text-decoration: none; font-weight: bold; 
            font-size: 0.95rem; font-family: var(--english-font) !important; white-space: nowrap;
        }
        .nav-top a:hover { opacity: 0.8; }
        .nav-title { color: white; font-weight: bold; font-size: 1.1rem; font-family: var(--english-font) !important; }
        .nav-spacer { width: 80px; }

        .orbit-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 56px);
            overflow: hidden;
            background: radial-gradient(circle at 50% 100%, #eef5f5 0%, #d4e4e4 70%); 
        }

        .fan-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .lines-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .connect-line {
            stroke: #9bb8b8; stroke-width: 2.5; stroke-dasharray: 6, 6;
            opacity: 0.8; fill: none;
        }

        .center-char {
            position: absolute;
            transform: translate(-50%, -50%); 
            z-index: 50; 
            width: 170px; height: 170px; 
        }

        .char-circle {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: white;
            border: 8px solid #f3b236;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .char-circle:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(243,178,54,0.3); }

        .char-bg-img {
            position: absolute;
            width: 90%; height: 90%;
            object-fit: contain; opacity: 0.15;
            z-index: 0; pointer-events: none;
        }

        .char-pinyin {
            position: relative; font-size: 1.35rem; color: #598586;
            font-weight: 600; font-family: var(--english-font) !important;
            z-index: 2; margin-bottom: -8px;
        }

        #character-target {
            position: relative; z-index: 10; 
            width: 90px; height: 90px;
        }

        .char-hint {
            position: relative; font-size: 0.8rem; color: #999;
            font-weight: bold; z-index: 2; margin-top: -8px; font-family: var(--english-font) !important;
            white-space: nowrap;
        }

        .char-play-btn {
            position: absolute;
            top: -5px; right: -5px; 
            z-index: 60;
            width: 42px; height: 42px;
            border-radius: 50%; background: #e74c3c;
            color: white; border: 4px solid white;
            cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(231,76,60,0.3); transition: 0.2s;
        }
        .char-play-btn:hover { background: #c0392b; transform: scale(1.15) rotate(5deg); }

        .phrase-node {
            position: absolute; 
            cursor: pointer; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20; 
            transform: translate(-50%, -50%); 
            perspective: 1000px; 
        }
        .phrase-node:hover { 
            transform: translate(-50%, -50%) scale(1.15); 
            z-index: 100 !important; 
        }

        .flip-card-inner {
            position: relative;
            width: 100%; height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 50%;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }
        
        .phrase-node:hover .flip-card-inner {
            box-shadow: 0 8px 25px rgba(243,178,54,0.4);
        }

        .is-flipped { transform: rotateY(180deg); }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;         
            border-radius: 50%;
            border: 5px solid #d0dede;
            background: white;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .phrase-node:hover .flip-card-front,
        .phrase-node:hover .flip-card-back {
            border-color: #f3b236;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f4f9f9 100%);
            color: #1e2e46;
            font-weight: bold;
            font-family: var(--kaiti-font) !important;
        }

        .flip-card-back { transform: rotateY(180deg); }
        .phrase-img { width: 85%; height: 85%; object-fit: contain; }

        @media (max-width: 600px) {
            .center-char { width: 130px; height: 130px; }
            .char-circle { border-width: 5px; }
            #character-target { width: 65px; height: 65px; }
            .char-pinyin { font-size: 1.1rem; margin-bottom: -5px; }
            .char-hint { font-size: 0.7rem; margin-top: -5px; }
            .char-play-btn { width: 36px; height: 36px; top: -8px; right: -8px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="words_and_phrases_zh.html">⬅ 返回四会字索引</a>
        <span class="nav-title">生字研习 📖</span>
        <div class="nav-spacer"></div>
    </nav>

    <div class="orbit-container" id="orbit-container">
        <svg class="fan-layer" id="fan-layer"></svg>
        <svg class="lines-layer" id="lines-layer"></svg>

        <div class="center-char" id="center-char">
            <div class="char-circle" onclick="goToTracing()">
                <img id="char-bg-img" class="char-bg-img" alt="">
                <div class="char-pinyin" id="char-pinyin"></div>
                <div id="character-target"></div>
                <div class="char-hint">✍️ 点击书写</div>
            </div>
            <button class="char-play-btn" onclick="event.stopPropagation(); playAudioOrFallback(targetChar);">🔊</button>
        </div>

        <div id="phrases-container"></div>
    </div>

    <script>
        let audioUnlocked = false;
        function unlockSystemAudio() {
            if (audioUnlocked) return;
            const silentSpeech = new SpeechSynthesisUtterance(' ');
            window.speechSynthesis.speak(silentSpeech);
            const silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
            silentAudio.play().catch(() => {});
            audioUnlocked = true;
            document.removeEventListener('touchstart', unlockSystemAudio);
            document.removeEventListener('click', unlockSystemAudio);
        }
        document.addEventListener('touchstart', unlockSystemAudio, { passive: true });
        document.addEventListener('click', unlockSystemAudio);

        const params = new URLSearchParams(window.location.search);
        const targetChar = params.get('char');

        let xiaoxiao = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            xiaoxiao = voices.find(v => v.name.includes('Xiaoxiao')) || voices.find(v => v.lang.startsWith('zh'));
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        const pinyinOverride = { '长': 'cháng', '会': 'huì', '了': 'le', '和': 'hé', '看': 'kàn', '大': 'dà' };
        function getCharPinyin(char) {
            if (pinyinOverride[char]) return pinyinOverride[char];
            if (window.pinyinPro) return window.pinyinPro.pinyin(char, { toneType: 'symbol' });
            return '';
        }

        // 🌟 终极破防发音引擎 🌟
        function playAudioOrFallback(text) {
            if (!audioUnlocked) unlockSystemAudio();
            
            window.speechSynthesis.cancel();
            
            // 【核心破解】：在点击的瞬间，同步塞入一个空格语音。拿到系统级别的播放白名单！
            const dummy = new SpeechSynthesisUtterance(' ');
            window.speechSynthesis.speak(dummy);

            const audio = new Audio(`../audio/sight_words_phrases/${encodeURIComponent(text)}.mp3`);
            audio.play().catch(() => { 
                // 即使 MP3 文件不存在进入了异步 catch，因为门已经被 dummy 语音踹开了，真实语音也能畅通无阻！
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'zh-CN';
                if (!xiaoxiao) {
                    const voices = window.speechSynthesis.getVoices();
                    xiaoxiao = voices.find(v => v.name.includes('Xiaoxiao')) || voices.find(v => v.lang.startsWith('zh'));
                }
                if (xiaoxiao) msg.voice = xiaoxiao;
                msg.rate = 0.85; 
                window.speechSynthesis.speak(msg); 
            }); 
        }

        function renderPhrases(phraseArray) {
            const container = document.getElementById('orbit-container');
            const phrasesContainer = document.getElementById('phrases-container');
            const linesSvg = document.getElementById('lines-layer');
            const fanSvg = document.getElementById('fan-layer');
            
            const W = container.clientWidth;
            const H = container.clientHeight;
            const isMobile = window.innerWidth <= 600;

            const count = phraseArray.length;
            if (count === 0) return;

            let cx, cy, maxRadius, minRadius, startAngle, endAngle;
            const charRadius = isMobile ? 65 : 85; 

            if (isMobile) {
                container.style.background = 'radial-gradient(circle at 0% 50%, #eef5f5 0%, #d4e4e4 70%)';
                cx = charRadius + 15; cy = H / 2;           
                const safeRight = 85; const safeTop = 75; const safeBottom = 75;
                
                maxRadius = Math.min(W - cx - safeRight, cy - safeTop, H - cy - safeBottom);
                if (count >= 8) maxRadius = Math.min(W - cx - 70, cy - 55, H - cy - 55); 
                
                minRadius = 135; 
                if (maxRadius < minRadius + 30) maxRadius = minRadius + 30;

                if (count === 1) { startAngle = 0; endAngle = 0; }
                else if (count <= 3) { startAngle = 45; endAngle = -45; } 
                else if (count <= 5) { startAngle = 65; endAngle = -65; }
                else if (count <= 7) { startAngle = 80; endAngle = -80; }
                else { startAngle = 90; endAngle = -90; } 

            } else {
                container.style.background = 'radial-gradient(circle at 50% 100%, #eef5f5 0%, #d4e4e4 70%)';
                cx = W / 2; const bottomOffset = 20; cy = H - bottomOffset - charRadius; 
                const safeSide = 90; const safeTop = 90;  
                
                maxRadius = Math.min(cx - safeSide, cy - safeTop);
                if (count >= 8) maxRadius = Math.min(cx - 30, cy - 70); 
                
                minRadius = 210; 
                if (maxRadius < minRadius + 40) maxRadius = minRadius + 40;

                if (count === 1) { startAngle = 90; endAngle = 90; }
                else if (count <= 3) { startAngle = 135; endAngle = 45; } 
                else if (count <= 5) { startAngle = 150; endAngle = 30; }
                else if (count <= 7) { startAngle = 165; endAngle = 15; }
                else { startAngle = 180; endAngle = 0; } 
            }
            
            const centerChar = document.getElementById('center-char');
            centerChar.style.left = cx + 'px';
            centerChar.style.top = cy + 'px';

            const angleStep = count > 1 ? (startAngle - endAngle) / (count - 1) : 0;

            const depthFactors = [];
            if (count <= 4) {
                for(let i=0; i<count; i++) depthFactors.push(1.0); 
            } else if (count <= 6) {
                for(let i=0; i<count; i++) depthFactors.push(i % 2 === 0 ? 1.0 : 0.65); 
            } else {
                for(let i=0; i<count; i++) {
                    const mod = i % 3;
                    if (mod === 0) depthFactors.push(1.0);       
                    else if (mod === 1) depthFactors.push(0.40); 
                    else depthFactors.push(0.80);                
                }
            }

            const fanOuterR = maxRadius + (isMobile ? 75 : 95); 
            const fanInnerR = charRadius + 20; 
            
            const p1x = cx + fanOuterR * Math.cos((startAngle + 5) * Math.PI / 180);
            const p1y = cy - fanOuterR * Math.sin((startAngle + 5) * Math.PI / 180);
            const p2x = cx + fanOuterR * Math.cos((endAngle - 5) * Math.PI / 180);
            const p2y = cy - fanOuterR * Math.sin((endAngle - 5) * Math.PI / 180);
            const p3x = cx + fanInnerR * Math.cos((endAngle - 5) * Math.PI / 180);
            const p3y = cy - fanInnerR * Math.sin((endAngle - 5) * Math.PI / 180);
            const p4x = cx + fanInnerR * Math.cos((startAngle + 5) * Math.PI / 180);
            const p4y = cy - fanInnerR * Math.sin((startAngle + 5) * Math.PI / 180);

            const spanAngle = (startAngle + 5) - (endAngle - 5);
            const largeArc = spanAngle > 180 ? 1 : 0;

            let fanHTML = '';
            if (count > 1) {
                fanHTML += `<path d="M ${p4x} ${p4y} L ${p1x} ${p1y} A ${fanOuterR} ${fanOuterR} 0 ${largeArc} 1 ${p2x} ${p2y} L ${p3x} ${p3y} A ${fanInnerR} ${fanInnerR} 0 ${largeArc} 0 ${p4x} ${p4y} Z" 
                            fill="rgba(255, 252, 245, 0.65)" stroke="#e6c27a" stroke-width="4" />`;
                
                const ribCount = count * 2 + 1;
                for (let i = 0; i < ribCount; i++) {
                    const ribAngle = startAngle + 5 - i * ((startAngle - endAngle + 10) / (ribCount - 1));
                    const rad = ribAngle * Math.PI / 180;
                    const rx1 = cx + (charRadius - 10) * Math.cos(rad);
                    const ry1 = cy - (charRadius - 10) * Math.sin(rad);
                    const rx2 = cx + (fanOuterR - 5) * Math.cos(rad);
                    const ry2 = cy - (fanOuterR - 5) * Math.sin(rad);
                    fanHTML += `<line x1="${rx1}" y1="${ry1}" x2="${rx2}" y2="${ry2}" stroke="rgba(230, 194, 122, 0.4)" stroke-width="3" stroke-linecap="round" />`;
                }
            }
            fanSvg.innerHTML = fanHTML;

            linesSvg.innerHTML = '';
            phrasesContainer.innerHTML = '';
            
            phraseArray.forEach((phrase, i) => {
                const angleDeg = startAngle - i * angleStep;
                const angleRad = angleDeg * Math.PI / 180;

                const f = depthFactors[i];
                const currentR = minRadius + (maxRadius - minRadius) * f;

                const x = cx + currentR * Math.cos(angleRad);
                const y = cy - currentR * Math.sin(angleRad); 

                const scaleFactor = 0.9 + (f * 0.35); 
                const baseImgSize = isMobile ? 105 : 155; 
                const imgSize = baseImgSize * scaleFactor;
                const fontSize = (isMobile ? 1.3 : 1.9) * scaleFactor;
                
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx); line.setAttribute('y1', cy);
                line.setAttribute('x2', x); line.setAttribute('y2', y);
                line.setAttribute('class', 'connect-line');
                linesSvg.appendChild(line);
                
                const node = document.createElement('div');
                node.className = 'phrase-node';
                node.style.left = x + 'px';
                node.style.top = y + 'px';
                node.style.width = imgSize + 'px';
                node.style.height = imgSize + 'px';
                node.style.zIndex = Math.round(f * 10) + 20; 
                
                node.onclick = (event) => {
                    event.stopPropagation();
                    playAudioOrFallback(phrase);
                    const innerCard = node.querySelector('.flip-card-inner');
                    innerCard.classList.toggle('is-flipped');
                };
                
                node.innerHTML = `
                    <div class="flip-card-inner">
                        <div class="flip-card-front" style="border-width:${5*scaleFactor}px;">
                            <span style="font-size:${fontSize}rem; line-height: 1.2;">${phrase}</span>
                        </div>
                        <div class="flip-card-back" style="border-width:${5*scaleFactor}px;">
                            <img src="../images/sight_words_phrases/${encodeURIComponent(phrase)}.webp" 
                                 class="phrase-img" alt="${phrase}"
                                 onerror="this.parentElement.style.background='#f0f5f5'; this.remove();">
                        </div>
                    </div>
                `;
                
                phrasesContainer.appendChild(node);
            });
        }

        fetch('../data/sight_words.json')
            .then(res => res.json())
            .then(dataObj => {
                const list = dataObj.sight_words_list || [];
                const data = list.find(d => d.char === targetChar);

                if (data) {
                    const py = getCharPinyin(targetChar);
                    document.getElementById('char-pinyin').textContent = py;

                    const bgImg = document.getElementById('char-bg-img');
                    bgImg.src = `../images/sight_words_phrases/${encodeURIComponent(targetChar)}.webp`;
                    bgImg.onerror = () => { bgImg.style.display = 'none'; };

                    document.getElementById('character-target').innerHTML = ''; 
                    
                    const writerSize = window.innerWidth <= 600 ? 65 : 90;
                    HanziWriter.create('character-target', targetChar, {
                        width: writerSize, height: writerSize, padding: 5, 
                        strokeColor: '#e74c3c', outlineColor: '#e0e0e0',
                        delayBetweenAnimations: 1500
                    }).animateCharacter();

                    let phraseArray = [];
                    if (data.phrases) {
                        phraseArray = data.phrases.split(/[,，、]/).map(p => p.trim()).filter(p => p);
                    }

                    if (phraseArray.length > 0) {
                        renderPhrases(phraseArray);
                    }
                }
            })
            .catch(err => console.error("Error loading sight words:", err));

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => location.reload(), 200);
        });

        function goToTracing() { 
            if(targetChar) window.location.href = `tracing_zh.html?char=${encodeURIComponent(targetChar)}&from=detail`; 
        }
    </script>
</body>
</html>
