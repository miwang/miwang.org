<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生字学习 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://unpkg.com/pinyin-pro"></script>
    <style>
        :root {
            --kaiti-font: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --main-teal: #598586;
            --accent-yellow: #f3b236;
            --bg-color: #f4f9f9;
        }

        /* 🌟 彻底锁死一屏，绝不出现滚动条 */
        body { 
            background-color: var(--bg-color); margin: 0; 
            font-family: var(--kaiti-font) !important; 
            overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        .nav-top {
            background: var(--main-teal); padding: 0 20px;
            height: 56px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 5px solid var(--accent-yellow); flex-shrink: 0;
            z-index: 1000;
        }
        .nav-top a { color: #fff; text-decoration: none; font-weight: bold; font-size: 1rem; font-family: var(--kaiti-font) !important; white-space: nowrap; }
        .nav-top a:hover { opacity: 0.8; }
        .nav-title { color: white; font-weight: bold; font-size: 1.2rem; font-family: var(--kaiti-font) !important; }
        .nav-spacer { width: 80px; }
        
        @media (max-width: 768px) {
            .nav-top a { font-size: 0.85rem; }
            .nav-title { font-size: 1rem; }
            .nav-spacer { width: 50px; }
        }

        /* 🌟 动态空间区域 */
        .sunburst-area {
            flex: 1; position: relative;
            background: radial-gradient(circle, #ffffff 0%, #e6f0f0 100%);
            overflow: hidden;
            /* 移除了所有的写死高度，完全交给屏幕剩余空间 */
        }

        /* ── 中心主字节点 (变得更小、更精致) ── */
        .center-node {
            position: absolute;
            top: 50%; left: 50%; /* 绝对居中 */
            transform: translate(-50%, -50%);
            width: 120px; height: 120px; /* 🌟 再次缩小，腾出空间 */
            background: white; border-radius: 50%;
            border: 6px solid var(--accent-yellow);
            box-shadow: 0 8px 25px rgba(89,133,134,0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
        }
        .center-node:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 12px 35px rgba(89,133,134,0.4); border-color: #e74c3c;
        }
        
        .center-pinyin { font-family: "LXGW WenKai Lite", sans-serif !important; font-size: 1.05rem; color: var(--main-teal); font-weight: bold; margin-bottom: 0px; }
        #character-target { width: 70px; height: 70px; } 
        .center-hint { font-size: 0.8rem; color: #999; font-weight: bold; margin-top: 0px; }

        .audio-badge {
            position: absolute; top: -6px; right: -6px;
            width: 36px; height: 36px; border-radius: 50%;
            background: #e74c3c; color: white; border: 3px solid white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: 0.2s; z-index: 60;
        }
        .audio-badge:hover { transform: scale(1.15) rotate(5deg); background: #c0392b; }
        .audio-badge svg { width: 16px; height: 16px; fill: white; } 

        /* ── 环绕的词组节点 ── */
        .orbit-wrapper {
            position: absolute;
            top: 50%; left: 50%; 
            transform: rotate(var(--angle)) translateY(calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle)));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        .orbit-wrapper:hover {
            transform: rotate(var(--angle)) translateY(calc(-1 * var(--radius))) rotate(calc(-1 * var(--angle))) scale(1.15);
            z-index: 100;
        }

        .orbit-content {
            transform: translate(-50%, -50%); 
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
        }

        .orbit-img {
            width: 95px; height: 95px; /* 调整到黄金比例 */
            border-radius: 50%; object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            background: white; transition: 0.3s;
        }
        
        .orbit-text {
            margin-top: 6px;
            font-size: 1.2rem; font-weight: bold; color: #1e2e46; 
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 14px; border-radius: 20px;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            white-space: nowrap; border: 1px solid rgba(255,255,255,0.5);
        }

        @media (max-width: 600px) {
            .center-node { width: 100px; height: 100px; border-width: 4px; }
            #character-target { width: 55px; height: 55px; }
            .center-pinyin { font-size: 0.9rem; }
            .center-hint { font-size: 0.7rem; }
            .orbit-img { width: 75px; height: 75px; border-width: 3px; }
            .orbit-text { font-size: 1.05rem; padding: 2px 10px; }
            .audio-badge { width: 30px; height: 30px; top: -4px; right: -4px; }
            .audio-badge svg { width: 13px; height: 13px; }
        }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a href="words_and_phrases_zh.html">⬅️ 返回四会字索引</a>
        <span class="nav-title">生字研习 📖</span>
        <div class="nav-spacer"></div>
    </nav>

    <div class="sunburst-area" id="sunburst-area">
        
        <div class="center-node" onclick="goToTracing()">
            <div class="audio-badge" onclick="speakChar(event)">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M13.5 4.06c0-1.336-1.616-2.005-2.56-1.06l-4.5 4.5H4.508c-1.141 0-2.318.664-2.66 1.905A9.76 9.76 0 001.5 12c0 .898.121 1.768.35 2.595.341 1.24 1.518 1.905 2.659 1.905h1.93l4.5 4.5c.945.945 2.561.276 2.561-1.06V4.06zM18.584 5.106a.75.75 0 011.06 0c3.808 3.807 3.808 9.98 0 13.788a.75.75 0 11-1.06-1.06 8.25 8.25 0 000-11.668.75.75 0 010-1.06z"/>
                    <path d="M15.932 7.757a.75.75 0 011.061 0 6 6 0 010 8.486.75.75 0 01-1.06-1.061 4.5 4.5 0 000-6.364.75.75 0 010-1.06z"/>
                </svg>
            </div>
            <div class="center-pinyin" id="char-pinyin"></div>
            <div id="character-target"></div>
            <div class="center-hint">✍️ 点击书写</div>
        </div>

        <div id="orbit-container"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const targetChar = params.get('char');

        let xiaoxiao = null;
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            xiaoxiao = voices.find(v => v.name.includes('Xiaoxiao'));
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        const pinyinOverride = { '长': 'cháng', '会': 'huì', '了': 'le', '和': 'hé', '看': 'kàn', '大': 'dà' };
        function getCharPinyin(char) {
            if (pinyinOverride[char]) return pinyinOverride[char];
            if (window.pinyinPro) return window.pinyinPro.pinyin(char, { toneType: 'symbol' });
            return '';
        }

        function speakChar(event) {
            event.stopPropagation(); 
            const audio = new Audio(`../audio/sight_words_phrases/${encodeURIComponent(targetChar)}.mp3`);
            audio.play().catch(() => {
                const msg = new SpeechSynthesisUtterance(targetChar);
                msg.lang = 'zh-CN';
                if (!xiaoxiao) loadVoices();
                if (xiaoxiao) msg.voice = xiaoxiao;
                msg.rate = 0.85;
                window.speechSynthesis.speak(msg);
            });
        }

        fetch('../data/sight_words.json')
            .then(res => res.json())
            .then(dataObj => {
                const list = dataObj.sight_words_list || [];
                const data = list.find(d => d.char === targetChar);

                if (data) {
                    document.getElementById('char-pinyin').textContent = getCharPinyin(targetChar);

                    const writerSize = window.innerWidth <= 600 ? 55 : 70;
                    HanziWriter.create('character-target', targetChar, {
                        width: writerSize, height: writerSize, padding: 0, 
                        strokeColor: '#e74c3c', outlineColor: '#f3f3f3', delayBetweenAnimations: 3000
                    }).animateCharacter();

                    let phraseArray = [];
                    if (data.phrases) {
                        phraseArray = data.phrases.split(/[,，、]/).map(p => p.trim()).filter(p => p);
                    }

                    const total = phraseArray.length;
                    const container = document.getElementById('sunburst-area');
                    
                    // 🌟 终极防遮挡雷达：根据屏幕的真实高度，计算绝对安全的半径
                    const containerHeight = container.clientHeight;
                    const containerWidth = container.clientWidth;
                    
                    // 留出 85px 的缓冲高度（图片的一半+文字的高度+边缘缝隙），确保绝对不碰壁
                    const safeV = (containerHeight / 2) - 85; 
                    const safeH = (containerWidth / 2) - 75;      
                    
                    // 理想半径
                    const idealRadius = total > 5 ? 220 : 180;
                    
                    // 取屏幕能承受的最大安全值
                    let radius = Math.min(safeV, safeH, idealRadius);
                    
                    // 兜底值：如果遇到极端扁屏，允许轻微靠近中心，但绝不缩小到撞车
                    radius = Math.max(radius, 110); 

                    let html = '';
                    phraseArray.forEach((p, index) => {
                        const angle = (index / total) * 360; 
                        
                        html += `
                            <div class="orbit-wrapper" style="--angle: ${angle}deg; --radius: ${radius}px;">
                                <div class="orbit-content" onclick="speak('${p}')">
                                    <img src="../images/sight_words_phrases/${p}.webp" class="orbit-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 100 100\\'><circle cx=\\'50\\' cy=\\'50\\' r=\\'50\\' fill=\\'%23e0eded\\'/><text x=\\'50\\' y=\\'55\\' font-size=\\'20\\' text-anchor=\\'middle\\' fill=\\'%23598586\\'>暂无图</text></svg>'">
                                    <div class="orbit-text">${p}</div>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('orbit-container').innerHTML = html;
                }
            })
            .catch(err => console.error("加载数据失败", err));

        function goToTracing() { 
            if(targetChar) window.location.href = `tracing_zh.html?char=${encodeURIComponent(targetChar)}&from=detail`; 
        }

        function speak(text) { 
            window.speechSynthesis.cancel(); 
            const audio = new Audio(`../audio/sight_words_phrases/${encodeURIComponent(text)}.mp3`);
            audio.play().catch(() => { 
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'zh-CN';
                if (!xiaoxiao) loadVoices();
                if (xiaoxiao) msg.voice = xiaoxiao;
                msg.rate = 0.85; 
                window.speechSynthesis.speak(msg); 
            }); 
        }
    </script>
</body>
</html>
