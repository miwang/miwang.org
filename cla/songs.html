<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="head-title">我们来唱歌 - MECC</title>
    
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
            --accent-yellow: #f3b236;
        }

        .font-zh, [class*="font-zh"] { font-family: var(--kaiti) !important; font-weight: bold; }
        .font-en, [class*="font-en"] { font-family: var(--wenkai) !important; }

        body { background-color: #fff9ea; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; padding-top: 60px; }

        #gallery-view {
            flex: 1; overflow-y: auto; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            align-content: start; gap: 20px; padding: 30px 40px; box-sizing: border-box;
        }
        
        @keyframes cardPop {
            from { opacity: 0; transform: translateY(30px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .song-card {
            background: white; border: 3px solid #e2e8f0; border-radius: 24px;
            overflow: hidden; cursor: pointer; 
            display: flex; flex-direction: column; height: 190px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        
        .song-card:hover { 
            transform: translateY(-8px) scale(1.03); 
            border-color: var(--accent-yellow); 
            box-shadow: 0 15px 30px rgba(243, 178, 54, 0.25); 
            z-index: 10;
        }
        
        .card-img-wrapper { 
            width: 100%; height: 135px; 
            overflow: hidden; background: #f8f9fa; 
            display: flex; align-items: center; justify-content: center; position: relative; 
        }
        
        .song-card img { 
            width: 100%; height: 100%; object-fit: cover; 
            transition: transform 0.5s ease; 
        }
        
        .song-card:hover img { transform: scale(1.1); } 

        .play-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.25);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .song-card:hover .play-overlay { opacity: 1; }
        
        .play-icon {
            width: 48px; height: 48px; background: rgba(255,255,255,0.95);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: var(--accent-yellow); font-size: 20px; padding-left: 4px; 
            transform: scale(0.5); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .song-card:hover .play-icon { transform: scale(1); } 

        .song-info { flex: 1; padding: 6px 10px; text-align: center; display: flex; align-items: center; justify-content: center; background: white; z-index: 2; }
        .song-info h3 { margin: 0; font-size: 0.95rem; color: #2c3e50; line-height: 1.3; font-weight: bold; }

        #play-view { display: none; height: 100vh; flex-direction: column; background: #fff9ea; z-index: 10000; position: fixed; top: 0; left: 0; width: 100%; }
        .play-header { min-height: 12vh; background: var(--main-teal); display: flex; align-items: center; justify-content: space-between; border-bottom: 0.6vh solid var(--accent-yellow); padding: 0 20px; gap: 12px; }
        .play-back-btn { flex-shrink: 0; color: white; cursor: pointer; font-size: 1rem; font-weight: bold; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 8px 18px; border-radius: 30px; border: 1.5px solid rgba(255,255,255,0.4); transition: 0.2s; white-space: nowrap; }
        .play-back-btn:hover { background: rgba(255,255,255,0.35); }
        .play-header-spacer { flex-shrink: 0; visibility: hidden; padding: 8px 18px; font-size: 1rem; white-space: nowrap; }
        .lyrics-panel { flex: 1; display: flex; flex-direction: column; background: white; margin: 1.5vh; border-radius: 4vh; overflow: hidden; }
        .lyrics-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2vh; overflow-y: auto; }
        .lyric-line { font-size: 9vh; font-weight: bold; margin: 0.6vh 0; color: #1e2e46; text-align: center; width: 100%; }
        .pagination-controls { height: 12vh; display: flex; justify-content: center; align-items: center; gap: 8vw; background: #fff; border-top: 1px solid #f0f0f0; }
        .page-btn {
            background: #f3b236;
            color: #ffffff;
            border: 1.5px solid transparent;
            padding: 12px 28px;
            min-width: 118px;
            border-radius: 16px;
            font-size: 1.85rem;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .page-btn:hover { background: #e1a328; }
        .page-btn:active { transform: scale(0.97); }

        #hover-img-container { 
            position: fixed; display: none; z-index: 10005; padding: 10px; pointer-events: auto; 
            opacity: 0; transition: opacity 0.2s ease; 
        }
        #global-hover-img { max-height: 40vh; max-width: 420px; border: 6px solid var(--accent-yellow); border-radius: 20px; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .btn-delete-item { position: absolute; top: 0px; right: 0px; background: #e74c3c; color: white; border: 3px solid white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10006; transition: 0.2s; }

        .hover-word { border-bottom: 0.8vh dashed var(--main-teal); cursor: pointer; display: inline-block; }
        .clickable-char { cursor: pointer; border-radius: 8px; display: inline-block; }
        .red-word { color: #e74c3c !important; }
        #selection-bubble { position: fixed; display: none; background: rgba(89, 133, 134, 0.95); color: white; padding: 10px 25px; border-radius: 50px; cursor: pointer; z-index: 10005; font-size: 1.2rem; font-weight: bold; border: 2px solid white; }

        .admin-bar { background: white; margin: 10px 50px 20px 50px; padding: 12px; border-radius: 20px; border: 2px dashed rgba(89, 133, 134, 0.85); display: flex; justify-content: center; gap: 20px; align-items: center; flex-shrink: 0; }
        .admin-btn {
            background: #598586;
            color: white;
            border: 1.5px solid transparent;
            padding: 9px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.96rem;
            box-shadow: none;
            transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            line-height: 1.1;
        }
        .admin-btn:hover { background: #4f7879; }
        .admin-btn:active { transform: scale(0.98); }

        @media (max-width: 768px) {
            body { padding-top: 56px; }
            #gallery-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; gap: 12px !important; padding: 15px !important; }
            .song-card { height: 170px !important; border-radius: 18px !important; }
            .card-img-wrapper { height: 115px !important; }
            .song-info { height: 70px !important; flex-shrink: 0 !important; overflow: hidden !important; padding: 6px 8px !important; }
            .song-info h3 { font-size: 0.9rem !important; display: -webkit-box !important; -webkit-line-clamp: 2 !important; -webkit-box-orient: vertical !important; overflow: hidden !important; line-height: 1.3 !important; }
            .admin-bar { margin: 6px 12px 10px !important; padding: 6px 8px !important; gap: 6px !important; flex-wrap: nowrap !important; justify-content: center !important; align-items: center !important; overflow-x: auto; }
            .admin-bar span { font-size: 0.75rem !important; white-space: nowrap !important; }
            .admin-btn { padding: 6px 10px !important; font-size: 0.75rem !important; border-radius: 12px !important; white-space: nowrap !important; gap: 5px !important; }
            .play-header { min-height: auto !important; padding: 10px 12px !important; gap: 8px !important; }
            .play-back-btn { font-size: 0.85rem !important; padding: 6px 12px !important; }
            #song-title { font-size: clamp(0.7rem, 2.8vw, 1rem) !important; white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
            .lyric-line { font-size: clamp(1.4rem, 6vw, 2rem) !important; white-space: nowrap !important; margin: 0.4em 0 !important; }
            .pagination-controls { height: auto !important; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px)) !important; gap: 6vw !important; }
            .page-btn { padding: 10px 18px !important; min-width: 96px !important; font-size: 1.35rem !important; border-radius: 14px !important; }
            #page-indicator { font-size: 1.4rem !important; }
        }
    </style>
</head>
<body>

    <div id="list-view" style="display: flex; flex-direction: column; height: calc(100vh - 60px);">
        <div id="gallery-view"></div>
        <div class="admin-bar font-zh" id="admin-bar">
            <span>数据中心：</span>
            <button class="admin-btn font-zh" onclick="exportData()">⤓ 导出备份</button>
            <button class="admin-btn font-zh" onclick="document.getElementById('fileInput').click()">⤒ 导入</button>
            <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
            <button class="admin-btn font-zh" style="background:#e74c3c;" onclick="resetAll()">✕ 清空记录</button>
        </div>
    </div>

    <div id="play-view">
        <div class="mecc-global-nav"><a href="#" class="mecc-nav-back" onclick="closePlay();return false;">← <span>返回</span></a><h1 class="mecc-nav-title" id="song-title-nav"></h1></div><div class="play-header" style="display:none;">
            <div class="play-back-btn font-zh" id="btn-close-play" onclick="closePlay()">⬅️ 返回列表</div>
            <h1 id="song-title" class="font-zh" style="color:white; font-size: clamp(1rem, 3.5vh, 2.2rem); margin:0; text-align:center; flex:1;"></h1>
            <div class="play-header-spacer font-zh">⬅️ 返回列表</div>
        </div>
        <div class="lyrics-panel">
            <div class="lyrics-content" id="lyrics-content"></div>
            <div class="pagination-controls">
                <button class="page-btn" onclick="prevPage()">←</button>
                <div id="page-indicator" class="font-en" style="font-size: 4vh; color: var(--main-teal); font-weight: bold;"></div>
                <button class="page-btn" onclick="nextPage()">→</button>
            </div>
        </div>
    </div>

    <div id="selection-bubble" class="font-zh" onmousedown="makeHardWord()">🖼️ 加注图片</div>
    
    <div id="hover-img-container" onmouseenter="keepImg()" onmouseleave="hideImg()">
        <button class="btn-delete-item" id="delete-item-btn">🗑️</button>
        <img id="global-hover-img" src="">
    </div>

    <script>
        const LANG = MECC_CONFIG.getLang();
        const t = {
            zh: { title: "🎶 我们来唱歌", backList: "⬅️ 返回列表" },
            en: { title: "🎶 Let's Sing", backList: "⬅️ Back to List" }
        }[LANG];

        let songsData = [];

        function formatText(text, isLyrics = false) {
            if (!text) return "";
            return text.split('').map(char => {
                const isChinese = /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u{20000}-\u{2a6df}]/u.test(char);
                const isEn = !isChinese;
                const className = isEn ? 'font-en' : 'font-zh';
                if (!isEn && isLyrics) {
                    const isRed = localStorage.getItem(`mecc_red_${currentSong.id}_${char}`) === 'true';
                    return `<span class="${className} clickable-char ${isRed ? 'red-word' : ''}" data-char="${char}" onclick="toggleChar(event, this,'${char}')">${char}</span>`;
                }
                return `<span class="${className}">${char}</span>`;
            }).join('');
        }

        const listView = document.getElementById('list-view');
        const playView = document.getElementById('play-view');
        const lyricsContent = document.getElementById('lyrics-content');
        const bubble = document.getElementById('selection-bubble');
        const imgContainer = document.getElementById('hover-img-container');
        const globalImg = document.getElementById('global-hover-img');
        const deleteBtn = document.getElementById('delete-item-btn');

        let currentSong = null, currentSlides = [], currentSlideIndex = 0, selectedText = "", hideTimer = null;

        const PROJECT_ID = 'sow12t1i';
        const DATASET = 'production';
        const QUERY = encodeURIComponent('*[_type == "song"] | order(_createdAt asc) {id, title, "cover": cover.asset->url, youtubeId, startTime, lyrics}');
        const API_URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

        window.onload = () => {
            MECC_CONFIG.renderGlobalNav(t.title);
            document.getElementById('head-title').innerText = t.title + " - MECC";
            document.getElementById('btn-close-play').innerText = t.backList;

            if (LANG === 'en') {
                document.getElementById('admin-bar').style.display = 'none';
            }

            fetch(API_URL)
                .then(res => res.json())
                .then(({ result }) => {
                    const list = result || [];
                    songsData = list.map(song => {
                        let lyricsArray = [];
                        if (song.lyrics) lyricsArray = song.lyrics.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                        return { ...song, lyrics: lyricsArray, id: song.id || song._id }; 
                    });
                    initGallery();
                })
                .catch(err => {
                    document.getElementById('gallery-view').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#999;font-size:1.1rem;padding:40px 0;">未能连接到云端数据库，请刷新重试！</div>';
                });
        };

        function initGallery() {
            if (songsData.length === 0) return;
            document.getElementById('gallery-view').innerHTML = songsData.map((song, index) => {
                let imgPath = song.cover || '';
                if (imgPath && imgPath.startsWith('/')) imgPath = '..' + imgPath; 
                else if (imgPath && !imgPath.startsWith('http') && !imgPath.startsWith('../')) imgPath = '../' + imgPath;

                const delay = Math.min(index * 0.05, 0.5);

                return `
                <div class="song-card" style="animation-delay: ${delay}s" onclick="startLevel(${index})">
                    <div class="card-img-wrapper">
                        <img src="${imgPath}" onerror="this.style.display='none';">
                        <div class="play-overlay">
                            <div class="play-icon"><i class="fas fa-play"></i></div>
                        </div>
                    </div>
                    <div class="song-info"><h3>${formatText(song.title)}</h3></div>
                </div>`;
            }).join('');
        }

        function startLevel(idx) {
            currentSong = songsData[idx]; 
            document.querySelector('.mecc-global-nav').style.display = 'none';
            
            listView.style.display = 'none'; playView.style.display = 'flex';
            document.getElementById('song-title').innerHTML = formatText(currentSong.title); document.getElementById('song-title-nav').innerText = currentSong.title;
            currentSlides = []; 
            let temp = [];
            
            const hasManualBreaks = currentSong.lyrics.some(l => l === "---");

            if (hasManualBreaks) {
                currentSong.lyrics.forEach(l => {
                    if(l === "---") { currentSlides.push({type:'text', content:temp}); temp = []; }
                    else { temp.push(l); }
                });
                if(temp.length) currentSlides.push({type:'text', content:temp});
            } else {
                currentSong.lyrics.forEach((l, index) => {
                    temp.push(l);
                    if (temp.length === 4 || index === currentSong.lyrics.length - 1) {
                        currentSlides.push({type:'text', content:temp});
                        temp = [];
                    }
                });
            }

            if (currentSong.youtubeId) {
                currentSlides.push({ type: 'video', content: currentSong.youtubeId, startTime: currentSong.startTime || 0 });
            }
            currentSlideIndex = 0; renderSlide();
        }

        function getMobileLines(lineData) {
            if (typeof lineData === 'object' && lineData.mobile) return lineData.mobile;
            const text = typeof lineData === 'object' ? lineData.pc : lineData;
            if (text.length <= 12) return [text];
            const segs = text.split(/(?<=[，。！？；、,!?;])/);
            if (segs.length <= 1) return [text]; 
            const result = []; let buf = '';
            segs.forEach(seg => { buf += seg; if (buf.length >= 4) { result.push(buf); buf = ''; } });
            if (buf) { if (result.length) result[result.length - 1] += buf; else result.push(buf); }
            return result;
        }

        function renderSlide() {
            const slide = currentSlides[currentSlideIndex];
            lyricsContent.innerHTML = "";
            if(slide.type === 'text') {
                const hardWords = JSON.parse(localStorage.getItem(`mecc_hard_${currentSong.id}`) || "{}");
                const sortedWords = Object.keys(hardWords).sort((a,b) => b.length - a.length);
                const isMobile = window.innerWidth <= 768;

                slide.content.forEach(lineData => {
                    const lineText = typeof lineData === 'object' ? lineData.pc : lineData;
                    const renderLines = isMobile ? getMobileLines(lineData) : [lineText];

                    renderLines.forEach(line => {
                        let parts = [{ text: line, isMarked: false }];
                        sortedWords.forEach(word => {
                            let newParts = [];
                            parts.forEach(part => {
                                if (part.isMarked) { newParts.push(part); }
                                else {
                                    let subparts = part.text.split(word);
                                    subparts.forEach((sub, idx) => {
                                        if (sub !== "") newParts.push({ text: sub, isMarked: false });
                                        if (idx < subparts.length - 1) {
                                            const imgSrc = hardWords[word];
                                            newParts.push({ text: word, isMarked: true, img: imgSrc });
                                            
                                            const preImg = new Image();
                                            preImg.src = (imgSrc && !imgSrc.startsWith('/') && !imgSrc.startsWith('http') && !imgSrc.startsWith('../')) ? '../' + imgSrc : imgSrc;
                                        }
                                    });
                                }
                            });
                            parts = newParts;
                        });

                        const div = document.createElement('div');
                        div.className = 'lyric-line font-zh';
                        if (isMobile) {
                            const vw = window.innerWidth;
                            const pxPerChar = (vw * 0.86) / line.length;
                            div.style.fontSize = Math.max(Math.min(pxPerChar * 0.85, 32), 14) + 'px';
                        }
                        parts.forEach(part => {
                            const span = document.createElement('span');
                            if (part.isMarked) {
                                span.className = 'hover-word'; span.innerHTML = formatText(part.text, true);
                                span.onmouseenter = (e) => showImg(e, part.img, part.text); span.onmouseleave = scheduleHide;
                            } else {
                                span.innerHTML = formatText(part.text, true);
                            }
                            div.appendChild(span);
                        });
                        lyricsContent.appendChild(div);
                    });
                });
            } else {
                const startParam = slide.startTime > 0 ? `&start=${slide.startTime}` : '';
                lyricsContent.innerHTML = `<div style="width:90%; height:80%; border-radius:20px; overflow:hidden; border:8px solid var(--main-teal);"><iframe src="https://www.youtube-nocookie.com/embed/${slide.content}?rel=0${startParam}" style="width:100%; height:100%; border:none;" allowfullscreen></iframe></div>`;
            }
            document.getElementById('page-indicator').innerText = `${currentSlideIndex + 1} / ${currentSlides.length}`;
        }

        function showImg(e, src, word) {
            clearTimeout(hideTimer);
            let imgPath = src;
            if(imgPath && !imgPath.startsWith('/') && !imgPath.startsWith('http') && !imgPath.startsWith('../')) imgPath = '../' + imgPath; 
            
            globalImg.src = imgPath; 
            imgContainer.style.display = 'block';
            
            requestAnimationFrame(() => {
                const rect = e.target.getBoundingClientRect();
                let topPos = rect.top - imgContainer.offsetHeight - 10;
                if (topPos < 10) topPos = rect.bottom + 10; 
                let leftPos = rect.left;
                if (leftPos + imgContainer.offsetWidth > window.innerWidth) leftPos = window.innerWidth - imgContainer.offsetWidth - 20;
                
                imgContainer.style.top = topPos + 'px'; 
                imgContainer.style.left = leftPos + 'px';
                
                requestAnimationFrame(() => {
                    imgContainer.style.opacity = '1';
                });
            });

            deleteBtn.onclick = (event) => {
                event.stopPropagation();
                if(confirm(`删除“${word}”的图片加注？`)) {
                    let d = JSON.parse(localStorage.getItem(`mecc_hard_${currentSong.id}`) || "{}");
                    delete d[word]; localStorage.setItem(`mecc_hard_${currentSong.id}`, JSON.stringify(d));
                    hideImg(); renderSlide();
                }
            };
        }

        function scheduleHide() { hideTimer = setTimeout(hideImg, 200); }
        function keepImg() { clearTimeout(hideTimer); }
        
        function hideImg() { 
            imgContainer.style.opacity = '0';
            setTimeout(() => { 
                if (imgContainer.style.opacity === '0') imgContainer.style.display = 'none'; 
            }, 200); 
        }

        function toggleChar(e, el, char) {
            e.stopPropagation(); const newState = !el.classList.contains('red-word');
            localStorage.setItem(`mecc_red_${currentSong.id}_${char}`, newState);
            document.querySelectorAll(`.clickable-char[data-char="${char}"]`).forEach(span => {
                if (newState) span.classList.add('red-word'); else span.classList.remove('red-word');
            });
        }

        document.onmouseup = (e) => {
            const s = window.getSelection(); const t = s.toString().trim();
            if (playView.style.display === 'flex' && t && t.length > 0) {
                const rect = s.getRangeAt(0).getBoundingClientRect();
                selectedText = t; bubble.style.display = 'block';
                bubble.style.top = (rect.top - 65) + 'px'; bubble.style.left = (rect.left + (rect.width/2) - 50) + 'px';
            } else if (e.target !== bubble) { bubble.style.display = 'none'; }
        };

        // 🌟 核心修改：移除 prompt，实现无感静默加注
        function makeHardWord() {
            const autoName = selectedText + ".webp";
            const imgFile = `../images/sight_words_phrases/${autoName}`; // 自动补全路径
            
            let d = JSON.parse(localStorage.getItem(`mecc_hard_${currentSong.id}`) || "{}"); 
            d[selectedText] = imgFile; 
            localStorage.setItem(`mecc_hard_${currentSong.id}`, JSON.stringify(d)); 
            
            bubble.style.display = 'none'; 
            renderSlide(); 
        }

        function closePlay() { 
            playView.style.display = 'none'; 
            listView.style.display = 'flex'; 
            bubble.style.display = 'none'; 
            lyricsContent.innerHTML = ''; 
            document.querySelector('.mecc-global-nav').style.display = 'flex';
        }

        function exportData() { const data = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('mecc_')) data[k] = localStorage.getItem(k); } const blob = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mecc_songs_backup.json`; a.click(); }
        function importData(event) { const file = event.target.files[0]; const reader = new FileReader(); reader.onload = (e) => { const data = JSON.parse(e.target.result); Object.keys(data).forEach(key => localStorage.setItem(key, data[key])); alert("导入成功！"); location.reload(); }; reader.readAsText(file); }
        function resetAll() { if(confirm("确定清空吗？")) { Object.keys(localStorage).forEach(k => k.startsWith('mecc_') && localStorage.removeItem(k)); location.reload(); } }
        function prevPage() { if(currentSlideIndex > 0) { currentSlideIndex--; renderSlide(); } }
        function nextPage() { if(currentSlideIndex < currentSlides.length - 1) { currentSlideIndex++; renderSlide(); } }
    </script>
</body>
</html>
