<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="head-title">迷宫找字 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --kaiti: "KaiTi-CJK", "LXGW WenKai Lite", sans-serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
            --accent-yellow: #f3b236;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --cell-size: clamp(44px, 9vw, 72px);
        }

        body {
            margin: 0; padding: 0;
            padding-top: 60px;
            box-sizing: border-box;
            background-color: #fff9ea;
            font-family: var(--kaiti);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Main layout ───────────────────────────────── */
        #main-layout {
            display: flex;
            flex-direction: row;
            gap: 14px;
            flex: 1;
            padding: 12px 16px 10px;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0;
        }

        /* ── Left column: image ────────────────────────── */
        #left-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 40%;
            min-width: 0;
        }

        #image-stage {
            flex: 1;
            background: white;
            border-radius: 24px;
            border: 3px solid #dde6e6;
            box-shadow: 0 8px 24px rgba(0,0,0,0.07);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative;
        }

        #sentence-img {
            width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        #image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #aaa;
            font-size: 1rem;
            font-family: var(--wenkai);
            height: 100%;
        }

        #image-placeholder svg { opacity: 0.35; }

        /* Progress bar under image */
        #progress-bar-wrap {
            height: 8px;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--main-teal), var(--correct-green));
            border-radius: 8px;
            transition: width 0.4s ease;
            width: 0%;
        }

        #progress-text {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            font-family: var(--wenkai);
            flex-shrink: 0;
        }

        /* ── Right column: maze + controls ────────────── */
        #right-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        #maze-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: auto;
        }

        #maze-grid {
            display: grid;
            gap: 6px;
            /* columns set by JS */
        }

        /* Maze cell */
        .maze-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 12px;
            border: 2.5px solid #d4e0e0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--kaiti);
            font-size: clamp(0.85rem, 2.5vw, 1.25rem);
            font-weight: bold;
            color: #333;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.15s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            touch-action: manipulation;
            text-align: center;
            padding: 2px;
            line-height: 1.2;
            word-break: break-all;
        }

        .maze-cell:hover:not(.done):not(.distractor-block) {
            background: #f0f7f7;
            border-color: var(--main-teal);
            transform: scale(1.06);
        }

        .maze-cell.start-cell {
            border-color: var(--accent-yellow);
            background: #fff9e6;
            box-shadow: 0 0 0 3px rgba(243,178,54,0.25);
        }

        .maze-cell.done {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-color: #27ae60;
            color: white;
            cursor: default;
            transform: scale(1);
        }

        .maze-cell.current-target {
            border-color: var(--main-teal);
            box-shadow: 0 0 0 3px rgba(89,133,134,0.3);
            animation: pulse 1.6s ease-in-out infinite;
        }

        .maze-cell.shake {
            animation: shake 0.4s ease;
        }

        .maze-cell.end-cell::after {
            content: '🏁';
            position: absolute;
            top: -6px; right: -6px;
            font-size: 0.8rem;
            line-height: 1;
        }

        .maze-cell.start-cell::before {
            content: '⭐';
            position: absolute;
            top: -6px; left: -6px;
            font-size: 0.75rem;
            line-height: 1;
        }

        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 3px rgba(89,133,134,0.3); }
            50%      { box-shadow: 0 0 0 7px rgba(89,133,134,0.15); }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%     { transform: translateX(-6px); }
            40%     { transform: translateX(6px); }
            60%     { transform: translateX(-4px); }
            80%     { transform: translateX(4px); }
        }

        /* ── Success overlay ───────────────────────────── */
        #success-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background: linear-gradient(135deg, #e6f9f0, #d4f1e3);
            border-radius: 20px;
            border: 2.5px solid var(--correct-green);
            text-align: center;
            flex-shrink: 0;
        }

        #success-panel .success-sentence {
            font-family: var(--kaiti);
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            font-weight: bold;
            color: #1a5c3a;
            line-height: 1.5;
        }

        #success-panel .success-icon {
            font-size: 2.5rem;
            animation: tada 0.8s;
        }

        /* ── Bottom controls ────────────────────────────── */
        #bottom-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .action-btn {
            font-family: var(--kaiti);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            font-weight: bold;
            padding: 9px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
            touch-action: manipulation;
        }

        .action-btn:active { transform: scale(0.95); }

        .btn-next {
            background: var(--accent-yellow);
            color: #1a2740;
            box-shadow: 0 3px 0 #c9921f;
        }
        .btn-next:hover { background: #e8a92b; }

        .btn-shuffle {
            background: #e2e8f0;
            color: #444;
            box-shadow: 0 3px 0 #b8c4cc;
        }
        .btn-shuffle:hover { background: #d0d8e0; }

        /* ── Writing practice ───────────────────────────── */
        #write-section {
            display: none;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        #write-label {
            font-family: var(--kaiti);
            font-size: 0.95rem;
            color: #555;
            font-weight: bold;
        }

        #write-input {
            font-family: var(--kaiti);
            font-size: 1.1rem;
            padding: 10px 14px;
            border-radius: 14px;
            border: 2.5px solid #d4e0e0;
            background: white;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        #write-input:focus { border-color: var(--main-teal); }

        /* ── Loading / error ─────────────────────────────── */
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,249,234,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            font-family: var(--kaiti);
            font-size: 1.2rem;
            color: #555;
            flex-direction: column;
            gap: 12px;
        }

        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #d4e0e0;
            border-top-color: var(--main-teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes tada {
            0%   { transform: scale(1); }
            10%,20% { transform: scale(0.9) rotate(-3deg); }
            30%,50%,70%,90% { transform: scale(1.15) rotate(3deg); }
            40%,60%,80% { transform: scale(1.15) rotate(-3deg); }
            100% { transform: scale(1); }
        }

        /* ── Mobile stacking ─────────────────────────────── */
        @media (max-width: 600px) {
            #main-layout {
                flex-direction: column;
                overflow-y: auto;
                overflow-x: hidden;
            }

            body { overflow: auto; }

            #left-col {
                width: 100%;
                height: 38vh;
                flex-shrink: 0;
            }

            #right-col { overflow: visible; }

            #maze-wrapper { overflow: visible; }

            .maze-cell {
                --cell-size: clamp(50px, 15vw, 65px);
            }
        }

        /* ── Tag pills (shown when tag filter active) ─────── */
        #tag-indicator {
            display: none;
            font-family: var(--wenkai);
            font-size: 0.8rem;
            color: white;
            background: var(--main-teal);
            padding: 3px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- Loading overlay (covers whole page) -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-msg">加载句子中…</span>
    </div>

    <!-- Main layout -->
    <div id="main-layout">

        <!-- LEFT: image -->
        <div id="left-col">
            <div id="image-stage">
                <img id="sentence-img" src="" alt="情境图片" style="display:none;" aria-label="句子情境图">
                <div id="image-placeholder">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#bbb" stroke-width="3" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="10" width="56" height="44" rx="6"/>
                        <circle cx="20" cy="26" r="6"/>
                        <polyline points="4,46 20,32 34,42 44,34 60,46"/>
                    </svg>
                    <span>（暂无图片）</span>
                </div>
            </div>
            <div id="progress-bar-wrap" style="display:none;">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text" style="display:none;"></div>
        </div>

        <!-- RIGHT: maze + controls -->
        <div id="right-col">
            <div id="maze-wrapper" role="grid" aria-label="字词迷宫">
                <div id="maze-grid"></div>
            </div>

            <!-- Success panel -->
            <div id="success-panel" role="alert" aria-live="polite">
                <div class="success-icon">🎉</div>
                <div class="success-sentence" id="success-sentence"></div>
            </div>

            <!-- Writing practice -->
            <div id="write-section">
                <label id="write-label" for="write-input">✏️ 写一写：把这个句子写下来吧！</label>
                <input type="text" id="write-input" placeholder="在这里写出完整句子…"
                       aria-label="手写句子练习输入框">
            </div>

            <!-- Bottom controls -->
            <div id="bottom-bar">
                <span id="tag-indicator"></span>
                <button class="action-btn btn-next" id="btn-next"
                        onclick="loadNextSentence()" aria-label="换一题">
                    🎲 换一题
                </button>
                <button class="action-btn btn-shuffle" id="btn-shuffle"
                        onclick="reshuffleMaze()" aria-label="重新生成迷宫">
                    🔀 重新洗牌
                </button>
            </div>
        </div>

    </div>

    <script>
    // ═══════════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════════
    const PROJECT_ID = 'sow12t1i';
    const DATASET    = 'production';
    const QUERY      = encodeURIComponent('*[_type == "sentence"]{words, punctuation, tags, "image": image.asset->url}');
    const API_URL    = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;

    // Grid constraints (auto-sized by sentence length, up to 5×5)
    const MAX_GRID_ROWS = 5;
    const MAX_GRID_COLS = 5;
    const MAX_GRID_CELLS = MAX_GRID_ROWS * MAX_GRID_COLS;

    // Max attempts for randomized path generation.
    const MAX_PATH_ATTEMPTS = 200;

    const STRIP_PUNCTUATION_RE = /[，,、。！？；：\s]/g;
    const FILTER_PUNCTUATION_RE = /[“”"'‘’（）()【】《》]/;

    // Fallback characters (used only when sight-word/sentence sources are insufficient)
    const DISTRACTOR_POOL = [
        '的一是在不有会你他她我们上下左右中大小日月山水火木土金风雨云星',
    ].join('').split('').filter((ch, i, arr) => arr.indexOf(ch) === i); // deduplicate

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════
    let allSentences   = [];
    let sightWordChars = [];
    let currentSentence = null;
    let wordList       = [];     // parsed words array
    let currentStep    = 0;      // index of next word to click
    let pathCells      = [];     // [{row,col}] of correct path
    let cellMeta       = [];     // flat array of {word, isPath, pathIdx, row, col}

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════
    window.onload = async () => {
        MECC_CONFIG.renderGlobalNav('迷宫找字');
        document.getElementById('head-title').innerText = '迷宫找字 - MECC';

        // Show tag filter indicator if ?tag= present
        const tag = new URLSearchParams(window.location.search).get('tag');
        if (tag) {
            const indicator = document.getElementById('tag-indicator');
            indicator.textContent = '标签：' + tag;
            indicator.style.display = 'inline-block';
        }

        await loadSightWordChars();
        await loadAllSentences();
    };

    // ═══════════════════════════════════════════════════════════
    //  FETCH
    // ═══════════════════════════════════════════════════════════
    async function loadSightWordChars() {
        try {
            const sightWords = await MECC_DATA.getSightWords();
            const chars = [];
            for (const item of sightWords) {
                if (!item) continue;
                chars.push(...splitToChars(item.char || ''));
                chars.push(...splitToChars(item.phrases || ''));
            }
            sightWordChars = Array.from(new Set(chars));
        } catch (e) {
            console.warn('四会字加载失败，将使用句子字符与备用干扰池生成干扰项。', e);
            sightWordChars = [];
        }
    }

    async function loadAllSentences() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const { result } = await res.json();
            allSentences = (result || []).filter(s => s && s.words && s.words.trim());

            // Filter by tag if provided
            const tag = new URLSearchParams(window.location.search).get('tag');
            if (tag) {
                const filtered = allSentences.filter(s => s.tags && s.tags.includes(tag));
                if (filtered.length > 0) allSentences = filtered;
            }

            if (allSentences.length === 0) {
                showError('暂时没有句子数据，请检查 Sanity CMS。');
                return;
            }

            hideLoading();
            loadNextSentence();
        } catch (e) {
            console.error('Sanity fetch error:', e);
            showError('加载失败，请检查网络后刷新。');
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  SENTENCE LOADING
    // ═══════════════════════════════════════════════════════════
    function loadNextSentence() {
        if (allSentences.length === 0) return;

        // Iteratively pick a sentence with parseable words, avoiding repeat where possible.
        let candidate = null;
        let parsedCandidate = [];
        const pool = allSentences.length > 1
            ? allSentences.filter(s => s !== currentSentence)
            : allSentences.slice();

        // Shuffle pool so we try sentences in random order
        shuffleArrayInPlace(pool);

        for (const s of pool) {
            const parsed = parseWords(s.words || '');
            const gridSize = chooseGridSize(parsed.length);
            if (parsed.length > 0 && gridSize) {
                candidate = s;
                parsedCandidate = parsed;
                break;
            }
        }

        if (!candidate) {
            showError('没有找到适合迷宫尺寸限制（最大5×5=25字）的句子。');
            return;
        }

        currentSentence = candidate;
        wordList = parsedCandidate.length > 0 ? parsedCandidate : parseWords(candidate.words);

        // Render image
        renderImage(candidate.image);

        // Reset state
        currentStep = 0;
        hideSuccessPanel();

        // Build maze
        buildMaze();

        // Reset progress
        updateProgress();
        document.getElementById('progress-bar-wrap').style.display = 'block';
        document.getElementById('progress-text').style.display = 'block';
        document.getElementById('write-section').style.display = 'none';
        document.getElementById('write-input').value = '';
    }

    function reshuffleMaze() {
        if (!currentSentence) return;
        currentStep = 0;
        hideSuccessPanel();
        buildMaze();
        updateProgress();
        document.getElementById('write-section').style.display = 'none';
        document.getElementById('write-input').value = '';
    }

    // ═══════════════════════════════════════════════════════════
    //  WORD PARSING
    // ═══════════════════════════════════════════════════════════
    function parseWords(raw) {
        if (!raw) return [];
        return splitToChars(raw);
    }

    function splitToChars(raw) {
        if (!raw) return [];
        const stripped = raw.replace(STRIP_PUNCTUATION_RE, '');
        return Array.from(stripped)
            .map(ch => ch.trim())
            .filter(ch => ch && !FILTER_PUNCTUATION_RE.test(ch));
    }

    function shuffleArrayInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ═══════════════════════════════════════════════════════════
    //  IMAGE
    // ═══════════════════════════════════════════════════════════
    function renderImage(url) {
        const img = document.getElementById('sentence-img');
        const placeholder = document.getElementById('image-placeholder');
        if (url) {
            img.src = url;
            img.style.display = 'block';
            placeholder.style.display = 'none';
        } else {
            img.style.display = 'none';
            placeholder.style.display = 'flex';
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  MAZE GENERATION
    // ═══════════════════════════════════════════════════════════
    function buildMaze() {
        const n = wordList.length;
        const gridSize = chooseGridSize(n);
        if (!gridSize) {
            showError('当前句子字数超出迷宫尺寸限制（最大5×5=25字），请换一题。');
            return;
        }
        const { rows, cols } = gridSize;
        const total = rows * cols;

        // Generate path: fixed start at top-left, fixed end at bottom-right
        pathCells = generatePathFromCorners(rows, cols, n);
        if (!Array.isArray(pathCells) || pathCells.length !== n) {
            showError('迷宫生成失败，正在换一题…');
            setTimeout(loadNextSentence, 600);
            return;
        }

        // Build path lookup for exact sequence mapping
        const pathIndexByFlat = new Map();
        pathCells.forEach(([r, c], idx) => pathIndexByFlat.set(r * cols + c, idx));

        // Collect distractor words from other sentences
        const otherWords = collectDistractors(wordList);

        // Assign words to cells
        cellMeta = [];

        for (let i = 0; i < total; i++) {
            const row = Math.floor(i / cols);
            const col = i % cols;
            if (pathIndexByFlat.has(i)) {
                const idx = pathIndexByFlat.get(i);
                cellMeta.push({ word: wordList[idx], isPath: true, pathIdx: idx, row, col });
            } else {
                cellMeta.push({ word: pickDistractor(otherWords), isPath: false, pathIdx: -1, row, col });
            }
        }

        renderGrid(rows, cols, total);
    }

    function chooseGridSize(n) {
        if (!Number.isInteger(n) || n < 1 || n > MAX_GRID_CELLS) return null;

        const candidates = [];
        for (let rows = 2; rows <= MAX_GRID_ROWS; rows++) {
            for (let cols = 2; cols <= MAX_GRID_COLS; cols++) {
                const total = rows * cols;
                // Shortest possible corner-to-corner path length (Manhattan path including start/end cells)
                const minPathLength = rows + cols - 1;
                if (n < minPathLength || n > total) continue;
                candidates.push({
                    rows,
                    cols,
                    total,
                    extra: total - n,
                    isNearSquare: Math.abs(rows - cols) <= 1
                });
            }
        }

        if (candidates.length === 0) return null;
        const preferred = candidates.some(c => c.isNearSquare)
            ? candidates.filter(c => c.isNearSquare)
            : candidates;

        // Priority: (1) fewer extra cells, (2) smaller total grid, (3) closer to square
        preferred.sort((a, b) =>
            a.extra - b.extra ||
            a.total - b.total ||
            Math.abs(a.rows - a.cols) - Math.abs(b.rows - b.cols)
        );

        return preferred[0];
    }

    /**
     * Randomized DFS path of length `n` on a rows×cols grid.
     * Start is fixed at (0,0), end is fixed at (rows-1, cols-1).
     */
    function generatePathFromCorners(rows, cols, n) {
        const endR = rows - 1;
        const endC = cols - 1;
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        const tryBuildPath = (shuffleDirs) => {
            const visited = new Set([0]);
            const path = [[0, 0]];

            const dfs = (r, c) => {
                if (path.length === n) return r === endR && c === endC;

                const remainingSteps = n - path.length;
                const distToEnd = Math.abs(r - endR) + Math.abs(c - endC);
                if (distToEnd > remainingSteps) return false;

                const orderedDirs = shuffleDirs
                    ? shuffleArrayInPlace(dirs.slice())
                    : dirs.slice().sort((a, b) => {
                        const aDist = Math.abs((r + a[0]) - endR) + Math.abs((c + a[1]) - endC);
                        const bDist = Math.abs((r + b[0]) - endR) + Math.abs((c + b[1]) - endC);
                        return aDist - bDist;
                    });
                for (const [dr, dc] of orderedDirs) {
                    const nr = r + dr;
                    const nc = c + dc;
                    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;

                    const key = nr * cols + nc;
                    if (visited.has(key)) continue;

                    const nextRemaining = remainingSteps - 1;
                    const nextDist = Math.abs(nr - endR) + Math.abs(nc - endC);
                    if (nextDist > nextRemaining) continue;

                    visited.add(key);
                    path.push([nr, nc]);
                    if (dfs(nr, nc)) return true;
                    path.pop();
                    visited.delete(key);
                }

                return false;
            };

            return dfs(0, 0) ? path : null;
        };

        for (let attempt = 0; attempt < MAX_PATH_ATTEMPTS; attempt++) {
            const randomPath = tryBuildPath(true);
            if (randomPath) return randomPath;
        }

        const deterministicPath = tryBuildPath(false);
        if (deterministicPath) return deterministicPath;

        return null;
    }

    /**
     * Collect distractor single characters from sight words + other sentences + fallback pool.
     */
    function collectDistractors(targetWords) {
        const targetSet = new Set(targetWords);
        const words = [];

        // From sight words
        for (const ch of sightWordChars) {
            if (!targetSet.has(ch)) words.push(ch);
        }

        // From other Sanity sentences
        for (const s of allSentences) {
            if (s === currentSentence) continue;
            const parsed = parseWords(s.words || '');
            for (const w of parsed) {
                if (!targetSet.has(w)) words.push(w);
            }
        }

        // Add built-in single characters
        for (const ch of DISTRACTOR_POOL) {
            if (!targetSet.has(ch)) words.push(ch);
        }

        return Array.from(new Set(words.filter(ch => ch.length === 1)));
    }

    function pickDistractor(pool) {
        if (pool.length === 0) return '字';
        return pool[Math.floor(Math.random() * pool.length)];
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER GRID
    // ═══════════════════════════════════════════════════════════
    function renderGrid(rows, cols, total) {
        const grid = document.getElementById('maze-grid');
        grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
        grid.innerHTML = '';

        for (let i = 0; i < total; i++) {
            const meta = cellMeta[i];
            const cell = document.createElement('button');
            cell.className = 'maze-cell';
            cell.dataset.index = i;
            cell.textContent = meta.word;
            cell.setAttribute('aria-label', meta.word);
            cell.setAttribute('role', 'gridcell');

            if (meta.isPath && meta.pathIdx === 0) {
                cell.classList.add('start-cell', 'current-target');
            }
            if (meta.isPath && meta.pathIdx === wordList.length - 1) {
                cell.classList.add('end-cell');
            }

            cell.addEventListener('click', () => onCellClick(i));
            grid.appendChild(cell);
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  INTERACTION
    // ═══════════════════════════════════════════════════════════
    function onCellClick(flatIndex) {
        if (currentStep >= wordList.length) return; // already done

        const meta = cellMeta[flatIndex];
        const cell = document.querySelector(`.maze-cell[data-index="${flatIndex}"]`);

        if (meta.isPath && meta.pathIdx === currentStep) {
            // ✅ Correct!
            cell.classList.remove('current-target', 'start-cell');
            cell.classList.add('done');
            cell.setAttribute('aria-pressed', 'true');
            currentStep++;

            // Highlight next target
            if (currentStep < wordList.length) {
                markCurrentTarget();
            }

            updateProgress();

            if (currentStep === wordList.length) {
                onComplete();
            }
        } else if (meta.isPath && meta.pathIdx < currentStep) {
            // Already clicked — do nothing (silently ignore)
            return;
        } else {
            // ❌ Wrong
            cell.classList.add('shake');
            MECC_UI.showToast('再找找看！', 'error');
            try { MECC_AUDIO.playSfx('wrong'); } catch(e) {}
            cell.addEventListener('animationend', () => cell.classList.remove('shake'), { once: true });
        }
    }

    function markCurrentTarget() {
        // Remove current-target from all
        document.querySelectorAll('.maze-cell.current-target').forEach(el => {
            el.classList.remove('current-target');
        });
        // Find cell for currentStep
        const targetMeta = cellMeta.findIndex(m => m.isPath && m.pathIdx === currentStep);
        if (targetMeta !== -1) {
            const el = document.querySelector(`.maze-cell[data-index="${targetMeta}"]`);
            if (el && !el.classList.contains('done')) {
                el.classList.add('current-target');
            }
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  PROGRESS
    // ═══════════════════════════════════════════════════════════
    function updateProgress() {
        const n = wordList.length;
        const pct = n > 0 ? Math.round((currentStep / n) * 100) : 0;
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-text').textContent =
            `已找到 ${currentStep} / ${n} 个字`;
    }

    // ═══════════════════════════════════════════════════════════
    //  COMPLETION
    // ═══════════════════════════════════════════════════════════
    function onComplete() {
        const fullSentence = wordList.join('') + (currentSentence.punctuation || '');

        // Try to play the full sentence
        try { MECC_AUDIO.readText(fullSentence); } catch(e) {}
        try { MECC_AUDIO.playSfx('tada'); } catch(e) {}

        // Confetti
        try { MECC_UI.fireConfetti('normal'); } catch(e) {}

        // Show success panel
        const panel = document.getElementById('success-panel');
        const sentEl = document.getElementById('success-sentence');
        sentEl.textContent = '🎊 ' + fullSentence;
        panel.style.display = 'flex';

        // Show writing practice
        const writeSection = document.getElementById('write-section');
        writeSection.style.display = 'flex';

        // Mark all remaining path cells as done (should be all done already, but safety)
        document.querySelectorAll('.maze-cell.current-target').forEach(el => {
            el.classList.remove('current-target');
        });

        updateProgress();
    }

    function hideSuccessPanel() {
        document.getElementById('success-panel').style.display = 'none';
    }

    // ═══════════════════════════════════════════════════════════
    //  LOADING / ERROR UI
    // ═══════════════════════════════════════════════════════════
    function hideLoading() {
        const overlay = document.getElementById('loading-overlay');
        if (overlay) overlay.style.display = 'none';
    }

    function showError(msg) {
        const overlay = document.getElementById('loading-overlay');
        const spinner = overlay.querySelector('.spinner');
        if (spinner) spinner.style.display = 'none';
        document.getElementById('loading-msg').textContent = msg;
    }

    </script>
</body>
