<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="head-title">迷宫找字 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --kaiti: "KaiTi-CJK", "LXGW WenKai Lite", sans-serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
            --accent-yellow: #f3b236;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --cell-size: clamp(44px, 9vw, 72px);
        }

        body {
            margin: 0; padding: 0;
            padding-top: 60px;
            box-sizing: border-box;
            background-color: #fff9ea;
            font-family: var(--kaiti);
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-layout {
            display: flex;
            flex-direction: row;
            gap: 14px;
            flex: 1;
            padding: 12px 16px 10px;
            box-sizing: border-box;
            overflow: hidden;
            min-height: 0;
        }

        #left-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 40%;
            min-width: 0;
        }

        #image-stage {
            flex: 1;
            background: white;
            border-radius: 24px;
            border: 3px solid #dde6e6;
            box-shadow: 0 8px 24px rgba(0,0,0,0.07);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            position: relative;
        }

        #sentence-img {
            width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        #image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #aaa;
            font-size: 1rem;
            font-family: var(--wenkai);
            height: 100%;
        }

        #image-placeholder svg { opacity: 0.35; }

        #progress-bar-wrap {
            height: 8px;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--main-teal), var(--correct-green));
            border-radius: 8px;
            transition: width 0.4s ease;
            width: 0%;
        }

        #progress-text {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            font-family: var(--wenkai);
            flex-shrink: 0;
        }

        #right-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            position: relative;
        }

        #maze-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            overflow: auto;
        }

        #maze-grid {
            display: grid;
            gap: 6px;
        }

        .maze-cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 12px;
            border: 2.5px solid #d4e0e0;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--kaiti);
            font-size: clamp(0.85rem, 2.5vw, 1.25rem);
            font-weight: bold;
            color: #333;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.15s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            touch-action: manipulation;
            text-align: center;
            padding: 2px;
            line-height: 1.2;
            word-break: break-all;
        }

        .maze-cell:hover:not(.done):not(.selected) {
            background: #f0f7f7;
            border-color: var(--main-teal);
            transform: scale(1.06);
        }

        /* FIX 3: selected cells keep pointer so undo tap works */
        .maze-cell.selected {
            background: linear-gradient(135deg, #a8d8ea, #74b9d0);
            border-color: #5ba0c0;
            color: white;
            cursor: pointer;
            transform: scale(1);
        }

        /* FIX 3: last selected cell gets a subtle undo indicator */
        .maze-cell.selected.last-selected {
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.45);
        }

        .maze-cell.done {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border-color: #27ae60;
            color: white;
            cursor: default;
            transform: scale(1);
        }

        .maze-cell.shake {
            animation: shake 0.4s ease;
        }

        /* FIX 2: end-cell flag only — no start-cell special styling at all */
        .maze-cell.end-cell::after {
            content: '🏁';
            position: absolute;
            top: -6px; right: -6px;
            font-size: 0.8rem;
            line-height: 1;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%     { transform: translateX(-6px); }
            40%     { transform: translateX(6px); }
            60%     { transform: translateX(-4px); }
            80%     { transform: translateX(4px); }
        }

        #success-panel {
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #e6f9f0, #d4f1e3);
            border-radius: 14px;
            border: 2px solid var(--correct-green);
            overflow: hidden;
            position: absolute;
            bottom: 56px;
            left: 0;
            right: 0;
            z-index: 20;
            box-shadow: 0 4px 18px rgba(46,204,113,0.2);
        }

        #success-panel .success-sentence {
            font-family: var(--kaiti);
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: bold;
            color: #1a5c3a;
        }

        #hint-panel {
            display: none;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: linear-gradient(135deg, #fff0f0, #ffe0e0);
            border-radius: 14px;
            border: 2px solid var(--wrong-red);
            overflow: hidden;
            position: absolute;
            bottom: 56px;
            left: 0;
            right: 0;
            z-index: 20;
            box-shadow: 0 4px 18px rgba(231,76,60,0.2);
            font-family: var(--kaiti);
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            font-weight: bold;
            color: #7a1a1a;
        }

        #bottom-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .action-btn {
            font-family: var(--kaiti);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn svg { flex-shrink: 0; }
        .action-btn:active { transform: scale(0.95); }

        .btn-next {
            background: var(--accent-yellow);
            color: #1a2740;
            box-shadow: 0 3px 0 #c9921f;
        }
        .btn-next:hover { background: #e8a92b; }

        .btn-shuffle {
            background: #e2e8f0;
            color: #444;
            box-shadow: 0 3px 0 #b8c4cc;
        }
        .btn-shuffle:hover { background: #d0d8e0; }

        #score-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 80px;
            flex-shrink: 0;
        }

        #score-card {
            background: white;
            border-radius: 18px;
            border: 2.5px solid #dde6e6;
            box-shadow: 0 4px 14px rgba(0,0,0,0.07);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        #score-title { font-family: var(--kaiti); font-size: 0.78rem; color: #777; white-space: nowrap; }
        #score-count { font-family: var(--kaiti); font-size: 2rem; font-weight: bold; color: var(--main-teal); line-height: 1; }
        #score-unit  { font-family: var(--kaiti); font-size: 0.78rem; color: #999; }

        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,249,234,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            font-family: var(--kaiti);
            font-size: 1.2rem;
            color: #555;
            flex-direction: column;
            gap: 12px;
        }

        .spinner {
            width: 36px; height: 36px;
            border: 4px solid #d4e0e0;
            border-top-color: var(--main-teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .retry-btn {
            border: 0;
            border-radius: 999px;
            padding: 8px 16px;
            font-family: var(--kaiti);
            font-size: 1rem;
            color: white;
            background: var(--main-teal);
            cursor: pointer;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            #main-layout { flex-direction: column; overflow-y: auto; overflow-x: hidden; }
            body { overflow: auto; }
            #left-col { width: 100%; height: 38vh; flex-shrink: 0; }
            #right-col { overflow: visible; }
            #maze-wrapper { overflow: visible; }
            .maze-cell { --cell-size: clamp(50px, 15vw, 65px); }
            #score-col { flex-direction: row; width: 100%; }
            #score-card { flex-direction: row; gap: 8px; padding: 8px 14px; width: auto; }
        }

        #tag-indicator {
            display: none;
            font-family: var(--wenkai);
            font-size: 0.8rem;
            color: white;
            background: var(--main-teal);
            padding: 3px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        #top-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-peek {
            background: #e8eaf6;
            color: #3949ab;
            box-shadow: 0 3px 0 #9fa8da;
        }
        .btn-peek:hover:not(:disabled) { background: #d5d8f0; }

        /* FIX 5: disabled peek button after first use */
        .btn-peek:disabled {
            background: #efefef;
            color: #bbb;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.65;
        }

        #peek-panel {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 25;
            padding: 10px 16px;
            background: linear-gradient(135deg, #fff9e6, #fef3c7);
            border-radius: 14px;
            border: 2px solid var(--accent-yellow);
            box-shadow: 0 4px 18px rgba(243,178,54,0.25);
            font-family: var(--kaiti);
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: bold;
            color: #7c4a00;
            text-align: center;
        }

        #maze-container {
            position: relative;
            display: inline-block;
        }

        #path-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        #path-svg line {
            stroke: var(--accent-yellow);
            stroke-width: 4;
            stroke-linecap: round;
            opacity: 0.75;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-msg">加载句子中…</span>
        <button id="retry-load-btn" class="retry-btn" onclick="retryLoadSentences()">重试</button>
    </div>

    <div id="main-layout">

        <div id="left-col">
            <div id="image-stage">
                <img id="sentence-img" src="" alt="情境图片" style="display:none;" aria-label="句子情境图">
                <div id="image-placeholder">
                    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#bbb" stroke-width="3" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="10" width="56" height="44" rx="6"/>
                        <circle cx="20" cy="26" r="6"/>
                        <polyline points="4,46 20,32 34,42 44,34 60,46"/>
                    </svg>
                    <span id="no-image-text">（暂无图片）</span>
                </div>
            </div>
            <div id="progress-bar-wrap" style="display:none;">
                <div id="progress-bar"></div>
            </div>
            <div id="progress-text" style="display:none;"></div>
        </div>

        <div id="right-col">
            <div id="top-bar">
                <button class="action-btn btn-peek" id="btn-peek"
                        onclick="peekSentence()" aria-label="看一看句子">
                    <svg width="20" height="20" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <ellipse cx="18" cy="18" rx="14" ry="9" stroke="#3949ab" stroke-width="2.4"/>
                        <circle cx="18" cy="18" r="4.5" fill="#3949ab"/>
                    </svg>
                    <span id="btn-peek-text">看一看句子</span>
                </button>
            </div>

            <div id="peek-panel" role="status" aria-live="polite"></div>

            <div id="maze-wrapper" role="grid" aria-label="字词迷宫">
                <div id="maze-container">
                    <div id="maze-grid"></div>
                    <svg id="path-svg" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>

            <div id="success-panel" role="alert" aria-live="polite">
                <span class="success-sentence" id="success-sentence"></span>
            </div>

            <div id="hint-panel" role="alert" aria-live="polite"></div>

            <div id="bottom-bar">
                <span id="tag-indicator"></span>
                <button class="action-btn btn-next" id="btn-next"
                        onclick="loadNextSentence()" aria-label="下一个句子">
                    <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="24" rx="3" stroke="#1a2740" stroke-width="2.2" fill="none"/>
                        <line x1="7" y1="10" x2="17" y2="10" stroke="#1a2740" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="7" y1="15" x2="17" y2="15" stroke="#1a2740" stroke-width="1.8" stroke-linecap="round"/>
                        <line x1="7" y1="20" x2="13" y2="20" stroke="#1a2740" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M24 18 L33 18" stroke="#1a2740" stroke-width="2.4" stroke-linecap="round"/>
                        <path d="M28 13 L34 18 L28 23" stroke="#1a2740" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="btn-next-text">下一个句子</span>
                </button>
                <button class="action-btn btn-shuffle" id="btn-shuffle"
                        onclick="reshuffleMaze()" aria-label="交换一下">
                    <svg width="22" height="22" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 10 C8 10 11 10 14 14 C17 18 20 22 24 22 L29 22" stroke="#444" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                        <path d="M25 18 L30 22 L25 26" stroke="#444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <path d="M4 26 C8 26 11 26 14 22 C17 18 20 14 24 14 L29 14" stroke="#444" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                        <path d="M25 10 L30 14 L25 18" stroke="#444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                    <span id="btn-shuffle-text">交换一下</span>
                </button>
            </div>
        </div>

        <div id="score-col">
            <div id="score-card">
                <div id="score-title">记分牌</div>
                <div id="score-count">0</div>
                <div id="score-unit">句 ✓</div>
            </div>
        </div>

    </div>

    <script>
    // ═══════════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════════
    const PROJECT_ID = 'sow12t1i';
    const DATASET    = 'production';
    const QUERY      = encodeURIComponent('*[_type == "sentence"]{words, punctuation, tags, "image": image.asset->url, "video": video.asset->url}');
    const API_URL    = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${QUERY}`;
    const FALLBACK_SENTENCE_URL = '../data/sentences.json';
    const FETCH_TIMEOUT_MS = 12000;
    const FETCH_RETRY_COUNT = 2;

    const MAX_GRID_ROWS    = 5;
    const MAX_GRID_COLS    = 5;
    const MAX_GRID_CELLS   = MAX_GRID_ROWS * MAX_GRID_COLS;
    const MAX_PATH_ATTEMPTS = 200;

    const STRIP_PUNCTUATION_RE  = /[，,、。！？；：\s]/g;
    const FILTER_PUNCTUATION_RE = /["""'''（）()【】《》]/;

    // FIX 1: kindergarten-appropriate distractor characters only — no digits, no rare chars
    const DISTRACTOR_POOL = Array.from(new Set(
        '的了也在是不有会你他她我上下左右来去大小多少好长短高矮里外前后中日月山水火木土金风雨云天地手口目耳心年生老师同学朋友爸妈哥姐弟妹家门窗书包桌椅吃饭喝走跑跳唱画说看见听想要做得能'
            .split('')
    ));

    // ═══════════════════════════════════════════════════════════
    //  I18N
    // ═══════════════════════════════════════════════════════════
    const LANG = MECC_CONFIG.getLang();
    const ALL_STRINGS = {
        zh: {
            navTitle:    '迷宫找字',
            loading:     '加载句子中…',
            noImage:     '（暂无图片）',
            mazeLabel:   '字词迷宫',
            peekBtn:     '看一看句子',
            peekUsed:    '已经看过了',
            nextBtn:     '下一个句子',
            shuffleBtn:  '交换一下',
            scoreTitle:  '记分牌',
            scoreUnit:   '句 ✓',
            tagLabel:    '标签：',
            errNoData:   '暂时没有句子数据，请检查 Sanity CMS。',
            errLoadFail: '加载失败，请检查网络后刷新。',
            retryLoad:   '重试',
            retrying:    '重新加载中…',
            errNoFit:    '没有找到适合迷宫尺寸限制（最大5×5=25字）的句子。',
            errTooLong:  '当前句子字数超出迷宫尺寸限制（最大5×5=25字），请换一题。',
            errMazeFail: '迷宫生成失败，正在换一题…',
            progress:    (step, n) => `已找到 ${step} / ${n} 个字`,
            wrongHint:   () => `顺序不对哦，再试试！`,
        },
        en: {
            navTitle:    'Sentence Maze',
            loading:     'Loading sentences…',
            noImage:     '(No image)',
            mazeLabel:   'Sentence maze',
            peekBtn:     'Peek at Sentence',
            peekUsed:    'Already peeked',
            nextBtn:     'Next Sentence',
            shuffleBtn:  'Shuffle',
            scoreTitle:  'Score',
            scoreUnit:   '✓',
            tagLabel:    'Tag: ',
            errNoData:   'No sentence data. Please check Sanity CMS.',
            errLoadFail: 'Failed to load. Please check network and refresh.',
            retryLoad:   'Retry',
            retrying:    'Reloading…',
            errNoFit:    'No sentence fits the maze size limit (max 5×5=25 chars).',
            errTooLong:  'Current sentence exceeds maze size limit (max 5×5=25 chars), please try another.',
            errMazeFail: 'Maze generation failed, trying another…',
            progress:    (step, n) => `Found ${step} / ${n} characters`,
            wrongHint:   () => `Wrong order, try again!`,
        },
    };
    const t = ALL_STRINGS[LANG] || ALL_STRINGS.zh;

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════
    let allSentences       = [];
    let remainingSentences = []; // FIX 4: queue of unseen sentences
    let sightWordChars     = [];
    let currentSentence    = null;
    let wordList           = [];
    let currentStep        = 0;
    let pathCells          = [];
    let cellMeta           = [];
    let scoreCount         = 0;
    let clickedFlatIndices = [];
    let peekTimer          = null;
    let hintResetTimer     = null;
    let peekUsed           = false; // FIX 5: one peek per sentence
    let isLoadingSentences = false;

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════
    window.onload = async () => {
        MECC_CONFIG.renderGlobalNav(t.navTitle);
        document.getElementById('head-title').innerText = t.navTitle + ' - MECC';

        document.getElementById('loading-msg').textContent         = t.loading;
        document.getElementById('no-image-text').textContent       = t.noImage;
        document.getElementById('maze-wrapper').setAttribute('aria-label', t.mazeLabel);
        document.getElementById('btn-peek').setAttribute('aria-label', t.peekBtn);
        document.getElementById('btn-peek-text').textContent       = t.peekBtn;
        document.getElementById('btn-next').setAttribute('aria-label', t.nextBtn);
        document.getElementById('btn-next-text').textContent       = t.nextBtn;
        document.getElementById('btn-shuffle').setAttribute('aria-label', t.shuffleBtn);
        document.getElementById('btn-shuffle-text').textContent    = t.shuffleBtn;
        document.getElementById('score-title').textContent         = t.scoreTitle;
        document.getElementById('score-unit').textContent          = t.scoreUnit;
        document.getElementById('retry-load-btn').textContent      = t.retryLoad;

        const tag = new URLSearchParams(window.location.search).get('tag');
        if (tag) {
            const indicator = document.getElementById('tag-indicator');
            indicator.textContent = t.tagLabel + tag;
            indicator.style.display = 'inline-block';
        }

        await loadSightWordChars();
        await loadAllSentences();
    };

    // ═══════════════════════════════════════════════════════════
    //  FETCH
    // ═══════════════════════════════════════════════════════════
    async function loadSightWordChars() {
        try {
            const sightWords = await MECC_DATA.getSightWords();
            const chars = [];
            for (const item of sightWords) {
                if (!item) continue;
                chars.push(...splitToChars(item.char || ''));
                chars.push(...splitToChars(item.phrases || ''));
            }
            // FIX 1: strip digits from sight-word distractor candidates
            sightWordChars = Array.from(new Set(chars)).filter(ch => !/[0-9０-９]/.test(ch));
        } catch (e) {
            console.warn('四会字加载失败', e);
            sightWordChars = [];
        }
    }

    async function loadAllSentences() {
        if (isLoadingSentences) return;
        isLoadingSentences = true;
        try {
            allSentences = await fetchSentencesFromSanity();
            if (!allSentences.length) {
                allSentences = await fetchFallbackSentences();
            }

            const tag = new URLSearchParams(window.location.search).get('tag');
            if (tag) {
                const filtered = allSentences.filter(s => s.tags && s.tags.includes(tag));
                if (filtered.length > 0) allSentences = filtered;
            }

            if (allSentences.length === 0) { showError(t.errNoData); return; }

            // FIX 4: build shuffled queue of valid sentences
            rebuildQueue();

            hideLoading();
            loadNextSentence();
        } catch (e) {
            console.error('Sanity fetch error:', e);
            showError(t.errLoadFail, { canRetry: true });
        } finally {
            isLoadingSentences = false;
        }
    }

    async function fetchSentencesFromSanity() {
        let lastError = null;
        for (let attempt = 0; attempt <= FETCH_RETRY_COUNT; attempt++) {
            try {
                const res = await fetchWithTimeout(API_URL, {}, FETCH_TIMEOUT_MS);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const { result } = await res.json();
                return (result || []).map(normalizeSentence).filter(s => s && s.words);
            } catch (err) {
                lastError = err;
                if (attempt < FETCH_RETRY_COUNT) await wait(300 * (attempt + 1));
            }
        }
        throw lastError || new Error('Failed to load sentence data from Sanity.');
    }

    async function fetchFallbackSentences() {
        const res = await fetchWithTimeout(FALLBACK_SENTENCE_URL, {}, FETCH_TIMEOUT_MS);
        if (!res.ok) throw new Error('Fallback HTTP ' + res.status);
        const data = await res.json();
        return (data?.sentence_list || []).map(normalizeSentence).filter(s => s && s.words);
    }

    function normalizeSentence(item) {
        if (!item || typeof item.words !== 'string') return null;
        const words = item.words.trim();
        if (!words) return null;
        const rawTags = item.tags;
        const tags = Array.isArray(rawTags)
            ? rawTags
            : (typeof rawTags === 'string' ? rawTags.split(/[,，、\s]+/).map(tag => tag.trim()).filter(Boolean) : []);
        return {
            words,
            punctuation: item.punctuation || '',
            image: item.image || '',
            video: item.video || '',
            tags,
        };
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 10000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } finally {
            clearTimeout(timer);
        }
    }

    // FIX 4: fill remainingSentences with all valid sentences in random order
    function rebuildQueue() {
        remainingSentences = allSentences.filter(s => {
            const parsed = parseWords(s.words || '');
            return parsed.length > 0 && chooseGridSize(parsed.length) !== null;
        });
        shuffleArrayInPlace(remainingSentences);
    }

    // ═══════════════════════════════════════════════════════════
    //  SENTENCE LOADING
    // ═══════════════════════════════════════════════════════════
    function loadNextSentence() {
        // FIX 4: when queue is empty, refill so the game continues (loops)
        if (remainingSentences.length === 0) {
            rebuildQueue();
            if (remainingSentences.length === 0) { showError(t.errNoFit); return; }
        }

        const candidate = remainingSentences.shift();
        const parsedCandidate = parseWords(candidate.words || '');

        if (!parsedCandidate.length || !chooseGridSize(parsedCandidate.length)) {
            loadNextSentence(); // skip invalid, try next
            return;
        }

        currentSentence = candidate;
        wordList        = parsedCandidate;

        renderImage(candidate.image);

        currentStep = 0;
        clickedFlatIndices = [];
        hidePeek();
        hideSuccessPanel();
        hideHintPanel();

        // FIX 5: reset peek for each new sentence
        peekUsed = false;
        resetPeekButton();

        buildMaze();
        updateProgress();
        document.getElementById('progress-bar-wrap').style.display = 'block';
        document.getElementById('progress-text').style.display     = 'block';
    }

    function reshuffleMaze() {
        if (!currentSentence) return;
        currentStep = 0;
        clickedFlatIndices = [];
        hidePeek();
        hideSuccessPanel();
        hideHintPanel();
        buildMaze();
        updateProgress();
    }

    // ═══════════════════════════════════════════════════════════
    //  WORD PARSING
    // ═══════════════════════════════════════════════════════════
    function parseWords(raw) { return splitToChars(raw); }

    function splitToChars(raw) {
        if (!raw) return [];
        return Array.from(raw.replace(STRIP_PUNCTUATION_RE, ''))
            .map(ch => ch.trim())
            .filter(ch => ch && !FILTER_PUNCTUATION_RE.test(ch));
    }

    function shuffleArrayInPlace(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ═══════════════════════════════════════════════════════════
    //  IMAGE
    // ═══════════════════════════════════════════════════════════
    function renderImage(url) {
        const img         = document.getElementById('sentence-img');
        const placeholder = document.getElementById('image-placeholder');
        if (url) {
            img.src = url;
            img.style.display         = 'block';
            placeholder.style.display = 'none';
        } else {
            img.style.display         = 'none';
            placeholder.style.display = 'flex';
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  MAZE GENERATION
    // ═══════════════════════════════════════════════════════════
    function buildMaze() {
        const n        = wordList.length;
        const gridSize = chooseGridSize(n);
        if (!gridSize) { showError(t.errTooLong); return; }
        const { rows, cols } = gridSize;
        const total = rows * cols;

        pathCells = generatePathFromCorners(rows, cols, n);
        if (!Array.isArray(pathCells) || pathCells.length !== n) {
            showError(t.errMazeFail);
            setTimeout(loadNextSentence, 600);
            return;
        }

        const pathIndexByFlat = new Map();
        pathCells.forEach(([r, c], idx) => pathIndexByFlat.set(r * cols + c, idx));

        const otherWords = collectDistractors(wordList);

        cellMeta = [];
        for (let i = 0; i < total; i++) {
            const row = Math.floor(i / cols);
            const col = i % cols;
            if (pathIndexByFlat.has(i)) {
                const idx = pathIndexByFlat.get(i);
                cellMeta.push({ word: wordList[idx], isPath: true, pathIdx: idx, row, col });
            } else {
                cellMeta.push({ word: pickDistractor(otherWords), isPath: false, pathIdx: -1, row, col });
            }
        }

        renderGrid(rows, cols, total);
    }

    function chooseGridSize(n) {
        if (!Number.isInteger(n) || n < 1 || n > MAX_GRID_CELLS) return null;
        const candidates = [];
        for (let rows = 2; rows <= MAX_GRID_ROWS; rows++) {
            for (let cols = 2; cols <= MAX_GRID_COLS; cols++) {
                const total          = rows * cols;
                const minPathLength  = rows + cols - 1;
                if (n < minPathLength || n > total) continue;
                candidates.push({
                    rows, cols, total,
                    extra: total - n,
                    isNearSquare: Math.abs(rows - cols) <= 1
                });
            }
        }
        if (candidates.length === 0) return null;
        const preferred = candidates.some(c => c.isNearSquare)
            ? candidates.filter(c => c.isNearSquare)
            : candidates;
        const targetDistractors = n;
        preferred.sort((a, b) =>
            Math.abs(a.extra - targetDistractors) - Math.abs(b.extra - targetDistractors) ||
            Math.abs(a.rows - a.cols) - Math.abs(b.rows - b.cols) ||
            a.total - b.total
        );
        return preferred[0];
    }

    function generatePathFromCorners(rows, cols, n) {
        const endR = rows - 1, endC = cols - 1;
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        const tryBuildPath = (shuffleDirs) => {
            const visited = new Set([0]);
            const path    = [[0, 0]];
            const dfs = (r, c) => {
                if (path.length === n) return r === endR && c === endC;
                const remainingSteps = n - path.length;
                if (Math.abs(r - endR) + Math.abs(c - endC) > remainingSteps) return false;
                const orderedDirs = shuffleDirs
                    ? shuffleArrayInPlace(dirs.slice())
                    : dirs.slice().sort((a, b) => {
                        const aDist = Math.abs((r+a[0]) - endR) + Math.abs((c+a[1]) - endC);
                        const bDist = Math.abs((r+b[0]) - endR) + Math.abs((c+b[1]) - endC);
                        return aDist - bDist;
                    });
                for (const [dr, dc] of orderedDirs) {
                    const nr = r + dr, nc = c + dc;
                    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
                    const key = nr * cols + nc;
                    if (visited.has(key)) continue;
                    if (Math.abs(nr - endR) + Math.abs(nc - endC) > remainingSteps - 1) continue;
                    visited.add(key);
                    path.push([nr, nc]);
                    if (dfs(nr, nc)) return true;
                    path.pop();
                    visited.delete(key);
                }
                return false;
            };
            return dfs(0, 0) ? path : null;
        };
        for (let i = 0; i < MAX_PATH_ATTEMPTS; i++) {
            const p = tryBuildPath(true);
            if (p) return p;
        }
        return tryBuildPath(false) || null;
    }

    // FIX 1: no digits in distractor pool
    function collectDistractors(targetWords) {
        const targetSet = new Set(targetWords);
        const words     = [];

        for (const ch of sightWordChars) {
            if (!targetSet.has(ch)) words.push(ch);
        }
        for (const s of allSentences) {
            if (s === currentSentence) continue;
            for (const w of parseWords(s.words || '')) {
                if (!targetSet.has(w)) words.push(w);
            }
        }
        for (const ch of DISTRACTOR_POOL) {
            if (!targetSet.has(ch)) words.push(ch);
        }

        return Array.from(new Set(
            words.filter(ch => ch.length === 1 && !/[0-9０-９]/.test(ch))
        ));
    }

    function pickDistractor(pool) {
        if (pool.length === 0) return '好';
        return pool[Math.floor(Math.random() * pool.length)];
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER GRID
    //  FIX 2: no special colour or icon for the start cell
    // ═══════════════════════════════════════════════════════════
    function renderGrid(rows, cols, total) {
        const grid = document.getElementById('maze-grid');
        grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
        grid.innerHTML = '';
        clearPathSVG();

        for (let i = 0; i < total; i++) {
            const meta = cellMeta[i];
            const cell = document.createElement('button');
            cell.className = 'maze-cell';
            cell.dataset.index = i;
            cell.textContent = meta.word;
            cell.setAttribute('aria-label', meta.word);
            cell.setAttribute('role', 'gridcell');

            // FIX 2: only mark the END cell — no start-cell class / no star icon
            if (meta.isPath && meta.pathIdx === wordList.length - 1) {
                cell.classList.add('end-cell');
            }

            cell.addEventListener('click', () => onCellClick(i));
            grid.appendChild(cell);
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  INTERACTION
    //  FIX 3: tapping the last-selected cell cancels it (undo)
    // ═══════════════════════════════════════════════════════════
    function onCellClick(flatIndex) {
        if (currentStep >= wordList.length) return;

        const cell = document.querySelector(`.maze-cell[data-index="${flatIndex}"]`);
        if (!cell || cell.classList.contains('done')) return;

        // FIX 3: if the player taps the most-recently selected cell, undo that step
        if (cell.classList.contains('selected')) {
            const lastIdx = clickedFlatIndices[clickedFlatIndices.length - 1];
            if (lastIdx === flatIndex) {
                cell.classList.remove('selected', 'last-selected');
                clickedFlatIndices.pop();
                currentStep--;
                removeLastPathLine();
                // re-mark the new last cell
                if (clickedFlatIndices.length > 0) {
                    const newLast = document.querySelector(
                        `.maze-cell[data-index="${clickedFlatIndices[clickedFlatIndices.length - 1]}"]`
                    );
                    if (newLast) newLast.classList.add('last-selected');
                }
                updateProgress();
                hideHintPanel();
            }
            return;
        }

        // Remove last-selected highlight from previous cell
        if (clickedFlatIndices.length > 0) {
            const prevCell = document.querySelector(
                `.maze-cell[data-index="${clickedFlatIndices[clickedFlatIndices.length - 1]}"]`
            );
            if (prevCell) prevCell.classList.remove('last-selected');

            drawPathLine(clickedFlatIndices[clickedFlatIndices.length - 1], flatIndex);
        }

        cell.classList.add('selected', 'last-selected');
        clickedFlatIndices.push(flatIndex);
        currentStep++;
        updateProgress();

        if (currentStep === wordList.length) {
            // Remove last-selected highlight before checking
            cell.classList.remove('last-selected');

            const assembled = clickedFlatIndices.map(i => cellMeta[i].word).join('');
            const correct   = wordList.join('');

            if (assembled === correct) {
                clickedFlatIndices.forEach(i => {
                    const c = document.querySelector(`.maze-cell[data-index="${i}"]`);
                    if (c) { c.classList.remove('selected'); c.classList.add('done'); }
                });
                onComplete();
            } else {
                showWrongHint();
            }
        }
    }

    // ═══════════════════════════════════════════════════════════
    //  PROGRESS
    // ═══════════════════════════════════════════════════════════
    function updateProgress() {
        const n   = wordList.length;
        const pct = n > 0 ? Math.round((currentStep / n) * 100) : 0;
        document.getElementById('progress-bar').style.width      = pct + '%';
        document.getElementById('progress-text').textContent     = t.progress(currentStep, n);
    }

    // ═══════════════════════════════════════════════════════════
    //  FIREWORKS (every 10 sentences)
    // ═══════════════════════════════════════════════════════════
    function launchFireworks() {
        if (typeof confetti === 'undefined') return;
        [{x:0.25,y:0.35},{x:0.75,y:0.25},{x:0.5,y:0.45},{x:0.15,y:0.6},{x:0.85,y:0.55}]
            .forEach(({x,y}, i) => setTimeout(() => confetti({
                particleCount: 180, spread: 120, startVelocity: 45,
                origin: {x,y},
                colors: ['#f3b236','#2ecc71','#e74c3c','#3498db','#9b59b6','#ff6b6b','#fff'],
                ticks: 200,
            }), i * 280));
    }

    // ═══════════════════════════════════════════════════════════
    //  COMPLETION
    // ═══════════════════════════════════════════════════════════
    function onComplete() {
        const fullSentence = wordList.join('') + (currentSentence.punctuation || '');
        try { MECC_AUDIO.readText(fullSentence); } catch(e) {}
        try { MECC_AUDIO.playSfx('tada'); }       catch(e) {}
        try { MECC_UI.fireConfetti('normal'); }    catch(e) {}

        document.getElementById('success-sentence').textContent = '🎊 ' + fullSentence;
        document.getElementById('success-panel').style.display  = 'flex';

        scoreCount++;
        document.getElementById('score-count').textContent = scoreCount;
        if (scoreCount % 10 === 0) launchFireworks();

        updateProgress();
    }

    function hideSuccessPanel() {
        document.getElementById('success-panel').style.display = 'none';
    }

    function hideHintPanel() {
        if (hintResetTimer) { clearTimeout(hintResetTimer); hintResetTimer = null; }
        document.getElementById('hint-panel').style.display = 'none';
    }

    function showWrongHint() {
        hideHintPanel();
        document.getElementById('hint-panel').textContent    = t.wrongHint();
        document.getElementById('hint-panel').style.display  = 'flex';
        hintResetTimer = setTimeout(() => {
            hideHintPanel();
            resetSelections();
        }, 2000);
    }

    function resetSelections() {
        clickedFlatIndices.forEach(i => {
            const cell = document.querySelector(`.maze-cell[data-index="${i}"]`);
            if (cell) cell.classList.remove('selected', 'last-selected');
        });
        clickedFlatIndices = [];
        currentStep = 0;
        clearPathSVG();
        updateProgress();
    }

    // ═══════════════════════════════════════════════════════════
    //  SVG PATH LINES
    // ═══════════════════════════════════════════════════════════
    function clearPathSVG() {
        const svg = document.getElementById('path-svg');
        if (svg) svg.innerHTML = '';
    }

    // FIX 3: remove just the last line segment (for undo)
    function removeLastPathLine() {
        const svg = document.getElementById('path-svg');
        if (svg && svg.lastChild) svg.removeChild(svg.lastChild);
    }

    function drawPathLine(fromIdx, toIdx) {
        const svg = document.getElementById('path-svg');
        if (!svg) return;
        const fromCell = document.querySelector(`.maze-cell[data-index="${fromIdx}"]`);
        const toCell   = document.querySelector(`.maze-cell[data-index="${toIdx}"]`);
        if (!fromCell || !toCell) return;

        const svgRect  = svg.getBoundingClientRect();
        const fromRect = fromCell.getBoundingClientRect();
        const toRect   = toCell.getBoundingClientRect();

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', fromRect.left - svgRect.left + fromRect.width  / 2);
        line.setAttribute('y1', fromRect.top  - svgRect.top  + fromRect.height / 2);
        line.setAttribute('x2', toRect.left   - svgRect.left + toRect.width    / 2);
        line.setAttribute('y2', toRect.top    - svgRect.top  + toRect.height   / 2);
        svg.appendChild(line);
    }

    // ═══════════════════════════════════════════════════════════
    //  PEEK  (FIX 5: one use per sentence, then button disabled)
    // ═══════════════════════════════════════════════════════════
    function peekSentence() {
        if (!currentSentence || peekUsed) return;

        peekUsed = true;
        disablePeekButton();

        const fullSentence = wordList.join('') + (currentSentence.punctuation || '');
        const panel = document.getElementById('peek-panel');
        panel.textContent    = fullSentence;
        panel.style.display  = 'block';

        if (peekTimer) clearTimeout(peekTimer);
        peekTimer = setTimeout(hidePeek, 5000);
    }

    function disablePeekButton() {
        const btn = document.getElementById('btn-peek');
        btn.disabled = true;
        document.getElementById('btn-peek-text').textContent = t.peekUsed;
    }

    function resetPeekButton() {
        const btn = document.getElementById('btn-peek');
        btn.disabled = false;
        document.getElementById('btn-peek-text').textContent = t.peekBtn;
    }

    function hidePeek() {
        if (peekTimer) { clearTimeout(peekTimer); peekTimer = null; }
        document.getElementById('peek-panel').style.display = 'none';
    }

    // ═══════════════════════════════════════════════════════════
    //  LOADING / ERROR UI
    // ═══════════════════════════════════════════════════════════
    function hideLoading() {
        document.getElementById('loading-overlay').style.display = 'none';
        const retryBtn = document.getElementById('retry-load-btn');
        if (retryBtn) retryBtn.style.display = 'none';
    }

    function showError(msg, options = {}) {
        const { canRetry = false } = options;
        const overlay = document.getElementById('loading-overlay');
        const spinner = overlay.querySelector('.spinner');
        const retryBtn = document.getElementById('retry-load-btn');
        if (spinner) spinner.style.display = 'none';
        if (retryBtn) retryBtn.style.display = canRetry ? 'inline-flex' : 'none';
        document.getElementById('loading-msg').textContent = msg;
        overlay.style.display = 'flex';
    }

    function retryLoadSentences() {
        if (isLoadingSentences) return;
        const overlay = document.getElementById('loading-overlay');
        const spinner = overlay.querySelector('.spinner');
        const retryBtn = document.getElementById('retry-load-btn');
        if (spinner) spinner.style.display = 'block';
        if (retryBtn) retryBtn.style.display = 'none';
        document.getElementById('loading-msg').textContent = t.retrying;
        loadAllSentences();
    }

    </script>
