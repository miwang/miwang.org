<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>写字大挑战 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --kaiti-font: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
        }

        body, html { background-color: #f8f9fa; margin: 0; padding: 0; height: 100dvh; width: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; font-family: var(--kaiti-font) !important; }
        
        .nav-top { 
            width: 100%; background: #598586; padding: 0 20px; 
            height: 56px; box-sizing: border-box; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
            border-bottom: 5px solid #f3b236;
        }
        .nav-top a { color: #fff; text-decoration: none; font-weight: 700; font-size: 1rem; font-family: var(--kaiti-font) !important; white-space: nowrap; }
        @media (max-width: 768px) {
            .nav-top { height: 56px; }
            .nav-top a { font-size: 0.9rem; }
            .stars-display { font-size: 1.5rem; }
            .progress-box { width: 85vw; }
            .btn { padding: 10px 36px; white-space: nowrap; }
        }
        
        .challenge-info { display: flex; flex-direction: column; align-items: center; padding: 10px 0; flex-shrink: 0; }
        .stars-display { font-size: 1.4rem; color: #f3b236; margin-bottom: 5px; letter-spacing: 2px; }
        .progress-box { width: 280px; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin-bottom: 5px; }
        .bar-fill { width: 0%; height: 100%; background: #f3b236; transition: width 0.3s; }
        
        #writer-container { border: 6px solid #598586; border-radius: 20px; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.15); touch-action: none; }
        
        .btn { padding: 10px 30px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 1rem; font-family: var(--kaiti-font) !important; }
        
        #final-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 46, 70, 0.98); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; text-align: center; }
        #final-overlay h2 { font-family: var(--kaiti-font) !important; font-size: 2.5rem; }

        /* ── 桌面端左右布局 ── */
        @media (min-width: 769px) {
            body { flex-direction: row; flex-wrap: wrap; align-items: stretch; justify-content: center; }
            
            .nav-top { width: 100%; flex-shrink: 0; order: 0; }

            #writer-container { 
                order: 1; flex-shrink: 0; align-self: center;
                margin: 20px 30px 20px 40px;
            }

            .right-panel {
                order: 2; flex: 1; min-width: 220px; max-width: 340px;
                display: flex; flex-direction: column; 
                align-items: center; justify-content: center;
                gap: 20px; padding: 20px 30px 20px 0;
            }

            /* 在桌面端隐藏原来的独立元素，移入 right-panel */
            .challenge-info { display: none; }
            #msg { display: none; }
            .controls { display: none; }

            .right-panel .stars-display { font-size: 1.6rem; letter-spacing: 4px; }
            .right-panel .progress-box { width: 100%; height: 12px; }
            .right-panel .char-label { font-size: 1.2rem; }
            .right-panel .char-label span { font-size: 2.8rem; }
            .right-panel #msg-desktop { 
                color: #598586; font-weight: bold; font-size: 1.1rem; 
                text-align: center;
            }
            .right-panel .btn { 
                padding: 12px 40px; font-size: 1.1rem; width: 100%;
            }
        }
        </style>
</head>
<body>
    <nav class="nav-top">
        <a id="back-link" href="words_and_phrases_zh.html">⬅️ 返回</a>
        <span style="color: white; font-weight: bold; letter-spacing: 1px;">写字大挑战</span>
        <div style="width: 40px;"></div>
    </nav>

    <div class="challenge-info">
        <div class="stars-display" id="stars">⚪⚪⚪⚪⚪⚪⚪⚪⚪⚪</div>
        <div class="progress-box"><div class="bar-fill" id="progress-bar"></div></div>
        <div style="color:#598586; font-weight:bold;">请写生字：<span id="char-display" style="font-size: 2.5rem; color:#e74c3c; font-family: var(--kaiti-font) !important;"></span></div>
    </div>

    <div id="writer-container"></div>

    <!-- 桌面端右侧面板 -->
    <div class="right-panel" id="right-panel" style="display:none;">
        <div style="color:#598586;font-weight:bold;font-size:1.2rem;">请写生字：<span id="char-label-desktop" style="font-size:2.8rem;color:#e74c3c;font-family:var(--kaiti-font)!important;"></span></div>
        <div class="stars-display" id="stars-desktop">⚪⚪⚪⚪⚪⚪⚪⚪⚪⚪</div>
        <div class="progress-box" style="width:100%;height:12px;"><div class="bar-fill" id="progress-bar-desktop"></div></div>
        <div id="msg-desktop" style="color:#598586;font-weight:bold;font-size:1.1rem;">等一下...</div>
        <button class="btn" style="background:#598586;" onclick="showDemo()">播放笔顺</button>
    </div>

    <div id="msg" style="margin-top:10px; height:24px; color:#598586; font-weight:bold;">等一下...</div>
    <div class="controls" style="margin-top:15px;">
        <button class="btn" style="background:#598586;" onclick="showDemo()">播放笔顺</button>
    </div>

    <div id="final-overlay">
        <div style="font-size:8rem;">🏆</div>
        <h2>太棒了！</h2>
        <p>你今天已经完全掌握了这个字！</p>
        <button class="btn" id="finish-btn" style="background: #f3b236; margin-top: 30px; color: #1e2e46;">完成练习</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const charToDraw = urlParams.get('char') || '天';
        const from = urlParams.get('from');
        document.getElementById('char-display').innerText = charToDraw;

        const backBtn = document.getElementById('back-link');
        const finishBtn = document.getElementById('finish-btn');
        
        // 🌟 返回逻辑修正：由于在同一个文件夹，不需要 ../
        let backUrl = "words_and_phrases_zh.html"; 
        
        if (from === 'detail') {
            backUrl = `word_detail_zh.html?char=${encodeURIComponent(charToDraw)}`;
            backBtn.innerText = `⬅️ 返回 "${charToDraw}" 详情页`;
        } else {
            backBtn.innerText = `⬅️ 返回列表`;
        }
        
        backBtn.href = backUrl;
        finishBtn.onclick = () => { location.href = backUrl; };

        let count = 0;
        const isMobile = window.innerWidth <= 768;
        const navH = 56;
        const infoH = isMobile ? 100 : 90;
        const ctrlH = isMobile ? 80 : 100;
        const reservedH = navH + infoH + ctrlH;
        const maxByHeight = window.innerHeight - reservedH;
        const maxByWidth = window.innerWidth * (isMobile ? 0.92 : 0.78);
        const wSize = Math.min(maxByHeight, maxByWidth, isMobile ? 420 : 520);
        const writer = HanziWriter.create('writer-container', charToDraw, {
            width: wSize,
            height: wSize,
            padding: 25,
            strokeColor: '#598586',
            outlineColor: '#c8dede',
            highlightColor: '#f3b236',
            strokeAnimationSpeed: 0.7,
            delayBetweenStrokes: 400,
            showHintAfterMisses: 1,
            highlightOnComplete: true
        });

        function showDemo() {
            syncUI("⚪".repeat(10), 0, "等一下...");
            writer.animateCharacter({
                onComplete: () => {
                    syncUI("⚪".repeat(10), 0, "该你了！");
                    writer.quiz({
                        onComplete: () => {
                            count++;
                            document.getElementById('progress-bar').style.width = (count*10) + "%";
                            document.getElementById('stars').innerText = "⭐".repeat(count) + "⚪".repeat(10-count);
                            if (count < 10) {
                                confetti({ particleCount: 60, spread: 50, origin: { y: 0.7 } });
                                setTimeout(() => writer.quiz(), 800);
                            } else {
                                saveProgress();
                                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                                document.getElementById('final-overlay').style.display = 'flex';
                            }
                        }
                    });
                }
            });
        }

        function saveProgress() {
            const progress = JSON.parse(localStorage.getItem('mecc_progress') || '{}');
            progress[charToDraw] = 'completed';
            localStorage.setItem('mecc_progress', JSON.stringify(progress));
        }

        function startQuiz() {
            writer.quiz({
                onComplete: () => {
                    count++;
                    syncUI("⭐".repeat(count) + "⚪".repeat(10-count), count*10, count < 10 ? "该你了！" : "太棒了！");
                    
                    if (count < 10) {
                        confetti({ particleCount: 60, spread: 50, origin: { y: 0.7 } });
                        setTimeout(() => writer.quiz(), 800);
                    } else {
                        saveProgress();
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        document.getElementById('final-overlay').style.display = 'flex';
                    }
                }
            });
        }

        function isDesktop() { return window.innerWidth > 768; }
        function syncUI(starsText, progressPct, msgText) {
            document.getElementById('stars').innerText = starsText;
            document.getElementById('progress-bar').style.width = progressPct + '%';
            document.getElementById('msg').innerText = msgText;
            const sd = document.getElementById('stars-desktop');
            const pb = document.getElementById('progress-bar-desktop');
            const md = document.getElementById('msg-desktop');
            if (sd) sd.innerText = starsText;
            if (pb) pb.style.width = progressPct + '%';
            if (md) md.innerText = msgText;
        }
        function initDesktopPanel() {
            if (!isDesktop()) return;
            document.getElementById('right-panel').style.display = 'flex';
            const lbl = document.getElementById('char-label-desktop');
            if (lbl) lbl.innerText = charToDraw;
        }

        window.onload = () => {
            initDesktopPanel();
            syncUI("⚪".repeat(10), 0, "等一下...");
            writer.animateCharacter({
                onComplete: () => {
                    syncUI("⚪".repeat(10), 0, "该你了！");
                    startQuiz();
                }
            });
        };
    </script>
</body>
</html>
