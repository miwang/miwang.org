<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>写字大挑战 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --kaiti-font: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
        }

        body, html { background-color: #f8f9fa; margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; font-family: var(--kaiti-font) !important; }
        
        .nav-top { 
            width: 100%; background: #1e2e46; padding: 0 25px; 
            height: 64px; min-height: 64px; box-sizing: border-box; 
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; 
        }
        .nav-top a { color: #f3b236; text-decoration: none; font-weight: 700; font-size: 1rem; font-family: var(--kaiti-font) !important; }
        
        .challenge-info { display: flex; flex-direction: column; align-items: center; padding: 10px 0; flex-shrink: 0; }
        .stars-display { font-size: 1.4rem; color: #f3b236; margin-bottom: 5px; letter-spacing: 2px; }
        .progress-box { width: 280px; height: 10px; background: #e0e0e0; border-radius: 5px; overflow: hidden; margin-bottom: 5px; }
        .bar-fill { width: 0%; height: 100%; background: #f3b236; transition: width 0.3s; }
        
        #writer-container { border: 6px solid #598586; border-radius: 20px; background: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.15); touch-action: none; }
        
        .btn { padding: 10px 30px; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 1rem; font-family: var(--kaiti-font) !important; }
        
        #final-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(30, 46, 70, 0.98); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; text-align: center; }
        #final-overlay h2 { font-family: var(--kaiti-font) !important; font-size: 2.5rem; }
    </style>
</head>
<body>
    <nav class="nav-top">
        <a id="back-link" href="words_and_phrases_zh.html">⬅️ 返回</a>
        <span style="color: white; font-weight: bold; letter-spacing: 1px;">写字大挑战</span>
        <div style="width: 40px;"></div>
    </nav>

    <div class="challenge-info">
        <div class="stars-display" id="stars">⚪⚪⚪⚪⚪⚪⚪⚪⚪⚪</div>
        <div class="progress-box"><div class="bar-fill" id="progress-bar"></div></div>
        <div style="color:#598586; font-weight:bold;">请写生字：<span id="char-display" style="font-size: 2.5rem; color:#e74c3c; font-family: var(--kaiti-font) !important;"></span></div>
    </div>

    <div id="writer-container"></div>
    <div id="msg" style="margin-top:10px; height:24px; color:#598586; font-weight:bold;">请稍候...</div>

    <div class="controls" style="margin-top:15px;">
        <button class="btn" style="background:#598586;" onclick="writer.animateCharacter()">看演示</button>
    </div>

    <div id="final-overlay">
        <div style="font-size:8rem;">🏆</div>
        <h2>太棒了！</h2>
        <p>你今天已经完全掌握了这个字！</p>
        <button class="btn" id="finish-btn" style="background: #f3b236; margin-top: 30px; color: #1e2e46;">完成练习</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const charToDraw = urlParams.get('char') || '天';
        const from = urlParams.get('from');
        document.getElementById('char-display').innerText = charToDraw;

        const backBtn = document.getElementById('back-link');
        const finishBtn = document.getElementById('finish-btn');
        
        // 🌟 返回逻辑修正：由于在同一个文件夹，不需要 ../
        let backUrl = "words_and_phrases_zh.html"; 
        
        if (from === 'detail') {
            backUrl = `word_detail_zh.html?char=${encodeURIComponent(charToDraw)}`;
            backBtn.innerText = `⬅️ 返回 "${charToDraw}" 详情页`;
        } else {
            backBtn.innerText = `⬅️ 返回列表`;
        }
        
        backBtn.href = backUrl;
        finishBtn.onclick = () => { location.href = backUrl; };

        let count = 0;
        const writer = HanziWriter.create('writer-container', charToDraw, {
            width: Math.min(window.innerWidth * 0.9, 500),
            height: Math.min(window.innerHeight * 0.45, 500),
            padding: 25,
            strokeColor: '#598586',
            showHintAfterMisses: 2
        });

        function saveProgress() {
            const progress = JSON.parse(localStorage.getItem('mecc_progress') || '{}');
            progress[charToDraw] = 'completed';
            localStorage.setItem('mecc_progress', JSON.stringify(progress));
        }

        function startQuiz() {
            writer.quiz({
                onComplete: () => {
                    count++;
                    document.getElementById('progress-bar').style.width = (count*10) + "%";
                    document.getElementById('stars').innerText = "⭐".repeat(count) + "⚪".repeat(10-count);
                    
                    if (count < 10) {
                        confetti({ particleCount: 60, spread: 50, origin: { y: 0.7 } });
                        setTimeout(() => writer.quiz(), 800);
                    } else {
                        saveProgress();
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                        document.getElementById('final-overlay').style.display = 'flex';
                    }
                }
            });
        }

        window.onload = () => {
            writer.animateCharacter({
                onComplete: () => {
                    document.getElementById('msg').innerText = "该你了！";
                    startQuiz();
                }
            });
        };
    </script>
</body>
</html>
