<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一样 · 不一样</title>
<style>
@font-face {
  font-family: 'LXGWWenKai';
  src: url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.woff2') format('woff2');
  font-weight: normal;
}
@font-face {
  font-family: 'LXGWWenKai';
  src: url('https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.woff2') format('woff2');
  font-weight: bold;
}

:root {
  --orange: #FF6B35;
  --mint:   #4ECDC4;
  --yellow: #FFD93D;
  --purple: #A855F7;
  --sky:    #38BDF8;
  --green:  #22C55E;
  --pink:   #FF6B9D;
  --coral:  #FF8B8B;
  --teal:   #2d6a6a;
  --bg:     #f2f9f8;
  --fn:     'LXGWWenKai','KaiTi','楷体','STKaiti',serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100vh;
  overflow: hidden;
  font-family: var(--fn);
  background: var(--bg);
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle, #4ECDC428 2px, transparent 2px),
    radial-gradient(circle, #FFD93D28 2px, transparent 2px);
  background-size: 38px 38px, 58px 58px;
  background-position: 0 0, 19px 19px;
  pointer-events: none; z-index: 0;
}

/* ── SHELL ── */
#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ── HEADER ── */
header {
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0 5px;
}

.title-pill {
  display: flex; align-items: center; gap: 8px;
  background: white; border-radius: 50px;
  padding: 5px 22px 5px 18px;
  box-shadow: 0 3px 0 var(--teal), 0 5px 14px #0001;
  border: 2px solid #c5e4e0;
}
.t-same { font-size: 30px; font-weight: bold; color: var(--mint); }
.t-sep  { font-size: 18px; color: #ddd; }
.t-diff { font-size: 30px; font-weight: bold; color: var(--orange); }

/* page indicator dots */
.dots {
  display: flex; gap: 6px; align-items: center;
}
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: #cde8e5; transition: all .25s; cursor: pointer;
}
.dot.active { background: var(--teal); transform: scale(1.35); }
.dot.done   { background: var(--mint); }

/* ── TABS (now a row of small pills) ── */
nav {
  flex-shrink: 0;
  display: flex; justify-content: center; gap: 6px;
  padding: 4px 0 6px;
  flex-wrap: wrap;
}

.tab {
  font-family: var(--fn); font-size: 13px;
  padding: 5px 14px; border-radius: 50px;
  border: 2px solid transparent;
  cursor: pointer; background: white; color: #777;
  box-shadow: 0 2px 6px #0001;
  transition: all .2s; white-space: nowrap;
}
.tab:hover { transform: translateY(-1px); background: #e8f7f5; }
.tab.active {
  background: var(--teal); color: white;
  border-color: var(--teal);
  box-shadow: 0 3px 0 #1a3d3d;
}

/* ── CONTENT ── */
.content { flex: 1; overflow: hidden; position: relative; }

.panel {
  display: none; position: absolute; inset: 0;
  animation: fadeUp .3s ease;
}
.panel.active { display: flex; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

/* ── PREV / NEXT nav arrows within each panel ── */
.pnav {
  position: absolute; bottom: 10px; right: 0;
  display: flex; gap: 8px; z-index: 10;
}
.pnav button {
  font-family: var(--fn); font-size: 14px;
  padding: 6px 18px; border-radius: 50px;
  border: 2px solid var(--teal); background: white; color: var(--teal);
  cursor: pointer; box-shadow: 0 3px 0 var(--teal);
  transition: all .18s;
}
.pnav button:hover { background: var(--teal); color: white; transform: translateY(-1px); }
.pnav button:disabled { opacity: .3; cursor: default; pointer-events: none; }

/* ═══════════════════════
   LAYOUT HELPERS
═══════════════════════ */
.center-col {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; gap: 16px; padding-bottom: 44px;
}
.center-row {
  display: flex; flex-direction: row;
  align-items: center; justify-content: center;
  width: 100%; gap: 24px; padding-bottom: 44px;
}

/* big word display */
.big-word {
  font-size: 90px; font-weight: bold; line-height: 1;
  padding: 18px 44px; border-radius: 28px;
  cursor: pointer; transition: transform .2s;
  user-select: none;
}
.big-word:hover { transform: scale(1.06) rotate(-1deg); }
.big-word:active { transform: scale(.96); }
.bw-same { background: linear-gradient(135deg,#ccfbf5,#a5f3ee); color:#0e9488; box-shadow:0 7px 0 var(--mint); border:3px solid var(--mint); }
.bw-diff { background: linear-gradient(135deg,#ffe2cf,#ffcba5); color:#c2410c; box-shadow:0 7px 0 var(--orange); border:3px solid var(--orange); }

.tap-hint { font-size: 16px; color: #bbb; margin-top: -8px; }

/* sentence display */
.sentence-box {
  background: white; border-radius: 20px;
  padding: 18px 32px; font-size: 28px; color: #444;
  box-shadow: 0 4px 16px #0001; border: 2.5px solid #c5e4e0;
  text-align: center; line-height: 1.7;
  max-width: 640px; width: 100%;
}
.sentence-box .kw  { color: var(--orange); font-weight: bold; }
.sentence-box .kw2 { color: var(--mint);   font-weight: bold; }

/* image-style emoji pair */
.pair-card {
  background: white; border-radius: 24px;
  padding: 24px 28px; text-align: center;
  box-shadow: 0 5px 18px #0001; border: 2.5px solid #e5d8c8;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: transform .2s;
}
.pair-card:hover { transform: rotate(-1.5deg) scale(1.03); }
.pair-card .pe { font-size: 72px; line-height: 1; }
.pair-card .pl { font-size: 17px; color: #777; }

.vs-badge {
  background: var(--yellow); border-radius: 50%;
  width: 52px; height: 52px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 21px; font-weight: bold;
  box-shadow: 0 4px 0 #e8b800;
}

/* label banner */
.label-banner {
  font-size: 44px; font-weight: bold;
  padding: 8px 36px; border-radius: 50px;
}
.lb-same { color: #0e9488; background: #ccfbf5; border: 2.5px solid var(--mint); }
.lb-diff { color: #c2410c; background: #ffe2cf; border: 2.5px solid var(--orange); }

/* apple row */
.apple-row { display: flex; gap: 10px; align-items: center; }
.apple { font-size: 62px; transition: transform .2s; cursor: default; }
.apple:hover { transform: scale(1.12); }

/* ═══════════════════════
   COMPARE GAME
═══════════════════════ */
.cmp-wrap {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  width: 100%; gap: 12px; padding-bottom: 44px;
}
.score-row { display:flex; gap:18px; align-items:center; font-size:15px; color:#999; }
.stars { font-size:20px; letter-spacing:2px; }

.cmp-pair { display:flex; align-items:center; gap:20px; }
.cmp-item {
  background:white; border-radius:22px; padding:22px 26px;
  text-align:center; box-shadow:0 5px 16px #0001; border:2.5px solid #e5d8c8;
  min-width:130px;
}
.cmp-emoji { font-size:68px; display:block; }
.cmp-label { font-size:17px; color:#777; margin-top:6px; }

.feedback { font-size:30px; min-height:42px; text-align:center; }
.ans-row { display:flex; gap:14px; }
.ans-btn {
  font-family:var(--fn); font-size:21px;
  padding:12px 32px; border-radius:50px; border:2.5px solid;
  cursor:pointer; font-weight:bold; transition:all .2s;
}
.same-btn { background:#ccfbf5; border-color:var(--mint);   color:#0e9488; }
.diff-btn { background:#ffe2cf; border-color:var(--orange);  color:#c2410c; }
.ans-btn:hover { transform:scale(1.06); }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
@keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* ═══════════════════════
   MATCH GAME
═══════════════════════ */
.match-wrap {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%; gap:10px; padding-bottom:44px;
}
.match-board {
  display:grid; grid-template-columns:repeat(4,1fr);
  gap:10px; width:100%; max-width:500px;
}
.mcard {
  aspect-ratio:1; background:var(--teal); border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  font-size:38px; cursor:pointer; border:2.5px solid #1a4040;
  box-shadow:0 5px 0 #123030; transition:all .18s; user-select:none;
  position:relative; overflow:hidden;
}
.mcard::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#fff2,transparent);pointer-events:none;}
.mcard.flipped  { background:white; border-color:#e5e7eb; box-shadow:0 5px 0 #d1d5db; }
.mcard.matched  { background:linear-gradient(135deg,#ccfbf5,#a5f3ee); border-color:var(--mint); box-shadow:0 5px 0 var(--mint); animation:mpop .4s; }
@keyframes mpop { 0%{transform:scale(1)} 50%{transform:scale(1.14)} 100%{transform:scale(1)} }
.mcard .cb{display:block;} .mcard .ch{display:none;}
.mcard.flipped .cb,.mcard.matched .cb{display:none;}
.mcard.flipped .ch,.mcard.matched .ch{display:block;}
.match-hint { font-size:15px; color:#aaa; }
.match-status { font-size:19px; color:#666; min-height:28px; }

/* ═══════════════════════
   SORT GAME
═══════════════════════ */
.sort-wrap {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:100%; gap:10px; padding-bottom:44px;
}
.sort-pool {
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  background:white; border-radius:16px; padding:10px 16px;
  box-shadow:0 3px 10px #0001; max-width:680px; width:100%;
}
.schip {
  font-family:var(--fn); padding:7px 14px; background:white;
  border-radius:50px; border:2.5px solid #e2e8f0; cursor:grab;
  user-select:none; box-shadow:0 3px 0 #cbd5e1; text-align:center;
  line-height:1.4; transition:transform .15s; font-size:15px;
}
.schip:active{cursor:grabbing;transform:scale(1.1) rotate(-3deg);}
.schip.placed{opacity:.35;pointer-events:none;}
.sort-cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:680px; }
.sbucket { border-radius:18px; padding:10px 12px; border:3.5px dashed; transition:background .2s; }
.sbucket.sb-same{border-color:var(--mint);background:#f0fffe;}
.sbucket.sb-diff{border-color:var(--orange);background:#fff5ef;}
.sbucket.drag-over{background:#fffbe0;border-style:solid;}
.btitle { font-size:30px; font-weight:bold; text-align:center; margin-bottom:6px; padding-bottom:6px; border-bottom:2px solid #eee; }
.sbucket.sb-same .btitle{color:#0e9488;} .sbucket.sb-diff .btitle{color:#c2410c;}
.bitems{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:48px;}
.sort-msg{font-size:18px;color:#666;min-height:24px;text-align:center;}

/* reset btn */
.reset-btn {
  font-family:var(--fn); font-size:14px; padding:7px 22px; border-radius:50px;
  background:white; border:2px solid var(--teal); color:var(--teal);
  cursor:pointer; box-shadow:0 3px 0 var(--teal); transition:all .18s;
}
.reset-btn:hover{background:var(--teal);color:white;transform:translateY(-1px);}

/* celebrate */
.celebrate{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:72px;z-index:999;pointer-events:none;animation:cAnim 1.2s forwards;
}
@keyframes cAnim{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.4);}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-85%) scale(.8);}
}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header>
    <div class="title-pill">
      <span class="t-same">一样</span>
      <span class="t-sep">·</span>
      <span class="t-diff">不一样</span>
    </div>
    <div class="dots" id="dots"></div>
  </header>

  <!-- TABS -->
  <nav id="nav"></nav>

  <!-- CONTENT -->
  <div class="content" id="content"></div>

</div>

<script>
// ══════════════════════════════════════════════════════
//  PAGE DEFINITIONS
// ══════════════════════════════════════════════════════
const PAGES = [

  // ── 1. 认识"一样" ──
  { tab:'📖 一样', build: () => `
    <div class="center-col">
      <div class="big-word bw-same" onclick="speak('一样')">一样</div>
      <div class="tap-hint">👆 点我听一听</div>
    </div>
  `},

  // ── 2. 认识"不一样" ──
  { tab:'📖 不一样', build: () => `
    <div class="center-col">
      <div class="big-word bw-diff" onclick="speak('不一样')">不一样</div>
      <div class="tap-hint">👆 点我听一听</div>
    </div>
  `},

  // ── 3. 一样的苹果 ──
  { tab:'🍏 苹果①', build: () => `
    <div class="center-col">
      <div class="label-banner lb-same">一样的苹果</div>
      <div class="apple-row">
        <span class="apple" title="绿苹果">🍏</span>
        <span class="apple" title="绿苹果">🍏</span>
        <span class="apple" title="绿苹果">🍏</span>
      </div>
      <div class="sentence-box">
        这三个苹果的颜色<span class="kw2">一样</span>。
      </div>
    </div>
  `},

  // ── 4. 不一样的苹果 ──
  { tab:'🍎 苹果②', build: () => `
    <div class="center-col">
      <div class="label-banner lb-diff">不一样的苹果</div>
      <div class="apple-row">
        <span class="apple">🍏</span>
        <span class="apple">🍋</span>
        <span class="apple">🍎</span>
      </div>
      <div class="sentence-box">
        这三个苹果的颜色<span class="kw">不一样</span>。
      </div>
    </div>
  `},

  // ── 5. 我和哥哥一样 ──
  { tab:'👦 哥哥', build: () => `
    <div class="center-row">
      <div class="pair-card"><span class="pe">👦</span><span class="pl">我</span></div>
      <div class="pair-card"><span class="pe">👦</span><span class="pl">哥哥</span></div>
    </div>
    <div style="position:absolute;bottom:60px;width:100%;display:flex;justify-content:center">
      <div class="sentence-box">我和哥哥<span class="kw2">一样</span>。</div>
    </div>
  `},

  // ── 6. 我和姐姐不一样 ──
  { tab:'👧 姐姐', build: () => `
    <div class="center-row">
      <div class="pair-card"><span class="pe">👦</span><span class="pl">我</span></div>
      <div class="vs-badge" style="flex-shrink:0">比</div>
      <div class="pair-card"><span class="pe">👧</span><span class="pl">姐姐</span></div>
    </div>
    <div style="position:absolute;bottom:60px;width:100%;display:flex;justify-content:center">
      <div class="sentence-box">我和姐姐<span class="kw">不一样</span>。</div>
    </div>
  `},

  // ── 7. 衣服一样，鞋子不一样 ──
  { tab:'👗 衣服', build: () => `
    <div class="center-row">
      <div class="pair-card"><span class="pe">👗</span><span class="pl">我的衣服</span></div>
      <div class="pair-card"><span class="pe">👗</span><span class="pl">妈妈的衣服</span></div>
    </div>
    <div style="position:absolute;bottom:60px;width:100%;display:flex;justify-content:center">
      <div class="sentence-box">
        我和妈妈的衣服<span class="kw2">一样</span>，鞋子<span class="kw">不一样</span>。
      </div>
    </div>
  `},

  // ── 8. 我们不一样 ──
  { tab:'👫 我们', build: () => `
    <div class="center-row" style="gap:12px;flex-wrap:wrap">
      <div class="pair-card"><span class="pe">👦</span></div>
      <div class="pair-card"><span class="pe">👧</span></div>
      <div class="pair-card"><span class="pe">👶</span></div>
      <div class="pair-card"><span class="pe">🧒</span></div>
    </div>
    <div style="position:absolute;bottom:60px;width:100%;display:flex;justify-content:center">
      <div class="sentence-box">我们<span class="kw">不一样</span>。</div>
    </div>
  `},

  // ── 9. 比一比游戏 ──
  { tab:'👀 比一比', build: () => `
    <div class="cmp-wrap" id="cmpRoot">
      <div class="score-row">
        <span>得分：<strong id="scoreNum">0</strong></span>
        <span class="stars" id="starRow">☆☆☆☆☆</span>
        <span>第 <strong id="qNum">1</strong> 题</span>
      </div>
      <div class="cmp-pair">
        <div class="cmp-item"><span class="cmp-emoji" id="itemA"></span><div class="cmp-label" id="labelA"></div></div>
        <div class="vs-badge">比</div>
        <div class="cmp-item"><span class="cmp-emoji" id="itemB"></span><div class="cmp-label" id="labelB"></div></div>
      </div>
      <div class="feedback" id="feedbackMsg"></div>
      <div class="ans-row">
        <button class="ans-btn same-btn" onclick="checkAns(true)">一样 🟰</button>
        <button class="ans-btn diff-btn" onclick="checkAns(false)">不一样 ❌</button>
      </div>
    </div>
  `, onShow: initCompare },

  // ── 10. 配对游戏 ──
  { tab:'🃏 配对', build: () => `
    <div class="match-wrap">
      <div class="match-hint">翻开两张一样的牌，就配对成功！</div>
      <div class="match-board" id="matchBoard"></div>
      <div class="match-status" id="matchStatus"></div>
      <button class="reset-btn" onclick="initMatch()">🔄 再玩一次</button>
    </div>
  `, onShow: initMatch },

  // ── 11. 分类游戏 ──
  { tab:'🗂️ 分类', build: () => `
    <div class="sort-wrap">
      <div class="sort-pool" id="sortPool"></div>
      <div class="sort-cols">
        <div class="sbucket sb-same" ondrop="drop(event,'same')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')">
          <div class="btitle">一样 🟰</div>
          <div class="bitems" id="iSame"></div>
        </div>
        <div class="sbucket sb-diff" ondrop="drop(event,'diff')" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')">
          <div class="btitle">不一样 ❌</div>
          <div class="bitems" id="iDiff"></div>
        </div>
      </div>
      <div class="sort-msg" id="sortMsg"></div>
      <button class="reset-btn" onclick="initSort()">🔄 再做一次</button>
    </div>
  `, onShow: initSort },

];

// ══════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════
let current = 0;
const seen = new Set();

function buildNav() {
  const nav = document.getElementById('nav');
  const dotsEl = document.getElementById('dots');
  nav.innerHTML = '';
  dotsEl.innerHTML = '';
  PAGES.forEach((p, i) => {
    // tab button
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === current ? ' active' : '');
    btn.textContent = p.tab;
    btn.onclick = () => goTo(i);
    nav.appendChild(btn);
    // dot
    const d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : (seen.has(i) ? ' done' : ''));
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  });
}

function renderPanel(i) {
  const content = document.getElementById('content');
  const p = PAGES[i];
  content.innerHTML = `
    <div class="panel active" style="position:absolute;inset:0">
      ${p.build()}
      <div class="pnav">
        <button onclick="goTo(${i-1})" ${i===0?'disabled':''}>← 上一页</button>
        <button onclick="goTo(${i+1})" ${i===PAGES.length-1?'disabled':''}>下一页 →</button>
      </div>
    </div>`;
  if (p.onShow) p.onShow();
}

function goTo(i) {
  if (i < 0 || i >= PAGES.length) return;
  seen.add(current);
  current = i;
  renderPanel(i);
  buildNav();
}

// ── INIT ──
buildNav();
renderPanel(0);

// ══════════════════════════════════════════════════════
//  SPEAK
// ══════════════════════════════════════════════════════
function speak(t) {
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'zh-CN'; u.rate = .85;
  speechSynthesis.speak(u);
}

// ══════════════════════════════════════════════════════
//  COMPARE GAME (page 9)
// ══════════════════════════════════════════════════════
// Items strictly from the PDF slides
const CMP = [
  {a:'🍏',la:'绿苹果', b:'🍏',lb:'绿苹果', same:true },
  {a:'🍏',la:'绿苹果', b:'🍎',lb:'红苹果',  same:false},
  {a:'🍋',la:'黄苹果', b:'🍎',lb:'红苹果',  same:false},
  {a:'👦',la:'我',     b:'👦',lb:'哥哥',    same:true },
  {a:'👦',la:'我',     b:'👧',lb:'姐姐',    same:false},
  {a:'👗',la:'我的衣服',b:'👗',lb:'妈妈的衣服',same:true},
];
let ci=0, score=0, answered=false;

function initCompare() {
  ci=0; score=0; answered=false;
  loadCmp();
}
function loadCmp() {
  answered=false;
  const q=CMP[ci];
  document.getElementById('itemA').textContent=q.a;
  document.getElementById('labelA').textContent=q.la;
  document.getElementById('itemB').textContent=q.b;
  document.getElementById('labelB').textContent=q.lb;
  document.getElementById('feedbackMsg').textContent='';
  document.getElementById('qNum').textContent=ci+1;
}
function checkAns(isSame) {
  if(answered)return; answered=true;
  const q=CMP[ci]; const ok=(isSame===q.same);
  if(ok){score++;document.getElementById('feedbackMsg').textContent='🎉 太棒了！';speak(q.same?'一样！':'不一样！');celebrate('🌟');}
  else  {document.getElementById('feedbackMsg').textContent='再想一想 💭';speak('再想一想');}
  document.getElementById('scoreNum').textContent=score;
  const n=Math.min(5,score);
  document.getElementById('starRow').textContent='⭐'.repeat(n)+'☆'.repeat(5-n);
  setTimeout(()=>{ci=(ci+1)%CMP.length;loadCmp();},1400);
}

// ══════════════════════════════════════════════════════
//  MATCH GAME (page 10)
// ══════════════════════════════════════════════════════
const ME=['🍏','🍎','👦','👧','👗','👠','🥛','🥤'];
let flipped=[],mCount=0,canFlip=true;

function initMatch() {
  mCount=0;flipped=[];canFlip=true;
  const el=document.getElementById('matchStatus');
  if(el)el.textContent='';
  const board=document.getElementById('matchBoard');
  if(!board)return;
  board.innerHTML='';
  const pairs=[...ME,...ME].sort(()=>Math.random()-.5);
  pairs.forEach(e=>{
    const c=document.createElement('div'); c.className='mcard';
    c.dataset.e=e;
    c.innerHTML=`<span class="cb">❓</span><span class="ch">${e}</span>`;
    c.onclick=()=>flip(c); board.appendChild(c);
  });
}
function flip(c) {
  if(!canFlip||c.classList.contains('flipped')||c.classList.contains('matched'))return;
  c.classList.add('flipped'); flipped.push(c);
  if(flipped.length===2){
    canFlip=false; const[a,b]=flipped;
    if(a.dataset.e===b.dataset.e){
      a.classList.add('matched');b.classList.add('matched');
      mCount++;flipped=[];canFlip=true;speak('一样！');
      if(mCount===ME.length){
        setTimeout(()=>{
          const s=document.getElementById('matchStatus');
          if(s){s.textContent='🏆 全部找到了！太厉害！';}
          celebrate('🎊');speak('太棒了！全部找到了！');
        },400);
      }
    }else{
      speak('不一样');
      setTimeout(()=>{a.classList.remove('flipped');b.classList.remove('flipped');flipped=[];canFlip=true;},1000);
    }
  }
}

// ══════════════════════════════════════════════════════
//  SORT GAME (page 11)
// ══════════════════════════════════════════════════════
// Pairs directly from PDF: apples (same color / diff color), people (same / diff), clothing
const SI=[
  {id:'s1',emoji:'🍏🍏',label:'两个绿苹果',ok:'same'},
  {id:'s2',emoji:'🍎🍏',label:'红·绿苹果', ok:'diff'},
  {id:'s3',emoji:'👦👦',label:'我和哥哥',  ok:'same'},
  {id:'s4',emoji:'👦👧',label:'我和姐姐',  ok:'diff'},
  {id:'s5',emoji:'👗👗',label:'我们的衣服', ok:'same'},
  {id:'s6',emoji:'👗👠',label:'衣服·鞋子', ok:'diff'},
];
let sAns={};

function initSort() {
  sAns={};
  ['iSame','iDiff'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='';});
  const msg=document.getElementById('sortMsg');if(msg)msg.textContent='';
  const pool=document.getElementById('sortPool');if(!pool)return;
  pool.innerHTML='';
  [...SI].sort(()=>Math.random()-.5).forEach(it=>{
    const c=document.createElement('div');
    c.className='schip';c.id='ch_'+it.id;c.draggable=true;
    c.dataset.id=it.id;c.dataset.ok=it.ok;
    c.innerHTML=`<div style="font-size:22px">${it.emoji}</div><div style="font-size:12px;color:#888">${it.label}</div>`;
    c.ondragstart=e=>e.dataTransfer.setData('cid',it.id);
    pool.appendChild(c);
  });
}
function drop(e,bucket) {
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  const id=e.dataTransfer.getData('cid');
  const chip=document.getElementById('ch_'+id);if(!chip)return;
  const it=SI.find(i=>i.id===id);sAns[id]=bucket;
  const cl=chip.cloneNode(true);cl.draggable=false;cl.style.opacity='1';
  const ok=it.ok===bucket;
  cl.style.border=`2.5px solid ${ok?'#4ECDC4':'#FF6B35'}`;
  cl.style.background=ok?'#d0fff8':'#ffe4d0';
  const target=document.getElementById(bucket==='same'?'iSame':'iDiff');
  if(target)target.appendChild(cl);
  chip.classList.add('placed');
  if(Object.keys(sAns).length===SI.length){
    const allOk=SI.every(i=>sAns[i.id]===i.ok);
    const msg=document.getElementById('sortMsg');
    if(allOk){if(msg)msg.textContent='🏆 全对了！你真棒！';celebrate('🎉');speak('全对了！太厉害了！');}
    else      {if(msg)msg.textContent='有几个放错了，再试试！😊';}
  }
}

// ══════════════════════════════════════════════════════
//  CELEBRATE
// ══════════════════════════════════════════════════════
function celebrate(e){
  const d=document.createElement('div');
  d.className='celebrate';d.textContent=e;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),1300);
}
</script>
