<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绘本阅读 - 我喜欢学校</title>
    <style>
        /* 沉浸式阅读页的基础样式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcfcfc; /* 柔和的背景色，保护视力 */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh; /* 撑满整个屏幕高度 */
        }

        /* 顶部导航栏 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .back-btn {
            padding: 8px 15px;
            background-color: #ecf0f1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            color: #2c3e50;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .page-counter {
            font-size: 1rem;
            color: #7f8c8d;
        }

        /* 核心内容区：图片 + 文字 */
        main {
            flex-grow: 1; /* 占据剩余的所有空间 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .book-image {
            max-width: 90%;
            max-height: 60vh; /* 限制图片高度，给底部文字留空间 */
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            object-fit: contain;
            background-color: #eaeaea; /* 图片没加载出来时的背景色 */
        }

        .book-text {
            margin-top: 30px;
            font-size: 2.5rem; /* 超大字体，适合低幼儿童认字 */
            font-weight: 500;
            color: #2c3e50;
            text-align: center;
            line-height: 1.4;
        }

        /* 底部控制栏：上一页 / 下一页 */
        footer {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 30px 40px;
        }

        .nav-btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .nav-btn:hover { background-color: #2980b9; }
        
        /* 当没有上一页/下一页时，按钮变灰 */
        .nav-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="window.location.href='library.html'">← 返回图书馆</button>
        <h2 class="book-title" id="display-title">加载中...</h2>
        <div class="page-counter" id="display-counter">1 / 1</div>
    </header>

    <main>
        <img class="book-image" id="display-image" src="" alt="绘本插图" onerror="this.src='https://via.placeholder.com/800x600?text=暂无插图'">
        <div class="book-text" id="display-text">加载中...</div>
        <button id="btn-speak" onclick="speakText()" style="margin-top: 20px; padding: 10px 20px; font-size: 1.2rem; background-color: #f1c40f; border: none; border-radius: 20px; cursor: pointer; color: #333; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    🔊 读给我听
</button>
    </main>

    <footer>
        <button class="nav-btn" id="btn-prev" onclick="goPrev()">上一页</button>
        <button class="nav-btn" id="btn-next" onclick="goNext()">下一页</button>
    </footer>

    <script>
    let currentBookData = null;
let currentPageIndex = 0;

const titleEl = document.getElementById('display-title');
const counterEl = document.getElementById('display-counter');
const imageEl = document.getElementById('display-image');
const textEl = document.getElementById('display-text');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

// 获取网址中的书籍编号 (例如 reader.html?id=0)
const urlParams = new URLSearchParams(window.location.search);
const bookId = urlParams.get('id');

if (bookId === null) {
    textEl.textContent = "未找到书籍编号，请从图书馆首页进入。";
} else {
    // 读取总数据文件
    fetch('/data/books.json')
        .then(response => response.json())
        .then(data => {
            const booksList = data.book_list || [];
            currentBookData = booksList[bookId]; // 提取我们要看的那本书
            
            if (currentBookData && currentBookData.pages && currentBookData.pages.length > 0) {
                renderPage(); // 拿到数据后，开始渲染第一页
            } else {
                textEl.textContent = "这本书还在路上，或者内容为空哦。";
            }
        })
        .catch(err => {
            textEl.textContent = "数据加载失败，请稍后再试。";
        });
}

function renderPage() {
    const totalPages = currentBookData.pages.length;
    const currentPage = currentBookData.pages[currentPageIndex];

    titleEl.textContent = currentBookData.title;
    counterEl.textContent = `${currentPageIndex + 1} / ${totalPages}`;
    
    imageEl.src = currentPage.image || 'https://via.placeholder.com/800x600?text=暂无插图';
    textEl.textContent = currentPage.text;

    btnPrev.disabled = (currentPageIndex === 0);
    btnNext.disabled = (currentPageIndex === totalPages - 1);
}

function goPrev() {
    if (currentPageIndex > 0) {
        currentPageIndex--;
        renderPage();
    }
}

function goNext() {
    if (currentPageIndex < currentBookData.pages.length - 1) {
        currentPageIndex++;
        renderPage();
    }
}
// 调用浏览器自带的语音功能
function speakText() {
    const textToRead = textEl.textContent; // 获取当前页面的句子
    
    // 检查浏览器是否支持语音
    if ('speechSynthesis' in window) {
        // 先停止当前正在播放的声音，防止重叠
        window.speechSynthesis.cancel();
        
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = 'zh-CN'; // 设定为中文普通话
        utterance.rate = 0.8;     // 语速调慢一点点（0.8），非常适合沉浸式课堂的学生听
        
        window.speechSynthesis.speak(utterance);
    } else {
        alert("抱歉，您的浏览器不支持语音朗读功能。");
    }
}
    </script>

</body>
</html>
