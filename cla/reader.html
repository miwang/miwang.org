<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="head-title">绘本阅读 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
       :root {
            --reader-bg: #f0f3f7;
            --panel: #ffffff;
            --text: #1a2740;
            --muted: #6a7b90;
            --accent: #f0a832;
            --accent-dk: #d4922a;
            --teal: #598586;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            height: 100dvh;
            background: var(--reader-bg);
            overflow: hidden;
            padding-top: 70px;
            display: flex;
            flex-direction: column;
        }

        .reader-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 12px 18px 15px; 
        }

        .reader-topbar { display: none; }

        .reader-main {
            flex: 1;
            min-height: 0;
            background: var(--panel);
            border-radius: 24px;
            box-shadow: 0 10px 28px rgba(26,39,64,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px 22px;
        }

        .book-image {
            max-width: min(100%, 900px);
            max-height: 42vh; 
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            object-fit: contain;
            background: #eaeaea;
        }

        .book-text {
            margin-top: 20px;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            text-align: center;
            line-height: 1.45;
            color: var(--text);
            max-width: 960px;
            word-break: break-word;
        }

        .speak-btn {
            margin: 20px auto 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            padding: 0 40px;
            height: 48px;
            min-width: 160px;
            background: #598586;
            color: #ffffff;
            font-size: 1.2rem;
            border: none;
            box-shadow: 0 4px 12px rgba(89, 133, 134, 0.3);
            transition: background 0.2s ease, transform 0.15s ease;
            cursor: pointer;
            flex-shrink: 0;
        }
        .speak-btn:active { transform: scale(0.95); }
        .speak-btn.success-anim { background: #4caf50; box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4); }

        .reader-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            padding-top: 15px;
            padding-bottom: 5px;
            flex-shrink: 0; 
        }

        .nav-btn {
            width: 90px; 
            height: 48px;
            border-radius: 24px; 
            background: #f3b236;
            color: #ffffff;
            border: none;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(243, 178, 54, 0.3); 
            transition: all 0.2s ease;
        }
        
        .nav-btn:hover { background: #e1a328; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(243, 178, 54, 0.4); }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn:disabled { background-color: #d1d5db !important; color: #9ca3af !important; box-shadow: none !important; cursor: not-allowed; transform: none !important; }

        .center-indicator {
            color: var(--teal);
            font-weight: 700;
            font-size: 1.1rem;
            font-family: "LXGW WenKai Lite", sans-serif;
            min-width: 60px;
            text-align: center;
        }

        .message-box { color: var(--muted); text-align: center; font-size: 1.05rem; font-family: "LXGW WenKai Lite", sans-serif; padding: 40px 16px; }

        @media (max-height: 768px) {
            body { padding-top: 60px; }
            .reader-shell { padding: 8px 14px 10px; }
            .reader-main { padding: 10px 20px; }
            .book-image { max-height: 38vh; } 
            .book-text { margin-top: 12px; font-size: clamp(1.5rem, 3.5vw, 2.2rem); }
            .speak-btn { margin-top: 15px; height: 42px; padding: 0 30px; font-size: 1.1rem; }
            .reader-footer { gap: 25px; padding-top: 10px; padding-bottom: 0px; }
            .nav-btn { height: 42px; width: 80px; font-size: 1.4rem; }
        }

        @media (max-width: 768px) {
            body { padding-top: 56px; }
            .reader-shell { padding: 10px; }
            .reader-main { padding: 15px 14px; border-radius: 20px; justify-content: center; gap: 15px; } 
            .book-image { max-height: 52vh; width: 100%; border-radius: 12px; margin-top: 0; } 
            .book-text { font-size: clamp(1.8rem, 8vw, 2.6rem); margin-top: 5px; line-height: 1.4; } 
            .reader-footer { gap: 20px; padding-top: 12px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
            .nav-btn { width: 80px; height: 46px; font-size: 1.4rem; }
            .center-indicator { font-size: 1rem; }
            .speak-btn { width: 85%; max-width: 320px; height: 52px; padding: 0; font-size: 1.3rem; margin-top: 10px; } 
        }
    </style>
</head>
<body class="fade-in">
    <div class="reader-shell">
        <div class="reader-topbar" style="display: none;">
            <h2 class="book-title" id="display-title">加载中...</h2>
            <div class="page-counter font-en" id="display-counter">1 / 1</div>
        </div>

        <main class="reader-main">
            <img class="book-image" id="display-image" src="" alt="绘本插图">
            <div class="book-text phrase-text" id="display-text">加载中...</div>
            <button id="btn-speak" class="btn speak-btn" onclick="speakText()">朗读</button>
        </main>

        <footer class="reader-footer">
            <button class="btn nav-btn" id="btn-prev" onclick="goPrev()">←</button>
            <div class="center-indicator" id="footer-indicator">1 / 1</div>
            <button class="btn nav-btn" id="btn-next" onclick="goNext()">→</button>
        </footer>
    </div>

    <script>
        const LANG = MECC_CONFIG.getLang();
        const t = {
            zh: { baseTitle: '绘本阅读', back: '返回图书馆', notFound: '未找到书籍编号。请从图书馆重新进入。', missing: '这本书的内容还在路上哦。', loadFail: '数据加载失败，请重试。', prev: '←', next: '→', speak: '朗读', noSpeech: '抱歉，您的浏览器不支持语音朗读功能。' },
            en: { baseTitle: 'Reader', back: 'Back to Library', notFound: 'Book ID not found. Please reopen from the library.', missing: 'This book is not ready yet.', loadFail: 'Failed to load book data. Please try again.', prev: '←', next: '→', speak: 'Read Aloud', noSpeech: 'Sorry, your browser does not support speech synthesis.' }
        }[LANG];

        // Sanity API 配置
        const PROJECT_ID = 'sow12t1i';
        const DATASET = 'production';

        let currentBookData = null;
        let currentPageIndex = 0;

        const titleEl = document.getElementById('display-title');
        const counterEl = document.getElementById('display-counter');
        const footerIndicator = document.getElementById('footer-indicator');
        const imageEl = document.getElementById('display-image');
        const textEl = document.getElementById('display-text');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSpeak = document.getElementById('btn-speak');
        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');

        let currentAudio = new Audio();
        let audioUnlocked = false;

        const unlockInteraction = () => {
            if (audioUnlocked) return;
            currentAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
            currentAudio.play().then(() => { audioUnlocked = true; }).catch(()=>{});
            document.removeEventListener('touchstart', unlockInteraction);
            document.removeEventListener('mousedown', unlockInteraction);
        };
        document.addEventListener('touchstart', unlockInteraction, { passive: true });
        document.addEventListener('mousedown', unlockInteraction, { passive: true });

        window.onload = () => {
            MECC_CONFIG.renderGlobalNav(t.baseTitle);
            document.getElementById('head-title').innerText = `${t.baseTitle} - MECC`;
            btnPrev.innerText = t.prev;
            btnNext.innerText = t.next;
            btnSpeak.innerText = t.speak;
            const navBackText = document.querySelector('.mecc-nav-back span');
            if (navBackText) navBackText.innerText = t.back;
            bindBackLink();
            loadBook();
        };

        function bindBackLink() {
            const backLink = document.querySelector('.mecc-nav-back');
            if (!backLink) return;
            backLink.href = LANG === 'en' ? 'library.html?role=parents' : 'library.html';
            backLink.addEventListener('click', (event) => {
                event.preventDefault();
                if (document.referrer && document.referrer.includes('library')) {
                    window.history.back();
                } else { window.location.href = backLink.href; }
            });
        }

        function showMessage(message, isError = false) {
            titleEl.textContent = t.baseTitle; counterEl.textContent = '—'; footerIndicator.textContent = '—';
            imageEl.style.display = 'none'; textEl.textContent = message; textEl.className = 'message-box';
            btnSpeak.style.display = 'none'; btnPrev.disabled = true; btnNext.disabled = true;
            if (isError) textEl.style.color = '#d94040';
        }

        function loadBook() {
            if (!bookId) { showMessage(t.notFound); return; }
            
            // 构建 GROQ 查询：通过唯一 ID 提取这本书，并解析出它 pages 数组里的图片真实 CDN 网址
            const query = encodeURIComponent(`*[_type == "book" && _id == "${bookId}"][0]{title, "pages": pages[]{text, "imageUrl": image.asset->url, "imageString": image}}`);
            const API_URL = `https://${PROJECT_ID}.api.sanity.io/v2021-10-21/data/query/${DATASET}?query=${query}`;

            fetch(API_URL)
                .then(response => { if (!response.ok) throw new Error('Data not found'); return response.json(); })
                .then(({ result }) => {
                    currentBookData = result;
                    if (currentBookData && currentBookData.pages && currentBookData.pages.length > 0) { 
                        renderPage(); 
                    } else { 
                        showMessage(t.missing); 
                    }
                })
                .catch(() => { showMessage(t.loadFail, true); });
        }

        imageEl.onerror = function() { this.style.display = 'none'; };

        function renderPage() {
            const totalPages = currentBookData.pages.length;
            const currentPage = currentBookData.pages[currentPageIndex];
            const currentTitle = currentBookData.title || t.baseTitle;
            titleEl.textContent = currentTitle;
            counterEl.textContent = `${currentPageIndex + 1} / ${totalPages}`;
            footerIndicator.textContent = `${currentPageIndex + 1} / ${totalPages}`;
            document.getElementById('head-title').innerText = `${currentTitle} - MECC`;
            const navTitle = document.querySelector('.mecc-nav-title');
            if (navTitle) navTitle.innerText = currentTitle;

            // 兼容新版云端 CDN 图片和旧版相对路径
            let imgSrc = currentPage.imageUrl; 
            if (!imgSrc && typeof currentPage.imageString === 'string') {
                imgSrc = currentPage.imageString.startsWith('http') ? currentPage.imageString : `../${currentPage.imageString.replace(/^\.\.\//, '')}`;
            }

            if (imgSrc) { imageEl.src = imgSrc; imageEl.style.display = 'block'; } 
            else { imageEl.style.display = 'none'; }

            textEl.className = 'book-text phrase-text'; textEl.style.color = ''; textEl.textContent = currentPage.text || '';
            btnSpeak.style.display = 'inline-flex';
            btnPrev.disabled = (currentPageIndex === 0);
            btnNext.disabled = (currentPageIndex === totalPages - 1);
        }

        function goPrev() { if (currentBookData && currentPageIndex > 0) { currentPageIndex--; renderPage(); } }
        function goNext() { if (currentBookData && currentPageIndex < currentBookData.pages.length - 1) { currentPageIndex++; renderPage(); } }

        async function speakText() {
            const textToRead = textEl.textContent;
            if (!textToRead) return;

            btnSpeak.classList.add('success-anim');
            setTimeout(() => btnSpeak.classList.remove('success-anim'), 500);

            if (!audioUnlocked) {
                currentAudio.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';
                currentAudio.play().catch(()=>{});
                audioUnlocked = true;
            }

            const apiUrl = `/api/tts?text=${encodeURIComponent(textToRead)}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API Error");

                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("audio")) throw new Error("Not Audio");

                const audioBlob = await response.blob();
                currentAudio.src = URL.createObjectURL(audioBlob);
                await currentAudio.play();
            } catch (e) {
                console.warn("云端发音失败，降级到系统声音:", e);
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'zh-CN';
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
