<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的中文绘本图书馆</title>
    <style>
        /* 页面基础背景 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 30px; 
        }
        h1 { text-align: center; color: #333; margin-bottom: 40px; }

        /* 核心 Grid 布局：精髓就在这一段 */
        .grid-container {
            display: grid;
            /* 魔法代码：卡片最小220px，如果屏幕够宽就自动平分剩余空间填满 */
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 书籍卡片外观 */
        .book-card {
            background: white;
            border-radius: 12px;
            overflow: hidden; /* 保证封面图圆角不出界 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        /* 鼠标悬停时的浮动动画效果 */
        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        /* 封面图比例 */
        .book-cover {
            width: 100%;
            height: 220px;
            object-fit: cover; /* 保证图片不变形填满区域 */
            background-color: #eaeaea; 
            display: block;
        }

        /* 卡片文字信息区 */
        .book-info { padding: 15px; }
        
        .book-title {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #2c3e50;
        }
        
        .book-level {
            display: inline-block;
            background-color: #e74c3c; /* 红色醒目标签 */
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .book-tags {
            font-size: 0.85rem;
            color: #7f8c8d;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>📚 中文分级绘本馆</h1>
<div style="text-align: center; margin-bottom: 30px;">
        <select id="filter-level" onchange="applyFilters()" style="padding: 8px; font-size: 1rem; margin-right: 10px; border-radius: 5px;">
            <option value="all">所有级别 (All Levels)</option>
            <option value="Novice Low (L1)">Novice Low (L1)</option>
            <option value="Novice Mid (L2)">Novice Mid (L2)</option>
            <option value="Novice High (L3)">Novice High (L3)</option>
        </select>
        <select id="filter-topic" onchange="applyFilters()" style="padding: 8px; font-size: 1rem; border-radius: 5px;">
            <option value="all">所有话题 (All Topics)</option>
            <option value="动物与自然">动物与自然</option>
            <option value="家庭与朋友">家庭与朋友</option>
            <option value="学校生活">学校生活</option>
            <option value="节日与文化">节日与文化</option>
            <option value="食物与购物">食物与购物</option>
        </select>
    </div>
    <div id="book-grid" class="grid-container">
        </div>

    <script>
let allBooks = []; // 用来保存从后台抓取的所有书

const gridContainer = document.getElementById('book-grid');

fetch('/data/books.json')
    .then(response => {
        if (!response.ok) throw new Error("暂时没有找到书籍数据，请先在后台发布一本！");
        return response.json();
    })
    .then(data => {
        // 给每本书打上原本的序号标签（originalId），这样筛选后点击才不会跳错书
        allBooks = (data.book_list || []).map((book, index) => {
            return { ...book, originalId: index };
        });
        
        // 第一次加载时，渲染所有书
        applyFilters();
    })
    .catch(error => {
        gridContainer.innerHTML = `<p style="text-align:center;">${error.message}</p>`;
    });

// 筛选逻辑函数
function applyFilters() {
    const selectedLevel = document.getElementById('filter-level').value;
    const selectedTopic = document.getElementById('filter-topic').value;

    const filteredBooks = allBooks.filter(book => {
        const matchLevel = (selectedLevel === 'all' || book.level === selectedLevel);
        const matchTopic = (selectedTopic === 'all' || book.topic === selectedTopic);
        return matchLevel && matchTopic;
    });

    renderGrid(filteredBooks);
}

// 渲染网格函数
function renderGrid(booksToShow) {
    gridContainer.innerHTML = ''; // 先清空书架

    if (booksToShow.length === 0) {
        gridContainer.innerHTML = "<p style='text-align:center; width: 100%;'>没有找到符合条件的绘本哦。</p>";
        return;
    }

    booksToShow.forEach(book => {
        const card = document.createElement('div');
        card.className = 'book-card';

        card.innerHTML = `
            <img class="book-cover" src="${book.coverImage || 'https://via.placeholder.com/220x220?text=暂无封面'}" alt="${book.title} 封面">
            <div class="book-info">
                <div class="book-level">${book.level}</div>
                <h3 class="book-title">${book.title}</h3>
                <div class="book-tags">🏷️ ${book.topic}<br>📝 ${book.vocab_tags || '无'}</div>
            </div>
        `;

        // 注意这里：使用的是 book.originalId
        card.onclick = () => {
            window.location.href = `reader.html?id=${book.originalId}`;
        };

        gridContainer.appendChild(card);
    });
}
    </script>

</body>
</html>
