<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的中文绘本图书馆</title>
    <style>
        /* 页面基础背景 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 30px; 
        }
        h1 { text-align: center; color: #333; margin-bottom: 40px; }

        /* 核心 Grid 布局：精髓就在这一段 */
        .grid-container {
            display: grid;
            /* 魔法代码：卡片最小220px，如果屏幕够宽就自动平分剩余空间填满 */
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 书籍卡片外观 */
        .book-card {
            background: white;
            border-radius: 12px;
            overflow: hidden; /* 保证封面图圆角不出界 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        /* 鼠标悬停时的浮动动画效果 */
        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        /* 封面图比例 */
        .book-cover {
            width: 100%;
            height: 220px;
            object-fit: cover; /* 保证图片不变形填满区域 */
            background-color: #eaeaea; 
            display: block;
        }

        /* 卡片文字信息区 */
        .book-info { padding: 15px; }
        
        .book-title {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #2c3e50;
        }
        
        .book-level {
            display: inline-block;
            background-color: #e74c3c; /* 红色醒目标签 */
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .book-tags {
            font-size: 0.85rem;
            color: #7f8c8d;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>📚 中文分级绘本馆</h1>

    <div id="book-grid" class="grid-container">
        </div>

    <script>
    const gridContainer = document.getElementById('book-grid');

// 从网站根目录的 data 文件夹中读取数据
fetch('/data/books.json')
    .then(response => {
        if (!response.ok) throw new Error("暂时没有找到书籍数据，请先在后台发布一本！");
        return response.json();
    })
    .then(data => {
        // Decap CMS 生成的列表数据结构会保存在 data.book_list 里
        const booksData = data.book_list || [];
        
        if (booksData.length === 0) {
            gridContainer.innerHTML = "<p>图书馆目前还是空的哦，快去后台添加吧！</p>";
            return;
        }

        // 循环遍历每一本书（顺便拿到它在数组里的序号 index）
        booksData.forEach((book, index) => {
            const card = document.createElement('div');
            card.className = 'book-card';

            card.innerHTML = `
                <img class="book-cover" src="${book.coverImage || 'https://via.placeholder.com/220x220?text=暂无封面'}" alt="${book.title} 封面">
                <div class="book-info">
                    <div class="book-level">${book.level}</div>
                    <h3 class="book-title">${book.title}</h3>
                    <div class="book-tags">🏷️ ${book.topic}<br>📝 ${book.vocab_tags || '无'}</div>
                </div>
            `;

            // 点击卡片时，跳转到阅读页，并把这本书的序号(id)通过网址传过去
            card.onclick = () => {
                window.location.href = `reader.html?id=${index}`;
            };

            gridContainer.appendChild(card);
        });
    })
    .catch(error => {
        gridContainer.innerHTML = `<p>${error.message}</p>`;
    });
    </script>

</body>
</html>
