<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你叫什么名字？</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-lite-webfont@1.1.0/style.css">
<style>
  :root {
    --sky: #e0f4ff;
    --blue: #4db8ff;
    --yellow: #ffd93d;
    --orange: #ff922b;
    --pink: #ff6eb4;
    --green: #51cf66;
    --purple: #845ef7;
    --red: #ff4757;
    --teal: #20c997;
    --white: #ffffff;
    --dark: #2d3436;
    --cloud: #f8f9ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    background: linear-gradient(160deg, #c9f0ff 0%, #e8d5ff 50%, #ffe8cc 100%);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 背景装饰 */
  .bg-deco {
    position: fixed; pointer-events: none; z-index: 0;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
  }
  .bubble {
    position: absolute; border-radius: 50%;
    opacity: 0.18;
    animation: floatBubble linear infinite;
  }
  @keyframes floatBubble {
    0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
    10% { opacity: 0.18; }
    90% { opacity: 0.18; }
    100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
  }

  /* 主容器 */
  .main {
    position: relative; z-index: 1;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* 页面切换 */
  .slide { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; animation: slideIn 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  .slide.active { display: flex; }
  @keyframes slideIn { from { opacity: 0; transform: scale(0.88) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  /* ===== SLIDE 1: 标题页 ===== */
  .title-badge {
    background: white;
    border-radius: 40px;
    padding: 40px 60px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(100,100,200,0.2), 0 0 0 6px var(--blue), 0 0 0 12px white, 0 0 0 16px var(--yellow);
    position: relative;
  }
  .title-emoji { font-size: 5rem; display: block; animation: wave 1.5s ease-in-out infinite; }
  @keyframes wave { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(10deg)} }
  .title-zh {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(3.5rem, 8vw, 7rem);
    color: var(--purple);
    font-weight: 900;
    line-height: 1.1;
    margin: 10px 0;
    text-shadow: 4px 4px 0 rgba(132,94,247,0.2);
  }
  .title-en {
    font-size: clamp(1.4rem, 3vw, 2.2rem);
    color: var(--orange);
    font-weight: 700;
    letter-spacing: 1px;
  }

  /* ===== SLIDE 2: 分词解释 ===== */
  .word-breakdown {
    display: flex;
    gap: clamp(12px, 2vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
  }
  .word-card {
    background: white;
    border-radius: 24px;
    padding: clamp(16px,2vh,28px) clamp(20px,2.5vw,36px);
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    transform: translateY(60px); opacity: 0;
    transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
    min-width: 120px;
  }
  .word-card.show { transform: translateY(0); opacity: 1; }
  .word-card .char {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(2.8rem, 6vw, 5.5rem);
    font-weight: 900;
    line-height: 1;
    display: block;
  }
  .word-card .meaning {
    font-size: clamp(1rem,1.8vw,1.4rem);
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    color: white;
    display: inline-block;
    margin-top: 6px;
  }
  .word-card .icon { font-size: clamp(2rem,4vw,3.5rem); display: block; margin-bottom: 4px; }
  .word-card:nth-child(1) { border-top: 6px solid var(--pink); }
  .word-card:nth-child(1) .char { color: var(--pink); }
  .word-card:nth-child(1) .meaning { background: var(--pink); }
  .word-card:nth-child(2) { border-top: 6px solid var(--blue); }
  .word-card:nth-child(2) .char { color: var(--blue); }
  .word-card:nth-child(2) .meaning { background: var(--blue); }
  .word-card:nth-child(3) { border-top: 6px solid var(--orange); }
  .word-card:nth-child(3) .char { color: var(--orange); }
  .word-card:nth-child(3) .meaning { background: var(--orange); }
  .word-card:nth-child(4) { border-top: 6px solid var(--green); }
  .word-card:nth-child(4) .char { color: var(--green); }
  .word-card:nth-child(4) .meaning { background: var(--green); }
  .plus-sign {
    font-size: clamp(2rem,4vw,3rem);
    color: #ccc;
    font-weight: 900;
    padding-bottom: clamp(40px,6vh,70px);
  }
  .equals-row {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-top: 20px;
    transform: translateY(40px); opacity: 0;
    transition: all 0.6s 1.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .equals-row.show { transform: translateY(0); opacity: 1; }
  .full-sentence-box {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    color: white;
    border-radius: 30px;
    padding: 14px 40px;
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(2rem,5vw,4rem);
    font-weight: 900;
    box-shadow: 0 10px 30px rgba(132,94,247,0.4);
    text-align: center;
  }
  .full-sentence-en {
    font-family: "LXGW WenKai Lite", sans-serif;
    font-size: clamp(0.9rem,2vw,1.5rem);
    opacity: 0.85;
    margin-top: 4px;
  }

  /* ===== SLIDE 3: 对话示范 ===== */
  .dialogue-stage {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .dialogue-title {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(1.6rem,3.5vw,2.8rem);
    color: var(--purple);
    text-align: center;
    margin-bottom: 8px;
  }
  .chat-bubble {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    opacity: 0;
    transform: translateX(-40px);
    transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .chat-bubble.right { flex-direction: row-reverse; transform: translateX(40px); }
  .chat-bubble.show { opacity: 1; transform: translateX(0); }
  .avatar {
    width: clamp(60px,9vw,90px);
    height: clamp(60px,9vw,90px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(2rem,4vw,3.5rem);
    flex-shrink: 0;
    border: 4px solid white;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .avatar.teacher { background: white; overflow: hidden; }
  .avatar.student { background: linear-gradient(135deg, #f093fb, #f5576c); }
  .bubble-content {
    background: white;
    border-radius: 24px;
    padding: clamp(12px,2vh,20px) clamp(18px,3vw,30px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    max-width: 65%;
    position: relative;
  }
  .chat-bubble.right .bubble-content {
    background: linear-gradient(135deg, var(--pink), var(--orange));
    color: white;
  }
  .bubble-label {
    font-size: clamp(0.75rem,1.2vw,1rem);
    font-weight: 700;
    color: #999;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .chat-bubble.right .bubble-label { color: rgba(255,255,255,0.7); }
  .bubble-zh {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(1.6rem,3.5vw,3rem);
    font-weight: 900;
    color: var(--purple);
    line-height: 1.2;
  }
  .chat-bubble.right .bubble-zh { color: white; }
  .bubble-en {
    font-size: clamp(0.85rem,1.5vw,1.2rem);
    color: #aaa;
    margin-top: 2px;
  }
  .chat-bubble.right .bubble-en { color: rgba(255,255,255,0.75); }
  .chat-bubble.right

  /* ===== SLIDE 4: 练习时间 ===== */
  .practice-area { width: 100%; max-width: 800px; text-align: center; }
  .practice-title {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(2rem,4.5vw,4rem);
    color: var(--orange);
    margin-bottom: 20px;
    animation: bounce 0.8s ease-in-out infinite alternate;
  }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-10px)} }
  .practice-cards {
    display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;
  }
  .step-card {
    background: white;
    border-radius: 24px;
    padding: 24px 28px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    flex: 1; min-width: 200px; max-width: 260px;
    border-top: 8px solid;
    text-align: center;
    transform: scale(0.85); opacity: 0;
    transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }
  .step-card.show { transform: scale(1); opacity: 1; }
  .step-card:nth-child(1) { border-color: var(--blue); }
  .step-card:nth-child(2) { border-color: var(--pink); }
  .step-card:nth-child(3) { border-color: var(--green); }
  .step-num {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 900; color: white;
    margin: 0 auto 12px;
  }
  .step-card:nth-child(1) .step-num { background: var(--blue); }
  .step-card:nth-child(2) .step-num { background: var(--pink); }
  .step-card:nth-child(3) .step-num { background: var(--green); }
  .step-icon { font-size: 2.8rem; display: block; margin-bottom: 8px; }
  .step-text {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(1.1rem,2vw,1.5rem);
    color: var(--dark);
    font-weight: 700;
  }
  .step-sub { font-size: clamp(0.8rem,1.3vw,1rem); color: #999; margin-top: 4px; }
  .cheer-box {
    background: linear-gradient(135deg, var(--yellow), var(--orange));
    border-radius: 30px;
    padding: 20px 40px;
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(1.8rem,4vw,3.2rem);
    color: white;
    box-shadow: 0 10px 30px rgba(255,146,43,0.4);
    transform: scale(0.8); opacity: 0;
    transition: all 0.6s 0.8s cubic-bezier(0.34,1.56,0.64,1);
  }
  .cheer-box.show { transform: scale(1); opacity: 1; }

  /* 底部导航 */
  .nav-bar {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; align-items: center; z-index: 100;
  }
  .nav-btn {
    background: white;
    border: none;
    border-radius: 50px;
    padding: 12px 32px;
    font-size: clamp(1rem,2vw,1.4rem);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: all 0.2s;
    font-family: "LXGW WenKai Lite", sans-serif;
    color: var(--dark);
  }
  .nav-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
  .nav-btn:active { transform: translateY(0); }
  .nav-btn.primary { background: linear-gradient(135deg, var(--purple), var(--blue)); color: white; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .dot-nav { display: flex; gap: 10px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.5); transition: all 0.3s; cursor: pointer; border: 2px solid white; }
  .dot.active { background: var(--purple); width: 32px; border-radius: 6px; }

  /* 音效按钮 */
  .sound-btn {
    position: fixed; top: 24px; right: 24px; z-index: 100;
    background: white; border: none; border-radius: 50%;
    width: 60px; height: 60px;
    font-size: 1.8rem; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .sound-btn:hover { transform: scale(1.1); }

  /* 页码 */
  .page-label {
    position: fixed; top: 24px; left: 24px; z-index: 100;
    background: white; border-radius: 20px;
    padding: 8px 18px; font-size: 1rem; font-weight: 700; color: var(--purple);
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  /* 段落标题 */
  .section-title {
    font-family: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
    font-size: clamp(1.8rem,4vw,3rem);
    color: var(--purple);
    margin-bottom: 24px;
    text-align: center;
  }
</style>
</head>

<!-- 背景泡泡 -->
<div class="bg-deco" id="bgDeco"></div>

<div class="page-label" id="pageLabel">1 / 4</div>
<button class="sound-btn" onclick="playSound()" title="播放发音">🔊</button>

<div class="main">

  <div class="slide active" id="slide-1">

  <div class="slide" id="slide-2">

  <div class="slide" id="slide-4">
    <div class="practice-area">
      <div class="practice-title">🎉 轮到你了！</div>
      <div class="practice-cards">
        <div class="step-card" id="s1">
          <div class="step-num">1</div>
          <span class="step-icon">👂</span>
          <div class="step-text">老师先问</div>
          <div class="step-sub">你叫什么名字？</div>
        </div>
        <div class="step-card" id="s2">
          <div class="step-num">2</div>
          <span class="step-icon">🙋</span>

          <div class="step-sub">我叫 ______！</div>
        </div>
        <div class="step-card" id="s3">

<!-- 底部导航 -->
<div class="nav-bar">
  <button class="nav-btn" id="prevBtn" onclick="changePage(-1)" disabled>← 上一页</button>
  <div class="dot-nav" id="dotNav"></div>
  <button class="nav-btn primary" id="nextBtn" onclick="changePage(1)">下一页 →</button>
</div>

<script>
  let curr = 1;
  const total = 4;

  // 背景泡泡
  const colors = ['#ff6eb4','#4db8ff','#ffd93d','#51cf66','#845ef7','#ff922b','#20c997'];
  const deco = document.getElementById('bgDeco');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 40 + Math.random() * 100;
    b.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      background:${colors[i%colors.length]};
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${Math.random()*10}s;
    `;
    deco.appendChild(b);
  }

  // 点导航
  const dotNav = document.getElementById('dotNav');
  for (let i = 1; i <= total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i===1?' active':'');
    d.onclick = () => goTo(i);
    dotNav.appendChild(d);
  }

  function updateDots() {
    document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i+1===curr));
  }

  function goTo(n) {
    document.getElementById(`slide-${curr}`).classList.remove('active');
    curr = n;
    document.getElementById(`slide-${curr}`).classList.add('active');
    document.getElementById('pageLabel').textContent = `${curr} / ${total}`;
    document.getElementById('prevBtn').disabled = curr === 1;
    document.getElementById('nextBtn').disabled = curr === total;
    document.getElementById('nextBtn').textContent = curr === total ? '🎊 完成！' : '下一页 →';
    updateDots();
    runSlideAnimations(curr);
  }

  function changePage(d) { goTo(curr + d); }

  function runSlideAnimations(n) {
    if (n === 2) {
      ['wc1','wc2','wc3','wc4'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.classList.remove('show');
        setTimeout(() => el.classList.add('show'), 150 + i * 200);
      });
      const eq = document.getElementById('equalsRow');
      eq.classList.remove('show');
      setTimeout(() => eq.classList.add('show'), 1200);
    }
    if (n === 3) {
      ['d1','d2','d3'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.classList.remove('show');
        setTimeout(() => el.classList.add('show'), 200 + i * 400);
      });
    }
    if (n === 4) {
      ['s1','s2','s3'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.classList.remove('show');
        setTimeout(() => el.classList.add('show'), 100 + i * 200);
      });
      const cheer = document.getElementById('cheerBox');
      cheer.classList.remove('show');
      setTimeout(() => cheer.classList.add('show'), 900);
    }
  }

  // 发音（Web Speech API）
  function playSound() {
    const texts = [
      '你叫什么名字',
      '你叫什么名字',
      '你叫什么名字？我叫___。',
      '你叫什么名字？'
    ];
    const utterance = new SpeechSynthesisUtterance(texts[curr - 1]);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.85;
    utterance.pitch = 1.1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);

    // 按钮动画
    const btn = document.querySelector('.sound-btn');
    btn.style.transform = 'scale(1.3)';
    btn.textContent = '🎵';
    setTimeout(() => { btn.style.transform = ''; btn.textContent = '🔊'; }, 1200);
  }

  // 键盘控制
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { if (curr < total) changePage(1); }
    if (e.key === 'ArrowLeft') { if (curr > 1) changePage(-1); }
    if (e.key === 's' || e.key === 'S') playSound();
  });
</script>
</body>
