<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Words — Wang Laoshi's Space</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --font-zh: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --font-en: "LXGW WenKai Lite", system-ui, sans-serif;
        }

        body { background-color: #f4f9f9; margin: 0; font-family: var(--font-en); }

        /* ── Nav ── */
        .back-nav { background: #598586; padding: 10px 24px; display: flex; align-items: center; }
        .back-nav a { color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
        .back-nav a:hover { opacity: 0.8; }

        /* ── Header ── */
        .header { padding: 28px 25px; border-bottom: 6px solid #f3b236; background: #598586; text-align: center; }
        .header h1 { font-size: 2.2rem; color: white; margin: 0; font-family: var(--font-en); }

        .container { width: 95%; max-width: 1000px; margin: 28px auto; }

        /* ── Progress summary ── */
        .progress-summary {
            background: #1e2e46; color: white; padding: 20px 24px;
            border-radius: 20px; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 6px 18px rgba(30,46,70,0.13);
        }
        .summary-text h2 { margin: 0; font-size: 1.3rem; color: #f3b236; font-family: var(--font-en); }
        .summary-text p  { margin: 5px 0 0; opacity: 0.75; font-size: 0.88rem; font-family: var(--font-en); }

        .bar-container { width: 140px; height: 10px; background: rgba(255,255,255,0.2); border-radius: 8px; overflow: hidden; }
        .bar-fill { height: 100%; background: #f3b236; width: 0%; transition: width 0.5s ease; border-radius: 8px; }
        .pct-label { margin-top: 6px; font-weight: bold; color: #f3b236; font-size: 0.9rem; text-align: right; font-family: var(--font-en); }

        /* ── Month sections ── */
        .week-section {
            margin-bottom: 32px; background: white;
            border-radius: 20px; padding: 24px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
        }
        .week-title {
            font-size: 1.5rem; color: #1e2e46;
            border-left: 6px solid #f3b236;
            padding-left: 14px; margin-bottom: 18px;
            font-weight: bold; font-family: var(--font-en);
        }

        /* ── Character grid ── */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 14px;
        }

        .char-card {
            background: #fff9ea; border: 3px solid transparent;
            border-radius: 20px; height: 110px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-decoration: none;
            transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .char-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: #f3b236;
        }
        .char-card.done {
            background: #eafaf1;
            border-color: #27ae60;
        }

        .char-text {
            font-family: var(--font-zh);
            font-size: 3.5rem; line-height: 1;
            color: #598586;
        }

        .badge-done {
            position: absolute; top: -8px; right: -8px;
            background: #27ae60; color: white; border-radius: 50%;
            width: 24px; height: 24px;
            display: none; align-items: center; justify-content: center;
            font-size: 13px; border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .char-card.done .badge-done { display: flex; }

        /* ── Footer ── */
        .footer { padding: 26px; text-align: center; color: #888; font-size: 0.85rem; }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.7rem; }
            .char-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; }
            .char-card { height: 90px; }
            .char-text { font-size: 2.8rem; }
            .progress-summary { flex-direction: column; align-items: flex-start; gap: 14px; }
            .bar-container { width: 100%; }
        }
        @media (max-width: 768px) {
            .char-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
        }
        @media (min-width: 1200px) {
            .char-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="../parents.html">⬅️ Back to Parents Hub</a>
    </div>

    <div class="header">
        <h1>Sight Words 📘</h1>
    </div>

    <div class="container">

        <div class="progress-summary">
            <div class="summary-text">
                <h2 id="summary-title">Learning Journey</h2>
                <p id="summary-detail">Keep practicing!</p>
            </div>
            <div>
                <div class="bar-container">
                    <div id="top-bar-fill" class="bar-fill"></div>
                </div>
                <div id="top-pct" class="pct-label">0%</div>
            </div>
        </div>

        <div id="main-content"></div>

    </div>

    <div class="footer">Created with ❤️ by Wang Laoshi</div>

    <script src="../js/sight_words_data.js"></script>
    <script>
        const progress = JSON.parse(localStorage.getItem('mecc_progress') || '{}');

        const labels = [];
        fullWordData.forEach(item => {
            if (!labels.includes(item.week)) labels.push(item.week);
        });

        const monthNames = ["January","February","March","April","May","June",
                            "July","August","September","October","November","December"];
        const currentMonthName = monthNames[new Date().getMonth()];

        let displayLabel = currentMonthName;
        let thisPeriodChars = fullWordData.filter(d => d.week === currentMonthName);

        if (thisPeriodChars.length === 0 && labels.length > 0) {
            displayLabel = labels[labels.length - 1];
            thisPeriodChars = fullWordData.filter(d => d.week === displayLabel);
        }

        if (thisPeriodChars.length > 0) {
            const done = thisPeriodChars.filter(d => progress[d.char] === 'completed').length;
            const pct  = Math.round((done / thisPeriodChars.length) * 100) || 0;
            document.getElementById('top-bar-fill').style.width = pct + '%';
            document.getElementById('top-pct').textContent = pct + '%';
            document.getElementById('summary-title').textContent = `${displayLabel} Progress`;
            document.getElementById('summary-detail').textContent =
                `${done} of ${thisPeriodChars.length} characters mastered ✅`;
        }

        document.getElementById('main-content').innerHTML = labels.map(label => {
            const chars = fullWordData.filter(d => d.week === label);
            return `
                <div class="week-section">
                    <div class="week-title">${label}</div>
                    <div class="char-grid">
                        ${chars.map(item => {
                            const isDone = progress[item.char] === 'completed';
                            return `
                                <a href="word_detail_en.html?char=${encodeURIComponent(item.char)}"
                                   class="char-card${isDone ? ' done' : ''}"
                                   onclick="saveScroll()">
                                    <div class="badge-done">✓</div>
                                    <span class="char-text">${item.char}</span>
                                </a>`;
                        }).join('')}
                    </div>
                </div>`;
        }).join('');

        // ── Scroll position save & restore ──
        function saveScroll() {
            sessionStorage.setItem('wap_en_scroll', window.scrollY);
        }
        const savedScroll = sessionStorage.getItem('wap_en_scroll');
        if (savedScroll !== null) {
            window.scrollTo({ top: parseInt(savedScroll), behavior: 'instant' });
            sessionStorage.removeItem('wap_en_scroll');
        }
    </script>
</body>
</html>
