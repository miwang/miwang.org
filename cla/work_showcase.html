<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Work Showcase - 王老师的教室</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/common_nav.css">
  <script src="../js/config.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.min.js"></script>

  <style>
    /* ══════════════════════════════════════════
       字体 & 全局变量
    ═════════════════���════════════════════════ */
    :root {
      --font-zh: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
      --font-en: "LXGW WenKai Lite", sans-serif;
      --teal:        #598586;
      --teal-mid:    #6fa3a4;
      --teal-light:  #e8f4f4;
      --teal-pale:   #f3fafa;
      --gold:        #c9a84c;
      --bg:          #faf6ed;
      --card-radius: 18px;
      --shadow-sm:   0 4px 16px rgba(89,133,134,.10);
      --shadow-md:   0 12px 36px rgba(89,133,134,.18);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body, h1, h2, h3, p, span, div, button {
      font-family: var(--font-zh);
    }
    .en, #current-page, #total-pages, .page-label,
    .author-label, #view-book, .card-author-name,
    .info-label, .badge-unit {
      font-family: var(--font-en) !important;
    }

    body {
      padding-top: 80px;
      background: var(--bg);
      overflow-x: hidden;
      margin: 0;
    }

    /* ══════════════════════════════════════════
       加载状态
    ══════════════════════════════════════════ */
    #status-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
      color: #aabfbf;
      font-size: 1.05rem;
    }

    /* 骨架屏 */
    .skeleton-grid {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px;
      padding: 0 24px 60px;
    }
    .skeleton-card {
      background: white;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .skeleton-thumb {
      height: 260px;
      background: linear-gradient(90deg, #eef5f5 25%, #ddeeed 50%, #eef5f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-meta {
      padding: 14px 16px 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .skeleton-line {
      height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, #eef5f5 25%, #ddeeed 50%, #eef5f5 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-line.short { width: 55%; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ══════════════════════════════════════════
       Gallery 网格
    ══════════════════════════════════════════ */
    #work-gallery {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 28px;
      padding: 0 24px 80px;
    }

    /* 卡片入场动画 */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .work-item-card {
      background: white;
      border-radius: var(--card-radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform .3s ease, box-shadow .3s ease;
      animation: cardIn .45s both;
      display: flex;
      flex-direction: column;
    }
    .work-item-card:hover {
      transform: translateY(-10px);
      box-shadow: var(--shadow-md);
    }

    /* 缩略图区 */
    .card-thumb {
      height: 260px;
      background: var(--teal-pale);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .card-thumb canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 悬停时蒙层 + 阅读提示 */
    .card-thumb::after {
      content: "点击阅读 ▶";
      font-family: var(--font-zh);
      font-size: .85rem;
      position: absolute;
      inset: 0;
      background: rgba(89,133,134,.72);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: .1em;
      opacity: 0;
      transition: opacity .25s ease;
    }
    .work-item-card:hover .card-thumb::after {
      opacity: 1;
    }

    /* 单元角标 */
    .badge-unit {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(255,255,255,.92);
      color: var(--teal);
      font-size: .72rem;
      font-weight: bold;
      padding: 3px 9px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      letter-spacing: .06em;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    /* 卡片信息区 */
    .card-meta {
      padding: 14px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .card-topic {
      margin: 0;
      color: #3a6a6b;
      font-size: 1rem;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-author-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }
    .card-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 2px solid var(--teal-light);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--teal-light);
    }
    .card-author-name {
      font-size: .80rem;
      color: var(--teal-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 底部色条 */
    .card-stripe {
      height: 4px;
      background: linear-gradient(90deg, var(--teal), var(--teal-mid));
      flex-shrink: 0;
    }

    /* ══════════════════════════════════════════
       Viewer — 全屏浮层
    ══════════════════════════════════════════ */
    @keyframes viewerFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    #work-viewer-section {
      display: none;
      position: fixed;
      inset: 0;
      background: #f0ebe1;
      z-index: 50;
      overflow: hidden;
      flex-direction: column;
    }
    #work-viewer-section.viewer-opening {
      animation: viewerFadeIn .35s ease both;
    }

    /* 顶栏 */
    .viewer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: linear-gradient(90deg, #fff 0%, #f8fafa 100%);
      box-shadow: 0 2px 16px rgba(89,133,134,.10);
      height: 56px;
      flex-shrink: 0;
      border-bottom: 2px solid var(--teal-light);
    }

    /* 纯文字返回按钮 */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--teal);
      padding: 0;
      cursor: pointer;
      font-family: var(--font-zh);
      font-size: .92rem;
      font-weight: bold;
      letter-spacing: .04em;
      transition: color .2s, opacity .2s;
    }
    .back-btn .btn-arrow {
      font-size: 1rem;
      transition: transform .2s;
    }
    .back-btn:hover {
      color: var(--gold);
    }
    .back-btn:hover .btn-arrow {
      transform: translateX(-3px);
    }

    .page-counter-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--teal);
      font-family: var(--font-en);
      font-size: .88rem;
    }
    .page-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .page-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--teal-light);
      transition: background .2s, transform .2s;
    }
    .page-dot.active {
      background: var(--teal);
      transform: scale(1.3);
    }

    /* 底部翻页进度条 */
    .viewer-progress {
      height: 3px;
      background: var(--teal-light);
      flex-shrink: 0;
      position: relative;
    }
    .viewer-progress-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--teal), var(--teal-mid));
      border-radius: 0 2px 2px 0;
      transition: width .35s ease;
    }

    /* body */
    .viewer-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }

    /* 左：PDF 区 */
    .viewer-left {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 15% 85%, rgba(89,133,134,.08) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(201,168,76,.07) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(89,133,134,.03) 0%, transparent 70%);
    }
    /* 角落装饰圆 */
    .viewer-left::before,
    .viewer-left::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .viewer-left::before {
      width: 220px; height: 220px;
      bottom: -70px; left: -70px;
      background: radial-gradient(circle, rgba(89,133,134,.08) 0%, transparent 70%);
    }
    .viewer-left::after {
      width: 160px; height: 160px;
      top: -50px; right: -50px;
      background: radial-gradient(circle, rgba(201,168,76,.08) 0%, transparent 70%);
    }

    .pdf-frame {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #pdf-canvas {
      display: block;
      border-radius: 10px;
      box-shadow:
        0 2px 6px rgba(0,0,0,.06),
        0 8px 24px rgba(0,0,0,.12),
        0 20px 60px rgba(0,0,0,.14),
        6px 6px 0 rgba(89,133,134,.06);
      cursor: pointer;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      transition: opacity .22s ease;
    }
    #pdf-canvas.pdf-fading {
      opacity: 0;
    }
    @keyframes pdfAppear {
      from { opacity: 0; transform: scale(.985) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    #pdf-canvas.pdf-appeared {
      animation: pdfAppear .3s ease both;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(89,133,134,.75);
      color: white;
      border: none;
      width: 40px;
      height: 72px;
      cursor: pointer;
      font-size: 18px;
      transition: background .2s, width .2s;
      z-index: 5;
      backdrop-filter: blur(6px);
    }
    .nav-btn:hover { background: var(--teal); width: 46px; }
    .prev-btn { left: 0; border-radius: 0 10px 10px 0; }
    .next-btn { right: 0; border-radius: 10px 0 0 10px; }

    /* 右：信息栏 */
    .viewer-right {
      width: 270px;
      flex-shrink: 0;
      background: white;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: -4px 0 20px rgba(89,133,134,.08);
    }

    /* 作者头部（带渐变背景） */
    .detail-author-box {
      padding: 28px 20px 24px;
      background: linear-gradient(160deg, var(--teal) 0%, var(--teal-mid) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    /* 作者区背景装饰 */
    .detail-author-box::before {
      content: '';
      position: absolute;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      bottom: -60px; right: -40px;
      pointer-events: none;
    }
    .detail-author-box::after {
      content: '';
      position: absolute;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      top: -20px; left: -20px;
      pointer-events: none;
    }
    .detail-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.8);
      object-fit: cover;
      background: var(--teal-light);
      box-shadow: 0 6px 24px rgba(0,0,0,.18);
      position: relative;
    }
    .detail-author-text {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .detail-author-name {
      font-family: var(--font-zh);
      font-size: 1.15rem;
      font-weight: bold;
      color: white;
      text-align: center;
      position: relative;
    }
    .author-label {
      font-family: var(--font-en);
      font-size: .72rem;
      color: rgba(255,255,255,.70);
      letter-spacing: .1em;
      position: relative;
    }

    /* 无作者时的占位头 */
    .no-author-header {
      padding: 20px;
      background: linear-gradient(160deg, var(--teal) 0%, var(--teal-mid) 100%);
      flex-shrink: 0;
    }

    /* 信息区 */
    .info-panel {
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: var(--teal-pale);
      border-radius: 12px;
      padding: 12px 14px;
      border-left: 3px solid var(--teal-light);
      transition: border-color .2s;
    }
    .info-group:hover {
      border-left-color: var(--teal-mid);
    }
    .info-label {
      font-family: var(--font-en);
      font-size: .68rem;
      color: var(--teal-mid);
      letter-spacing: .12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .info-label::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--teal-mid);
      flex-shrink: 0;
    }
    .info-value {
      font-family: var(--font-zh);
      color: #3a6a6b;
      font-size: 1rem;
      font-weight: bold;
      line-height: 1.45;
    }

    /* 分隔线（保留但淡化，由 info-group 间距代替） */
    .info-divider {
      display: none;
    }

    /* ══════════════════════════════════════════
       空状态
    ══════════════════════════════════════════ */
    #empty-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 14px;
      color: #b0c4c4;
    }
    #empty-state .empty-icon { font-size: 3rem; }
    #empty-state p { margin: 0; font-size: 1rem; }

    /* ══════════════════════════════════════════
       手机端适配
    ══════════════════════════════════════════ */
    @media (max-width: 640px) {
      body { padding-top: 60px; }

      /* 画廊：两列，间距收紧 */
      #work-gallery,
      .skeleton-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px 60px;
      }
      .card-thumb { height: 160px; }
      .card-meta  { padding: 10px 12px 14px; gap: 6px; }
      .card-topic { font-size: .88rem; }

      /* Viewer：改为纵向布局，PDF 在上，信息栏在下 */
      #work-viewer-section { overflow: hidden; }

      .viewer-toolbar {
        padding: 0 14px;
        height: 46px;
      }
      .page-dots { display: none; }

      .viewer-body {
        flex-direction: column;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      /* PDF 区占满宽度，给足高度（纵向滚动方案中 PDF 撑满视口 60%） */
      .viewer-left {
        flex: 0 0 auto;
        height: 60vh;
        min-height: 300px;
        padding: 10px;
        overflow: hidden;
      }

      /* 翻页按钮适当缩小 */
      .nav-btn {
        width: 30px;
        height: 52px;
        font-size: 14px;
      }

      /* 信息栏改为全宽、高度自适应 */
      .viewer-right {
        width: 100%;
        flex-shrink: 0;
        overflow-y: visible;
        box-shadow: none;
        border-top: 2px solid var(--teal-light);
      }

      .detail-author-box {
        flex-direction: row;
        align-items: center;
        padding: 12px 16px;
        gap: 14px;
      }
      .detail-author-box::before { display: none; }
      .detail-author-box::after  { display: none; }
      .detail-avatar { width: 48px; height: 48px; flex-shrink: 0; }
      .detail-author-name { font-size: .95rem; text-align: left; }
      .author-label { font-size: .65rem; }
      .info-panel { padding: 14px 14px; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- 加载提示 -->
  <div id="status-msg"></div>

  <!-- 骨架屏 -->
  <div id="skeleton-grid" class="skeleton-grid">
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-meta"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-meta"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-meta"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-meta"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
  </div>

  <!-- 空状态 -->
  <div id="empty-state">
    <div class="empty-icon">📂</div>
    <p>暂时还没有作品，敬请期待！</p>
  </div>

  <!-- 画廊 -->
  <div id="work-gallery"></div>

  <!-- ══ Viewer ══ -->
  <div id="work-viewer-section">
    <div class="viewer-toolbar">
      <button class="back-btn" onclick="showGallery()" aria-label="返回作品列表"><span class="btn-arrow" aria-hidden="true">←</span> 返回列表</button>
      <div class="page-counter-wrap">
        <span class="page-label">PAGE</span>
        <span id="current-page">1</span>
        <span style="color:#ccc;">/</span>
        <span id="total-pages">--</span>
        <div class="page-dots" id="page-dots"></div>
      </div>
    </div>
    <div class="viewer-progress"><div class="viewer-progress-bar" id="viewer-progress-bar"></div></div>

    <div class="viewer-body">
      <div class="viewer-left">
        <div class="pdf-frame">
          <button class="nav-btn prev-btn" onclick="changePage(-1)">❮</button>
          <canvas id="pdf-canvas" onclick="changePage(1)"></canvas>
          <button class="nav-btn next-btn" onclick="changePage(1)">❯</button>
        </div>
      </div>

      <div class="viewer-right">
        <!-- 作者头部 -->
        <div class="detail-author-box" id="author-box" style="display:none;">
          <img src="" class="detail-avatar" id="detail-img" alt="avatar">
          <div class="detail-author-text">
            <div class="detail-author-name" id="detail-name">---</div>
            <div class="author-label" id="author-role-label">Featured Author</div>
          </div>
        </div>
        <div class="no-author-header" id="no-author-header" style="display:none;"></div>

        <!-- 信息区 -->
        <div class="info-panel">
          <div class="info-group">
            <div class="info-label">话题 / Topic</div>
            <div class="info-value" id="view-topic">---</div>
          </div>
          <div class="info-divider"></div>
          <div class="info-group">
            <div class="info-label">所属单元 / Unit</div>
            <div class="info-value" id="view-unit">---</div>
          </div>
          <div class="info-divider"></div>
          <div class="info-group">
            <div class="info-label">对应书本 / Book</div>
            <div class="info-value en" id="view-book">---</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://unpkg.com/pdfjs-dist@2.16.105/build/pdf.worker.min.js';

    const LANG       = MECC_CONFIG.getLang();
    const isTeacher  = LANG === 'zh';
    const pageTitle  = isTeacher ? '学生优秀习作展示' : 'Excellent Work Showcase';
    const authorLabel = isTeacher ? '习作作者' : 'Featured Author';

    const QUERY = encodeURIComponent(`*[_type == "studentWork"] | order(_createdAt desc){
      unit, topic, book, "pdfUrl": pdfFile.asset->url,
      "author": author->{ name, "avatarUrl": avatar.asset->url }
    }`);
    const API_URL = `https://sow12t1i.api.sanity.io/v2023-05-03/data/query/production?query=${QUERY}`;

    let pdfDoc = null, pageNum = 1, isRendering = false;
    let cachedAvailWidth = null, cachedAvailHeight = null;
    let totalPages = 0;
    let savedScrollY = 0;   /* ← 保存列表滚动位置 */

    /* ─── 初始化 ─── */
    async function init() {
      try {
        const res = await fetch(API_URL);
        const { result } = await res.json();

        document.getElementById('skeleton-grid').style.display = 'none';

        if (!result || result.length === 0) {
          document.getElementById('empty-state').style.display = 'flex';
          return;
        }

        const gallery = document.getElementById('work-gallery');
        result.forEach((work, idx) => {
          const card    = document.createElement('div');
          card.className = 'work-item-card';
          card.style.animationDelay = `${idx * 60}ms`;

          const thumbId = `thumb-${Math.random().toString(36).substr(2, 9)}`;

          const authorHTML = work.author
            ? `<div class="card-author-row">
                 <img class="card-avatar"
                      src="${work.author.avatarUrl || ''}"
                      alt="${work.author.name}"
                      onerror="this.style.display='none'">
                 <span class="card-author-name">${work.author.name}</span>
               </div>`
            : '';

          const unitLabel = work.unit ? work.unit : '';

          card.innerHTML = `
            <div class="card-thumb">
              <canvas id="${thumbId}"></canvas>
              ${unitLabel ? `<div class="badge-unit">${unitLabel}</div>` : ''}
            </div>
            <div class="card-meta">
              <h3 class="card-topic">${work.topic || work.unit || '---'}</h3>
              ${authorHTML}
            </div>
            <div class="card-stripe"></div>
          `;
          card.onclick = () => openWork(work);
          gallery.appendChild(card);
          generateThumb(work.pdfUrl, thumbId);
        });

      } catch (e) {
        document.getElementById('skeleton-grid').style.display = 'none';
        const msg = document.getElementById('status-msg');
        msg.innerText = '数据加载失败，请稍后重试。';
        msg.style.display = 'block';
      }
    }

    /* ─── 缩略图 ─── */
    async function generateThumb(url, canvasId) {
      try {
        const pdf  = await pdfjsLib.getDocument({
          url, cMapUrl: 'https://unpkg.com/pdfjs-dist@2.16.105/cmaps/', cMapPacked: true
        }).promise;
        const page = await pdf.getPage(1);
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const vp = page.getViewport({ scale: 0.55 });
        canvas.width  = vp.width;
        canvas.height = vp.height;
        page.render({ canvasContext: canvas.getContext('2d'), viewport: vp });
      } catch (e) {}
    }

    /* ─── 打开作品 ─── */
    function openWork(work) {
      savedScrollY = window.scrollY;   /* ← 保存当前滚动位置 */
      document.querySelector('.mecc-global-nav').style.display = 'none';
      document.getElementById('work-gallery').style.display    = 'none';
      document.getElementById('empty-state').style.display     = 'none';
      const viewer = document.getElementById('work-viewer-section');
      viewer.style.display          = 'flex';
      viewer.style.flexDirection    = 'column';
      viewer.classList.remove('viewer-opening');
      viewer.offsetWidth;   /* 触发重排，确保动画重新播放（intentional reflow） */
      viewer.classList.add('viewer-opening');

      document.getElementById('view-unit').innerText  = work.unit  || '---';
      document.getElementById('view-topic').innerText = work.topic || '---';
      document.getElementById('view-book').innerText  = work.book  ? `《${work.book}》` : '---';

      const authorBox      = document.getElementById('author-box');
      const noAuthorHeader = document.getElementById('no-author-header');
      if (work.author) {
        authorBox.style.display      = 'flex';
        noAuthorHeader.style.display = 'none';
        document.getElementById('detail-name').innerText = work.author.name;
        document.getElementById('detail-img').src        = work.author.avatarUrl || '';
      } else {
        authorBox.style.display      = 'none';
        noAuthorHeader.style.display = 'block';
      }

      pageNum          = 1;
      cachedAvailWidth = null;
      cachedAvailHeight = null;
      loadPDF(work.pdfUrl);
    }

    /* ─── 返回列表 ─── */
    function showGallery() {
      document.querySelector('.mecc-global-nav').style.display = '';
      document.getElementById('work-gallery').style.display    = 'grid';
      document.getElementById('work-viewer-section').style.display = 'none';
      pdfDoc = null;
      updateDots(0, 0);
      updateProgressBar(0, 0);
      /* ← 恢复之前的滚动位置 */
      requestAnimationFrame(() => window.scrollTo(0, savedScrollY));
    }

    /* ─── 加载 PDF ─── */
    function loadPDF(url) {
      pdfjsLib.getDocument({
        url, cMapUrl: 'https://unpkg.com/pdfjs-dist@2.16.105/cmaps/', cMapPacked: true
      }).promise.then(pdf => {
        pdfDoc      = pdf;
        totalPages  = pdf.numPages;
        document.getElementById('total-pages').innerText = totalPages;
        updateDots(pageNum, totalPages);
        updateProgressBar(pageNum, totalPages);
        renderPage(pageNum);
      });
    }

    /* ─── 页码点指示器（最多 8 个点） ─── */
    function updateDots(current, total) {
      const container = document.getElementById('page-dots');
      container.innerHTML = '';
      const show = Math.min(total, 8);
      for (let i = 1; i <= show; i++) {
        const d = document.createElement('div');
        d.className = 'page-dot' + (i === current ? ' active' : '');
        container.appendChild(d);
      }
    }

    /* ─── 底部进度条 ─── */
    function updateProgressBar(current, total) {
      const bar = document.getElementById('viewer-progress-bar');
      if (!bar) return;
      bar.style.width = total > 0 ? `${(current / total) * 100}%` : '0%';
    }

    /* ─── 计算可用空间（缓存稳定尺寸） ─── */
    function getAvailableSpace() {
      if (cachedAvailWidth !== null) return { availWidth: cachedAvailWidth, availHeight: cachedAvailHeight };
      const el = document.querySelector('.viewer-left');
      if (!el) return { availWidth: 800, availHeight: 600 };
      const s = getComputedStyle(el);
      cachedAvailWidth  = el.clientWidth  - parseFloat(s.paddingLeft)  - parseFloat(s.paddingRight);
      cachedAvailHeight = el.clientHeight - parseFloat(s.paddingTop)   - parseFloat(s.paddingBottom);
      return { availWidth: cachedAvailWidth, availHeight: cachedAvailHeight };
    }

    /* ─── 渲染页 ─── */
    function renderPage(num) {
      if (isRendering || !pdfDoc) return;
      isRendering = true;
      const canvas = document.getElementById('pdf-canvas');
      canvas.classList.add('pdf-fading');
      pdfDoc.getPage(num).then(page => {
        const { availWidth, availHeight } = getAvailableSpace();
        const vpBase = page.getViewport({ scale: 1 });
        const scale  = Math.min(availWidth / vpBase.width, availHeight / vpBase.height, 1.8);
        const vp     = page.getViewport({ scale });
        canvas.width  = vp.width;
        canvas.height = vp.height;
        page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise.then(() => {
          isRendering = false;
          document.getElementById('current-page').innerText = num;
          updateDots(num, totalPages);
          updateProgressBar(num, totalPages);
          canvas.classList.remove('pdf-fading');
          canvas.classList.add('pdf-appeared');
          setTimeout(() => canvas.classList.remove('pdf-appeared'), 400);
        });
      }).catch(() => { isRendering = false; canvas.classList.remove('pdf-fading'); });
    }

    /* ─── 翻页 ─── */
    function changePage(delta) {
      if (!pdfDoc || isRendering) return;
      const next = pageNum + delta;
      if (next >= 1 && next <= pdfDoc.numPages) {
        pageNum = next;
        renderPage(pageNum);
      }
    }

    /* ─── 触摸滑动翻页（手机端） ─── */
    (function () {
      let touchStartX = 0, touchStartY = 0;
      const SWIPE_THRESHOLD = 40;
      document.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      document.addEventListener('touchend', e => {
        if (document.getElementById('work-viewer-section').style.display === 'none') return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
          changePage(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
    }());

    /* ─── 键盘翻页（含激光遥控笔 PageDown / PageUp） ─── */
    document.addEventListener('keydown', e => {
      if (document.getElementById('work-viewer-section').style.display === 'none') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') changePage(1);
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'PageUp')   changePage(-1);
      if (e.key === 'Escape') showGallery();
    });

    /* ─── Resize ─── */
    window.addEventListener('resize', () => {
      cachedAvailWidth = null; cachedAvailHeight = null;
      if (pdfDoc && !isRendering &&
          document.getElementById('work-viewer-section').style.display !== 'none') {
        renderPage(pageNum);
      }
    });

    /* ─── 入口 ─── */
    window.onload = () => {
      MECC_CONFIG.renderGlobalNav(pageTitle);
      document.getElementById('author-role-label').innerText = authorLabel;
      init();
    };
  </script>
</body>
</html>
