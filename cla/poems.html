<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>古诗与顺口溜 - MECC</title>
    <link rel="icon" type="image/png" href="../favicon.png">
    
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common_nav.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/pinyin-pro"></script>

    <style>
        :root {
            --kaiti: "STKaiti", "Kaiti SC", "KaiTi", "楷体", "LXGW WenKai Lite", serif;
            --wenkai: "LXGW WenKai Lite", sans-serif;
            --main-teal: #598586;
            --accent-yellow: #f3b236;
        }

        .font-zh, [class*="font-zh"] { font-family: var(--kaiti) !important; font-weight: bold; }
        .font-en, [class*="font-en"] { font-family: var(--wenkai) !important; }

        /* 🌟 1. 列表页关键修复：为导航栏留出空间并防止内容溢出 */
        body { 
            background-color: #fff9ea; margin: 0; padding: 0; 
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
            padding-top: 60px; /* 留出导航栏高度 */
            box-sizing: border-box;
        }

        /* 隐藏旧版重复的标题和返回键 */
        .back-btn-capsule, .list-header { display: none !important; }

        /* 🌟 2. 容器高度修正：减去导航栏高度，防止底部按钮被遮挡 */
        #list-view { 
            display: flex; flex-direction: column; 
            height: calc(100vh - 60px) !important; 
        }

        #gallery-view {
            flex: 1; overflow-y: auto; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            grid-auto-rows: 290px; align-items: start; gap: 30px; padding: 20px 50px; box-sizing: border-box;
        }
        .song-card {
            background: white; border: 4px solid var(--main-teal); border-radius: 20px;
            overflow: hidden; cursor: pointer; transition: 0.2s;
            display: flex; flex-direction: column; height: 220px; box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }
        .song-card:hover { transform: translateY(-5px); border-color: var(--accent-yellow); }
        .card-img-wrapper { width: 100%; height: 155px; overflow: hidden; background: #f4f4f4; display: flex; align-items: center; justify-content: center; position: relative; }
        .song-card img { width: 100%; height: 100%; object-fit: cover; }
        .song-info { flex: 1; padding: 6px 10px; text-align: center; display: flex; align-items: center; justify-content: center; border-top: 1px solid #eee; }
        .song-info h3 { margin: 0; font-size: 1.2rem; color: #333; line-height: 1.3; }

        /* 🌟 3. 详情页导航栏：高度 60px，去背景去边框，仅保留文字与图标 */
        #play-view { display: none; height: 100vh; flex-direction: column; background: #fff9ea; z-index: 10000; position: fixed; top: 0; left: 0; width: 100vw; }
        .play-header { 
            height: 60px; /* 对齐列表页导航高度 */
            background: var(--main-teal); 
            display: flex; align-items: center; justify-content: space-between; 
            border-bottom: 5px solid var(--accent-yellow); /* 对齐系统底边 */
            padding: 0 20px; box-sizing: border-box; 
        }
        
        .play-back-btn { 
            color: white; cursor: pointer; font-size: 1.1rem; font-weight: bold; 
            background: transparent; border: none; /* 🌟 彻底去掉胶囊背景 */
            display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .play-back-btn:hover { opacity: 0.7; }
        .play-header-spacer { flex-shrink: 0; visibility: hidden; width: 120px; }

        .lyrics-panel { flex: 1; display: flex; flex-direction: column; background: white; margin: 15px; border-radius: 4vh; overflow: hidden; }
        .lyrics-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2vh; overflow-y: auto; }
        .lyric-line { font-size: 10vh; font-weight: bold; margin: 1.5vh 0; color: #1e2e46; text-align: center; width: 100%; letter-spacing: 0.2em; }
        .pagination-controls { height: 12vh; display: flex; justify-content: center; align-items: center; gap: 8vw; background: #fff; border-top: 1px solid #f0f0f0; }
        .page-btn {
            background: #f3b236;
            color: #ffffff;
            border: 1.5px solid transparent;
            padding: 12px 28px;
            min-width: 118px;
            border-radius: 16px;
            font-size: 1.85rem;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .page-btn:hover { background: #e1a328; }
        .page-btn:active { transform: scale(0.97); }

        /* 功能逻辑样式 */
        #hover-img-container { position: fixed; display: none; z-index: 20000; padding: 10px; pointer-events: auto; }
        #global-hover-img { max-height: 40vh; max-width: 420px; border: 6px solid var(--accent-yellow); border-radius: 20px; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .btn-delete-item { position: absolute; top: 0px; right: 0px; background: #e74c3c; color: white; border: 3px solid white; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 20001; }
        .hover-word { border-bottom: 0.8vh dashed var(--main-teal); cursor: pointer; display: inline-block; }
        .clickable-char { cursor: pointer; border-radius: 8px; display: inline-block; }
        .red-word { color: #e74c3c !important; }
        #selection-bubble { position: fixed; display: none; background: rgba(89, 133, 134, 0.95); color: white; padding: 10px 25px; border-radius: 50px; cursor: pointer; z-index: 15000; font-size: 1.2rem; font-weight: bold; border: 2px solid white; }
        
        /* 🌟 4. 数据中心功能区：确保在底部且不缩放 */
        .admin-bar { 
            background: white; margin: 10px 50px 20px; padding: 12px; border-radius: 20px; 
            border: 2px dashed rgba(89, 133, 134, 0.85); display: flex; justify-content: center; gap: 20px; 
            align-items: center; flex-shrink: 0; /* 强制不缩放 */
        }
        .admin-btn {
            background: #598586;
            color: white;
            border: 1.5px solid transparent;
            padding: 9px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.96rem;
            box-shadow: none;
            transition: background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            line-height: 1.1;
        }
        .admin-btn:hover { background: #4f7879; }
        .admin-btn:active { transform: scale(0.98); }

        @media (max-width: 768px) {
            body { padding-top: 54px; }
            #list-view { height: calc(100vh - 54px) !important; }
            .play-header { height: 54px !important; }
            #gallery-view { grid-template-columns: 1fr 1fr !important; gap: 14px !important; padding: 10px 14px !important; }
        }
    </style>
</head>
<body>

    <div id="list-view">
        <div id="gallery-view"></div>
        <div class="admin-bar font-zh">
            <span>数据中心：</span>
            <button class="admin-btn font-zh" onclick="exportData()">💾 导出加注备份</button>
            <button class="admin-btn font-zh" onclick="document.getElementById('fileInput').click()">⤒ 导入备份</button>
            <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
            <button class="admin-btn font-zh" style="background:#e74c3c;" onclick="resetAll()">✕ 清空所有加注</button>
        </div>
    </div>

    <div id="play-view">
        <div class="mecc-global-nav"><a href="#" class="mecc-nav-back" onclick="closePlay();return false;">← <span>返回</span></a><h1 class="mecc-nav-title" id="poem-title-nav"></h1></div><div class="play-header" style="display:none;">
            <div class="play-back-btn font-zh" onclick="closePlay()">
                <svg width="22" height="22" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="6"/>
                    <path d="M65 50 H35 M45 35 L35 50 L45 65" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>返回列表</span>
            </div>
            <h1 id="item-title" class="font-zh" style="color:white; font-size: 1.4rem; margin:0; text-align:center; flex:1;"></h1>
            <div class="play-header-spacer"></div>
        </div>
        <div class="lyrics-panel">
            <div class="lyrics-content" id="lyrics-content"></div>
            <div class="pagination-controls">
                <button class="page-btn" onclick="prevPage()">←</button>
                <div id="page-indicator" class="font-en" style="font-size: 4vh; color: var(--main-teal); font-weight: bold;"></div>
                <button class="page-btn" onclick="nextPage()">→</button>
            </div>
        </div>
    </div>

    <div id="selection-bubble" class="font-zh" onmousedown="makeHardWord()">🖼️ 加注图片</div>
    <div id="hover-img-container" onmouseenter="keepImg()" onmouseleave="hideImg()">
        <button class="btn-delete-item" id="delete-item-btn">🗑️</button>
        <img id="global-hover-img" src="">
    </div>

    <script>
        // 🌟 5. 核心加注功能：完全原封不动保留，包含 pinyin-pro 逻辑
        let poemsData = [];
        function formatText(text, isLyrics = false) {
            if (!text) return "";
            return text.split('').map(char => {
                const isEn = /[a-zA-Z0-9\s\p{P}]/u.test(char);
                const className = isEn ? 'font-en' : 'font-zh';
                if (!isEn && isLyrics) {
                    const isRed = localStorage.getItem(`mecc_poem_red_${currentItem.id}_${char}`) === 'true';
                    return `<span class="${className} clickable-char ${isRed ? 'red-word' : ''}" data-char="${char}" onclick="toggleChar(event, this,'${char}')">${char}</span>`;
                }
                return `<span class="${className}">${char}</span>`;
            }).join('');
        }
        const listView = document.getElementById('list-view');
        const playView = document.getElementById('play-view');
        const lyricsContent = document.getElementById('lyrics-content');
        const bubble = document.getElementById('selection-bubble');
        const imgContainer = document.getElementById('hover-img-container');
        const globalImg = document.getElementById('global-hover-img');

        function initData() {
            // 接入全局导航并自动根据身份显示标题
            MECC_CONFIG.renderGlobalNav(MECC_CONFIG.getLang() === 'en' ? "Sight Words & Poems 📜" : "古诗与童谣 📜");
            fetch('../data/poems.json').then(res => res.json()).then(data => { processData(data.poem_list || []); })
                .catch(err => { const defaultPoems = [{ id: "jingyesi", title: "静夜思 (李白)", lyrics: "床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。" }]; processData(defaultPoems); });
        }
        function processData(list) { poemsData = list.map(item => ({ ...item, lyrics: item.lyrics ? item.lyrics.split('\n').map(l => l.trim()).filter(l => l.length > 0) : [] })); initGallery(); }
        function initGallery() {
            const gallery = document.getElementById('gallery-view');
            gallery.innerHTML = poemsData.map((item, index) => {
                const fallbackSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23e0eded'/><text x='200' y='160' font-family='sans-serif' font-size='32' text-anchor='middle' fill='%23598586' font-weight='bold'>${item.title.split(' ')[0]}</text></svg>`;
                return `<div class="song-card" onclick="startLevel(${index})"><div class="card-img-wrapper"><img src="${item.cover || fallbackSVG}" onerror="this.src='${fallbackSVG}';"></div><div class="song-info"><h3>${formatText(item.title)}</h3></div></div>`;
            }).join('');
        }
        function startLevel(idx) {
            currentItem = poemsData[idx]; listView.style.display = 'none'; playView.style.display = 'flex';
            document.getElementById('item-title').innerHTML = formatText(currentItem.title); document.getElementById('poem-title-nav').innerText = currentItem.title;
            currentSlides = []; let temp = [];
            currentItem.lyrics.forEach((l, index) => { temp.push(l); if (temp.length === 4 || index === currentItem.lyrics.length - 1) { currentSlides.push({content:temp}); temp = []; } });
            currentSlideIndex = 0; renderSlide();
        }
        function renderSlide() {
            const slide = currentSlides[currentSlideIndex]; lyricsContent.innerHTML = "";
            const hardWords = JSON.parse(localStorage.getItem(`mecc_poem_hard_${currentItem.id}`) || "{}");
            const sortedWords = Object.keys(hardWords).sort((a,b) => b.length - a.length);
            slide.content.forEach(line => {
                let parts = [{ text: line, isMarked: false }];
                sortedWords.forEach(word => {
                    let newParts = [];
                    parts.forEach(part => {
                        if (part.isMarked) newParts.push(part);
                        else {
                            let subparts = part.text.split(word);
                            subparts.forEach((sub, idx) => {
                                if (sub !== "") newParts.push({ text: sub, isMarked: false });
                                if (idx < subparts.length - 1) newParts.push({ text: word, isMarked: true, img: hardWords[word] });
                            });
                        }
                    }); parts = newParts;
                });
                const div = document.createElement('div'); div.className = 'lyric-line font-zh';
                parts.forEach(part => {
                    const span = document.createElement('span');
                    if (part.isMarked) { span.className = 'hover-word'; span.innerHTML = formatText(part.text, true); span.onmouseenter = (e) => showImg(e, part.img, part.text); span.onmouseleave = scheduleHide; }
                    else { span.innerHTML = formatText(part.text, true); }
                    div.appendChild(span);
                }); lyricsContent.appendChild(div);
            });
            document.getElementById('page-indicator').innerText = `${currentSlideIndex + 1} / ${currentSlides.length}`;
        }
        function showImg(e, src, word) {
            clearTimeout(hideTimer);
            let imgPath = src; if(imgPath && !imgPath.startsWith('/') && !imgPath.startsWith('http')) { imgPath = '/' + imgPath; }
            globalImg.src = imgPath; imgContainer.style.display = 'block';
            const rect = e.target.getBoundingClientRect();
            setTimeout(() => {
                let topPos = rect.top - imgContainer.offsetHeight - 10; if (topPos < 10) topPos = rect.bottom + 10; 
                let leftPos = rect.left; if (leftPos + imgContainer.offsetWidth > window.innerWidth) leftPos = window.innerWidth - imgContainer.offsetWidth - 20;
                imgContainer.style.top = topPos + 'px'; imgContainer.style.left = leftPos + 'px';
            }, 0);
            document.getElementById('delete-item-btn').onclick = () => { if(confirm("删除加注？")) { let d = JSON.parse(localStorage.getItem(`mecc_poem_hard_${currentItem.id}`)); delete d[word]; localStorage.setItem(`mecc_poem_hard_${currentItem.id}`, JSON.stringify(d)); imgContainer.style.display = 'none'; renderSlide(); } };
        }
        function scheduleHide() { hideTimer = setTimeout(() => { imgContainer.style.display = 'none'; }, 250); }
        function keepImg() { clearTimeout(hideTimer); }
        function hideImg() { imgContainer.style.display = 'none'; }
        function toggleChar(e, el, char) { e.stopPropagation(); const s = !el.classList.contains('red-word'); localStorage.setItem(`mecc_poem_red_${currentItem.id}_${char}`, s); renderSlide(); }
        function closePlay() { playView.style.display = 'none'; listView.style.display = 'flex'; }
        function exportData() { 
            const data = {}; for (let i = 0; i < localStorage.length; i++) { 
                const k = localStorage.key(i); if (k.startsWith('mecc_poem_')) data[k] = localStorage.getItem(k);
            } 
            const blob = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mecc_poems_backup.json`; a.click(); 
        }
        function importData(event) { 
            const file = event.target.files[0]; const reader = new FileReader(); 
            reader.onload = (e) => { const data = JSON.parse(e.target.result); Object.keys(data).forEach(key => localStorage.setItem(key, data[key])); alert("导入成功！"); location.reload(); }; reader.readAsText(file); 
        }
        function resetAll() { if(confirm("确定清空数据？")) { Object.keys(localStorage).forEach(k => k.startsWith('mecc_poem_') && localStorage.removeItem(k)); location.reload(); } }
        document.onmouseup = (e) => {
            const s = window.getSelection(); const t = s.toString().trim();
            if (playView.style.display === 'flex' && t && t.length > 0) {
                const rect = s.getRangeAt(0).getBoundingClientRect(); selectedText = t; bubble.style.display = 'block';
                bubble.style.top = (rect.top - 65) + 'px'; bubble.style.left = (rect.left + (rect.width/2) - 50) + 'px';
            } else if (e.target !== bubble) { bubble.style.display = 'none'; }
        };
        // 🌟 拼音文件名自动生成：一字未动
        function makeHardWord() {
            const { pinyin } = pinyinPro; const autoName = pinyin(selectedText, { toneType: 'none', type: 'array' }).join('') + ".webp";
            const imgFile = prompt(`请填写后台的图片路径:`, `/images/poems/${autoName}`);
            if (imgFile) { 
                let d = JSON.parse(localStorage.getItem(`mecc_poem_hard_${currentItem.id}`) || "{}");
                d[selectedText] = imgFile; localStorage.setItem(`mecc_poem_hard_${currentItem.id}`, JSON.stringify(d));
                bubble.style.display = 'none'; renderSlide(); 
            }
        }
        function prevPage() { if(currentSlideIndex > 0) { currentSlideIndex--; renderSlide(); } }
        function nextPage() { if(currentSlideIndex < currentSlides.length - 1) { currentSlideIndex++; renderSlide(); } }
        window.onload = initData;
    </script>
</body>
</html>
