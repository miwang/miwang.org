<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Princess Dresses – Ten Frame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f8 0%, #f0f4ff 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px;
    }

    h1 {
      font-size: 1.9rem;
      color: #b5338a;
      text-align: center;
      margin-bottom: 6px;
      text-shadow: 1px 1px 0 #ffd6f0;
    }

    .subtitle {
      font-size: 1rem;
      color: #7a6080;
      text-align: center;
      margin-bottom: 28px;
    }

    /* ── Story card ── */
    .story {
      background: #fff;
      border: 2px solid #f7b8e0;
      border-radius: 18px;
      padding: 18px 24px;
      max-width: 520px;
      width: 100%;
      margin-bottom: 30px;
      font-size: 1.05rem;
      color: #4a3560;
      line-height: 1.7;
      box-shadow: 0 4px 18px #f7b8e022;
    }

    /* ── Color picker ── */
    .color-picker {
      display: flex;
      gap: 20px;
      margin-bottom: 26px;
      align-items: center;
    }

    .color-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 0.85rem;
      color: #6a5070;
      font-weight: 600;
      transition: transform .15s;
    }
    .color-btn:hover { transform: scale(1.1); }

    .color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid transparent;
      transition: border-color .15s, box-shadow .15s;
    }
    .color-btn.active .color-swatch {
      border-color: #333;
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px #b5338a;
    }

    .swatch-pink  { background: #f472b6; }
    .swatch-blue  { background: #60a5fa; }
    .swatch-erase { background: #e5e7eb; }

    /* ── Ten-frame ── */
    .ten-frame-wrap {
      background: #fff;
      border: 3px solid #c084fc;
      border-radius: 20px;
      padding: 18px 22px;
      box-shadow: 0 6px 24px #c084fc22;
      margin-bottom: 28px;
    }

    .ten-frame {
      display: flex;
      gap: 10px;
    }

    .cell {
      width: 68px;
      height: 88px;
      border: 2.5px dashed #d8b4fe;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .18s, transform .12s, border-color .18s;
      background: #faf5ff;
      position: relative;
    }
    .cell:hover { transform: scale(1.07); border-color: #a855f7; }

    /* dress SVG coloring */
    .cell svg { pointer-events: none; }
    .cell .dress-body   { transition: fill .18s; }
    .cell .dress-skirt  { transition: fill .18s; }

    .cell.empty   .dress-body,
    .cell.empty   .dress-skirt  { fill: #e2d9f3; }
    .cell.pink    .dress-body,
    .cell.pink    .dress-skirt  { fill: #f472b6; }
    .cell.blue    .dress-body,
    .cell.blue    .dress-skirt  { fill: #60a5fa; }

    .cell.empty   .dress-detail { fill: #c4b5d4; }
    .cell.pink    .dress-detail { fill: #be185d; }
    .cell.blue    .dress-detail { fill: #1d4ed8; }

    /* ── Score board ── */
    .scoreboard {
      display: flex;
      gap: 28px;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .score-box {
      background: #fff;
      border-radius: 16px;
      padding: 14px 26px;
      text-align: center;
      box-shadow: 0 4px 14px #00000014;
      min-width: 110px;
    }
    .score-box .num {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1;
    }
    .score-box .label {
      font-size: 0.82rem;
      color: #6b7280;
      font-weight: 600;
      margin-top: 4px;
    }
    .score-box.pink-box  { border: 3px solid #f472b6; }
    .score-box.pink-box  .num { color: #db2777; }
    .score-box.blue-box  { border: 3px solid #60a5fa; }
    .score-box.blue-box  .num { color: #2563eb; }
    .score-box.total-box { border: 3px solid #a855f7; }
    .score-box.total-box .num { color: #7c3aed; }

    .plus-sign, .equals-sign {
      font-size: 2rem;
      font-weight: 800;
      color: #9ca3af;
    }

    /* ── Equation sentence ── */
    .equation {
      font-size: 1.15rem;
      color: #4a3560;
      text-align: center;
      min-height: 28px;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .eq-pink  { color: #db2777; }
    .eq-blue  { color: #2563eb; }

    /* ── Reset button ── */
    .reset-btn {
      background: linear-gradient(135deg, #f472b6, #a855f7);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px #f472b640;
      transition: transform .15s, box-shadow .15s;
    }
    .reset-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px #f472b660;
    }

    /* ── Stars celebration ── */
    .celebrate {
      font-size: 1.4rem;
      text-align: center;
      min-height: 36px;
      margin-top: 8px;
      transition: opacity .3s;
    }
  </style>
</head>
<body>

  <h1>👗 Princess Dresses 👗</h1>
  <p class="subtitle">Click a dress to color it pink or blue!</p>

  <div class="story">
    A princess has <strong>10</strong> dresses.<br>
    Some are <span style="color:#db2777;font-weight:700;">pink</span> and the rest are <span style="color:#2563eb;font-weight:700;">blue</span>.<br>
    How many pink dresses? How many blue dresses?<br>
    <em style="font-size:.9rem;color:#9ca3af;">Try all the different ways to make 10! 🌟</em>
  </div>

  <!-- Color picker -->
  <div class="color-picker">
    <button class="color-btn active" id="btn-pink" onclick="selectColor('pink')">
      <div class="color-swatch swatch-pink"></div>
      Pink
    </button>
    <button class="color-btn" id="btn-blue" onclick="selectColor('blue')">
      <div class="color-swatch swatch-blue"></div>
      Blue
    </button>
    <button class="color-btn" id="btn-erase" onclick="selectColor('empty')">
      <div class="color-swatch swatch-erase">
        <svg viewBox="0 0 40 40" width="40" height="40" style="display:block">
          <line x1="8" y1="8" x2="32" y2="32" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
          <line x1="32" y1="8" x2="8" y2="32" stroke="#9ca3af" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </div>
      Erase
    </button>
  </div>

  <!-- Ten frame -->
  <div class="ten-frame-wrap">
    <div class="ten-frame" id="tenFrame"></div>
  </div>

  <!-- Score board -->
  <div class="scoreboard">
    <div class="score-box pink-box">
      <div class="num" id="pinkCount">0</div>
      <div class="label">💗 Pink</div>
    </div>
    <div class="plus-sign">+</div>
    <div class="score-box blue-box">
      <div class="num" id="blueCount">0</div>
      <div class="label">💙 Blue</div>
    </div>
    <div class="equals-sign">=</div>
    <div class="score-box total-box">
      <div class="num" id="totalCount">0</div>
      <div class="label">👗 Total</div>
    </div>
  </div>

  <div class="equation" id="equation">&nbsp;</div>
  <div class="celebrate" id="celebrate">&nbsp;</div>

  <button class="reset-btn" onclick="resetAll()">🔄 Start Over</button>

  <!-- Dress SVG template -->
  <svg style="display:none">
    <symbol id="dress-icon" viewBox="0 0 60 80">
      <!-- bodice -->
      <path class="dress-body"
        d="M22,6 Q30,2 38,6 L42,28 Q30,24 18,28 Z"/>
      <!-- sleeves -->
      <path class="dress-detail"
        d="M22,6 Q14,8 12,20 L18,22 Q20,12 24,10 Z
           M38,6 Q46,8 48,20 L42,22 Q40,12 36,10 Z"/>
      <!-- skirt -->
      <path class="dress-skirt"
        d="M18,28 Q30,24 42,28 L50,72 Q30,76 10,72 Z"/>
      <!-- waist belt -->
      <rect class="dress-detail" x="17" y="26" width="26" height="5" rx="2"/>
      <!-- neckline -->
      <path class="dress-detail" fill="none" stroke-width="1.5"
        style="stroke:currentColor;opacity:.25"
        d="M26,6 Q30,12 34,6"/>
    </symbol>
  </svg>

  <script>
    const TOTAL = 10;
    let currentColor = 'pink';
    let cells = Array(TOTAL).fill('empty');

    // Celebration messages
    const cheers = [
      '🌟 Great job! 🌟',
      '🎉 Amazing! You filled all 10! 🎉',
      '👑 You\'re a math princess! 👑',
      '✨ Wonderful! ✨',
      '🦋 Brilliant! 🦋',
    ];

    function selectColor(color) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + (color === 'empty' ? 'erase' : color)).classList.add('active');
    }

    function buildFrame() {
      const frame = document.getElementById('tenFrame');
      frame.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell ' + cells[i];
        cell.title = 'Dress ' + (i + 1);
        cell.innerHTML = `
          <svg width="52" height="68" viewBox="0 0 60 80">
            <use href="#dress-icon"/>
          </svg>`;
        cell.addEventListener('click', () => toggleCell(i));
        frame.appendChild(cell);
      }
    }

    function toggleCell(index) {
      cells[index] = currentColor;
      updateDisplay();
    }

    function updateDisplay() {
      buildFrame();
      const pink  = cells.filter(c => c === 'pink').length;
      const blue  = cells.filter(c => c === 'blue').length;
      const total = pink + blue;

      document.getElementById('pinkCount').textContent  = pink;
      document.getElementById('blueCount').textContent  = blue;
      document.getElementById('totalCount').textContent = total;

      // Equation sentence
      let eq = '&nbsp;';
      if (total > 0) {
        eq = `<span class="eq-pink">${pink} pink</span> + <span class="eq-blue">${blue} blue</span> = ${total}`;
      }
      document.getElementById('equation').innerHTML = eq;

      // Celebration
      const cel = document.getElementById('celebrate');
      if (total === TOTAL) {
        cel.textContent = cheers[Math.floor(Math.random() * cheers.length)];
      } else {
        cel.textContent = '\u00a0';
      }
    }

    function resetAll() {
      cells = Array(TOTAL).fill('empty');
      updateDisplay();
    }

    // Init
    buildFrame();
  </script>
</body>
</html>
